window.addEventListener('message', (e) => {
  const frame = getBrowserIframe();
  const expectedOrigin = browserFrameOrigin(frame);
  if (!frame?.contentWindow || !expectedOrigin || e.source !== frame.contentWindow || e.origin !== expectedOrigin) return;
  const d = e.data || {};
  if (d.kind === 'axo-tap:picked') {
    openDomHier(d.chain || [], d.selectedIndex || 0, d.url || S.browser.url || '', d.selector || '', d.html || '');
  } else if (d.kind === 'axo-tap:level') {
    const h = S.browser.hier;
    if (h && typeof d.level === 'number') {
      h.selector = d.selector || h.selector;
      h.html     = d.html     || h.html;
      renderDomHier();
    }
  } else if (d.kind === 'axo-tap:cancelled') {
    closeDomHier(false);
  } else if (d.kind === 'axo-tap:ready') {
    // Tap script alive in the iframe — nothing to do, but useful for future
    // "picker available" indicators.
  }
});

function termStatusClass(status) {
  const s = String(status || '');
  if (s.startsWith('running')) return 'running';
  if (s.startsWith('failed') || s.startsWith('error')) return 'failed';
  return 'exited';
}
function termShortLabel(command) {
  const c = String(command || '').trim();
  // First whitespace-separated word, plus the next arg if short.
  const parts = c.split(/\s+/);
  if (parts.length === 1) return parts[0] || '(empty)';
  return (parts[0] + ' ' + parts[1]).slice(0, 28);
}

async function refreshSessionTasks(expectedSessionId = S.session.id) {
  if (!expectedSessionId || S.session.id !== expectedSessionId) return false;
  const sessionState = S.session;
  // Preparing, failed, and approval-gated Sessions have no executable task
  // surface. Environment recovery explicitly refreshes this list after Ready,
  // so polling early only creates noisy, expected 409 responses.
  if (sessionState.runtimeActivationPending || sessionState.attemptRestorePending
      || _sessionEnvironmentTransitions.has(expectedSessionId)
      || workspaceAttemptOwnsPrimaryRuntime(sessionState)
      || S.threadVariants?.sessionId === expectedSessionId
      || !sessionEnvironmentReady(sessionState)) {
    sessionState.tasks = [];
    renderTerminals();
    // Lazy reconstruction can durably move a persisted Ready Session through
    // Preparing while the request that activated it is still in flight. Poll
    // the canonical Session record from this existing timer so a successful
    // preparation returns the cockpit to Ready without a manual reload.
    if (sessionEnvironmentState(sessionState) === 'preparing') {
      await reconcileSessionAfterRuntimeFailure(expectedSessionId, sessionState);
    }
    if (S.session === sessionState && sessionState.runtimeActivationPending
        && !sessionState.runtimeActivationInFlight && sessionEnvironmentReady(sessionState)
        && !sessionState.attemptRestorePending
        && !_sessionEnvironmentTransitions.has(expectedSessionId)
        && !workspaceAttemptOwnsPrimaryRuntime(sessionState)
        && S.threadVariants?.sessionId !== expectedSessionId) {
      await activateOpenedSessionRuntime(expectedSessionId);
    }
    return false;
  }
  const runtimeGeneration = Number(sessionState.runtimeActivationGeneration || 0);
  let tasks = null;
  try {
    const response = await fetch('/api/sessions/' + encodeURIComponent(expectedSessionId) + '/tasks');
    const body = await response.json().catch(() => null);
    if (!response.ok || body?.error || !Array.isArray(body)) {
      await reconcileSessionAfterRuntimeFailure(expectedSessionId, sessionState);
      if (S.session !== sessionState || S.session.id !== expectedSessionId
          || Number(sessionState.runtimeActivationGeneration || 0) !== runtimeGeneration) {
        return false;
      }
      if (response.status === 409 && sessionEnvironmentReady(sessionState)) {
        // Another tab can start Ways before its WebSocket frame reaches this
        // one. A still-Ready conflict is an ownership signal: restore Results
        // immediately instead of treating the failed read as an empty task list.
        sessionState.attemptRestorePending = true;
        await restoreThreadVariants(expectedSessionId);
      }
      return false;
    }
    tasks = body;
  } catch {
    // A failed snapshot says nothing about which terminals exist. Preserve the
    // last authoritative list and let the next poll retry.
    return false;
  }
  if (S.session !== sessionState || S.session.id !== expectedSessionId
      || Number(sessionState.runtimeActivationGeneration || 0) !== runtimeGeneration
      || sessionState.runtimeActivationPending || sessionState.attemptRestorePending
      || _sessionEnvironmentTransitions.has(expectedSessionId)
      || workspaceAttemptOwnsPrimaryRuntime(sessionState)
      || S.threadVariants?.sessionId === expectedSessionId) return false;
  sessionState.tasks = tasks;
  renderTerminals();
  detectUrlsFromTasks();
  return true;
}

// Tracks what the output panel currently displays so the 4-second task poll
// doesn't blindly tear it down and steal focus from xterm on every tick.
let _lastMountedTerminal = { id: null, kind: null };

function renderTerminals() {
  // Keep the closed-state rail in sync on every render so newly-spawned
  // terminals show up in the bottom strip without a separate trigger.
  try { renderTermRailList(); } catch {}
  const list = $('#terminals-list');
  const out  = $('#terminals-output');
  if (!list || !out) return;

  const tasks = S.session.tasks || [];

  if (!tasks.length) {
    if (S.session.autoTerminalStarting) {
      list.innerHTML = '<div class="terminals-empty small term-jade">starting shell…</div>';
      out.innerHTML =
        '<pre class="term-pre term-welcome">' +
        '<span class="term-dim">user@axocoatl </span><span class="term-jade">$</span> provision-session\n\n' +
        '<span class="term-jade">▶</span> <span style="font-weight:600;color:var(--axo-jade-glow);">Starting your terminal…</span>\n' +
        '<span class="term-dim">  opening sh in the Session environment…</span>\n\n' +
        '<span class="term-dim">user@axocoatl </span><span class="term-jade">$</span> <span class="term-cursor">▌</span>' +
        '</pre>';
    } else {
      list.innerHTML = '<div class="terminals-empty small muted">no terminals yet — click ＋ to start one</div>';
      out.innerHTML =
        '<pre class="term-pre term-welcome">' +
        '<span class="term-dim">user@axocoatl </span><span class="term-jade">$</span> <span class="term-cursor">▌</span>\n\n' +
        '<span class="term-dim">Click ＋ to start a terminal — run a dev server, a build watcher, or anything else.</span>' +
        '</pre>';
    }
    S.session.activeTerminalId = null;
    _lastMountedTerminal = { id: null, kind: null };
    return;
  }

  const ordered = tasks.slice().reverse();
  if (!S.session.activeTerminalId
      || !ordered.find(t => t.id === S.session.activeTerminalId)) {
    S.session.activeTerminalId = ordered[0].id;
  }

  // Sidebar list — always cheap to rebuild; doesn't touch the xterm DOM.
  list.innerHTML = '';
  ordered.forEach(t => {
    const active = t.id === S.session.activeTerminalId;
    const row = el('button', 'term-row' + (active ? ' active' : ''));
    row.type = 'button';
    row.setAttribute('aria-pressed', String(active));
    row.appendChild(el('span', 'term-dot ' + termStatusClass(t.status)));
    row.appendChild(el('span', 'term-label', termShortLabel(t.command)));
    row.title = (t.command || '') + '\n' + (t.status || '');
    row.addEventListener('click', () => {
      S.session.activeTerminalId = t.id;
      renderTerminals();
    });
    list.appendChild(row);
  });

  const active = ordered.find(t => t.id === S.session.activeTerminalId);
  if (!active) { out.innerHTML = ''; _lastMountedTerminal = { id: null, kind: null }; return; }

  // Same terminal that's already mounted? Just refresh the status text.
  // CRITICAL: do NOT touch the xterm DOM or it loses focus mid-typing.
  if (_lastMountedTerminal.id === active.id && _lastMountedTerminal.kind === active.kind) {
    const cmdEl = out.querySelector('.term-status-bar .term-cmd');
    const statusEl = out.querySelector('.term-status-bar > span:last-child');
    const dotEl = out.querySelector('.term-status-bar .term-dot');
    if (cmdEl)    cmdEl.textContent = active.command || '';
    if (statusEl) statusEl.textContent = active.status || '';
    if (dotEl)    dotEl.className = 'term-dot ' + termStatusClass(active.status);
    // For legacy (log) tasks, also refresh the scrollback.
    if (active.kind !== 'terminal') {
      const pre = out.querySelector('.term-pre');
      if (pre) {
        const atBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 8;
        pre.textContent = String(active.log || '').slice(-32 * 1024) || '(no output yet)';
        if (atBottom) pre.scrollTop = pre.scrollHeight;
      }
    }
    return;
  }

  // Different terminal — fully re-mount.
  out.innerHTML = '';
  const bar = el('div', 'term-status-bar');
  bar.appendChild(el('span', 'term-dot ' + termStatusClass(active.status)));
  bar.appendChild(el('span', 'term-cmd', active.command || ''));
  bar.appendChild(el('span', 'grow'));
  bar.appendChild(el('span', '', active.status || ''));
  out.appendChild(bar);

  if (active.kind === 'terminal') {
    const elx = getOrCreateXterm(active.id);
    if (elx) {
      out.appendChild(elx);
      // The element re-fits itself on resize; this is for the mount, where it
      // has just been given dimensions for the first time.
      setTimeout(() => { elx.fit(); elx.focus(); }, 0);
    } else {
      out.appendChild(el('div', 'term-empty-output', 'xterm.js failed to load.'));
    }
  } else {
    const pre = el('pre', 'term-pre');
    pre.textContent = String(active.log || '').slice(-32 * 1024) || '(no output yet)';
    out.appendChild(pre);
    queueMicrotask(() => { pre.scrollTop = pre.scrollHeight; });
  }
  _lastMountedTerminal = { id: active.id, kind: active.kind };
}

// ── + New terminal popover ──
// First preset is highlighted as the "default" — clicking the ＋ button and
// hitting Enter starts a plain shell at the session's working directory.
const TERMINAL_PRESETS = [
  'sh',
  'bash',
  'python3 serve.py',
  'python3 -m http.server 3000',
  'npm run dev',
  'cargo run',
  'vim .',
  'nano',
  'ls -la',
];

let _termPopReturnFocus = null;

function openTerminalPop() {
  const pop = $('#term-new-pop'); if (!pop) return;
  const active = axoDeepActiveElement();
  _termPopReturnFocus = active?.id === 'term-rail-new-btn' ? $('#term-new-btn') : active;
  const presets = $('#term-presets');
  if (presets) {
    presets.innerHTML = '';
    TERMINAL_PRESETS.forEach(cmd => {
      const b = el('button', 'term-preset', cmd);
      b.type = 'button';
      b.addEventListener('click', () => {
        const inp = $('#term-new-cmd');
        if (inp) { inp.value = cmd; inp.focus(); }
      });
      presets.appendChild(b);
    });
  }
  const inp = $('#term-new-cmd');
  if (inp) {
    inp.value = 'sh';
    setTimeout(() => { inp.focus(); inp.select(); }, 0);
  }
  // Stage off-screen so layout is real before we measure (display:none → flex
  // can give a zero rect on the same tick in some browsers).
  pop.style.top = '-9999px';
  pop.style.left = '-9999px';
  pop.classList.remove('hide');
  pop.setAttribute('aria-hidden', 'false');
  $('#term-new-btn')?.setAttribute('aria-expanded', 'true');
  $('#term-rail-new-btn')?.setAttribute('aria-expanded', 'true');
  requestAnimationFrame(() => {
    const btn = $('#term-new-btn');
    if (!btn) return;
    const r = btn.getBoundingClientRect();
    const popRect = pop.getBoundingClientRect();
    const vh = window.innerHeight, vw = window.innerWidth;
    const fitsBelow = (r.bottom + 6 + popRect.height) <= vh - 8;
    const top = fitsBelow ? (r.bottom + 6) : Math.max(8, r.top - 6 - popRect.height);
    let left = r.left;
    if (left + popRect.width > vw - 8) left = Math.max(8, vw - 8 - popRect.width);
    pop.style.top  = top  + 'px';
    pop.style.left = left + 'px';
    pop.style.right = 'auto';
  });
  setTimeout(() => document.addEventListener('mousedown', onTermPopOutside, true), 0);
}

function closeTerminalPop() {
  const pop = $('#term-new-pop');
  if (pop) {
    pop.classList.add('hide');
    pop.setAttribute('aria-hidden', 'true');
  }
  $('#term-new-btn')?.setAttribute('aria-expanded', 'false');
  $('#term-rail-new-btn')?.setAttribute('aria-expanded', 'false');
  document.removeEventListener('mousedown', onTermPopOutside, true);
  queueMicrotask(() => _termPopReturnFocus?.isConnected && _termPopReturnFocus.focus?.());
  _termPopReturnFocus = null;
}

function onTermPopOutside(e) {
  const pop = $('#term-new-pop');
  const btn = $('#term-new-btn');
  if (!pop || pop.contains(e.target) || (btn && btn.contains(e.target))) return;
  closeTerminalPop();
}

async function submitNewTerminal() {
  const inp = $('#term-new-cmd');
  const cmd = (inp && inp.value || '').trim();
  if (!cmd || !S.session.id) return;
  if (presentSessionRuntimeGate('Terminal')) { closeTerminalPop(); return; }
  const runtime = captureSessionRuntimeSurface();
  if (!runtime) { closeTerminalPop(); return; }
  const expectedSessionId = runtime.sessionId;
  const sessionState = S.session;
  if (sessionState.manualTerminalStarting) return;
  const controller = new AbortController();
  sessionState.manualTerminalStarting = true;
  sessionState.manualTerminalController = controller;
  closeTerminalPop();
  try {
    const r = await fetch('/api/sessions/' + encodeURIComponent(expectedSessionId) + '/tasks', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      // Default to interactive PTY — these run vim/nano, dev servers with
      // colored output, etc. The legacy log-only path is still reachable
      // server-side via interactive:false (used by agent-spawned tasks).
      body: JSON.stringify({ command: cmd, interactive: true, rows: 30, cols: 100 }),
      signal: controller.signal,
    });
    const j = await r.json().catch(() => ({}));
    if (!runtime.owns()) return;
    if (r.ok && j && j.id) {
      sessionState.activeTerminalId = j.id;
      toast('Terminal started', cmd, 'ok');
    } else {
      const msg = j && j.error ? j.error : ('HTTP ' + r.status);
      await reconcileSessionAfterRuntimeFailure(expectedSessionId, sessionState);
      if (!runtime.owns()) return;
      if (r.status === 409 && sessionEnvironmentReady(sessionState)) {
        sessionState.attemptRestorePending = true;
        await restoreThreadVariants(expectedSessionId);
        return;
      }
      toast('Could not start terminal', msg, 'err');
      const out = $('#terminals-output');
      if (out) out.innerHTML = '<div class="term-empty-output">Failed to start: ' + escHtml(msg) + '</div>';
    }
  } catch (e) {
    if (!runtime.owns()) return;
    await reconcileSessionAfterRuntimeFailure(expectedSessionId, sessionState);
    if (!runtime.owns()) return;
    toast('Could not start terminal', String(e), 'err');
    const out = $('#terminals-output');
    if (out) out.innerHTML = '<div class="term-empty-output">Failed to start: ' + escHtml(String(e)) + '</div>';
  } finally {
    if (S.session === sessionState && sessionState.manualTerminalController === controller) {
      sessionState.manualTerminalController = null;
      sessionState.manualTerminalStarting = false;
    }
  }
  if (runtime.owns()) await refreshSessionTasks(expectedSessionId);
}

// ── xterm.js bridge ──
// One Terminal instance per terminal id we've seen, so switching back and
// forth doesn't lose state.
// ── Terminals ──
//
// A terminal is <ax-terminal> (see /ui/terminal.js): it owns its xterm, its PTY
// socket, the brand theme and the resize protocol. What stays here is which
// terminals exist and where the active one is shown.
//
// Elements are created once per task and reused. Everything about a terminal is
// stateful and expensive to recreate — scrollback, the running process, the
// socket — so it is moved between containers, never rebuilt.
S.xterms = new Map();   // task id → <ax-terminal>

function getOrCreateXterm(taskId) {
  let elx = S.xterms.get(taskId);
  if (elx) return elx;
  if (typeof Terminal === 'undefined') return null;
  elx = document.createElement('ax-terminal');
  elx.session = S.session.id;
  elx.task = taskId;
  S.xterms.set(taskId, elx);
  return elx;
}

function teardownXterms() {
  S.xterms.forEach((elx) => { try { elx.destroy(); } catch {} });
  S.xterms.clear();
}


// ── File tree ──
//
// The tree itself is <ax-file-tree> (see /ui/file-tree.js): a shadow-DOM
// component that loads folders on demand, filters, and reports `file-open`
// rather than opening anything itself. What stays here is the wiring — which
// session it shows, what happens when a row is activated, and the search input
// that drives its `filter` attribute.

/** Re-read the tree from disk. Called whenever the project changes underneath. */
async function refreshFileTree(expectedSessionId = S.session.id) {
  if (!expectedSessionId || S.session.id !== expectedSessionId
      || !sessionRuntimeSurfaceReady()) return;
  invalidateQuickOpenIndex();
  const sessionState = S.session;
  const tree = $('#file-tree');
  await tree?.reload?.();
  if (S.session !== sessionState || S.session.id !== expectedSessionId) return;
  if (tree?.shadowRoot?.querySelector('.empty.failed')) {
    await reconcileSessionAfterRuntimeFailure(expectedSessionId, sessionState);
  }
}

// ── Rail ──
//
// Workspace identity is stable navigation state. A Session can change without
// changing its Workspace, and a Workspace can remain selected with no open
// Session at all.
const LAST_SESSION_KEY = 'axo.session.last.v1';
const LAST_WORKSPACE_KEY = 'axo.workspace.last.v1';
const lastWorkspaceSessionKey = (workspaceId) => `axo.workspace.${workspaceId}.session.v1`;

function setSelectedWorkspace(workspaceId, { scope = 'workspace' } = {}) {
  if (!workspaceId) return null;
  S.selectedWorkspaceId = workspaceId;
  try { localStorage.setItem(LAST_WORKSPACE_KEY, workspaceId); } catch {}
  const rail = $('#rail'); if (rail) rail.workspace = workspaceId;
  const home = sessionHome();
  const workspace = (S.workspaces || []).find(item => item.id === workspaceId)
    || home?.workspace?.(workspaceId)
    || rail?.workspaceById?.(workspaceId)
    || null;
  home?.selectWorkspace?.(workspaceId, { scope });
  return workspace;
}

async function activateWorkspace(workspace) {
  if (!workspace?.id) return false;
  const alreadyOpenHere = S.session.id && S.session.workspaceId === workspace.id;
  setSelectedWorkspace(workspace.id, { scope: 'workspace' });
  if (alreadyOpenHere) {
    _workspaceNavigationGeneration += 1;
    return true;
  }
  // Never pair one Workspace's selector label with another Workspace's
  // conversation while the next Session is resolving.
  closeCockpit({ homeScope: 'workspace' });
  sessionHome()?.selectWorkspace?.(workspace.id, { scope: 'workspace' });
  const navigationGeneration = ++_workspaceNavigationGeneration;
  let sessions = sessionHome()?.sessions?.filter(session => session.workspace_id === workspace.id) || [];
  try {
    const authoritative = await fetch(`/api/workspaces/${encodeURIComponent(workspace.id)}/sessions`).then(response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    });
    if (Array.isArray(authoritative)) sessions = authoritative;
  } catch {}
  if (navigationGeneration !== _workspaceNavigationGeneration
      || S.selectedWorkspaceId !== workspace.id) return false;
  const open = sessions.filter(session => session.status !== 'closed');
  const remembered = (() => {
    try { return localStorage.getItem(lastWorkspaceSessionKey(workspace.id)); } catch { return ''; }
  })();
  const next = open.find(session => session.id === remembered)
    || open.slice().sort((a, b) => (b.last_active || 0) - (a.last_active || 0))[0]
    || null;
  if (next) {
    openCockpit(next);
    return true;
  }
  sessionHome()?.selectWorkspace?.(workspace.id, { scope: 'workspace' });
  return true;
}

/** Open the session you were last in, if it still exists. */
async function restoreLastSession() {
  const explicitId = new URLSearchParams(location.search).get('session');
  try {
    const [workspaces, sessions] = await Promise.all([
      fetch('/api/workspaces').then(response => response.json()),
      fetch('/api/sessions').then(response => response.json()),
    ]);
    S.workspaces = Array.isArray(workspaces) ? workspaces : [];
    S.sessions = Array.isArray(sessions) ? sessions : [];
    const explicit = explicitId ? S.sessions.find(session => session.id === explicitId) : null;
    if (explicit) { openCockpit(explicit); return true; }
    let workspaceId = '';
    try { workspaceId = localStorage.getItem(LAST_WORKSPACE_KEY) || ''; } catch {}
    const legacySessionId = (() => { try { return localStorage.getItem(LAST_SESSION_KEY) || ''; } catch { return ''; } })();
    const legacySession = S.sessions.find(session => session.id === legacySessionId);
    if (!S.workspaces.some(workspace => workspace.id === workspaceId)) {
      workspaceId = legacySession?.workspace_id || S.workspaces[0]?.id || '';
    }
    if (!workspaceId) {
      sessionHome()?.showAllSessions?.();
      return false;
    }
    setSelectedWorkspace(workspaceId, { scope: 'workspace' });
    let remembered = '';
    try { remembered = localStorage.getItem(lastWorkspaceSessionKey(workspaceId)) || ''; } catch {}
    const candidates = S.sessions.filter(session => session.workspace_id === workspaceId && session.status !== 'closed');
    const session = candidates.find(item => item.id === remembered)
      || (legacySession?.workspace_id === workspaceId && legacySession.status !== 'closed' ? legacySession : null)
      || candidates.slice().sort((a, b) => (b.last_active || 0) - (a.last_active || 0))[0]
      || null;
    if (session) { openCockpit(session); return true; }
    closeCockpit({ homeScope: 'workspace' });
    return true;
  } catch { return false; }
}

// ── Module launcher ────────────────────────────────────────────────────
//
// Opening a pane used to mean going to a menu and flipping a switch, which is a
// settings gesture. It is an action you take mid-thought, so it lives on a
// shortcut. The launcher lists every module with its binding, because a
// shortcut nobody can discover is one nobody uses.
// Keep global bindings familiar: Cmd/Ctrl+P remains Quick Open, Cmd/Ctrl+L
// focuses the composer, and Cmd/Ctrl+K is the command center. The launcher is
// discoverable with Shift+Cmd/Ctrl+P but direct letter hijacks are retired.
const MODULE_KEYS = {};

function openModule(id) {
  if (id === 'terminal') {
    openSessionTerminal();
    return;
  }
  if ((id === 'browser' || id === 'files')
      && presentSessionRuntimeGate(id === 'files' ? 'Files' : 'Preview')) return;
  if (!SURFACES[id]) return;
  if (id === 'compare') setAttemptsDock(false);
  const L = S.cockpitLayout;
  // Header, launcher, cards, and shortcuts are center-stage navigation. The
  // separate More → Pin action is the only way to request a two-up review.
  L.center = id;
  applyCockpitLayout();
  if (id === 'compare') refreshCompare(S.session.id);
  renderPanesMenu();
  syncLauncherState();
}

function syncLauncherState() {
  const open = visibleSurfaces().slice();
  if (S.cockpitLayout.termOpen) open.push('terminal');
  $('#launcher')?.setOpenModules?.([...new Set(open)]);
}

function sessionHome() { return $('#session-home'); }

// The Home component owns session/folder state. The shell only crosses this
// boundary to open the permanent cockpit and mirror counts/pins in its chrome.
(function initSessionHomeOnce() {
  function attach() {
    const home = sessionHome(); if (!home || home._wired) return;
    home._wired = true;
    home.agents = S.agents || [];
    home.addEventListener('session-open', (e) => openCockpit(e.detail.session));
    home.addEventListener('workspace-open', (e) => void activateWorkspace(e.detail.workspace));
    home.addEventListener('session-open-new', (e) => {
      e.preventDefault();
      window.open(`/?session=${encodeURIComponent(e.detail.session.id)}`, '_blank', 'noopener');
    });
    const onLifecycle = (e) => {
      if (S.session.id === e.detail.session.id) closeCockpit();
      else $('#rail')?.refresh?.();
    };
    home.addEventListener('session-closed', onLifecycle);
    home.addEventListener('session-deleted', onLifecycle);
    home.addEventListener('session-environment-changing', (e) => {
      const sessionId = e.detail?.session?.id;
      if (sessionId && S.session.id === sessionId) {
        // Suspend every runtime-backed surface before the destructive request
        // starts. The matching change/error event below settles this epoch.
        markSessionRuntimeActivationRequired(sessionId);
      }
    });
    home.addEventListener('sessions-change', (e) => {
      S.sessions = e.detail.sessions;
      const count = $('#cnt-sessions'); if (count) count.textContent = String(e.detail.count);
      const current = (S.sessions || []).find((session) => session.id === S.session.id);
      // Environment configuration dispatches its explicit change event after
      // this list refresh. Reconcile visible state here, but let that event own
      // teardown and terminal activation so the two callbacks cannot race.
      if (current) applySessionEnvironmentUpdate(current, { activateRuntime: false });
      $('#rail')?.refresh?.();
    });
    home.addEventListener('session-environment-change', (e) => {
      const session = e.detail?.session;
      if (!session?.id) return;
      if (!Array.isArray(S.sessions)) S.sessions = [];
      const at = (S.sessions || []).findIndex((item) => item.id === session.id);
      if (at >= 0) S.sessions.splice(at, 1, session);
      else S.sessions.push(session);
      const source = String(e.detail?.source || '');
      const runtimeRebuilt = source === 'rebuild' || source === 'configure';
      applySessionEnvironmentUpdate(session, {
        runtimeRebuilt,
        activateRuntime: runtimeRebuilt,
      });
      if (source.endsWith('-error') && S.session.id === session.id
          && sessionEnvironmentReady(S.session)
          && S.threadVariants?.sessionId !== session.id) {
        // A rejected rebuild/configuration may leave the original runtime
        // authoritative and Ready. Settle the pre-change suspension through
        // the normal single-owner activation path instead of stranding Files,
        // Git, Preview, and the editor behind a stale gate.
        void activateOpenedSessionRuntime(session.id);
      }
      $('#rail')?.refresh?.();
    });
    home.addEventListener('workspaces-change', (e) => {
      S.workspaces = e.detail.workspaces;
      if (S.selectedWorkspaceId) {
        home.selectedWorkspaceId = S.selectedWorkspaceId;
        const rail = $('#rail'); if (rail) rail.workspace = S.selectedWorkspaceId;
      }
      $('#rail')?.refresh?.();
    });
    home.addEventListener('notify', (e) => {
      const { title, body, kind } = e.detail;
      toast(title, body, kind);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', attach);
  else attach();
})();

function applyResponsiveRailState(rail = $('#rail')) {
  if (!rail) return;
  if (window.innerWidth < 720) {
    // The narrow rail is an off-canvas sheet. Render its full labels when it
    // opens instead of leaving a permanent 52 px icon strip beside the work.
    rail.collapsed = false;
    syncMobileRailAccessibility();
    return;
  }
  if (document.body.classList.contains('mobile-rail-open')) closeMobileRail(false);
  // Compact desktop starts collapsed only until the user makes an explicit
  // choice. That choice then survives resize and reload instead of being
  // overwritten every time the viewport reports a resize.
  const preferred = readRailCollapsedPreference();
  setRailCollapsed(preferred ?? window.innerWidth < 1100, { persist: false });
  syncMobileRailAccessibility();
}

// The column caps are computed from the window's actual width, so they have to
// be recomputed when it changes. Without this the layout is only ever correct
// for the width it was last built at: shrink the window and the panes keep
// their old tracks and push the chat spine off the edge.
(function relayoutOnResize() {
  let queued = false;
  window.addEventListener('resize', () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => {
      queued = false;
      applyCockpitLayout();
      relayoutEmbeddedEditors();
      // Below a laptop width there is not room for a rail and a readable chat
      // at once. It collapses itself rather than being fought with, and the
      // preference is left alone so it comes back when the window does.
      applyResponsiveRailState();
    });
  });
})();

(function initRailOnce() {
  function attach() {
    const rail = $('#rail'); if (!rail || rail._wired) return;
    rail._wired = true;
    rail.addEventListener('session-open', async (e) => {

// (or after refresh). Subsequence + substring scoring.
S.quickOpen = {
  index: null, indexFor: null, building: false, buildingFor: null, buildGeneration: 0,
  controller: null,
};
const QUICK_OPEN_ENTRY_LIMIT = 5000;
const QUICK_OPEN_DIRECTORY_LIMIT = 1000;
const QUICK_OPEN_DEPTH_LIMIT = 64;

function invalidateQuickOpenIndex() {
  if (!S.quickOpen) return;
  S.quickOpen.buildGeneration += 1;
  S.quickOpen.controller?.abort?.();
  S.quickOpen.controller = null;
  S.quickOpen.index = null;
  S.quickOpen.indexFor = null;
  S.quickOpen.building = false;
  S.quickOpen.buildingFor = null;
}

async function buildQuickOpenIndex(expectedSessionId = S.session?.id) {
  if (!expectedSessionId || S.session?.id !== expectedSessionId
      || !sessionRuntimeSurfaceReady(S.session)) return false;
  if (S.quickOpen.indexFor === expectedSessionId && S.quickOpen.index) return true;
  if (S.quickOpen.building && S.quickOpen.buildingFor === expectedSessionId) return false;

  S.quickOpen.controller?.abort?.();
  const controller = new AbortController();
  S.quickOpen.controller = controller;
  const generation = ++S.quickOpen.buildGeneration;
  S.quickOpen.building = true;
  S.quickOpen.buildingFor = expectedSessionId;
  const out = [];
  const queue = [{ path: '', depth: 0 }];
  const visited = new Set();
  let cursor = 0;
  let directoryCount = 0;
  let entryCount = 0;
  const current = () => generation === S.quickOpen.buildGeneration
    && S.session?.id === expectedSessionId
    && sessionRuntimeSurfaceReady(S.session);

  try {
    // `/tree` is intentionally lazy and accepts arbitrary logical paths. The
    // client therefore owns explicit traversal bounds: a directory-only tree
    // or symlink cycle must not turn Quick Open into an infinite request loop.
    while (cursor < queue.length && directoryCount < QUICK_OPEN_DIRECTORY_LIMIT
        && entryCount < QUICK_OPEN_ENTRY_LIMIT) {
      if (!current()) return false;
      const directory = queue[cursor++];
      if (visited.has(directory.path) || directory.depth > QUICK_OPEN_DEPTH_LIMIT) continue;
      visited.add(directory.path);
      directoryCount += 1;

      let entries = [];
      try {
        const response = await fetch('/api/sessions/' + encodeURIComponent(expectedSessionId) + '/tree'
          + (directory.path ? '?path=' + encodeURIComponent(directory.path) : ''),
        { signal: controller.signal });
        if (!response.ok) continue;
        entries = await response.json();
      } catch { continue; }
      if (!current()) return false;
      if (!Array.isArray(entries)) continue;

      for (const entry of entries) {
        if (entryCount >= QUICK_OPEN_ENTRY_LIMIT) break;
        entryCount += 1;
        const logicalPath = typeof entry?.path === 'string' ? entry.path : '';
        if (!logicalPath) continue;
        if (entry.kind === 'dir') {
          if (directory.depth < QUICK_OPEN_DEPTH_LIMIT && !visited.has(logicalPath)
              && queue.length < QUICK_OPEN_DIRECTORY_LIMIT) {
            queue.push({ path: logicalPath, depth: directory.depth + 1 });
          }
        } else {
          out.push({ name: entry.name || logicalPath.split('/').pop() || logicalPath, path: logicalPath });
        }
      }
    }
    if (!current()) return false;
    S.quickOpen.index = out;
    S.quickOpen.indexFor = expectedSessionId;
    return true;
  } finally {
    if (generation === S.quickOpen.buildGeneration) {
      S.quickOpen.building = false;
      S.quickOpen.buildingFor = null;
      if (S.quickOpen.controller === controller) S.quickOpen.controller = null;
    }
  }
}

// Subsequence-aware fuzzy match. Returns a numeric score (higher = better)
// or -1 if no match. Falls back to substring + ranks paths shorter / closer
// to root higher so common files surface fast.
function quickOpenScore(query, name, path) {
  const q = query.toLowerCase();
  const n = name.toLowerCase();
  const p = path.toLowerCase();
  // 1. Exact name match — best.
  if (n === q) return 10000 - p.length;
  // 2. Name startsWith
  if (n.startsWith(q)) return 5000 - p.length;
  // 3. Name substring
  const nameIdx = n.indexOf(q);
  if (nameIdx >= 0) return 2000 - nameIdx * 5 - p.length;
  // 4. Path substring (matches against full relative path)
  const pathIdx = p.indexOf(q);
  if (pathIdx >= 0) return 800 - pathIdx * 2 - p.length;
  // 5. Subsequence in name (every query char appears in order)
  let qi = 0;
  for (let i = 0; i < n.length && qi < q.length; i++) {
    if (n[i] === q[qi]) qi++;
  }
  if (qi === q.length) return 300 - p.length;
  return -1;
}

let _quickOpenEl = null;
let _quickOpenActiveIdx = 0;
let _quickOpenHits = [];
let _quickOpenReturnFocus = null;

async function openQuickOpen() {
  if (!S.session || !S.session.id) return;
  if (presentSessionRuntimeGate('Quick Open')) return;
  // Build index in background while the modal opens.
  void buildQuickOpenIndex(S.session.id);
  if (_quickOpenEl) return;
  _quickOpenReturnFocus = axoDeepActiveElement();
  const overlay = el('div', 'quick-open');
  const card = el('div', 'quick-open-card');
  card.setAttribute('role', 'dialog');
  card.setAttribute('aria-modal', 'true');
  card.setAttribute('aria-label', 'Open file');
  const input = document.createElement('input');
  input.className = 'quick-open-input';
  input.id = 'quick-open-input';
  input.setAttribute('role', 'combobox');
  input.setAttribute('aria-label', 'Search workspace files');
  input.setAttribute('aria-controls', 'quick-open-list');
  input.setAttribute('aria-expanded', 'true');
  input.setAttribute('aria-autocomplete', 'list');
  input.placeholder = 'Search files by name…';
  input.spellcheck = false;
  input.autocomplete = 'off';
  const list = el('div', 'quick-open-list');
  list.id = 'quick-open-list';
  list.setAttribute('role', 'listbox');
  list.setAttribute('aria-label', 'Workspace files');
  card.appendChild(input);
  card.appendChild(list);
  overlay.appendChild(card);
  document.body.appendChild(overlay);
  _quickOpenEl = overlay;
  _quickOpenActiveIdx = 0;
  function refresh() {
    const q = input.value.trim();
    if (!q) {
      // Default view: most-recent first (the openFiles tabs sit on top).
      const recent = (axEditor().files || []).map(f => ({ name: f.path.split('/').pop(), path: f.path }));
      _quickOpenHits = recent;
    } else {
      const idx = S.quickOpen.index || [];
      const scored = [];
      for (const it of idx) {
        const s = quickOpenScore(q, it.name, it.path);
        if (s >= 0) scored.push({ ...it, score: s });
      }
      scored.sort((a, b) => b.score - a.score);
      _quickOpenHits = scored.slice(0, 200);
    }
    _quickOpenActiveIdx = 0;
    renderList();
  }
  function renderList() {
    list.innerHTML = '';
    if (!_quickOpenHits.length) {
      input.removeAttribute('aria-activedescendant');
      list.appendChild(el('div', 'quick-open-empty',
        S.quickOpen.building ? 'Indexing files…' : 'No matches'));
      return;
    }
    _quickOpenHits.forEach((it, i) => {
      const active = i === _quickOpenActiveIdx;
      const row = el('button', 'quick-open-item' + (active ? ' active' : ''));
      row.type = 'button';
      row.id = `quick-open-option-${i}`;
      row.setAttribute('role', 'option');
      row.setAttribute('aria-selected', String(active));
      row.tabIndex = -1;
      const [iconName, tint] = iconForFile(it.name);
      const ico = el('i', 'codicon codicon-' + iconName + ' ftn-ico ' + tint, '');
      const name = el('span', 'quick-open-name', it.name);
      const path = el('span', 'quick-open-path', it.path);
      row.appendChild(ico); row.appendChild(name); row.appendChild(path);
      row.addEventListener('click', () => choose(i));
      list.appendChild(row);
    });
    input.setAttribute('aria-activedescendant', `quick-open-option-${_quickOpenActiveIdx}`);
    // Keep the active row in view.
    const active = list.querySelector('.quick-open-item.active');
    if (active) active.scrollIntoView({ block: 'nearest' });
  }
  function move(delta) {
    if (!_quickOpenHits.length) return;
    _quickOpenActiveIdx = (_quickOpenActiveIdx + delta + _quickOpenHits.length) % _quickOpenHits.length;
    renderList();
  }
  function choose(idx) {
    const hit = _quickOpenHits[idx]; if (!hit) return;
    closeQuickOpen();
    openFile(hit.path);
  }
  input.addEventListener('input', refresh);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); closeQuickOpen(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp')   { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter')     { e.preventDefault(); choose(_quickOpenActiveIdx); }
    else if (e.key === 'Tab')       { e.preventDefault(); }
  });
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeQuickOpen();
  });
  // Initial render + light polling so the modal stays responsive while
  // the index is still being built in the background.
  refresh();
  const poll = setInterval(() => {
    if (!_quickOpenEl) { clearInterval(poll); return; }
    if (!S.quickOpen.building) { clearInterval(poll); refresh(); }
  }, 250);
  input.focus();
}
function closeQuickOpen() {
  if (_quickOpenEl) {
    _quickOpenEl.remove();
    _quickOpenEl = null;
    queueMicrotask(() => _quickOpenReturnFocus?.isConnected && _quickOpenReturnFocus.focus?.());
    _quickOpenReturnFocus = null;
  }
}

const FILES_PANE_WITH_EDITOR = 760;

 * A pane sized for a file tree leaves the editor about seventy pixels, which

function widenFilesForEditor() {

async function openFile(relPath) {
  if (presentSessionRuntimeGate('Files')) return;
  const expectedSessionId = S.session.id;
  const sessionState = S.session;
  // Files opened from Quick Open or an in-thread change card replace the
  // conversation temporarily. A user who explicitly pinned Files keeps that
  // wide layout because it is already visible.
  if (!visibleSurfaces().includes('files')) openModule('files');
  widenFilesForEditor();
  await axEditor().open(relPath);
  if (S.session === sessionState && S.session.id === expectedSessionId
      && !axEditor().files.some((file) => file.path === relPath)) {
    await reconcileSessionAfterRuntimeFailure(expectedSessionId, sessionState);
  }
  if (axEditor().activeFile) {
    S.session.filesDetailVisible = true;
    updateFilesEditor();
  }
}

async function closeFile(relPath) {
  if (presentSessionRuntimeGate('Files')) return false;
  const editor = axEditor();
  const file = editor.files.find((candidate) => candidate.path === relPath);
  if (!file) return false;
  if (file.dirty) {
    const runtime = captureSessionRuntimeSurface();
    const approved = await axoConfirm({
      title: 'Discard unsaved changes?',
      body: `Close "${relPath}" and discard its unsaved edits?`,
      okLabel: 'Discard',
      okKind: 'danger',
    });
    if (!approved || !runtime?.owns()) return false;
  }
  editor.close(relPath);
  return true;
}

function renderFileTabs() {
  const bar = $('#file-tabs'); if (!bar) return;
  const ed = axEditor();
  bar.innerHTML = '';
  ed.files.forEach((f, index) => {
    // A dot rather than a word: it has to be readable at a glance across a row
    // of tabs, and "unsaved" spelled out on every tab is noise.
    const tab = el('div', 'ftab' + (f.active ? ' active' : '') + (f.dirty ? ' dirty' : ''));
    tab.title = f.path + (f.dirty ? ' — unsaved changes' : '');
    const main = el('button', 'ftab-main');
    main.type = 'button';
    main.setAttribute('role', 'tab');
    main.setAttribute('aria-selected', String(f.active));
    main.tabIndex = f.active ? 0 : -1;
    main.appendChild(el('span', 'ftab-name', f.path.split('/').pop() || f.path));
    tab.appendChild(main);
    const x = el('button', 'ftab-close', f.dirty ? '•' : '×');
    x.type = 'button';
    x.setAttribute('aria-label', `Close ${f.path}${f.dirty ? ', unsaved changes' : ''}`);
    x.addEventListener('click', (e) => { e.stopPropagation(); closeFile(f.path); });
    tab.appendChild(x);
    main.addEventListener('click', () => ed.activate(f.path));
    main.addEventListener('keydown', (event) => {
      if (event.key === 'Delete') {
        event.preventDefault();
        closeFile(f.path);
      } else if (event.key === 'ArrowLeft' || event.key === 'ArrowRight'
          || event.key === 'Home' || event.key === 'End') {
        event.preventDefault();
        const files = ed.files;
        const targetIndex = event.key === 'Home' ? 0
          : event.key === 'End' ? files.length - 1
          : (index + (event.key === 'ArrowRight' ? 1 : -1) + files.length) % files.length;
        const target = files[targetIndex];
        if (target) {
          ed.activate(target.path);
          queueMicrotask(() => bar.querySelector('[role="tab"][aria-selected="true"]')?.focus());
        }
      }
    });
    bar.appendChild(tab);
  });

}

// Wide Files is list + detail. Constrained Files becomes a predictable
// master-detail flow instead of compressing both columns until neither works.
function updateFilesEditor() {
  const inner = document.querySelector('#cockpit-files .files-pane-inner');
  if (!inner) return;
  // Layout can run before the deferred module has upgraded <ax-editor>.
  // Treat that brief pre-upgrade state as an empty editor; the component's
  // files-changed event will update the pane after it is ready.
  const files = axEditor().files;
  const hasContent = (Array.isArray(files) && files.length > 0) || !!S.session.gitDiff;
  if (!hasContent) S.session.filesDetailVisible = false;
  const width = $('#cockpit-files')?.getBoundingClientRect().width || 0;
  const compact = width > 0 && width < FILES_MASTER_DETAIL_BREAKPOINT;
  const detailVisible = hasContent && S.session.filesDetailVisible !== false;
  inner.classList.toggle('files-compact', compact);
  inner.classList.toggle('show-detail', compact && detailVisible);
  inner.classList.toggle('show-master', compact && !detailVisible);
  inner.classList.toggle('has-detail', hasContent);
  inner.classList.toggle('empty-detail', !hasContent);
  renderFilesDetailBar();
  restoreFilesExplorerWidth();
  if (detailVisible) requestAnimationFrame(() => relayoutEmbeddedEditors());
}

/**
 * Replace what the viewer is showing, keeping the editor alive.
 *
 * The editor holds every open model and its view state, so it must be detached
 * rather than destroyed — clearing `innerHTML` around it would silently throw
 * away unsaved work and every cursor position. Callers that want the editor
 * back call `renderActiveFile()`.
 */
function viewerShow(node) {
  const v = $('#file-viewer'); if (!v) return null;
  const ed = axEditor();
  if (ed.parentNode === v) v.removeChild(ed);
  v.textContent = '';
  if (typeof node === 'string') v.innerHTML = node;
  else if (node) v.append(node);
  return v;
}

/**

/**
 * Show the active file: either the preview renderer or the editor.
 *
 * Preview is a different way of showing the same file, not part of the editor,
 * so it lives here and the editor element is simply set aside while it shows.
 */
function renderActiveFile() {
  const v = $('#file-viewer'); if (!v) return;
  const ed = axEditor();
  const modes = $('#viewer-modes');
  const hint = $('#viewer-hint');
  const saveBtn = $('#viewer-save');
  const f = ed.activeFile;
  if (!f) {
    if (modes) modes.style.display = 'none';
    viewerShow(filesEmptyDetail());
    renderFilesDetailBar();
    return;
  }
  S.session.filesDetailVisible = true;
  const previewable = PREVIEWABLE_LANGS.has((f.lang || '').toLowerCase());
  const mode = viewModeFor(f);
  if (modes) {
    modes.style.display = 'flex';
    $$('.vmode').forEach(b => {
      const m = b.dataset.mode;
      b.classList.toggle('active', m === mode);
      b.style.display = (m === 'preview' && !previewable) ? 'none' : '';
    });
    if (hint) {
      hint.textContent =
        mode === 'preview' ? 'Live preview (sandboxed)' :
        f.truncated        ? 'Read-only — file truncated by backend' :
        f.dirty            ? 'Unsaved changes — Ctrl+S to save' :
                             'Editing — Ctrl+S to save';
    }
    if (saveBtn) saveBtn.classList.toggle('hide', mode !== 'edit' || !!f.truncated);
    const revertBtn = $('#viewer-cancel');
    if (revertBtn) revertBtn.classList.toggle('hide', mode !== 'edit' || !f.dirty);
  }

  if (mode === 'preview') {
    const iframe = document.createElement('iframe');
    iframe.className = 'file-preview';
    iframe.setAttribute('sandbox', 'allow-scripts');
    const lang = (f.lang || '').toLowerCase();
    iframe.setAttribute('srcdoc',
      MARKDOWN_LANGS.has(lang) ? renderMarkdownDoc(ed.contentOf(f.path)) : ed.contentOf(f.path));
    viewerShow(iframe);
    renderFilesDetailBar();
    return;
  }
  // The editor moves back into the pane rather than being rebuilt — it is
  // holding a model and a cursor position for every open file.
  if (ed.parentNode !== v) {
    // A diff was showing; it is not any more, and holding its editor would keep
    // the pane open around an empty view once the last file is closed.
    if (S.session.gitDiff) gitDisposeDiff(window.monaco);
    v.textContent = '';
    v.append(ed);
  }
  ed.layout();
  ed.focus();
  renderFilesDetailBar();
}

/** Which way a file is being shown. Previewable types start rendered. */
const _viewModes = new Map();   // path → 'edit' | 'preview'
function viewModeFor(f) {
  if (!_viewModes.has(f.path)) {
    _viewModes.set(f.path,
      PREVIEWABLE_LANGS.has((f.lang || '').toLowerCase()) ? 'preview' : 'edit');
  }
  return _viewModes.get(f.path);
}

async function onViewerModeClick(e) {
  const b = e.target.closest('.vmode'); if (!b) return;
  const ed = axEditor();
  const f = ed.activeFile; if (!f) return;
  const next = b.dataset.mode;
  // Leaving the editor with unsaved work is a decision, not a side effect.
  if (viewModeFor(f) === 'edit' && next !== 'edit' && f.dirty) {
    const ok = await axoConfirm({
      title: 'Discard unsaved changes?',
      body: `"${f.path}" has unsaved edits. Switching view will lose them.`,
      okLabel: 'Discard',
      okKind: 'danger',
    });
    if (!ok) return;
    ed.revert(f.path);
  }
  _viewModes.set(f.path, next);
  renderActiveFile();
}

function saveActiveFile() {
  if (presentSessionRuntimeGate('Files')) return Promise.resolve(false);
  return axEditor().save();
}

/// Does this edit affect a file we have open? Path comparison handles both
/// absolute paths and paths relative to the session's working dir.
function pathMatchesOpen(editedPath, openPath) {
  if (!editedPath || !openPath) return false;
  const e = editedPath.replace(/^\.\//, '');
  const o = openPath.replace(/^\.\//, '');
  return e === o || e.endsWith('/' + o);
}

async function reloadOpenFileIfMatch(editedPath) {
  const ed = axEditor(); if (!ed) return;
  // Match on either an absolute path or one relative to the working dir.
  const hit = ed.files.find(f => pathMatchesOpen(editedPath, f.path));
  if (!hit) return;
  const done = await ed.reload(hit.path);
  // A file with unsaved work is left alone rather than overwritten; say so
  // instead of letting the buffer and the disk quietly disagree.
  if (!done && hit.dirty) {
    toast('File changed on disk', hit.path + ' has unsaved edits — not reloaded.', 'warn');
  }
  renderActiveFile();
}

// ── Activity stream ──
function appendSessionEl(node) {
  const msgs = $('#session-msgs');
  msgs.appendChild(node);
  msgs.scrollTop = msgs.scrollHeight;
}
function toolVerb(name, args) {
  args = args || {};
  switch (name) {
    case 'read_file': return ['◆', 'Read ' + (args.path || '')];
    case 'write_file': return ['✎', 'Write ' + (args.path || '')];
    case 'edit_file': return ['✎', 'Edit ' + (args.path || '')];
    case 'list_dir': return ['▤', 'List ' + (args.path || '.')];
    case 'grep': return ['⌕', 'Grep “' + (args.pattern || '') + '”'];
    case 'glob': return ['⌕', 'Glob ' + (args.pattern || '')];
    case 'bash': return ['▸', 'Bash: ' + (args.command || '')];
    case 'web_search': return ['◍', 'Search the web: ' + (args.query || '')];
    default:
      if (name && name.indexOf('skill_') === 0) return ['◈', 'Fire skill: ' + name.slice(6)];
      return ['•', name || 'tool'];

}
function renderToolResult(name, result) {
  if (result == null) return '';
  const r = result;
  if (name === 'bash') {
    let s = '';
    if (r.stdout) s += r.stdout;
    if (r.stderr) s += (s ? '\n' : '') + r.stderr;
    return '<pre>' + escHtml(s || '(no output)') + '</pre>'
      + (r.exit_code ? '<div class="small muted">exit ' + r.exit_code + '</div>' : '');
  }
  if (name === 'read_file') return '<pre>' + escHtml((r.content || '').slice(0, 4000)) + '</pre>';
  if (name === 'grep') return '<pre>' + escHtml(r.matches || '(no matches)') + '</pre>';
  if (name === 'list_dir') return '<pre>' + escHtml(r.listing || '') + '</pre>';
  if (name === 'glob') return '<pre>' + escHtml((r.files || []).join('\n')) + '</pre>';
  if (name === 'write_file' || name === 'edit_file') {
    return '<div class="small">✓ ' + escHtml(r.path || '')
      + (r.replacements != null ? ' · ' + r.replacements + ' replacement(s)' : '') + '</div>';
  }

      + '" target="_blank" rel="noopener">' + escHtml(h.title || h.url || '') + '</a>'
      + '<div class="small muted">' + escHtml((h.snippet || '').slice(0, 220)) + '</div></div>'

function sessionToolKey(turnId, agentId, callId, occurrence = 0) {
  return JSON.stringify([
    String(turnId || S.session.activeTurnId || ''),
    String(agentId || 'agent'),
    String(callId || ''),
    Number(occurrence) || 0,
  ]);
}
function sessionToolStart(d) {
  setThinking($('#session-msgs'), false);

  // Reconnect hydration may rebuild this durable start before the queued live
  // frame arrives. The per-turn occurrence identity makes replay idempotent.
  if (S.session.toolCards[key]) return;
  const { card, body } = buildToolCard(d);
  card.dataset.turnId = d.turn_id || S.session.activeTurnId || '';
  card.dataset.agentId = d.agent || 'agent';
  card.dataset.occurrence = String(d.occurrence || 0);
  S.session.toolCards[key] = { card, body };
  appendSessionEl(card);
}
function sessionToolResult(d) {

    sessionToolKey(d.turn_id, d.agent, d.call_id, d.occurrence)
  ];
  if (!tc) return;
  if (tc.card.dataset.resultApplied === 'true') return;
  fillToolCard(tc.card, d);
  // A write changed the project — refresh the file tree and re-render any
  // open file that just changed (which makes the Preview iframe auto-reload).
  if (!d.is_error && (d.name === 'write_file' || d.name === 'edit_file' || d.name === 'bash')) {

}

function sessionAppendText(delta, agentId = 'agent') {

      live.replayCovered = live.replayCovered.slice(uncovered.length);
      return;

      uncovered = uncovered.slice(live.replayCovered.length);

    live.streamBuf = '';
    live.reasoningEl = null;

function sessionAppendReasoning(delta, agentId = 'agent') {
  setThinking($('#session-msgs'), false);
  const live = sessionLiveStream(agentId);

    det.className = 'chat-reasoning';

    sum.textContent = 'Thinking…';

    live.reasoningBuf = '';
  }

  live.reasoningEl.textContent = live.reasoningBuf;
  const msgs = $('#session-msgs'); msgs.scrollTop = msgs.scrollHeight;
}

// ── Session transcript: rehydrate prior turns + Retry/Rewind ─────────
// The cockpit's Activity feed is otherwise ephemeral; on reopen we fetch the
// canonical turns and rebuild it so the conversation isn't lost — including
// multi-agent output and structured context — and so rewind uses durable ids.
async function reloadSessionTranscript(expectedSessionId = S.session.id, options = {}) {
  if (!expectedSessionId || S.session.id !== expectedSessionId) return null;
  const sessionState = S.session;
  const ownershipAtRequest = liveSessionOwnershipStamp(expectedSessionId);
  const generation = ++sessionState.historyGeneration;
  sessionState.historyController?.abort?.();
  const controller = new AbortController();
  sessionState.historyController = controller;
  sessionState.historyState = 'loading';
  sessionState.historyError = '';
  syncSessionComposerState();
  try {
    const r = await fetch('/api/sessions/' + encodeURIComponent(expectedSessionId) + '/turns', {
      signal: controller.signal,
    });
    if (!r.ok) {
      const detail = await r.json().catch(() => ({}));
      throw new Error(detail.error || ('HTTP ' + r.status));
    }
    const turns = await r.json();
    if (!Array.isArray(turns)) throw new Error('Turn history response is not a list');
    if (S.session !== sessionState || generation !== sessionState.historyGeneration) return null;
    // A History request can be slower than the live WebSocket. Reconcile with
    // the cache at render time—not when the request started—so frames that
    // arrived while `/turns` was in flight cannot be erased by this rebuild.
    const cachedRun = _liveSessionRuns.get(expectedSessionId) || null;
    const ownershipAdvanced = liveSessionOwnershipStamp(expectedSessionId) !== ownershipAtRequest;
    const preserveLive = Boolean(options.preserveLive || cachedRun?.turn_id);
    const liveRun = preserveLive && cachedRun
      ? mergeLiveSessionRun(options.liveRun || null, cachedRun, {
          preferCachedTurn: ownershipAdvanced,
        })
      : null;
    if (liveRun?.turn_id) _liveSessionRuns.set(expectedSessionId, liveRun);
    // Accepted/Start is published only after the new turn is durable, but an
    // older HTTP response may already be in flight. Never let that stale body
    // erase the newer live owner; a short bounded reread catches up instead.
    if (liveRun?.turn_id && !turns.some((turn) => turn?.id === liveRun.turn_id)) {
      sessionState.historyState = 'ready';
      sessionState.historyError = '';
      syncSessionComposerState();
      const catchupAttempt = Number(options.catchupAttempt || 0);
      if (catchupAttempt < 3) {
        setTimeout(() => {
          if (S.session === sessionState
              && _liveSessionRuns.get(expectedSessionId)?.turn_id === liveRun.turn_id) {
            void reloadSessionTranscript(expectedSessionId, {
              preserveLive: true,
              liveRun,
              catchupAttempt: catchupAttempt + 1,
            });
          }
        }, 50 * (catchupAttempt + 1));
      }
      return turns;
    }
    renderSessionTurns(turns, { ...options, preserveLive, liveRun });
    for (const frame of (Array.isArray(liveRun?.toolFrames) ? liveRun.toolFrames : [])) {
      if (frame.phase === 'start') sessionToolStart(frame);
      else if (frame.phase === 'result') sessionToolResult(frame);
    }
    sessionState.historyState = 'ready';
    sessionState.historyError = '';
    syncSessionComposerState();
    return turns;
  } catch (error) {
    if (error?.name === 'AbortError' || S.session !== sessionState
        || generation !== sessionState.historyGeneration) return null;
    sessionState.historyState = 'error';
    sessionState.historyError = String(error?.message || error);
    renderSessionHistoryError(sessionState.historyError);
    syncSessionComposerState();
    return null;
  }
}

function renderSessionHistoryError(message) {
  const host = $('#session-msgs');
  if (!host) return;
  host.innerHTML = '';
  const state = el('div', 'empty');
  state.appendChild(el('div', '', 'Session history is unavailable.'));
  state.appendChild(el('div', 'small muted', message || 'Could not read canonical history.'));
  const retry = el('button', 'btn sm', 'Retry');
  retry.type = 'button';
  retry.addEventListener('click', () => void hydrateSessionConversation(S.session.id));
  state.appendChild(retry);
  host.appendChild(state);
}

async function hydrateSessionConversation(sessionId) {
  if (!sessionId || S.session.id !== sessionId) return false;
  const sessionState = S.session;
  sessionState.historyState = 'loading';
  syncSessionComposerState();
  let [turns, activeResult] = await Promise.all([
    reloadSessionTranscript(sessionId),
    readStableActiveSessionTurn(sessionId)
      .catch((error) => ({ error: String(error?.message || error) })),
  ]);
  if (S.session !== sessionState) return false;
  if (!Array.isArray(turns)) return false;
  // The active read may have settled before the slower History response. If a
  // boundary landed in that interval, order one final read after that frame.
  if (!activeResult?.error
      && activeResult.ownership_stamp !== liveSessionOwnershipStamp(sessionId)) {
    activeResult = await readStableActiveSessionTurn(sessionId)
      .catch((error) => ({ error: String(error?.message || error) }));
    if (S.session !== sessionState) return false;
  }
  if (activeResult?.error) {
    sessionState.historyState = 'error';
    sessionState.historyError = 'Current turn state is unavailable: ' + activeResult.error;
    renderSessionHistoryError(sessionState.historyError);
    syncSessionComposerState();
    return false;
  }
  const cachedRun = _liveSessionRuns.get(sessionId) || null;
  // A stable `/active-turn` read is authoritative for ownership. Same-turn
  // socket projections may still be newer, so merge their buffered content;
  // a different cached turn (or ghost cache when the endpoint says idle) is
  // discarded.
  const run = activeResult?.run
    ? mergeLiveSessionRun(activeResult.run, cachedRun, { preferCachedTurn: false })
    : null;
  if (run?.turn_id) _liveSessionRuns.set(sessionId, run);
  else _liveSessionRuns.delete(sessionId);
  if (sessionState.pendingTurn) {
    resolvePendingSessionTurn(sessionId, sessionState.pendingTurn, turns);
  }
  applyOpenSessionLiveRun(run, turns);
  return true;
}

async function readStableActiveSessionTurn(sessionId) {
  // Tokens, reasoning, tools, and worker progress do not change Stop
  // ownership. Snapshot/Accepted/terminal boundaries do. If one arrives while
  // HTTP is in flight it may be older or newer than the response, so order a
  // new authoritative read after that arrival instead of comparing clocks.
  for (let attempt = 0; attempt < 8; attempt += 1) {
    const ownershipStamp = liveSessionOwnershipStamp(sessionId);
    const response = await fetch('/api/sessions/' + encodeURIComponent(sessionId) + '/active-turn');
    if (!response.ok) {
      const detail = await response.json().catch(() => ({}));
      throw new Error(detail.error || ('HTTP ' + response.status));
    }
    const result = await response.json();
    if (ownershipStamp === liveSessionOwnershipStamp(sessionId)) {
      return { ...result, ownership_stamp: ownershipStamp };
    }
  }
  throw new Error('Current turn ownership kept changing while Axocoatl reconnected');
}

function applyOpenSessionLiveRun(run, turns = null) {
  if (!S.session.id) return;
  if (run?.turn_id) {
    const pending = S.session.pendingTurn;
    if (pending?.id === run.turn_id) {
      void $('#session-context')?.consumeAccepted?.(pending.referenceIds || []);
      S.session.pendingTurn = null;
      _pendingSessionTurns.delete(S.session.id);
      setSessionTurnPending(false);
    }
    setSessionTurnRunning(run.turn_id, true);
    if (Array.isArray(turns) && turns.some((turn) => turn?.id === run.turn_id)) {
      renderSessionTurns(turns, { preserveLive: true, liveRun: run });
    }
    for (const frame of (Array.isArray(run.toolFrames) ? run.toolFrames : [])) {
      if (frame.phase === 'start') sessionToolStart(frame);
      else if (frame.phase === 'result') sessionToolResult(frame);
    }
    restoreCoordinatorRunView(run, { open: true });
  } else {
    if (S.session.activeTurnId) setSessionTurnRunning(S.session.activeTurnId, false);
  }
  syncSessionComposerState();
}

async function reconcilePendingSessionTurn(sessionId, pending, retry = 0) {
  if (!pending || S.session.id !== sessionId || S.session.pendingTurn !== pending) return;
  const turns = await reloadSessionTranscript(sessionId);
  if (S.session.id !== sessionId || S.session.pendingTurn !== pending) return;
  if (!Array.isArray(turns)) {
    if (retry === 3) {
      toast('Confirming your send', 'The connection is back, but turn history is still unavailable. Axocoatl will keep checking before it lets this prompt be sent twice.', 'warn', 7000);
    }
    setTimeout(() => void reconcilePendingSessionTurn(
      sessionId, pending, Math.min(retry + 1, 8),
    ), Math.min(1000 * (2 ** Math.min(retry, 3)), 8000));
    return;
  }
  resolvePendingSessionTurn(sessionId, pending, turns);
}

function resolvePendingSessionTurn(sessionId, pending, turns) {
  if (!pending || S.session.id !== sessionId || S.session.pendingTurn !== pending
      || !Array.isArray(turns)) return;
  const accepted = turns.find(turn => turn?.id === pending.id);
  if (accepted) {
    void $('#session-context')?.consumeAccepted?.(pending.referenceIds || []);
    if (accepted.status === 'running') setSessionTurnRunning(pending.id, true);
  } else {
    pending.userEl?.remove?.();
    if (!$('#session-text').value) $('#session-text').value = pending.composerText || '';
    if (Array.isArray(pending.inlineRefs) && !(S.session.refs || []).length) {
      S.session.refs = pending.inlineRefs;
      renderChatRefs();
    }
  }
  S.session.pendingTurn = null;
  _pendingSessionTurns.delete(sessionId);
  setSessionTurnPending(false);
}

function renderSessionTurns(turns, options = {}) {
  const host = $('#session-msgs');
  host.innerHTML = '';
  S.session.toolCards = {};
  S.session.streamEl = null;
  S.session.reasoningEl = null;
  S.session.liveStreams = new Map();
  const visible = Array.isArray(turns) ? turns : [];
  visible.forEach((turn, index) => {
    const priorTurnId = index > 0 ? visible[index - 1].id : null;
    const user = el('div', 'smsg user');
    user.dataset.turnId = turn.id || '';
    user.appendChild(el('div', 'smsg-role', 'you'));
    user.appendChild(el('div', 'smsg-body', turn.user_input || ''));
    const context = Array.isArray(turn.context) ? turn.context : [];
    if (context.length) {
      const chips = el('div', 'chat-refs');
      for (const reference of context) {
        const uploaded = reference.kind === 'upload';
        const chip = el(uploaded ? 'button' : 'span', 'chat-ref');
        if (uploaded) {
          chip.type = 'button';
          chip.title = 'Preview or download this historical attachment';
          chip.addEventListener('click', () => $('#session-context')?.openReference?.(reference));
        }
        chip.textContent = reference.display_name || reference.reference_id || 'context';
        chips.appendChild(chip);
      }
      user.appendChild(chips);
    }
    user.appendChild(sessionActionRow({
      role: 'user', text: turn.user_input || '', keepThroughTurnId: priorTurnId,
      hasContext: context.length > 0,
    }));
    host.appendChild(user);

    // Tool route evidence is part of the canonical turn ledger, not only the
    // live WebSocket. Rebuild the same cards after reload/restart so a user can
    // still inspect how the answer was produced and whether a tool failed.
    const toolCards = new Map();
    for (const execution of (Array.isArray(turn.execution_events) ? turn.execution_events : [])) {
      if (execution?.kind !== 'tool_started' && execution?.kind !== 'tool_result') continue;
      const metadata = execution.metadata && typeof execution.metadata === 'object'
        ? execution.metadata : {};
      const callId = execution.execution_id || metadata.call_id || execution.operation_id || '';
      const agentId = metadata.agent_id || turn.agent_id || 'agent';
      const occurrence = Number(metadata.occurrence) || 0;
      const toolKey = sessionToolKey(turn.id, agentId, callId, occurrence);
      const name = metadata.tool_name || 'tool';
      if (execution.kind === 'tool_started') {
        const built = buildToolCard({
          name, arguments: metadata.arguments || {}, call_id: callId, agent: agentId, occurrence,
        });
        built.card.dataset.turnId = turn.id || '';
        built.card.dataset.agentId = agentId;
        built.card.dataset.occurrence = String(occurrence);
        toolCards.set(toolKey, built.card);
        S.session.toolCards[toolKey] = built;
        host.appendChild(built.card);
      } else {
        let card = toolCards.get(toolKey);
        if (!card) {
          const built = buildToolCard({
            name, arguments: {}, call_id: callId, agent: agentId, occurrence,
          });
          built.card.dataset.turnId = turn.id || '';
          built.card.dataset.agentId = agentId;
          built.card.dataset.occurrence = String(occurrence);
          card = built.card;
          toolCards.set(toolKey, card);
          S.session.toolCards[toolKey] = built;
          host.appendChild(card);
        }
        fillToolCard(card, {
          name,
          result: metadata.result ?? {},
          is_error: Boolean(metadata.is_error),
        });
      }
    }

    const agentOutputs = Array.isArray(turn.agent_outputs) ? turn.agent_outputs : [];
    const outputs = agentOutputs.length
      ? agentOutputs.map(output => ({ agent: output.agent_id || 'agent', content: output.output || '' }))
      : [{ agent: turn.agent_id || 'agent', content: turn.final_output || turn.partial_output || '' }];
    if (agentOutputs.length && turn.partial_output) {
      const completedLength = agentOutputs.reduce(
        (total, output) => total + String(output.output || '').length, 0,
      );
      const tail = turn.partial_output.slice(Math.min(completedLength, turn.partial_output.length));
      if (tail.trim()) {
        const liveAgent = options.liveRun?.agents?.find?.(agent => agent?.status === 'running');
        outputs.push({ agent: liveAgent?.agent || turn.agent_id || 'agent', content: tail });
      }
    }
    for (const output of outputs) {
      if (!output.content.trim()) continue;
      const assistant = el('div', 'smsg');
      assistant.dataset.turnId = turn.id || '';
      assistant.dataset.agentId = output.agent;
      assistant.appendChild(el('div', 'smsg-role', output.agent));
      const body = el('div', 'smsg-body prose');
      body.innerHTML = mdRender(output.content);
      assistant.appendChild(body);
      assistant.appendChild(sessionActionRow({
        role: 'agent', text: output.content,
        retryKeepThroughTurnId: priorTurnId, retryText: turn.user_input || '',
        hasContext: context.length > 0,
      }));
      host.appendChild(assistant);
    }
    if (turn.status && turn.status !== 'completed') {
      const state = el('div', 'small muted', turn.status === 'cancelled'
        ? 'Stopped by you' : turn.status === 'interrupted'
          ? 'Interrupted by restart' : turn.status === 'failed'
            ? ('Failed' + (turn.error ? ': ' + turn.error : '')) : turn.status);
      state.dataset.turnId = turn.id || '';
      host.appendChild(state);
    }
    const terminalMetadata = turn.metadata && typeof turn.metadata === 'object'
      ? turn.metadata : {};
    const hasTokenUsage = ['input_tokens', 'output_tokens', 'reasoning_tokens', 'token_usage_known']
      .some((key) => Object.prototype.hasOwnProperty.call(terminalMetadata, key));
    if (hasTokenUsage && turn.status !== 'running') {
      const known = terminalMetadata.token_usage_known === true;
      const input = Number(terminalMetadata.input_tokens || 0);
      const output = Number(terminalMetadata.output_tokens || 0);
      const reasoning = Number(terminalMetadata.reasoning_tokens || 0);
      const usage = el('div', 'small muted', `${known ? '' : '≥'}${input} in / ${output} out / `
        + `${reasoning} reasoning${known ? '' : ' · known subtotal; usage incomplete'}`);
      usage.dataset.turnId = turn.id || '';
      host.appendChild(usage);
    }
  });
  if (options.preserveLive) {
    const running = visible.find(turn => turn.status === 'running');
    if (running && running.id === S.session.activeTurnId) {
      const liveAgents = Array.isArray(options.liveRun?.agents) ? options.liveRun.agents : [];
      const replayAgents = liveAgents.length ? liveAgents : [{
        agent: running.agent_id || 'agent',
        output: running.agent_outputs?.length ? '' : running.partial_output || '',
        status: 'running',
      }];
      for (const liveAgent of replayAgents) {
        const liveAgentId = liveAgent?.agent || running.agent_id || 'agent';
        const liveOutput = liveAgent?.output || '';
        const completedOutputs = Array.isArray(running.agent_outputs)
          ? running.agent_outputs : [];
        const completed = completedOutputs.find(output =>
          (output.agent_id || 'agent') === liveAgentId);
        let canonicalOutput = completed?.output || '';
        if (!completedOutputs.length) {
          canonicalOutput = running.partial_output || '';
        } else if (!canonicalOutput && liveAgent?.status === 'running') {
          const completedLength = completedOutputs.reduce(
            (total, output) => total + String(output.output || '').length, 0,
          );
          canonicalOutput = String(running.partial_output || '').slice(
            Math.min(completedLength, String(running.partial_output || '').length),
          );
        }
        const mergedOutput = canonicalOutput.startsWith(liveOutput)
          ? canonicalOutput
          : liveOutput.startsWith(canonicalOutput) ? liveOutput
          : (canonicalOutput || liveOutput);
        let assistant = Array.from(host.querySelectorAll('.smsg[data-turn-id]'))
          .find(node => node.dataset.turnId === running.id
            && node.dataset.agentId === liveAgentId);
        let body = assistant?.querySelector('.smsg-body');
        if (!body && mergedOutput) {
          assistant = el('div', 'smsg');
          assistant.dataset.turnId = running.id;
          assistant.dataset.agentId = liveAgentId;
          assistant.appendChild(el('div', 'smsg-role', liveAgentId));
          body = el('div', 'smsg-body prose');
          body.innerHTML = mdRender(mergedOutput);
          assistant.appendChild(body);
          host.appendChild(assistant);
        }
        if (body) {
          // The durable render above rebuilt the canonical prefix. Re-bind the
          // live stream to that node and immediately restore the longer
          // same-turn projection so a delayed History response cannot make
          // already-visible tokens disappear until the next frame arrives.
          body.innerHTML = mdRender(mergedOutput);
          const live = sessionLiveStream(liveAgentId);
          live.streamEl = body;
          live.streamBuf = mergedOutput;
          live.replayCovered = canonicalOutput.startsWith(liveOutput)
            ? canonicalOutput.slice(liveOutput.length) : '';
        }
        if (liveAgent?.thinking) sessionAppendReasoning(liveAgent.thinking, liveAgentId);
      }
    }
  }
  host.scrollTop = host.scrollHeight;
}

// Render an array of stored messages (user / assistant[+tool_calls] / tool)
// into the Activity feed, reconstructing tool cards by pairing each assistant
// tool_call with its following tool-result message.
function renderSessionTranscript(messages) {
  const host = $('#session-msgs');
  host.innerHTML = '';
  S.session.toolCards = {};
  S.session.streamEl = null;
  S.session.reasoningEl = null;
  let lastUser = null; // { idx, content } — the prompt that drives the next reply
  (messages || []).forEach((m, idx) => {
    const role = String(m.role || '').toLowerCase();
    if (role === 'user') {
      lastUser = { idx, content: m.content || '' };
      const wrap = el('div', 'smsg user');
      wrap.appendChild(el('div', 'smsg-role', 'you'));
      wrap.appendChild(el('div', 'smsg-body', m.content || ''));
      // Rewind: drop this turn and everything after it.
      wrap.appendChild(sessionActionRow({ role: 'user', text: m.content || '', keep: idx }));
      host.appendChild(wrap);
    } else if (role === 'assistant') {
      for (const tc of (m.tool_calls || [])) {
        let args = {};
        try { args = JSON.parse(tc.arguments_json || '{}'); } catch {}
        const { card } = buildToolCard({ name: tc.name, arguments: args, call_id: tc.id });
        S.session.toolCards[tc.id] = { card };
        host.appendChild(card);
      }
      if (m.content && m.content.trim()) {
        const wrap = el('div', 'smsg');
        wrap.appendChild(el('div', 'smsg-role', 'agent'));
        const b = el('div', 'smsg-body prose');
        b.innerHTML = mdRender(m.content);
        wrap.appendChild(b);
        // Retry: re-run the prompt that produced this reply.
        wrap.appendChild(sessionActionRow({
          role: 'agent', text: m.content,
          retryKeep: lastUser ? lastUser.idx : null,
          retryText: lastUser ? lastUser.content : null,
        }));
        host.appendChild(wrap);
      }
    } else if (role === 'tool') {
      const tc = S.session.toolCards[m.tool_call_id];
      if (tc) {
        tc.card.classList.remove('running');
        tc.card.classList.add('ok');
        const body = tc.card.querySelector('.toolcard-body');
        if (body) body.innerHTML = '<pre>' + escHtml(m.content || '') + '</pre>';
      }
    }
  });
  host.scrollTop = host.scrollHeight;
}

function sessionActionRow(opts) {
  const acts = el('div', 'smsg-actions');
  acts.appendChild(copyActionBtn(opts.text || ''));
  // Closed Sessions mount as a durable, read-only recovery surface. Copying
  // transcript evidence remains available, but changing its canonical
  // boundary requires the explicit Reopen transition first.
  const canRewind = sessionSupportsRewind() && S.session.status !== 'closed';
  if (opts.role === 'user' && canRewind && Object.hasOwn(opts, 'keepThroughTurnId')) {
    const rewind = el('button', 'smsg-act', '⤺ Rewind');
    rewind.title = opts.hasContext
      ? 'Go back here. Attached files stay in history but are not reattached to the composer.'
      : 'Go back to this turn — drop everything after, then continue';
    rewind.addEventListener('click', () => sessionRewind(
      opts.keepThroughTurnId, null, opts.text, Boolean(opts.hasContext),
    ));
    acts.appendChild(rewind);
  } else if (opts.role === 'agent' && canRewind && Object.hasOwn(opts, 'retryKeepThroughTurnId')) {
    const retry = el('button', 'smsg-act', '⟳ Retry');
    retry.disabled = Boolean(opts.hasContext);
    retry.title = opts.hasContext
      ? 'Retry is unavailable because this turn used immutable attached context. Reattach the files and send a new turn.'
      : 'Regenerate this response';
    if (!opts.hasContext) {
      retry.addEventListener('click', () => sessionRewind(
        opts.retryKeepThroughTurnId, opts.retryText, null, false,
      ));
    }
    acts.appendChild(retry);
  }
  return acts;
}

// Rewind the session through one durable turn id. When
// `resend` is set (Retry), re-send it; when `prefill` is set (Rewind), drop the
// turn and put its text back in the composer to edit/re-ask.
async function sessionRewind(keepThroughTurnId, resend, prefill, hadContext = false) {
  const id = S.session.id;
  if (!id) return;
  if (presentSessionRuntimeGate('Rewind')) return;
  try {
    const r = await fetch('/api/sessions/' + encodeURIComponent(id) + '/rewind', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ keep_through_turn_id: keepThroughTurnId }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    await reloadSessionTranscript();
    if (resend != null && resend !== '') {
      $('#session-text').value = resend;
      sendSessionMessage();
    } else if (prefill != null) {
      $('#session-text').value = prefill;
      $('#session-text').focus();
      if (hadContext) toast('Files were not reattached',
        'The historical turn keeps its immutable context. Attach the files again before sending a revised request.',
        'info', 7000);
    }
  } catch (e) { toast('Rewind failed', String(e), 'err'); }
}

// ── Source Control shell adapter ────────────────────────────────────
// `<ax-source-control>` owns Git state and mutations. The shell keeps only
// pane routing and the Monaco diff boundary.
function setExplorerTab(tab) {
  tab = tab === 'git' ? 'git' : 'files';
  if (tab === 'git' && presentSessionRuntimeGate('Source Control')) return;
  S.session.explorerTab = tab;
  $$('#explorer-tabs .etab').forEach(b => b.classList.toggle('active', b.dataset.etab === tab));
  const git = tab === 'git';
  $('#file-search')?.classList.toggle('hide', git);
  $('#file-tree')?.classList.toggle('hide', git);
  $('#source-control')?.classList.toggle('hide', !git);
  restoreFilesExplorerWidth(tab);
  if (!S.session.gitDiff && !axEditor().activeFile) viewerShow(filesEmptyDetail());
  updateFilesEditor();
  if (git) void refreshGitPane({ branches: true });
}

async function refreshGitPane(options) {
  const sourceControl = $('#source-control');
  if (!sourceControl || !S.session.id || !sessionRuntimeSurfaceReady()) return;
  const runtime = captureSessionRuntimeSurface();
  if (!runtime) return;
  const expectedSessionId = runtime.sessionId;
  const sessionState = S.session;
  sourceControl.session = expectedSessionId;
  await sourceControl.refresh(options);
  if (!runtime.owns()) return;
  if (sourceControl.shadowRoot?.querySelector('.state.error')) {
    await reconcileSessionAfterRuntimeFailure(expectedSessionId, sessionState);
  }
}

// Open a file's working-tree diff (HEAD vs current) in the editor area, using
// Monaco's diff editor.
async function openGitDiff(path) {
  const v = $('#file-viewer'); if (!v || !S.session.id) return;
  if (presentSessionRuntimeGate('Source Control')) return;
  const runtime = captureSessionRuntimeSurface();
  if (!runtime) return;
  // Open the editor column (it's collapsed when nothing's shown) so Monaco
  // lays out at a real size.
  widenFilesForEditor();
  S.session.filesDetailVisible = true;
  gitDisposeDiff(window.monaco);
  const generation = (S.session.gitDiffGeneration || 0) + 1;
  S.session.gitDiffGeneration = generation;
  S.session.gitDiff = { path, loading: true, generation };
  const modes = $('#viewer-modes'); if (modes) modes.style.display = 'none';
  viewerShow('<div class="empty small">Loading diff…</div>');
  updateFilesEditor();
  let d;
  try {
    d = await fetch('/api/sessions/' + encodeURIComponent(runtime.sessionId) + '/git/diff?path=' + encodeURIComponent(path)).then(r => r.json());
  } catch {
    if (!runtime.owns() || S.session.gitDiffGeneration !== generation) return;
    S.session.gitDiff = { path, sentinel: true, error: true, generation };
    viewerShow('<div class="empty small">Diff failed to load.</div>');
    updateFilesEditor();
    return;
  }
  if (!runtime.owns() || S.session.gitDiffGeneration !== generation) return;
  if (!d || d.error) {
