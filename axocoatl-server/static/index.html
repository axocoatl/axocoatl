  const banner = $('#session-environment');
  if (!banner) return;
  const state = sessionEnvironmentState(session);
  const message = sessionEnvironmentMessage(session);
  banner.classList.toggle('hide', !message);
  banner.dataset.state = state;
  banner.toggleAttribute('aria-busy', state === 'preparing');
  renderSessionEnvironmentEvidence(session);
  if (!message) return;
  $('#session-environment-title').textContent = message.title;
  $('#session-environment-detail').textContent = message.detail;
  const command = $('#session-environment-command');
  const setupCommand = session?.environment?.setup_command || '';
  command.textContent = setupCommand;
  command.classList.toggle('hide', !setupCommand);
  const action = $('#session-environment-action');
  action.textContent = message.action;
  action.classList.toggle('hide', !message.action);
}

function presentSessionEnvironmentGate(feature = 'This action') {
  if (!S.session.id || sessionEnvironmentReady()) return false;
  renderSessionEnvironment(S.session);
  const state = sessionEnvironmentState();
  const message = sessionEnvironmentMessage();
  toast(
    state === 'failed' ? 'Project environment failed' : 'Project environment needs attention',
    `${feature} is unavailable until the project environment is ready. ${message?.detail || ''}`,
    state === 'failed' ? 'err' : 'warn',
    8000,
  );
  if (S.session.status === 'closed') {
    $('#session-environment')?.scrollIntoView?.({ block: 'nearest' });
  } else if (state !== 'preparing') {
    sessionHome()?.configureEnvironment?.(S.session.id);
  } else {
    $('#session-environment')?.scrollIntoView?.({ block: 'nearest' });
  }
  return true;
}

/**
 * A persisted Ready record may need to reconstruct its sandbox after a daemon
 * restart. If that lazy activation fails, the daemon durably changes the exact
 * Session to Failed before returning the request error. Re-read that record so
 * the cockpit cannot keep presenting stale Ready controls.
 */
async function reconcileSessionAfterRuntimeFailure(
  expectedSessionId,
  expectedSessionState = S.session,
  signal = null,
) {
  if (!expectedSessionId || S.session !== expectedSessionState
      || S.session.id !== expectedSessionId) return null;
  try {
    const workspaceId = expectedSessionState.workspaceId;
    const url = workspaceId
      ? `/api/workspaces/${encodeURIComponent(workspaceId)}/sessions`
      : '/api/sessions';
    const response = await fetch(url, {
      cache: 'no-store',
      headers: { accept: 'application/json' },
      ...(signal ? { signal } : {}),
    });
    if (!response.ok) return null;
    const sessions = await response.json();
    const exact = Array.isArray(sessions)
      ? sessions.find((session) => session?.id === expectedSessionId) : null;
    if (!exact || S.session !== expectedSessionState || S.session.id !== expectedSessionId) return exact;

    // A missed cross-tab lifecycle edge can leave the browser holding Ready
    // from an older durable environment generation. Invalidate that runtime
    // before rebinding components to the canonical record.
    if (Number(expectedSessionState.environment?.generation || 0)
        !== Number(exact.environment?.generation || 0)) {
      markSessionRuntimeActivationRequired(expectedSessionId);
    }

    if (!Array.isArray(S.sessions)) S.sessions = [];
    const at = S.sessions.findIndex((session) => session?.id === expectedSessionId);
    if (at >= 0) S.sessions.splice(at, 1, exact);
    else S.sessions.push(exact);
    applySessionEnvironmentUpdate(exact, { activateRuntime: false });
    void sessionHome()?.refresh?.();
    void $('#rail')?.refresh?.();
    return exact;
  } catch (error) {
    if (error?.name === 'AbortError') return null;
    console.warn('could not reconcile Session after runtime failure:', error);
    return null;
  }
}

async function reconcileSessionEnvironmentLifecycle(
  sessionId,
  { invalidatesRuntime = false, retireCockpitState = null } = {},
) {
  if (!sessionId || S.session.id !== sessionId) {
    void sessionHome()?.refresh?.();
    void $('#rail')?.refresh?.();
    return null;
  }
  const sessionState = S.session;
  const wasClosed = sessionState.status === 'closed';
  const retiresThisCockpit = retireCockpitState === sessionState;
  if (invalidatesRuntime) markSessionRuntimeActivationRequired(sessionId);
  const exact = await reconcileSessionAfterRuntimeFailure(sessionId, sessionState);
  if (S.session !== sessionState || S.session.id !== sessionId) return exact;
  if (!exact) {
    const home = sessionHome();
    const refreshed = await home?.refresh?.();
    if (refreshed && S.session === sessionState && S.session.id === sessionId
        && !home?.session?.(sessionId)) {
      closeCockpit();
    }
    return null;
  }
  if (exact.status === 'closed') {
    // Selecting an already-Closed Session deliberately mounts its durable
    // transcript and unresolved Attempt recovery read-only. Preserve that
    // view across reconnect snapshots. A lifecycle edge that closes a Session
    // which was active when reconciliation began still retires the cockpit,
    // matching the explicit cross-tab Close contract.
    if (retiresThisCockpit || !wasClosed) closeCockpit();
    return exact;
  }
  if (_sessionEnvironmentTransitions.has(sessionId)
      || workspaceAttemptOwnsPrimaryRuntime(sessionState)) return exact;
  if (sessionEnvironmentReady(sessionState)
      && sessionState.runtimeActivationPending
      && !sessionState.attemptRestorePending
      && S.threadVariants?.sessionId !== sessionId) {
    await activateOpenedSessionRuntime(sessionId);
  }
  return exact;
}

function applySessionEnvironmentUpdate(
  session,
  { runtimeRebuilt = false, activateRuntime = true } = {},
) {
  if (!session?.id || session.id !== S.session.id) return;
  const previous = S.session.environment || { state: 'unprepared' };
  const next = session.environment || { state: 'unprepared' };
  const previousStatus = S.session.status || 'active';
  const nextStatus = session.status || previousStatus;
  const changed = previous.generation !== next.generation || previous.state !== next.state
    || previous.error !== next.error || previous.setup_command !== next.setup_command
    || sessionEnvironmentEvidenceSignature(previous) !== sessionEnvironmentEvidenceSignature(next)
    || sessionEnvironmentRuntimeSignature(previous) !== sessionEnvironmentRuntimeSignature(next)
    || previousStatus !== nextStatus;
  if (!changed && !runtimeRebuilt) return;
  S.session.environment = next;
  S.session.status = nextStatus;
  S.session.mode = session.mode || S.session.mode;
  S.session.name = session.name || S.session.name;
  S.session.dir = sessionDir(session) || S.session.dir;
  const invalidatesRuntime = runtimeRebuilt
    || (previous.state === 'ready' && next.state !== 'ready')
    || (previousStatus !== 'closed' && nextStatus === 'closed');
  if (invalidatesRuntime) {
    markSessionRuntimeActivationRequired(session.id);
  }
  if (runtimeRebuilt && sessionEnvironmentReady(session)
      && S.threadVariants?.sessionId !== session.id) {
    // The explicit rebuild request already owns a live runtime. It is safe to
    // bind Files/Git immediately; the normal terminal refresh below does not
    // need to repeat the cold-recovery serialization path.
    S.session.runtimeActivationPending = false;
  } else if (!runtimeRebuilt && previous.state !== 'ready' && next.state === 'ready') {
    // A different request or a previous daemon instance may have completed a
    // persisted Preparing transition. Claim that runtime through the same
    // single-owner activation path used when a Ready Session is first opened.
    markSessionRuntimeActivationRequired(session.id);
  }
  if (nextStatus === 'closed') {
    if (S.session.taskTimer) clearInterval(S.session.taskTimer);
    S.session.taskTimer = null;
    S.session.activeTurnId = null;
    S.session.pendingTurn = null;
    S.session.stopPending = false;
    S.session.terminalState = 'idle';
    S.session.terminalLabel = 'closed';
    S.session.terminalDetail = 'Session closed';
    _pendingSessionTurns.delete(S.session.id);
  } else if (previousStatus === 'closed') {
    S.session.terminalState = 'idle';
    S.session.terminalLabel = 'idle';
    S.session.terminalDetail = '';
    if (!S.session.taskTimer) {
      const reopenedSessionId = S.session.id;
      S.session.taskTimer = setInterval(
        () => void refreshSessionTasks(reopenedSessionId), 4000,
      );
    }
  }
  renderSessionEnvironment(S.session);
  bindSessionRuntimeComponents(S.session);
  syncSessionComposerState();
  updateFanoutBtn();
  const resetRuntime = runtimeRebuilt
    || (previous.state === 'ready' && next.state !== 'ready')
    || (previousStatus !== 'closed' && nextStatus === 'closed');
  if (resetRuntime) {
    teardownXterms();
    S.session.autoTerminalController?.abort?.();
    S.session.autoTerminalController = null;
    S.session.manualTerminalController?.abort?.();
    S.session.manualTerminalController = null;
    S.session.manualTerminalStarting = false;
    S.session.tasks = [];
    S.session.activeTerminalId = null;
    S.session.autoTerminalDone = false;
    S.session.autoTerminalStarting = false;
    renderTerminals();
    if ($('#file-tree')) $('#file-tree').selected = '';
    if (S.session.gitDiff) {
      gitDisposeDiff(window.monaco);
      if (axEditor().activeFile) renderActiveFile();
      else viewerShow(filesEmptyDetail());
    }
    // The editor is already suspended by bindSessionRuntimeComponents. Keep
    // its buffers—including dirty drafts—through runtime failure or rebuild;
    // clean files revalidate automatically when the same Session resumes.
    updateFilesEditor();
  }
  if (sessionEnvironmentReady() && activateRuntime) {
    const sessionId = S.session.id;
    refreshFileTree();
    void refreshSessionTasks(sessionId).then((current) => {
      if (current) return maybeAutoStartTerminal(sessionId);
      return null;
    });
    if (S.session.explorerTab === 'git') void refreshGitPane({ branches: true });
  }
}

// Populate the per-turn model picker for one resolved agent. Model names are
// provider-scoped, so a multi-agent "all" turn deliberately has no override:
// every agent keeps its own configured provider/model until the user targets
// one specific agent.
async function populateSessionModelPicker(session) {
  const sel = $('#session-model'); if (!sel) return;
  const readId = ++_sessionModelPickerReadId;
  const sessionId = session?.id;
  if (!sessionId || S.session.id !== sessionId) return;
  const agentId = sessionModelOverrideAgentId(session);
  sel.innerHTML = '';
  if (!agentId) {
    sel.classList.add('hide');
    return;
  }
  sel.classList.remove('hide');
  const agent = (S.agents || []).find(item => item.id === agentId) || { id: agentId };
  const defaultModel = agent.model || '';
  const opt0 = document.createElement('option');
  opt0.value = '__default__';
  opt0.textContent = defaultModel
    ? `model · ${defaultModel} · default`
    : `model · ${agentId} default`;
  sel.appendChild(opt0);
  sel.value = '__default__';
  // The endpoint resolves the selected agent's provider and returns only that
  // provider's model names. It intentionally does not return a global catalog.
  try {
    const response = await fetch('/api/llm/models?agent=' + encodeURIComponent(agentId));
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      throw new Error(body.error || ('HTTP ' + response.status));
    }
    const data = await response.json();
    if (!Array.isArray(data)) throw new Error('The model endpoint returned an invalid list.');
    if (readId !== _sessionModelPickerReadId || S.session.id !== sessionId
        || sessionModelOverrideAgentId(S.session) !== agentId) return;
    const seen = new Set(defaultModel ? [defaultModel] : []);
    data.forEach(model => {
      if (!model || seen.has(model)) return;
      seen.add(model);
      const opt = document.createElement('option');
      opt.value = model;
      opt.textContent = agent.provider ? `${model} · ${agent.provider}` : model;
      sel.appendChild(opt);
    });
  } catch (error) {
    if (readId !== _sessionModelPickerReadId || S.session.id !== sessionId) return;
    // The configured default remains usable. Do not turn a discovery failure
    // into a false cross-provider list or block the session turn.
    opt0.textContent += ' · choices unavailable';
    sel.title = `Could not load ${agentId} model choices: ${error.message || error}`;
  }
}

async function sessionLatticeBuild(session) {

  S.session.agents = agents;

  try {
    await import('/lattice/index.js');

  } catch (e) { host.innerHTML = '<div class="empty small">lattice unavailable</div>'; return; }
  const lat = document.createElement('ax-lattice');
  lat.setAttribute('background', 'dots');
  lat.setAttribute('fit-view-on-init', '');

  lat.setAttribute(
    'aria-label',
    `Agent dependency graph for ${session.name || 'this Session'}: `
      + `${agents.length} agents and ${dependencies.length} configured `
      + (dependencies.length === 1 ? 'dependency' : 'dependencies'),
  );
  host.innerHTML = '';
  host.appendChild(lat);
  lat.addEventListener('selection-change', (event) => {
    const ids = event.detail?.ids || [];
    if (ids.length !== 1 || !ids[0].startsWith('sl-')) return;
    const agentId = ids[0].slice(3);
    const agent = (S.agents || []).find((candidate) => candidate.id === agentId);
    if (String(agent?.role || '').toLowerCase() === 'coordinator') openCoordinatorRunView(agentId);
  });
  agents.forEach((a, i) => {
    const node = document.createElement('ax-node');
    node.id = 'sl-' + a;
    node.setAttribute('data-x', String(60 + (i % 2) * 150));
    node.setAttribute('data-y', String(40 + i * 78));
    node.setAttribute('status', 'idle');
    const incoming = dependencies
      .filter(dependency => dependency.to === a)
      .map(dependency => dependency.from);
    node.setAttribute(
      'aria-label',
      incoming.length
        ? `Agent ${a}; depends on ${incoming.join(', ')}`
        : `Agent ${a}; no configured dependencies in this Session`,
    );
    node.append(mkDiv('sn-title', a));
    node.append(mkHandle('target', 'in', 'left'), mkHandle('source', 'out', 'right'));
    lat.appendChild(node);
  });
  dependencies.forEach(dependency => {
    const edge = document.createElement('ax-edge');
    edge.setAttribute('from', 'sl-' + dependency.from + ':out');
    edge.setAttribute('to', 'sl-' + dependency.to + ':in');
    edge.setAttribute('aria-label', dependency.to + ' depends on ' + dependency.from);
    lat.appendChild(edge);
  });
  S.session.lattice = lat;
  setTimeout(() => { try { lat.autoLayout({ direction: 'LR' }); } catch {} }, 60);
}
function sessionLatticeStatus(agent, status) {
  const lat = S.session.lattice;

    try { lat.setNodeStatus('sl-' + agent, status); } catch {}
  }
}
function sessionLatticeEvent(d) {
  if (d.type === 'AgentActivated' && d.agent) sessionLatticeStatus(d.agent, 'running');
  else if (d.type === 'TaskCompleted' && d.agent) sessionLatticeStatus(d.agent, 'success');
  else if (['AgentFailed', 'AgentCancelled', 'AgentPanicked'].includes(d.type) && d.agent) {
    // ax-lattice intentionally has one terminal error state. The Coordinator
    // run view below preserves the more precise cancelled/panicked distinction.
    sessionLatticeStatus(d.agent, 'error');
  }
}

/**
 * Everything you can reach by typing.
 *
 * The palette follows the one-app hierarchy: session modules and Settings,
 * with the same shortcuts printed beside each module as the launcher shows.
 */
function paletteItems() {
  const items = [];

  // Sessions first: the thing you are most often looking for is other work.
  for (const s of (S.sessions || [])) {
    if (s.status === 'closed') continue;
    const workspace = (S.workspaces || []).find(item => item.id === s.workspace_id);
    items.push({
      kind: 'session',
      label: s.name || (s.working_dir || '').split('/').pop() || s.id,
      sub: workspace ? `${workspace.name} · ${workspace.canonical_path}` : (s.working_dir || ''),
      action: () => openCockpit(s),
    });
  }

  // Modules, only while a session is open — there is nothing to open them onto
  // otherwise, and offering them would be offering a dead end.
  if (S.session && S.session.id) {
    for (const m of PALETTE_MODULES) {
      items.push({
        kind: 'module',
        label: m.title,
        sub: m.hint || 'Session tool',
        action: () => openModule(m.id),
      });
    }
    items.push({
      kind: 'session', label: 'Search Session history', sub: 'Transcript and context',
      action: () => $('#session-history')?.show?.({
        sessionId: S.session.id, sessionName: S.session.name, scope: 'session',
      }),
    });
    items.push({
      kind: 'session', label: 'Export Session', sub: 'Markdown or JSON',
      action: () => $('#session-history')?.show?.({
        sessionId: S.session.id, sessionName: S.session.name, scope: 'session',
      }),
    });
  }
  items.push({
    kind: 'session', label: 'Search all Session history', sub: 'Across workspaces',
    action: () => $('#session-history')?.show?.({ scope: 'all' }),
  });

  for (const sec of PALETTE_SETTINGS) {
    items.push({
      kind: 'settings',
      label: sec.title,
      sub: 'Settings',
      action: () => $('#settings')?.show(sec.id),
    });
  }

  const selectedWorkspace = (S.workspaces || []).find(workspace => workspace.id === S.selectedWorkspaceId);
  if (selectedWorkspace) {
    items.push({ kind: 'session', label: 'New session', sub: `In ${selectedWorkspace.name}`,
                 action: () => {
                   closeCockpit({ homeScope: 'workspace' });
                   sessionHome()?.newSession?.(selectedWorkspace.id);
                 } });
  }
  items.push({ kind: 'session', label: 'Open workspace…', sub: 'Choose a project folder',
               action: () => {
                 closeCockpit({ homeScope: 'workspaces' });
                 sessionHome()?.openWorkspace?.();
               } });
  items.push({ kind: 'session', label: 'All sessions', sub: 'Across Workspaces',
               action: () => closeCockpit({ homeScope: 'all' }) });

  // Automations, agents and skills stay reachable by name — they are things you
  // fire mid-thought, which is exactly what a palette is for.
  (S.automations || []).forEach(a => items.push({
    kind: 'automation', label: a.name || a.id, sub: 'Run now',
    action: () => {
      $('#settings')?.show?.('automations');
      queueMicrotask(() => { void $('#settings-automations')?.run?.(a.id); });
    },
  }));
  (S.agents || []).forEach(a => items.push({
    kind: 'agent', label: a.id, sub: 'Restart',
    action: () => { void $('#settings-agents')?.restartAgent?.(a.id); },
  }));
  (S.skills || []).forEach(g => items.push({
    kind: 'skill', label: g.name, sub: 'Fire',
    action: () => { void $('#settings-skills')?.fire?.(g.id); },
  }));

  return items;
}

function renderPalette(query) {
  const list = $('#palette-list'); list.innerHTML = '';
  const q = query.trim().toLowerCase();
  const matches = paletteItems().filter(i => {

    return i.label.toLowerCase().includes(q)
      || i.kind.toLowerCase().includes(q)
      || (i.sub || '').toLowerCase().includes(q);

    $('#palette-input').removeAttribute('aria-activedescendant');
    list.appendChild(el('div', 'palette-empty', `Nothing matches “${query.trim()}”`));
    return;

  matches.slice(0, 50).forEach((it, i) => {
    const row = el('button', 'palette-item' + (i === 0 ? ' sel' : ''));
    row.type = 'button';
    row.id = `palette-option-${i}`;
    row.setAttribute('role', 'option');

    row.appendChild(el('span', 'kind', it.kind));
    row.appendChild(el('span', 'nm', it.label));
    row.appendChild(el('span', 'sub', it.sub));
    row.addEventListener('click', () => { it.action(); closePalette(); });

$('#palette-input').addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePalette(); return; }
  if (e.key === 'Tab') { e.preventDefault(); return; }
  const items = $$('.palette-item'); if (!items.length) return;
  let sel = items.findIndex(x => x.classList.contains('sel')); if (sel < 0) sel = 0;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    items[sel].classList.remove('sel');
    items[sel].setAttribute('aria-selected', 'false');
    sel = e.key === 'ArrowDown' ? (sel + 1) % items.length : (sel - 1 + items.length) % items.length;
    items[sel].classList.add('sel');
    items[sel].setAttribute('aria-selected', 'true');
    e.currentTarget.setAttribute('aria-activedescendant', items[sel].id);
    items[sel].scrollIntoView({ block: 'nearest' });
  }
  else if (e.key === 'Enter') { e.preventDefault(); items[sel].click(); }
});

// ╔════════════════════ Unified live WebSocket ════════════════════╗
// The dashboard's only live transport — lattice events, workflow tokens,
// and chat all flow over one reconnecting socket.
let axoWs = null;
let wsBackoff = 500;

function connectWs() {
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
  axoWs = new WebSocket(url);
  axoWs.addEventListener('open', () => {
    wsBackoff = 500;
    S.liveConnection = 'connected';
    renderStatusPearls();
    syncSessionLifecycleChrome();
  });
  axoWs.addEventListener('message', (e) => {
    let d; try { d = JSON.parse(e.data); } catch { return; }
    handleWsFrame(d);
  });
  axoWs.addEventListener('close', () => {
    S.liveConnection = 'reconnecting';
    renderStatusPearls();
    syncSessionLifecycleChrome();
    setTimeout(connectWs, wsBackoff);
    wsBackoff = Math.min(wsBackoff * 2, 10000); // exponential backoff, capped
  });
  axoWs.addEventListener('error', () => { try { axoWs.close(); } catch {} });
}

function wsSend(obj) {
  if (axoWs && axoWs.readyState === WebSocket.OPEN) {
    axoWs.send(JSON.stringify(obj));
    return true;
  }
  return false;
}

// ── Attempts, across every session ─────────────────────────────────────
//
// A run key is `{session}#{i}`, so a lane frame can be attributed to its session
// without that session being the one on screen. That is the whole point: the
// failure of parallel work is not being unable to see it, it is not noticing one
// stopped — and the one that stopped is usually in a session you navigated away
// from.
const _attempts = new Map();   // session id -> Map(lane index -> state)
const _attemptSetIds = new Map(); // session id -> HTTP-authoritative durable set id
const _announcedAttemptSetIds = new Map(); // raw LaneStarted/snapshot ownership claims
const _laneAttemptSetIds = new Map(); // claims accepted against the HTTP current set
const _pendingAttemptFrames = new Map(); // run -> { attemptSetId, frames }
const _backgroundAttemptReads = new Map();
const _backgroundAttemptRefreshAgain = new Set();

function clearAttemptRunOwnership(sessionId, clearAnnouncements = false) {
  for (const run of [..._laneAttemptSetIds.keys()]) {
    if (laneKeyParts(run)?.session === sessionId) _laneAttemptSetIds.delete(run);
  }
  if (clearAnnouncements) {
    for (const run of [..._announcedAttemptSetIds.keys()]) {
      if (laneKeyParts(run)?.session === sessionId) _announcedAttemptSetIds.delete(run);
    }
    for (const run of [..._pendingAttemptFrames.keys()]) {
      if (laneKeyParts(run)?.session === sessionId) _pendingAttemptFrames.delete(run);
    }
  }
}

function attemptFrameRun(frame) {
  if (['token', 'reasoning', 'tool-call'].includes(frame?.kind)) return frame.workflow || null;
  if (['session-start', 'session-done', 'session-error', 'session-cancelled'].includes(frame?.kind)) {
    return frame.session || null;
  }
  return null;
}

/**
 * Hold frames whose LaneStarted claim arrived before the authoritative start
 * response/results read. They are released only after HTTP proves that exact
 * set owns the session, closing the first-token race without allowing a stale
 * socket frame to leak into a newer attempt turn.
 */
function queueUnownedAttemptFrame(frame) {
  const run = attemptFrameRun(frame);
  if (!run || !laneKeyParts(run) || attemptRunOwnerMatches(run)) return false;
  const attemptSetId = _announcedAttemptSetIds.get(run);
  if (!attemptSetId) return false;
  let pending = _pendingAttemptFrames.get(run);
  if (!pending || pending.attemptSetId !== attemptSetId) {
    pending = { attemptSetId, frames: [] };
    _pendingAttemptFrames.set(run, pending);
  }
  const previous = pending.frames[pending.frames.length - 1];
  if (previous && ['token', 'reasoning'].includes(frame.kind)
      && previous.kind === frame.kind && attemptFrameRun(previous) === run) {
    const merged = String(previous.delta || '') + String(frame.delta || '');
    previous.delta = merged.length > 262144 ? merged.slice(-262144) : merged;
  } else {
    pending.frames.push({ ...frame });
  }
  // A delayed HTTP response should be brief. Bound pathological streams; the
  // durable output artifact remains the full recovery authority at completion.
  if (pending.frames.length > 1024) pending.frames.splice(0, pending.frames.length - 1024);
  return true;
}

function flushPendingAttemptFrames(run, attemptSetId) {
  const pending = _pendingAttemptFrames.get(run);
  if (!pending || pending.attemptSetId !== attemptSetId) return;
  _pendingAttemptFrames.delete(run);
  for (const frame of pending.frames) handleWsFrame(frame);
}

/** Install the current set learned from HTTP, then accept only matching stream claims. */
function installAttemptSetOwnership(sessionId, attemptSetId) {
  markSessionRuntimeActivationRequired(sessionId);
  clearAttemptRunOwnership(sessionId);
  _attemptSetIds.set(sessionId, attemptSetId);
  const acceptedRuns = [];
  for (const [run, announcedSetId] of _announcedAttemptSetIds) {
    if (announcedSetId === attemptSetId && laneKeyParts(run)?.session === sessionId) {
      _laneAttemptSetIds.set(run, attemptSetId);
      acceptedRuns.push(run);
    }
  }
  acceptedRuns.forEach(run => flushPendingAttemptFrames(run, attemptSetId));
}

function attemptRailStates(map) {
  return [...map.entries()].sort((a, b) => a[0] - b[0]).map(entry => entry[1]);
}

/** A successful start owns a fresh rail roster for this session. */
function beginAttemptRailSet(sessionId, attemptSetId, lanes) {
  installAttemptSetOwnership(sessionId, attemptSetId);
  const states = new Map();
  (lanes || []).forEach(lane => states.set(lane.index, 'run'));
  _attempts.set(sessionId, states);
  railAttempts(sessionId, attemptRailStates(states));
}

/** Rebuild the rail from durable lifecycle/verdict facts, never stale dots. */
function syncAttemptRailFromThread(tv) {
  if (!tv?.sessionId || !tv?.attemptSetId) return;
  const previous = _attemptSetIds.get(tv.sessionId) === tv.attemptSetId
    ? _attempts.get(tv.sessionId) : null;
  installAttemptSetOwnership(tv.sessionId, tv.attemptSetId);
  const states = new Map();
  tv.variants.forEach(variant => {
    let state = 'run';
    if (variant.verdict) {
      state = variant.verdict.passed && variant.verdict.changed_files > 0 ? 'pass' : 'fail';
    } else if (variant.laneState === 'completed') {
      state = 'done'; // neutral terminal dot: complete, not yet verified
    } else if (isAttemptTerminal(variant.laneState)) {
      state = 'fail';
    }
    // A durable running state does not mean a pending approval stopped needing
    // a person. Only terminal execution or a verdict resolves that rail fact.
    if (state === 'run' && previous?.get(variant.index) === 'need') state = 'need';
    states.set(variant.index, state);
  });
  _attempts.set(tv.sessionId, states);
  railAttempts(tv.sessionId, attemptRailStates(states));
}

function syncAttemptRailFromResults(sessionId, results) {
  const set = results?.attempt_set;
  if (!set) {
    clearAttemptRailForSet(sessionId, null);
    return;
  }
  if (set.session_id !== sessionId || !Array.isArray(set.lanes)) return;
  const laneStates = Array.isArray(results.lane_states) ? results.lane_states : [];
  const verdicts = Array.isArray(results.verdicts) ? results.verdicts : [];
  const previous = _attemptSetIds.get(sessionId) === set.id ? _attempts.get(sessionId) : null;
  installAttemptSetOwnership(sessionId, set.id);
  const states = new Map();
  for (const lane of set.lanes) {
    const fact = laneStates.find(item => item.index === lane.index);
    const verdict = verdicts.find(item => item.index === lane.index);
    let state = 'run';
    if (verdict) state = verdict.passed && verdict.changed_files > 0 ? 'pass' : 'fail';
    else if (fact?.state === 'completed') state = 'done';
    else if (isAttemptTerminal(fact?.state)) state = 'fail';
    if (state === 'run' && previous?.get(lane.index) === 'need') state = 'need';
    states.set(lane.index, state);
  }
  _attempts.set(sessionId, states);
  railAttempts(sessionId, attemptRailStates(states));
}

function refreshBackgroundAttemptSet(sessionId) {
  if (!sessionId) return;
  if (sessionId === S.session.id) {
    S.session.attemptRestorePending = true;
    void restoreThreadVariants(sessionId);
    scheduleThreadVariantRestore(sessionId);
    return;
  }
  if (_backgroundAttemptReads.has(sessionId)) {
    _backgroundAttemptRefreshAgain.add(sessionId);
    return;
  }
  const read = attemptJson('/api/sessions/' + encodeURIComponent(sessionId) + '/variants/results')
    .then(results => syncAttemptRailFromResults(sessionId, results))
    .catch(() => {})
    .finally(() => {
      if (_backgroundAttemptReads.get(sessionId) === read) {
        _backgroundAttemptReads.delete(sessionId);
        if (_backgroundAttemptRefreshAgain.delete(sessionId)) refreshBackgroundAttemptSet(sessionId);
      }
    });
  _backgroundAttemptReads.set(sessionId, read);
}

/** Clear only the decision's set; a stale event cannot erase a newer roster. */
function clearAttemptRailForSet(sessionId, attemptSetId) {
  const knownSetId = _attemptSetIds.get(sessionId);
  if (attemptSetId && knownSetId && knownSetId !== attemptSetId) return false;
  _attempts.delete(sessionId);
  _attemptSetIds.delete(sessionId);
  clearAttemptRunOwnership(sessionId, true);
  railAttempts(sessionId, []);
  return true;
}

/** Split `{session}#{n}` into its parts, or null if it is not a lane key. */
function laneKeyParts(key) {
  const i = String(key || '').lastIndexOf('#');
  if (i < 0) return null;
  const n = parseInt(key.slice(i + 1), 10);
  return Number.isInteger(n) ? { session: key.slice(0, i), lane: n } : null;
}

function noteAttempt(key, state) {
  const p = laneKeyParts(key); if (!p) return;
  if (!_attempts.has(p.session)) _attempts.set(p.session, new Map());
  const m = _attempts.get(p.session);
  // "needs you" outranks live activity: an attempt can keep emitting frames
  // while it waits, and losing the blocked state to a later token is exactly
  // the miss this exists to prevent. A verdict clears it — that is a decision.
  const settled = state === 'done' || state === 'pass' || state === 'fail';
  if (settled || state === 'need' || m.get(p.lane) !== 'need') m.set(p.lane, state);
  railAttempts(p.session, attemptRailStates(m));
}

function attemptRunOwnerMatches(run) {
  const parts = laneKeyParts(run);
  if (!parts) return false;
  const currentSetId = _attemptSetIds.get(parts.session);
  return Boolean(currentSetId && _laneAttemptSetIds.get(run) === currentSetId);
}

function longerStreamProjection(first, second) {
  const left = String(first || '');
  const right = String(second || '');
  if (left.startsWith(right)) return left;
  if (right.startsWith(left)) return right;
  // Both are projections from the start of one Agent stream. A mismatch means
  // the cached live row crossed a new activation boundary; prefer that row.
  return right || left;
}

function liveAgentStatusRank(status) {
  if (['done', 'error', 'cancelled'].includes(status)) return 3;
  if (status === 'running') return 2;
  if (status) return 1;
  return 0;
}

function liveToolFrameKey(frame) {
  return JSON.stringify([
    frame?.turn_id || '', frame?.agent || 'agent', frame?.call_id || '',
    Number(frame?.occurrence) || 0, frame?.phase || '',
  ]);
}

function mergeLiveSessionRun(snapshot, cached, { preferCachedTurn = true } = {}) {
  if (!snapshot) return cached ? structuredClone(cached) : null;
  if (!cached) return structuredClone(snapshot);
  if (snapshot.turn_id !== cached.turn_id) {
    return structuredClone(preferCachedTurn ? cached : snapshot);
  }
  const merged = structuredClone(snapshot);
  if (!Array.isArray(merged.agents)) merged.agents = [];
  for (const cachedAgent of (Array.isArray(cached.agents) ? cached.agents : [])) {
    if (!cachedAgent?.agent) continue;
    const current = merged.agents.find(agent => agent?.agent === cachedAgent.agent);
    if (!current) {
      merged.agents.push(structuredClone(cachedAgent));
      continue;
    }
    current.output = longerStreamProjection(current.output, cachedAgent.output);
    current.thinking = longerStreamProjection(current.thinking, cachedAgent.thinking);
    if (liveAgentStatusRank(cachedAgent.status) > liveAgentStatusRank(current.status)) {
      current.status = cachedAgent.status;
    }
    current.tokens = Math.max(Number(current.tokens || 0), Number(cachedAgent.tokens || 0));
  }
  for (const field of ['coordinator', 'goal']) {
    if (!merged[field] && cached[field]) merged[field] = cached[field];
  }
  if ((!Array.isArray(merged.subtasks) || !merged.subtasks.length)
      && Array.isArray(cached.subtasks)) merged.subtasks = structuredClone(cached.subtasks);
  const toolFrames = new Map();
  for (const frame of [
    ...(Array.isArray(snapshot.toolFrames) ? snapshot.toolFrames : []),
    ...(Array.isArray(cached.toolFrames) ? cached.toolFrames : []),
  ]) toolFrames.set(liveToolFrameKey(frame), structuredClone(frame));
  merged.toolFrames = [...toolFrames.values()].slice(-2048);
  return merged;
}

function cacheSessionRunFrame(frame) {
  if (frame.kind === 'snapshot') {
    _liveSessionSnapshotEpoch += 1;
    _liveSessionRuns.clear();
    for (const run of (Array.isArray(frame.runs) ? frame.runs : [])) {
      if (run?.kind === 'session' && run.workflow && run.turn_id) {
        _liveSessionRuns.set(run.workflow, structuredClone(run));
      }
    }
    return;
  }
  if (frame.kind === 'session-accepted') {
    advanceLiveSessionOwnership(frame.session);
    _liveSessionRuns.set(frame.session, {
      workflow: frame.session, kind: 'session', turn_id: frame.turn_id, agents: [],
    });
    return;
  }
  if (frame.kind === 'session-start' && frame.turn_id) {
    const current = _liveSessionRuns.get(frame.session);
    if (!current || current.turn_id === frame.turn_id) {
      if (!current) advanceLiveSessionOwnership(frame.session);
      _liveSessionRuns.set(frame.session, current || {
        workflow: frame.session, kind: 'session', turn_id: frame.turn_id, agents: [],
      });
    }
    return;
  }
  if (frame.kind === 'coordinator-plan') {
    const current = _liveSessionRuns.get(frame.workflow);
    if (!current) return;
    current.coordinator = frame.coordinator || null;
    current.goal = frame.goal || '';
    current.subtasks = structuredClone(frame.subtasks || []);
    return;
  }
  if (frame.kind === 'event' && frame.workflow) {
    const current = _liveSessionRuns.get(frame.workflow);
    if (!current || !frame.agent) return;
    if (!Array.isArray(current.agents)) current.agents = [];
    let agent = current.agents.find(item => item.agent === frame.agent);
    if (!agent) {
      agent = { agent: frame.agent, status: 'running', output: '', thinking: '', tokens: 0 };
      current.agents.push(agent);
    }
    if (frame.type === 'AgentActivated') {
      agent.status = 'running';
      agent.output = '';
      agent.thinking = '';
      agent.tokens = 0;
      agent.resetOutput = true;
    } else if (frame.type === 'TaskCompleted') {
      agent.status = 'done';
      agent.output = longerStreamProjection(agent.output, frame.output);
      agent.tokens = Number(frame.tokens || 0);
    } else if (frame.type === 'AgentCancelled') {
      agent.status = 'cancelled';
      agent.output = longerStreamProjection(agent.output, frame.output);
      agent.tokens = Number(frame.tokens || 0);
    } else if (frame.type === 'AgentFailed' || frame.type === 'AgentPanicked') {
      agent.status = 'error';
      agent.output = String(frame.output || '');
    }
    return;
  }
  if (['token', 'reasoning'].includes(frame.kind) && frame.turn_id) {
    const current = _liveSessionRuns.get(frame.workflow);
    if (!current || current.turn_id !== frame.turn_id) return;
    if (!Array.isArray(current.agents)) current.agents = [];
    let agent = current.agents.find(item => item.agent === frame.agent);
    if (!agent) {
      agent = { agent: frame.agent || 'agent', status: 'running', output: '', thinking: '', tokens: 0 };
      current.agents.push(agent);
    }
    if (frame.kind === 'token') agent.output += frame.delta || '';
    else agent.thinking += frame.delta || '';
    return;
  }
  if (frame.kind === 'tool-call' && frame.turn_id) {
    const current = _liveSessionRuns.get(frame.workflow);
    if (!current || current.turn_id !== frame.turn_id) return;
    if (!Array.isArray(current.toolFrames)) current.toolFrames = [];
    const key = liveToolFrameKey(frame);
    if (!current.toolFrames.some(candidate => liveToolFrameKey(candidate) === key)) {
      current.toolFrames.push(structuredClone(frame));
      if (current.toolFrames.length > 2048) current.toolFrames.splice(0, current.toolFrames.length - 2048);
    }
    return;
  }
  if (['session-done', 'session-cancelled', 'session-error'].includes(frame.kind)
      && frame.turn_id) {
    const current = _liveSessionRuns.get(frame.session);
    if (current?.turn_id === frame.turn_id) {
      advanceLiveSessionOwnership(frame.session);
      _liveSessionRuns.delete(frame.session);
    }
  }
}

function beginRemoteSessionEnvironmentChange(frame) {
  const sessionId = frame?.session;
  if (!sessionId) return;
  _sessionEnvironmentTransitions.set(
    sessionId,
    Number(frame.generation || 0),
  );
  if (S.session.id !== sessionId) return;
  if (S.session.status !== 'closed') {
    // A later Close can reuse the same environment generation after Reopen.
    // Always bind a fresh changing edge to the cockpit that is mounted now;
    // a stale object retained from an earlier edge must not own this one.
    _sessionEnvironmentRetireOwners.set(sessionId, S.session);
  } else if (_sessionEnvironmentRetireOwners.get(sessionId) !== S.session) {
    _sessionEnvironmentRetireOwners.delete(sessionId);
  }
  if (S.session.runtimeActivationPending && S.session.runtimeActivationInFlight) {
    // Cold reconstruction announces itself from inside the one request that
    // already owns activation. Keep that request alive; the transition map
    // still gates every component and the settled edge starts a fresh epoch.
    bindSessionRuntimeComponents(S.session);
    syncSessionComposerState();
    updateFanoutBtn();
    return;
  }
  markSessionRuntimeActivationRequired(sessionId);
}

function settleRemoteSessionEnvironmentChange(frame) {
  const sessionId = frame?.session;
  if (!sessionId) return;
  _sessionEnvironmentTransitions.delete(sessionId);
  const retireCockpitState = _sessionEnvironmentRetireOwners.get(sessionId) || null;
  _sessionEnvironmentRetireOwners.delete(sessionId);
  void reconcileSessionEnvironmentLifecycle(sessionId, {
    invalidatesRuntime: true,
    retireCockpitState,
  });
}

function replaceSessionEnvironmentTransitions(items) {
  const selectedSessionId = S.session.id;
  const selectedRetireOwner = selectedSessionId
    ? _sessionEnvironmentRetireOwners.get(selectedSessionId) || null : null;
  _sessionEnvironmentTransitions.clear();
  for (const item of (Array.isArray(items) ? items : [])) {
    if (!item?.session) continue;
    _sessionEnvironmentTransitions.set(item.session, Number(item.generation || 0));
  }
  for (const sessionId of _sessionEnvironmentRetireOwners.keys()) {
    if (!_sessionEnvironmentTransitions.has(sessionId)) {
      _sessionEnvironmentRetireOwners.delete(sessionId);
    }
  }
  if (!S.session.id) return;
  if (_sessionEnvironmentTransitions.has(S.session.id)) {
    if (S.session.status !== 'closed') {
      // A Snapshot is a new authoritative observation point. Rebind even when
      // its numeric environment generation matches an older Close/Reopen/Close
      // cycle, because status-only lifecycle changes need not advance it.
      _sessionEnvironmentRetireOwners.set(S.session.id, S.session);
    } else if (_sessionEnvironmentRetireOwners.get(S.session.id) !== S.session) {
      _sessionEnvironmentRetireOwners.delete(S.session.id);
    }
    markSessionRuntimeActivationRequired(S.session.id);
  } else {
    // The socket may have been offline for the entire change. Re-read the
    // durable generation even when this snapshot contains no active owner.
    void reconcileSessionEnvironmentLifecycle(S.session.id, {
      retireCockpitState: selectedRetireOwner,
    });
  }
}

function beginRemoteWorkspaceAttemptChange(frame) {
  const workspaceId = frame?.workspace;
  const attemptSetId = frame?.attempt_set_id;
  if (!workspaceId || !attemptSetId) return;
  _workspaceAttemptOwnerships.set(workspaceId, {
    workspace: workspaceId,
    session: frame.session || '',
    attemptSetId,
  });
  if ((S.session.workspaceId || '') === workspaceId) {
    markSessionRuntimeActivationRequired(S.session.id);
  }
}

function settleRemoteWorkspaceAttemptChange(frame) {
  const workspaceId = frame?.workspace;
  const attemptSetId = frame?.attempt_set_id;
  const current = _workspaceAttemptOwnerships.get(workspaceId);
  if (!workspaceId || !attemptSetId || current?.attemptSetId !== attemptSetId) return;
  const ownerSessionId = current.session || frame.session || '';
  const selectedSessionId = S.session.id;
  _workspaceAttemptOwnerships.delete(workspaceId);

  // Settlement is the authoritative cross-tab edge for Keep and Discard. A
  // judged comparison no longer polls, so merely releasing the Workspace lease
  // leaves the owning tab showing a decision that no longer exists. Re-read
  // Results for that Session: the exact ownership id above rejects stale
  // settlements, while the HTTP response decides whether the set was cleared
  // or replaced before this frame arrived.
  if (ownerSessionId && ownerSessionId === selectedSessionId) {
    S.session.attemptRestorePending = true;
    void restoreThreadVariants(selectedSessionId);
    scheduleThreadVariantRestore(selectedSessionId);
    return;
  }
  if (ownerSessionId) refreshBackgroundAttemptSet(ownerSessionId);

  if ((S.session.workspaceId || '') === workspaceId) {
    void reconcileSessionEnvironmentLifecycle(selectedSessionId, { invalidatesRuntime: true });
  }
}

function replaceWorkspaceAttemptOwnerships(items) {
  const reconnect = _runtimeOwnershipSnapshotSeen;
  _runtimeOwnershipSnapshotSeen = true;
  _workspaceAttemptOwnerships.clear();
  for (const item of (Array.isArray(items) ? items : [])) {
    if (!item?.workspace || !item?.attempt_set_id) continue;
    _workspaceAttemptOwnerships.set(item.workspace, {
      workspace: item.workspace,
      session: item.session || '',
      attemptSetId: item.attempt_set_id,
    });
  }
  if (!S.session.id) return;
  if (workspaceAttemptOwnsPrimaryRuntime(S.session)) {
    markSessionRuntimeActivationRequired(S.session.id);
  } else if (reconnect) {
    // This socket may have missed an entire start→Keep/Discard lifecycle. The
    // Session generation does not change for Ways, so a reconnect cut with no
    // owner must still retire any primary runtime bound before the outage.
    void reconcileSessionEnvironmentLifecycle(S.session.id, { invalidatesRuntime: true });
  }
}

function handleWsFrame(d) {
  $('#settings-automations')?.handleFrame?.(d);
  cacheSessionRunFrame(d);
  if (queueUnownedAttemptFrame(d)) return;
  // Attribute every lane-scoped frame before the per-kind handling, so the rail
  // reflects sessions the cockpit is not currently showing.
  switch (d.kind) {
    case 'lane-started': {
      const run = d.run || d.workflow;
      const parts = laneKeyParts(run);
      const sessionId = d.session || parts?.session;
      if (!run || !sessionId || !d.attempt_set_id) break;
      const pending = _pendingAttemptFrames.get(run);
      if (pending && pending.attemptSetId !== d.attempt_set_id) {
        _pendingAttemptFrames.delete(run);
      }
      _announcedAttemptSetIds.set(run, d.attempt_set_id);
      const authoritativeSetId = _attemptSetIds.get(sessionId);
      if (authoritativeSetId === d.attempt_set_id) {
        _laneAttemptSetIds.set(run, d.attempt_set_id);
        flushPendingAttemptFrames(run, d.attempt_set_id);
        noteAttempt(run, 'run');
      } else {
        _laneAttemptSetIds.delete(run);
      }
      if (sessionId === S.session.id) {
        const tv = S.threadVariants;
        if (authoritativeSetId !== d.attempt_set_id
            || !tv || tv.attemptSetId !== d.attempt_set_id) {
          S.session.attemptRestorePending = true;
          void restoreThreadVariants(sessionId);
          scheduleThreadVariantRestore(sessionId);
        } else {
          scheduleThreadVariantPoll();
        }
        refreshCompare(sessionId);
        refreshAttempts(sessionId);
      } else if (authoritativeSetId !== d.attempt_set_id) refreshBackgroundAttemptSet(sessionId);
      break;
    }
    case 'token':
    case 'reasoning':
    case 'tool-call': if (attemptRunOwnerMatches(d.workflow)) noteAttempt(d.workflow, 'run'); break;
    case 'session-done': if (attemptRunOwnerMatches(d.session)) noteAttempt(d.session, 'done'); break;
    case 'session-error': if (attemptRunOwnerMatches(d.session)) noteAttempt(d.session, 'fail'); break;
    case 'session-cancelled': if (attemptRunOwnerMatches(d.session)) noteAttempt(d.session, 'fail'); break;
    case 'mcp-approval-required':
      if (d.run && attemptRunOwnerMatches(d.run)) noteAttempt(d.run, 'need');
      break;
    case 'mcp-approval-resolved':
      // Resolved elsewhere; the next frame from that lane restores 'run'.
      break;
    case 'lane-verified': {
      const knownSetId = _attemptSetIds.get(d.session);
      if (!d.attempt_set_id || knownSetId !== d.attempt_set_id) {
        refreshBackgroundAttemptSet(d.session);
        break;
      }
      // A verdict changes the scoreboard; re-read rather than patch, so the
      // pane and the daemon cannot drift.
      if (d.session === S.session.id) {
        refreshCompare(d.session);
        // The final verdict file lands just after the per-lane frame. A short
        // delayed read catches it and updates inline Keep gating from evidence.
        setTimeout(() => { if (S.session.id === d.session) void refreshThreadVariantStatus(); }, 250);
      }
      const sess = d.session;
      if (sess) {
        if (!_attempts.has(sess)) _attempts.set(sess, new Map());
        _attempts.get(sess).set(d.index, d.passed && d.changed_files > 0 ? 'pass' : 'fail');
        const m = _attempts.get(sess);
        railAttempts(sess, attemptRailStates(m));
      }
      break;
    }
  }

  switch (d.kind) {
    case 'ready':
    case 'pong':
      break;

    case 'session-environment-changing':
      beginRemoteSessionEnvironmentChange(d);
      break;
    case 'session-environment-settled':
      settleRemoteSessionEnvironmentChange(d);
      break;
    case 'workspace-attempt-changing':
      beginRemoteWorkspaceAttemptChange(d);
      break;
    case 'workspace-attempt-settled':
      settleRemoteWorkspaceAttemptChange(d);
      break;

    // Sent on connect — re-attach the live view to any run already in flight
    // (e.g. the page was reloaded mid-run).
    case 'snapshot': {
      replaceSessionEnvironmentTransitions(d.environment_transitions);
      replaceWorkspaceAttemptOwnerships(d.attempt_ownerships);
      const snapshotRuns = Array.isArray(d.runs) ? d.runs : [];
      const snapshotApprovals = Array.isArray(d.approvals) ? d.approvals : [];
      // Approvals are their own authoritative snapshot collection. A run's
      // generic `awaiting` summary cannot recreate argument/tool detail and
      // cannot represent unscoped or multiple parallel approvals.
      reconcileMcpApprovals(snapshotApprovals);
      const approvalRuns = new Set(snapshotApprovals.map(item => item?.run).filter(Boolean));
      const runs = snapshotRuns.filter(r => (r.kind || 'workflow') === 'workflow');
      const sessionRuns = snapshotRuns.filter(r => r.kind === 'session' && r.turn_id);
      const attemptRuns = snapshotRuns.filter(r => r.kind === 'attempt' && r.attempt_set_id);
      // Snapshot is the complete live-run ownership view. Replace the stream
      // claims, but keep the HTTP current-set ids until results refreshes them.
      _announcedAttemptSetIds.clear();
      _laneAttemptSetIds.clear();
      _pendingAttemptFrames.clear();
      const sessionsToRefresh = new Set([
        ..._attemptSetIds.keys(),
        ...(S.sessions || []).map(session => session.id).filter(Boolean),
      ]);
      if (!(S.sessions || []).length) {
        void attemptJson('/api/sessions').then((sessions) => {
          for (const session of (Array.isArray(sessions) ? sessions : [])) {
            if (session?.id) refreshBackgroundAttemptSet(session.id);
          }
        }).catch(() => {});
      }
      for (const run of attemptRuns) {
        const parts = laneKeyParts(run.workflow);
        if (!parts) continue;
        sessionsToRefresh.add(parts.session);
        _announcedAttemptSetIds.set(run.workflow, run.attempt_set_id);
        if (_attemptSetIds.get(parts.session) === run.attempt_set_id) {
          _laneAttemptSetIds.set(run.workflow, run.attempt_set_id);
          noteAttempt(run.workflow, approvalRuns.has(run.workflow) ? 'need' : 'run');
        }
      }
      for (const sessionId of sessionsToRefresh) {
        if (sessionId === S.session.id) {
          S.session.attemptRestorePending = true;
          void restoreThreadVariants(sessionId);
          scheduleThreadVariantRestore(sessionId);
        } else {
          refreshBackgroundAttemptSet(sessionId);
        }
      }
      if (S.session.id) {
        const snapshotSessionId = S.session.id;
        const activeSessionRun = sessionRuns.find(run => run.workflow === S.session.id);
        if (activeSessionRun) {
          const pending = S.session.pendingTurn;
          if (pending?.id === activeSessionRun.turn_id) {
            void $('#session-context')?.consumeAccepted?.(pending.referenceIds || []);
            S.session.pendingTurn = null;
            setSessionTurnPending(false);
          }
          setSessionTurnRunning(activeSessionRun.turn_id, true);
          restoreCoordinatorRunView(activeSessionRun, { open: true });
          void reloadSessionTranscript(S.session.id, {
            preserveLive: true,
            liveRun: activeSessionRun,
          });
        } else {
          // Snapshot is authoritative. A terminal may have landed while this
          // socket was offline; clear stale Stop ownership and hydrate the
          // durable turn/context state that replaced the missed frames.
          const pending = S.session.pendingTurn;
          if (S.session.activeTurnId) {
            setSessionTurnRunning(S.session.activeTurnId, false);
          }
          if (pending) void reconcilePendingSessionTurn(snapshotSessionId, pending);
          else void reloadSessionTranscript(snapshotSessionId);
          void $('#session-context')?.refresh?.();
        }
        refreshCompare(S.session.id);
        refreshAttempts(S.session.id);
      }
      const liveCount = runs.length + sessionRuns.length;
      if (liveCount) toast('Reconnected', `Re-attached to ${liveCount} live run${liveCount === 1 ? '' : 's'}`, 'info');
      break;
    }

    // A lattice coordination event.
    case 'event': {
      rvWorkerEvent(d);
      if (S.session.id && d.workflow === S.session.id) sessionLatticeEvent(d);
      break;
    }

    // A streamed token / reasoning chunk — routed to the session cockpit when
    // the run id matches the open session. Workflows fire silently from the
    // Automations card or palette; their component owns run status/history.
    case 'token': {
      const ln = variantLaneFor(d.workflow);
      if (ln !== null) {
        if (threadVariantFrameMatches(d.workflow)) threadVariantToken(ln, d.delta);
        break;
      }
      if (S.runView && d.workflow === S.runView.workflow
          && d.agent === S.runView.coordinator && d.delta) {
        S.runView.synthesis += d.delta;
        renderRunView();
      }
      if (S.session.id && d.workflow === S.session.id
          && (!d.turn_id || d.turn_id === S.session.activeTurnId)) {
        sessionAppendText(d.delta, d.agent || 'agent');
      }
      break;
    }
    case 'reasoning':
      if (S.session.id && d.workflow === S.session.id
          && (!d.turn_id || d.turn_id === S.session.activeTurnId)) {
        sessionAppendReasoning(d.delta, d.agent || 'agent');
      }
      break;

    // A tool call from a running agent.
    case 'tool-call': {
      const ln = variantLaneFor(d.workflow);
      // In-thread variants stream text into their pill, not tool lines —
      // a variant-keyed tool call has no surface, so swallow it.
      if (ln !== null) break;
      if (S.session.id && d.workflow === S.session.id
          && (!d.turn_id || d.turn_id === S.session.activeTurnId)) {
        if (d.phase === 'start') sessionToolStart(d);
        else sessionToolResult(d);
      }
      break;
    }

    // A coordinator decomposed a goal and auctioned its subtasks — open the
    // Layer-2 run view and follow it live (workers arrive as run-scoped events).
    case 'coordinator-plan':
      onCoordinatorPlan(d);
      break;

    // Workflow run finished.
    case 'workflow-done':
      onWorkflowDone(d);
      break;
    case 'workflow-error':
      onWorkflowError(d);
      break;

    // Session run lifecycle.
    case 'session-accepted':
      if (S.session.id === d.session) {
        const pending = S.session.pendingTurn;
        if (pending && pending.id === d.turn_id) {
          $('#session-context')?.consumeAccepted?.(pending.referenceIds || []);
          S.session.pendingTurn = null;
          _pendingSessionTurns.delete(d.session);
        }
        setSessionTurnPending(false);
        setSessionTurnRunning(d.turn_id, true);
      }
      break;
    case 'session-start':
      // Single-agent sessions emit no AgentActivated events — drive the one
      // node from the run lifecycle instead.
      if (S.session.id === d.session && (S.session.agents || []).length === 1) {
        sessionLatticeStatus(S.session.agents[0], 'running');
      }
      break;
    case 'session-done': {
      const ln = variantLaneFor(d.session);
      if (ln !== null) {
        if (threadVariantFrameMatches(d.session)) threadVariantStatus(ln, 'completed');
        refreshCompare(S.session.id);
        break;
      }
      if (S.session.id === d.session) {
        if (d.turn_id && S.session.activeTurnId && d.turn_id !== S.session.activeTurnId) break;
        if (S.runView?.workflow === d.session) {
          S.runView.status = 'done';
          S.runView.tokens = (d.input_tokens || 0) + (d.output_tokens || 0)
            + (d.reasoning_tokens || 0);
          S.runView.tokenUsageKnown = d.token_usage_known === true;
          renderRunView();
        }
        setSessionTurnRunning(d.turn_id || S.session.activeTurnId, false);
        S.session.pendingTurn = null;
        setSessionTurnPending(false);
        S.session.streamEl = null;
        setThinking($('#session-msgs'), false);
        (S.session.agents || []).forEach(a => sessionLatticeStatus(a, 'success'));
        $('#cockpit-status').textContent = `done · ${d.token_usage_known === true ? '' : '≥'}`
          + (d.input_tokens || 0) + ' in / ' + (d.output_tokens || 0) + ' out / '
          + (d.reasoning_tokens || 0) + ' reasoning'
          + (d.token_usage_known === true ? '' : ' · known subtotal');
        setCockpitLive('done', 'done');
        refreshFileTree();
        refreshGitPane();
        // Terminal transport is only a lifecycle signal. Rebuild from the
        // canonical ledger so actions, agent grouping, and Route evidence are
        // identical after a live completion and a later reopen; then add the
        // repository change card as explicitly ephemeral review UI.
        void reloadSessionTranscript(d.session).then((turns) => {
          if (!Array.isArray(turns) || S.session.id !== d.session) return;
          appendChangesCard();
        });
      }
      break;
    }
    case 'session-cancelled': {
      if (S.session.id === d.session) {
        if (d.turn_id && S.session.activeTurnId && d.turn_id !== S.session.activeTurnId) break;
        if (S.runView?.workflow === d.session) {
          S.runView.status = 'cancelled';
          S.runView.tokens = (d.input_tokens || 0) + (d.output_tokens || 0)
            + (d.reasoning_tokens || 0);
          S.runView.tokenUsageKnown = d.token_usage_known === true;
          renderRunView();
        }
        setSessionTurnRunning(d.turn_id || S.session.activeTurnId, false);
        S.session.pendingTurn = null;
        setSessionTurnPending(false);
        S.session.streamEl = null;
        setThinking($('#session-msgs'), false);
        (S.session.agents || []).forEach(a => sessionLatticeStatus(a, 'idle'));
        const stoppedTokens = (d.input_tokens || 0) + (d.output_tokens || 0)
          + (d.reasoning_tokens || 0);
        $('#cockpit-status').textContent = `stopped · ${d.token_usage_known === true ? '' : '≥'}`
          + `${stoppedTokens} tokens${d.token_usage_known === true ? '' : ' known subtotal'}`;
        setCockpitLive('idle', 'stopped');
        void reloadSessionTranscript(d.session);
      }
      break;
    }
    case 'session-error': {
      const lne = variantLaneFor(d.session);
      if (lne !== null) {
        if (threadVariantFrameMatches(d.session)) threadVariantStatus(lne, 'failed');
        refreshCompare(S.session.id);
        break;
      }
      if (S.session.id === d.session) {
        const pending = S.session.pendingTurn;
        const activeTurnId = S.session.activeTurnId;
        const appliesToActive = !d.turn_id || d.turn_id === activeTurnId;
        const appliesToPending = Boolean(pending && (!d.turn_id || d.turn_id === pending.id));
        if (d.turn_id && !appliesToActive && !appliesToPending) break;
        if (appliesToActive && S.runView?.workflow === d.session) {
          S.runView.status = 'error';
          S.runView.tokens = (d.input_tokens || 0) + (d.output_tokens || 0)
            + (d.reasoning_tokens || 0);
          S.runView.tokenUsageKnown = d.token_usage_known === true;
          if (!S.runView.synthesis) S.runView.synthesis = d.error || 'Session failed';
          renderRunView();
        }
        // A rejected new request must not clear a different turn that already
        // owns this Session. Only its matching pending send is rolled back.
        if (appliesToActive && activeTurnId) setSessionTurnRunning(activeTurnId, false);
        const rejected = S.session.pendingTurn;
        if (appliesToPending && rejected) {
          S.session.pendingTurn = null;
          _pendingSessionTurns.delete(d.session);
          setSessionTurnPending(false);
          rejected.userEl?.remove?.();
          if (!$('#session-text').value) $('#session-text').value = rejected.composerText || '';
          if (Array.isArray(rejected.inlineRefs) && !(S.session.refs || []).length) {
            S.session.refs = rejected.inlineRefs;
            renderChatRefs();
          }
        }
        S.session.streamEl = null;
        setThinking($('#session-msgs'), false);
        const e = el('div', 'smsg');
        e.appendChild(el('div', 'smsg-role', 'error'));
        e.appendChild(el('div', 'smsg-body', d.error || 'session failed'));
        appendSessionEl(e);
        const failedTokens = (d.input_tokens || 0) + (d.output_tokens || 0)
          + (d.reasoning_tokens || 0);
        $('#cockpit-status').textContent = `error · ${d.token_usage_known === true ? '' : '≥'}`
          + `${failedTokens} tokens${d.token_usage_known === true ? '' : ' known subtotal'}`;
        setCockpitLive('error', 'error');
        void reconcileSessionAfterRuntimeFailure(d.session, S.session);
      }
      break;
    }
    case 'session-stop-rejected': {
      if (S.session.id !== d.session || S.session.activeTurnId !== d.turn_id) break;
      S.session.stopPending = false;
      syncSessionComposerState();
      toast('Stop was not applied', d.error || 'The turn changed before Stop arrived.', 'warn');
      // The narrow active endpoint decides whether to re-enable exact Stop or
      // clear a turn that completed during the command race.
      void hydrateSessionConversation(d.session);
      break;
    }

    case 'mcp-approval-required':
      // Show the approval modal. Multiple approvals can be in flight; the
      // queue serializes them so the user isn't flooded with overlapping
      // dialogs from a parallel run.
      enqueueMcpApproval(d);
      break;
    case 'mcp-approval-resolved':
      // Another tab decided — drop this id from the queue if it's still
      // there (closes any stale modal we have open).
      dismissMcpApproval(d.approval_id);
      break;
  }
}

function onWorkflowDone(d) {
  const usage = d.token_usage_known === true
    ? `${fmtNum(d.tokens || 0)} tokens`
    : `${fmtNum(d.tokens || 0)} known tokens · usage incomplete`;
  toast('Workflow complete', `${(d.completed || []).length} agents · ${usage}`, 'ok');
  rvWorkflowDone(d);
  try { refreshTopStats(); } catch {}
}

function onWorkflowError(d) {
  const tokens = (d.input_tokens || 0) + (d.output_tokens || 0)
    + (d.reasoning_tokens || 0);
  const usage = `${d.token_usage_known === true ? '' : '≥'}${fmtNum(tokens)} tokens`
    + `${d.token_usage_known === true ? '' : ' known subtotal; usage incomplete'}`;
  toast('Workflow failed', `${d.error || 'unknown error'} · ${usage}`, 'err');
  if (S.runView && d.workflow === S.runView.workflow) {
    S.runView.status = 'error';
    S.runView.synthesis = d.error || 'run failed';
    S.runView.tokens = tokens;
    S.runView.tokenUsageKnown = d.token_usage_known === true;
    renderRunView();
  }
}

// ╔══════════════════ Coordinator run view (Layer-2) ══════════════════╗
// The live process tree for one coordinator run: goal → decompose →
// auction → workers → synthesis. Built entirely from the stream bus:
//   coordinator-plan  → the goal + subtasks + per-subtask auction outcome
//   event (run-scoped)→ each winning worker's running / done / error + output
//   workflow-done     → the coordinator's synthesis
// One run is held at a time and kept after it finishes, so a coordinator
// node can re-open its last run.

function restoreCoordinatorRunView(run, options = {}) {
  if (!run?.workflow || !run.coordinator) return false;
  const workers = {};
  for (const subtask of (run.subtasks || [])) {
    if (subtask?.winner) {
      workers[subtask.winner] = { status: 'queued', output: '', tokens: 0 };
    }
  }
  let synthesis = '';
  let tokens = 0;
  for (const agent of (run.agents || [])) {
    if (!agent?.agent) continue;
    if (agent.agent === run.coordinator) {
      synthesis = String(agent.output || '');
      tokens = Number(agent.tokens || 0);
      continue;
    }
    workers[agent.agent] = {
      status: ['done', 'error', 'cancelled'].includes(agent.status) ? agent.status : 'running',
      output: String(agent.output || ''),
      tokens: Number(agent.tokens || 0),
    };
  }
  S.runView = {
    workflow: run.workflow,
    coordinator: run.coordinator,
    goal: run.goal || '',
    subtasks: Array.isArray(run.subtasks) ? run.subtasks : [],
    workers,
    synthesis,
    tokens,
    status: 'running',
  };
  if (options.open) openRunView();
  renderRunView();
  return true;
}

function onCoordinatorPlan(d) {
  S.runView = {
    workflow: d.workflow,
    coordinator: d.coordinator,
    goal: d.goal || '',
    subtasks: d.subtasks || [],
    workers: {},          // workerId → { status, output, tokens }
    synthesis: '',
    status: 'running',
  };
  // Seed each winning worker as queued so the whole plan shows before any
  // worker reports in.
  (d.subtasks || []).forEach(s => {
    if (s.winner) S.runView.workers[s.winner] = { status: 'queued', output: '', tokens: 0 };
  });
  openRunView();
  renderRunView();
}

// Fold a worker lifecycle event into the open run if it belongs to it.
// Returns true when consumed (so the caller knows it was run-scoped).
function rvWorkerEvent(d) {
  const rv = S.runView;
  if (!rv || !rv.workflow || d.workflow !== rv.workflow || !d.agent) return false;
  const t = d.type || '';
  // The coordinator's own completion carries the synthesis — fold it into the
  // synthesis phase, not the worker list. This always arrives (the activation
  // layer publishes it), so the run view shows the result even if the separate
  // workflow-done frame is missed.
  if (d.agent === rv.coordinator) {
    if (t === 'TaskCompleted') {
      if (d.output != null) rv.synthesis = String(d.output);
      if (d.tokens != null) rv.tokens = d.tokens;
      rv.status = 'done';
      renderRunView();
      return true;
    }
    if (t === 'AgentCancelled') {
      rv.status = 'cancelled';
      if (d.output != null) rv.synthesis = String(d.output);
      if (d.tokens != null) rv.tokens = d.tokens;
      renderRunView();
      return true;
    }
    if (t === 'AgentFailed' || t === 'AgentPanicked') {
      rv.status = 'error';
      if (d.output != null) rv.synthesis = String(d.output);
      renderRunView();
      return true;
    }
    return false;  // the coordinator's own activation — the goal phase covers it
  }
  const w = rv.workers[d.agent] || (rv.workers[d.agent] = { status: 'queued', output: '', tokens: 0 });
  if (t === 'AgentActivated') {
    w.status = 'running';
  } else if (t === 'TaskCompleted') {
    w.status = 'done';
    if (d.output != null) w.output = String(d.output);
    if (d.tokens != null) w.tokens = d.tokens;
  } else if (t === 'AgentFailed') {
    w.status = 'error';
    if (d.output != null) w.output = String(d.output);
  } else if (t === 'AgentCancelled') {
    w.status = 'cancelled';
    if (d.output != null) w.output = String(d.output);
    if (d.tokens != null) w.tokens = d.tokens;
  } else if (t === 'AgentPanicked') {
    w.status = 'error';
    if (d.output != null) w.output = String(d.output);
  } else {
    return false;
  }
  renderRunView();
  return true;
}

function rvWorkflowDone(d) {
  const rv = S.runView;
  if (!rv || d.workflow !== rv.workflow) return;
  rv.synthesis = d.output || '';
  rv.status = 'done';
  rv.tokens = d.tokens || 0;
  rv.tokenUsageKnown = d.token_usage_known === true;
  renderRunView();
}

let _runViewReturnFocus = null;
function openRunView() {
  const modal = $('#run-view-modal');
  if (!modal) return;
  if (modal.classList.contains('hide')) _runViewReturnFocus = axoDeepActiveElement();
  modal.classList.remove('hide');
  modal.setAttribute('aria-hidden', 'false');
  queueMicrotask(() => modal.querySelector('#run-view-close')?.focus());
}
function closeRunView() {
  const modal = $('#run-view-modal');
  if (!modal) return;
  modal.classList.add('hide');
  modal.setAttribute('aria-hidden', 'true');
  queueMicrotask(() => _runViewReturnFocus?.isConnected && _runViewReturnFocus.focus?.());
  _runViewReturnFocus = null;
}

// Open (or re-open) the run view for a specific coordinator — used by the
// "View run →" affordance on a coordinator node. Shows the last run if one is
// held, otherwise an idle shell.
function openCoordinatorRunView(coordinatorId) {
  if (!S.runView || S.runView.coordinator !== coordinatorId) {
    S.runView = {
      workflow: null, coordinator: coordinatorId, goal: '',
      subtasks: [], workers: {}, synthesis: '', status: 'idle',
    };
  }
  openRunView();
  renderRunView();
}

function renderRunView() {
  const rv = S.runView;
  const body = $('#run-view-body');
  if (!rv || !body) return;

  $('#run-view-title').textContent = (rv.coordinator || 'coordinator') + ' · run';
  const st = $('#run-view-status');
  st.className = 'run-view-status ' + (rv.status === 'idle' ? '' : rv.status);
  st.textContent = rv.status === 'done'  ? 'done'
                 : rv.status === 'error' ? 'failed'
                 : rv.status === 'cancelled' ? 'stopped'
                 : rv.status === 'idle'  ? 'idle'
                                         : 'running';

  body.innerHTML = '';

  // ── Goal
  const gp = el('div', 'rv-phase done');
  gp.appendChild(el('div', 'rv-phase-label', 'Goal'));
  gp.appendChild(el('div', 'rv-goal', rv.goal || '—'));
  body.appendChild(gp);

  // ── Decompose · auction · workers
  const tasksDone = rv.subtasks.length > 0 && rv.subtasks.every(s => {
    const w = rv.workers[s.winner];
    return w && (w.status === 'done' || w.status === 'error' || w.status === 'cancelled');
  });
  const pp = el('div', 'rv-phase ' + (rv.status === 'idle' ? '' : tasksDone ? 'done' : 'active'));
  pp.appendChild(el('div', 'rv-phase-label',
    rv.subtasks.length
      ? `Decompose · auction · ${rv.subtasks.length} subtask${rv.subtasks.length === 1 ? '' : 's'}`
      : 'Decompose · auction'));

  if (!rv.subtasks.length) {
    pp.appendChild(el('div', 'rv-out empty',
      rv.status === 'idle' ? 'No run yet — fire a workflow to watch this coordinator work.' : 'Decomposing…'));
  }

  rv.subtasks.forEach(s => {
    const w = rv.workers[s.winner] || { status: 'queued', output: '', tokens: 0 };
    const card = el('div', 'rv-task');

    const head = el('div', 'rv-task-head');
    head.appendChild(el('span', 'rv-dot ' + (w.status === 'queued' ? '' : w.status)));
    head.appendChild(el('span', 'rv-task-name', s.name || 'subtask'));
    const win = el('span', 'rv-winner');
    win.innerHTML = 'won by <span class="nm">' + escHtml(s.winner || '—') + '</span>'
      + (s.score ? ' · ' + Number(s.score).toFixed(2) : '');
    head.appendChild(win);
    if (s.adhoc) head.appendChild(el('span', 'rv-adhoc', 'ad-hoc'));
    card.appendChild(head);

    if (s.description) card.appendChild(el('div', 'rv-task-desc', s.description));

    if (s.bids && s.bids.length) {
      const bids = el('div', 'rv-bids');
      s.bids.forEach(b => {
        const cls = 'rv-bid' + (b.worker === s.winner ? ' win' : '') + (Number(b.score) === 0 ? ' zero' : '');
        bids.appendChild(el('span', cls, b.worker + ' ' + Number(b.score).toFixed(2)));
      });
      card.appendChild(bids);
    }

    const out = el('div', 'rv-out' + (w.output ? '' : ' empty'));
    out.textContent = w.output
      || (w.status === 'running' ? 'working…'
        : w.status === 'error' ? 'failed'
        : w.status === 'cancelled' ? 'stopped'
        : 'queued');
    card.appendChild(out);
    if (w.tokens) card.appendChild(el('div', 'rv-meta', fmtNum(w.tokens) + ' tokens'));

    pp.appendChild(card);
  });
  body.appendChild(pp);

  // ── Synthesis
  const sp = el('div', 'rv-phase' + (rv.status === 'done' ? ' done' : ''));
  sp.appendChild(el('div', 'rv-phase-label', 'Synthesis'));
  const synth = el('div', 'rv-synth' + (rv.synthesis ? '' : ' empty'));
  synth.textContent = rv.synthesis
    || (rv.status === 'idle' ? '—'
      : rv.status === 'cancelled' ? 'Stopped before synthesis completed.'
      : rv.status === 'error' ? 'Synthesis did not complete.'
      : rv.status === 'done' ? 'Completed in the Session transcript.'
      : 'Waiting for the coordinator to synthesize…');
  sp.appendChild(synth);
  if (['done', 'error', 'cancelled'].includes(rv.status)
      && typeof rv.tokenUsageKnown === 'boolean') {
    const known = rv.tokenUsageKnown === true;
    sp.appendChild(el('div', 'rv-meta', `${known ? '' : '≥'}${fmtNum(rv.tokens || 0)} tokens`
      + `${known ? '' : ' · known subtotal; usage incomplete'}`));
  }
  body.appendChild(sp);
}

// Close button, backdrop click, Esc — wired once.
(function wireRunView() {
  $('#run-view-close')?.addEventListener('click', closeRunView);
  $('#run-view-modal')?.addEventListener('click', (e) => {
    if (e.target === $('#run-view-modal')) closeRunView();
  });
  document.addEventListener('keydown', (e) => {
    const modal = $('#run-view-modal');
    if (modal?.classList.contains('hide')) return;
    if (e.key === 'Escape') closeRunView();
    else if (e.key === 'Tab') {
      e.preventDefault();
      modal.querySelector('#run-view-close')?.focus();
    }
  });
})();

// ╔══════════════════════════════ Init ══════════════════════════════╗
async function init() {
  // The live socket comes up FIRST and never waits on anything.
  //
  // It used to be opened after two awaited fetches. If either rejected — daemon
  // mid-restart — init aborted; if either merely *hung*, init stalled with no
  // error at all, and the app sat there permanently disconnected saying
  // nothing. The socket reconnects on its own and depends on no data, so
  // nothing should be able to strand it.
  connectWs();
  try { await refreshStatus(); } catch {}
  try { await loadAll(); } catch {}
  void $('#session-home')?.refresh?.();
  refreshTopStats();
  setInterval(refreshStatus, 5000);
  setInterval(refreshTopStats, 8000);
  checkLlmHealth();
}

// First-run friendliness: probe configured LLM providers and surface a
// one-time toast with concrete fix-up commands if anything's missing. The
// localStorage flag clears on user dismiss + on each version bump so we
// re-notify if the situation regresses.
async function checkLlmHealth() {
  try {
    const r = await fetch('/api/llm-health');
    if (!r.ok) return;
    const d = await r.json();
    if (!d.ollama || !d.ollama.configured) return;
    if (d.ollama.reachable && (!d.ollama.missing_models || !d.ollama.missing_models.length)) {
      try { localStorage.removeItem('axo.llm-health.warned'); } catch {}
      return;
    }
    const key = 'axo.llm-health.warned:' + JSON.stringify({
      r: d.ollama.reachable, m: d.ollama.missing_models || []
    });
    try { if (localStorage.getItem(key)) return; } catch {}
    if (!d.ollama.reachable) {
      toast('Ollama is not running',
            `Start it with  ollama serve  — then pull a model:  ollama pull llama3.2`,
            'err', 9000);
    } else if (d.ollama.missing_models.length) {
      const cmd = d.ollama.missing_models.map(m => 'ollama pull ' + m).join('  &&  ');
      toast('Missing Ollama model' + (d.ollama.missing_models.length > 1 ? 's' : ''),
            `Run:  ${cmd}`,
            'err', 9000);
    }
    try { localStorage.setItem(key, '1'); } catch {}
  } catch { /* network down — nothing useful to say */ }
}

// The component graph above is a deferred ES module. Starting the classic
// shell while the parser is still running can create detached custom elements
// before their definitions exist; detached candidates are not upgraded when
// the definitions arrive, leaving methods such as <ax-editor>.reset missing.
// DOMContentLoaded fires only after deferred modules have evaluated.
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init, { once: true });
} else {
  init();
}
