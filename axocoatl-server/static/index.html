// ── Session transcript: rehydrate prior turns + Retry/Rewind ─────────
// The cockpit's Activity feed is otherwise ephemeral; on reopen we fetch the
// persisted transcript (GET /api/sessions/{id}/messages) and rebuild it so the
// conversation isn't lost — and so each turn can be addressed for rewind.
async function reloadSessionTranscript(expectedSessionId = S.session.id) {
  if (!expectedSessionId) return;
  try {
    const r = await fetch('/api/sessions/' + encodeURIComponent(expectedSessionId) + '/messages');
    const messages = r.ok ? await r.json() : null;
    if (r.ok && S.session.id === expectedSessionId) renderSessionTranscript(messages);
  } catch {}
}

// Render an array of stored messages (user / assistant[+tool_calls] / tool)
// into the Activity feed, reconstructing tool cards by pairing each assistant
// tool_call with its following tool-result message.
function renderSessionTranscript(messages) {
  const host = $('#session-msgs');
  host.innerHTML = '';
  S.session.toolCards = {};
  S.session.streamEl = null;
  S.session.reasoningEl = null;
  let lastUser = null; // { idx, content } — the prompt that drives the next reply
  (messages || []).forEach((m, idx) => {
    const role = String(m.role || '').toLowerCase();
    if (role === 'user') {
      lastUser = { idx, content: m.content || '' };
      const wrap = el('div', 'smsg user');
      wrap.appendChild(el('div', 'smsg-role', 'you'));
      wrap.appendChild(el('div', 'smsg-body', m.content || ''));
      // Rewind: drop this turn and everything after it.
      wrap.appendChild(sessionActionRow({ role: 'user', text: m.content || '', keep: idx }));
      host.appendChild(wrap);
    } else if (role === 'assistant') {
      for (const tc of (m.tool_calls || [])) {
        let args = {};
        try { args = JSON.parse(tc.arguments_json || '{}'); } catch {}
        const { card } = buildToolCard({ name: tc.name, arguments: args, call_id: tc.id });
        S.session.toolCards[tc.id] = { card };
        host.appendChild(card);
      }
      if (m.content && m.content.trim()) {
        const wrap = el('div', 'smsg');
        wrap.appendChild(el('div', 'smsg-role', 'agent'));
        const b = el('div', 'smsg-body prose');
        b.innerHTML = mdRender(m.content);
        wrap.appendChild(b);
        // Retry: re-run the prompt that produced this reply.
        wrap.appendChild(sessionActionRow({
          role: 'agent', text: m.content,
          retryKeep: lastUser ? lastUser.idx : null,
          retryText: lastUser ? lastUser.content : null,
        }));
        host.appendChild(wrap);
      }
    } else if (role === 'tool') {
      const tc = S.session.toolCards[m.tool_call_id];
      if (tc) {
        tc.card.classList.remove('running');
        tc.card.classList.add('ok');
        const body = tc.card.querySelector('.toolcard-body');
        if (body) body.innerHTML = '<pre>' + escHtml(m.content || '') + '</pre>';
      }
    }
  });
  host.scrollTop = host.scrollHeight;
}

function sessionActionRow(opts) {
  const acts = el('div', 'smsg-actions');
  acts.appendChild(copyActionBtn(opts.text || ''));
  if (opts.role === 'user' && opts.keep != null) {
    const rewind = el('button', 'smsg-act', '⤺ Rewind');
    rewind.title = 'Go back to this turn — drop everything after, then continue';
    rewind.addEventListener('click', () => sessionRewind(opts.keep, null, opts.text));
    acts.appendChild(rewind);
  } else if (opts.role === 'agent' && opts.retryKeep != null) {
    const retry = el('button', 'smsg-act', '⟳ Retry');
    retry.title = 'Regenerate this response';
    retry.addEventListener('click', () => sessionRewind(opts.retryKeep, opts.retryText, null));
    acts.appendChild(retry);
  }
  return acts;
}

// Rewind the session to keep the first `keep` transcript messages. When
// `resend` is set (Retry), re-send it; when `prefill` is set (Rewind), drop the
// turn and put its text back in the composer to edit/re-ask.
async function sessionRewind(keep, resend, prefill) {
  const id = S.session.id;
  if (!id) return;
  try {
    const r = await fetch('/api/sessions/' + encodeURIComponent(id) + '/rewind', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ keep }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    await reloadSessionTranscript();
    if (resend != null && resend !== '') {
      $('#session-text').value = resend;
      sendSessionMessage();
    } else if (prefill != null) {
      $('#session-text').value = prefill;
      $('#session-text').focus();
    }
  } catch (e) { toast('Rewind failed', String(e), 'err'); }
}

// ── Source Control shell adapter ────────────────────────────────────
// `<ax-source-control>` owns Git state and mutations. The shell keeps only
// pane routing and the Monaco diff boundary.
function setExplorerTab(tab) {
  S.session.explorerTab = tab;
  $$('#explorer-tabs .etab').forEach(b => b.classList.toggle('active', b.dataset.etab === tab));
  const git = tab === 'git';
  $('#file-search')?.classList.toggle('hide', git);
  $('#file-tree')?.classList.toggle('hide', git);
  $('#source-control')?.classList.toggle('hide', !git);
  if (git) void refreshGitPane({ branches: true });
}

function refreshGitPane(options) {
  const sourceControl = $('#source-control');
  if (!sourceControl || !S.session.id) return Promise.resolve();
  sourceControl.session = S.session.id;
  return sourceControl.refresh(options);
}

// Open a file's working-tree diff (HEAD vs current) in the editor area, using
// Monaco's diff editor.
async function openGitDiff(path) {
  const v = $('#file-viewer'); if (!v || !S.session.id) return;
  // Open the editor column (it's collapsed when nothing's shown) so Monaco
  // lays out at a real size.
  widenFilesForEditor();
  const modes = $('#viewer-modes'); if (modes) modes.style.display = 'none';
  viewerShow('<div class="empty small">Loading diff…</div>');
  let d;
  try {
    d = await fetch('/api/sessions/' + encodeURIComponent(S.session.id) + '/git/diff?path=' + encodeURIComponent(path)).then(r => r.json());
  } catch { viewerShow('<div class="empty small">Diff failed to load.</div>'); return; }
  if (!d || d.error) { viewerShow('<div class="empty small">Diff failed to load.</div>'); return; }
  const monaco = await loadMonacoOnce();
  // Tear down any prior diff editor + models.
  gitDisposeDiff(monaco);
  // The diff owns the pane while it is up; the editor keeps its files and is
  // put back the next time one is activated.
  // Binary or oversized files have no inline diff — show a sentinel, but still
  // remember the path so a live refresh can recover if it shrinks/changes.
  if (d.binary || d.too_large) {
    viewerShow('<div class="empty small">' +
      (d.binary ? 'Binary file — no inline diff.' : 'File too large to diff inline (over 512 KB).') +
      '</div>');
    S.session.gitDiff = { path, sentinel: true };
    return;
  }
  const host = el('div', 'monaco-host');
  viewerShow(host);
  const de = monaco.editor.createDiffEditor(host, {
    automaticLayout: true, readOnly: true, renderSideBySide: true,
    minimap: { enabled: false }, fontSize: 13, scrollBeyondLastLine: false,
  });
  // Models keyed by a unique uri so Monaco infers the language from the path.
  const stamp = path.replace(/[^a-zA-Z0-9._/-]/g, '_');
  const orig = monaco.editor.createModel(d.old || '', undefined, monaco.Uri.parse('axo://diff-old/' + stamp));
  const modd = monaco.editor.createModel(d.new || '', undefined, monaco.Uri.parse('axo://diff-new/' + stamp));
  de.setModel({ original: orig, modified: modd });
  S.session.gitDiff = { editor: de, models: [orig, modd], path };
}

// Keep an already-open diff in sync as the agent keeps editing. Called from
// refreshGitPane after the status list updates. Updates the Monaco models in
// place (no scroll jump) when possible; clears the view once the file is no
// longer changed; rebuilds across binary/oversize ↔ renderable transitions.
async function refreshOpenDiff() {
  const gd = S.session.gitDiff;
  if (!gd || !gd.path || !S.session.id) return;
  const path = gd.path;
  const changed = (S.session.gitStatus?.files || []).some(f => f.path === path);
  if (!changed) {
    const monaco = await loadMonacoOnce();
    gitDisposeDiff(monaco);
    viewerShow('<div class="empty small">No changes — committed or reverted.</div>');
    updateFilesEditor();   // collapse the editor if nothing else is open
    return;
  }
  let d;
  try {
    d = await fetch('/api/sessions/' + encodeURIComponent(S.session.id) + '/git/diff?path=' + encodeURIComponent(path)).then(r => r.json());
  } catch { return; }
  if (!d || d.error) return;
  // Renderable and the editor is live → update in place (preserves scroll).
  if (!d.binary && !d.too_large && gd.editor && gd.models) {
    if (gd.models[0].getValue() !== (d.old || '')) gd.models[0].setValue(d.old || '');
    if (gd.models[1].getValue() !== (d.new || '')) gd.models[1].setValue(d.new || '');
    return;
  }
  // Sentinel ↔ renderable transition (or first render of a sentinel) → rebuild.
  await openGitDiff(path);
}

function gitDisposeDiff(monaco) {
  const gd = S.session.gitDiff;
  if (!gd) return;
  try { gd.editor && gd.editor.dispose(); } catch {}
  (gd.models || []).forEach(m => { try { m.dispose(); } catch {} });
  S.session.gitDiff = null;
}

// ── Variants run-key parser ─────────────────────────────────────────────
// Variants stream over the WS keyed `{session}#{i}`. This shared helper pulls
// the lane index out of a run id; the in-thread variant turn (startThreadVariants
// → pills) demuxes those frames. Backed by /api/sessions/{id}/variants*.

// If `key` is a variant run id (`{session}#{n}`), return n; else null.
function variantLaneFor(key) {
  if (!key || !S.session.id) return null;
  const pre = S.session.id + '#';
  if (!key.startsWith(pre)) return null;
  const n = parseInt(key.slice(pre.length), 10);
  return Number.isInteger(n) ? n : null;
}

function threadVariantFrameMatches(run) {
  const tv = S.threadVariants;
  if (!tv) return false;
  const parts = laneKeyParts(run);
  if (!parts || parts.session !== tv.sessionId) return false;
  const announcedSetId = _laneAttemptSetIds.get(run);
  const authoritativeSetId = _attemptSetIds.get(tv.sessionId);
  return Boolean(tv.attemptSetId && authoritativeSetId
    && tv.attemptSetId === authoritativeSetId
    && announcedSetId === authoritativeSetId);
}

function sendSessionMessage() {
  if (!S.session.id) return;
  const text = ($('#session-text').value || '').trim(); if (!text) return;
  if (S.session.attemptRestorePending) {
    toast('Checking current attempts', 'The daemon is restoring this session before another turn can start.', 'info');
    return;
  }
  // An unresolved attempt set owns this session turn. Starting a normal turn
  // or another exploration would fork the workspace underneath its base and
  // make Keep ambiguous, so leave the draft intact and route to the decision.
  if (S.threadVariants && S.threadVariants.sessionId === S.session.id) {
    void refreshThreadVariantStatus();
    toast('Finish the current attempts', 'Keep one or finish without keeping before sending another turn.', 'warn');
    openModule('compare');
    return;
  }
  const configuredAttemptLanes = S.session.fanoutOn && Array.isArray(S.session.fanoutLanes)
    ? S.session.fanoutLanes : [];
  if (configuredAttemptLanes.length > 1 && !sessionSupportsAttempts()) {
    toast('Explore needs a single-agent session',
      'This session keeps a multi-agent transcript. Open a single-agent session to explore several ways safely.',
      'warn', 7000);
    return;
  }
  $('#session-text').value = '';
  // Prepend any captured references as a structured Context block, then
  // clear the refs strip so they aren't sent twice.
  const refs = S.session.refs || [];
  const fullText = refs.length ? (buildRefsContext(refs) + '\n\n' + text) : text;
  const planned = S.session.attemptPlan?.instruction === text ? S.session.attemptPlan : null;
  const attemptTask = planned?.task || text;
  if (refs.length) { S.session.refs = []; renderChatRefs(); }
  const wrap = el('div', 'smsg user');
  wrap.appendChild(el('div', 'smsg-role', 'you'));
  // Visible message shows the user's text; the structured context goes to
  // the agent but isn't re-rendered in the transcript (keeps it clean).
  wrap.appendChild(el('div', 'smsg-body', text));
  appendSessionEl(wrap);

  // Fan-out: explore the prompt several ways at once, in the thread. It's a
  // persistent mode — stays on across turns until you switch it off.
  // Attempts are configured rows now, not a count. The count still drives the
  // optimistic UI, but what the backend receives is the actual per-attempt
  // agent and model — otherwise choosing them would be a control that changes
  // nothing.
  const laneCfg = configuredAttemptLanes;
  if (laneCfg.length > 1) {
    startThreadVariants(attemptTask, fullText, laneCfg, {
      composerText: text,
      refs: refs.map((ref) => ({ ...ref })),
      plan: planned ? { ...planned } : null,
      userEl: wrap,
    });
    return;
  }

  setThinking($('#session-msgs'), true);
  S.session.streamEl = null;
  S.session.reasoningEl = null;
  // Per-turn pickers: model override + (optional) agent target.
  const modelSel  = $('#session-model');
  const targetSel = $('#session-target');
  const model_override = (modelSel && !modelSel.classList.contains('hide')
    && modelSel.value && modelSel.value !== '__default__')
    ? modelSel.value : undefined;
  const target_agent = (targetSel && !targetSel.classList.contains('hide') && targetSel.value && targetSel.value !== '__all__')
    ? targetSel.value : undefined;
  const payload = { cmd: 'session', id: S.session.id, input: fullText };
  if (model_override !== undefined) payload.model_override = model_override;
  if (target_agent   !== undefined) payload.target_agent   = target_agent;
  if (!wsSend(payload)) {
    setThinking($('#session-msgs'), false);
    wrap.remove();
    $('#session-text').value = text;
    S.session.refs = refs;
    renderChatRefs();
    syncAttemptsDraft();
    $('#session-text').focus();
    toast('Not connected', 'Reconnecting to the daemon…', 'err');
    return;
  } else {
    S.session.attemptPlan = null;
    syncAttemptsDraft();
  }
  $('#cockpit-status').textContent = 'running…';
  setCockpitLive('live', 'live');
}

// ── Variants in the thread ──────────────────────────────────────────────
// Fan out one prompt into N attempts, shown as live pills at the head of an
// assistant turn. Flip between them; keep the one you like; the rest dissolve.
// The git worktrees/branches/merge underneath are never named.

// How many attempts a fresh session offers before you configure them. The
// ceiling and the per-attempt configuration live in <ax-fanout>.
const FANOUT_RECOMMENDED = 3;

function sessionSupportsAttempts(session = S.session) {
  return session?.mode?.kind === 'single_agent';
}


// The composer button: ⑂ N when on (N = the count), ⑂ 1 when off.
function updateFanoutBtn() {
  const on = !!S.session.fanoutOn;
  const n = on ? Math.max(2, S.session.fanout || FANOUT_RECOMMENDED) : 1;
  const lbl = $('#fanout-n'); if (lbl) lbl.textContent = String(n);
  const b = $('#fanout-btn');
  if (b) {
    const supported = sessionSupportsAttempts();
    b.classList.toggle('on', on);
    b.disabled = !supported;
    b.setAttribute('aria-label', on
      ? `Configure ${n} attempt ways` : 'Configure several ways');
    b.title = !supported
      ? 'Explore several ways currently requires a single-agent session'
      : (on ? ('Exploring ' + n + ' ways — click to configure')
        : 'Explore several ways at once, then keep the one you like');
  }
}

// ── What a turn changed ────────────────────────────────────────────────
//
// A run emits a card per tool call, which answers "what happened" and not the
// question a reviewer has: what did this turn do to the repository. One card per
// turn summarises it, with per-file counts so you know which file to read first.
function appendChangesCard() {
  if (!S.session.id) return;
  const card = document.createElement('ax-changes');
  card.session = S.session.id;
  card.addEventListener('file-open', (e) => openFile(e.detail.path));
  card.addEventListener('review', () => {
    openModule('files');
    setExplorerTab('git');
  });
  appendSessionEl(card);
  // The working tree is read after the turn settles; the element hides itself
  // when nothing changed, so a no-op turn adds no noise.
  card.refresh();
  return card;
}

// ── Fan-out control ────────────────────────────────────────────────────
//
// The attempts are configured by <ax-fanout> (see /ui/fanout.js): one row per
// attempt, each choosing its own agent and model. What stays here is the button
// that opens it and the state it reports.

function attemptsDraftTask() {
  const text = ($('#session-text')?.value || '').trim();
  const planned = S.session?.attemptPlan;
  return planned && planned.instruction === text ? planned.task : text;
}

function syncAttemptsDraft() {
  const attempts = $('#attempts');
  if (!attempts?.setDraft) return;
  const lanes = S.session?.fanoutOn && Array.isArray(S.session.fanoutLanes)
    ? S.session.fanoutLanes : [];
  attempts.setDraft({ task: attemptsDraftTask(), lanes });
}

function refreshAttempts(sessionId = S.session.id) {
  const attempts = $('#attempts');
  if (!attempts || !sessionId || attempts.session !== sessionId) return;
  void attempts.refresh?.();
}

function toggleFanoutPop() {
  const f = $('#fanout'); if (!f) return;
  f.open = !f.open;
  $('#fanout-btn')?.setAttribute('aria-expanded', String(f.open));
  if (f.open) {
    requestAnimationFrame(() => {
      f.shadowRoot?.querySelector('input, button, select, textarea')?.focus();
    });
  }
}

function closeFanoutPop() {
  const f = $('#fanout');
  if (f) f.open = false;
  $('#fanout-btn')?.setAttribute('aria-expanded', 'false');
}

(function initFanoutOnce() {
  function attach() {
    const f = $('#fanout'); if (!f || f._wired) return;
    f._wired = true;
    f.enabled = !!S.session.fanoutOn;
    new MutationObserver(() => {
      const btn = $('#fanout-btn');
      btn?.setAttribute('aria-expanded', String(f.open));
      // Shadow focus retargets to the host. If a keyboard-activated close
      // button hid the dialog, return focus to the control that opened it.
      if (!f.open && document.activeElement === f) btn?.focus();
    }).observe(f, { attributes: true, attributeFilter: ['open'] });
    f.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape' || !f.open) return;
      event.preventDefault();
      event.stopPropagation();
      closeFanoutPop();
      $('#fanout-btn')?.focus();
    });
    f.addEventListener('change', (e) => {
      S.session.fanoutOn = e.detail.enabled;
      S.session.fanoutLanes = e.detail.lanes;
      S.session.fanout = e.detail.lanes.length || 1;
      updateFanoutBtn();
      syncAttemptsDraft();
    });
    // Clicking away closes it, but not a click on its own button.
    document.addEventListener('mousedown', (ev) => {
      if (!f.open) return;
      const btn = $('#fanout-btn');
      if (f.contains(ev.target) || ev.composedPath().includes(f) || (btn && btn.contains(ev.target))) return;
      closeFanoutPop();
    }, { capture: true });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attach);
  } else attach();
})();

(function initAttemptsOnce() {
  function attach() {
    const attempts = $('#attempts'); if (!attempts || attempts._shellWired) return;
    attempts._shellWired = true;
    $('#session-text')?.addEventListener('input', () => {
      const planned = S.session?.attemptPlan;
      if (planned && planned.instruction !== ($('#session-text').value || '').trim()) {
        S.session.attemptPlan = null;
      }
      syncAttemptsDraft();
    });
    attempts.addEventListener('attempt-instruction', (event) => {
      const detail = event.detail || {};
      const instruction = String(detail.instruction || '').trim();
      if (!S.session.id || !instruction) return;
      S.session.attemptPlan = {
        task: String(detail.task || instruction),
        instruction,
        plan: detail.plan || null,
      };
      const input = $('#session-text');
      if (input) {
        input.value = instruction;
        input.focus();
      }
      syncAttemptsDraft();
      toast('Plan ready', 'The reviewed instruction is in the session composer.', 'ok');
    });
    attempts.addEventListener('attempt-review', (event) => {
      const detail = event.detail || {};
      if (detail.session !== S.session.id) return;
      const compare = $('#compare');
      if (compare) {
        compare.session = detail.session;
        compare.view = 'outcome';
      }
      openModule('compare');
      refreshCompare(detail.session);
    });
    attempts.addEventListener('attempts-error', (event) => {
      const detail = event.detail || {};
      if (detail.stale || detail.session !== S.session.id) return;
      const currentSet = S.threadVariants?.sessionId === detail.session
        ? S.threadVariants.attemptSetId : null;
      if (detail.attempt_set_id && currentSet && detail.attempt_set_id !== currentSet) return;
      const titles = {
        agents: 'Could not load agents', sessions: 'Could not read session',
        results: 'Could not read attempts', plan: 'Could not plan',
        probe: 'Model check failed', cost: 'Could not calculate cost',
      };
      toast(titles[detail.action] || 'Attempts need attention',
        String(detail.message || 'Unknown attempts error'), 'err', 8000);
    });
    syncAttemptsDraft();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attach);
  } else attach();
})();

(function initCompareOnce() {
  function attach() {
    const compare = $('#compare'); if (!compare || compare._shellWired) return;
    compare._shellWired = true;
    compare.addEventListener('attempt-keep', (event) => {
      void finishAttemptDecision('keep', event.detail);
    });
    compare.addEventListener('attempt-discard', (event) => {
      void finishAttemptDecision('discard', event.detail);
    });
    compare.addEventListener('attempt-set-changed', (event) => {
      const detail = event.detail || {};
      const tv = S.threadVariants;
      if (detail.session !== S.session.id || !tv
          || tv.sessionId !== detail.session
          || tv.attemptSetId !== detail.previous_attempt_set_id) return;
      S.session.attemptRestorePending = true;
      void restoreThreadVariants(detail.session);
      scheduleThreadVariantRestore(detail.session);
    });
    compare.addEventListener('compare-error', (event) => {
      const detail = event.detail || {};
      if (detail.stale || detail.session !== S.session.id) return;
      const titles = {
        verify: 'Checks failed',
        judge: 'Judge failed',
        keep: 'Keep failed',
        discard: 'Discard failed',
        'inspect-files': 'Could not inspect changes',
      };
      const advice = detail.action === 'keep'
        ? 'Reading the durable attempt state before allowing another action.'
        : detail.action === 'discard'
          ? 'Reading the durable attempt state before allowing another action.'
        : detail.action === 'verify'
          ? 'Wait for every attempt to finish, then run Checks again.'
          : 'The attempt set is still available; review it in Attempts and retry.';
      // A dropped response is indistinguishable from a failed decision at the
      // browser boundary: Keep or Discard may already have removed the set.
      // Reconcile against results before releasing the composer, rather than
      // stranding a stale in-memory attempt turn until the next page reload.
      if (detail.action === 'keep' || detail.action === 'discard') {
        reconcileUncertainAttemptDecision(detail.session, detail.attempt_set_id);
      }
      openModule('compare');
      toast(titles[detail.action] || 'Attempts need attention',
        String(detail.message || 'Unknown error') + ' ' + advice, 'err', 8000);
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attach);
  } else attach();
})();


// Anchor above the ⑂ button, right-aligned to it, clamped to the viewport.

const ATTEMPT_TERMINAL_STATES = new Set(['completed', 'failed', 'cancelled', 'interrupted']);
const ATTEMPT_KEEP_RECOVERY_STATES = new Set(['applying', 'applied', 'transcript_recorded']);
const ATTEMPT_POLLING_SET_STATES = new Set(['preparing', 'running', 'checking', 'discarding']);

function isAttemptTerminal(state) { return ATTEMPT_TERMINAL_STATES.has(String(state || '')); }

function threadVariantNeedsPoll(tv) {
  return Boolean(tv && (ATTEMPT_POLLING_SET_STATES.has(tv.setState)
    || ATTEMPT_KEEP_RECOVERY_STATES.has(tv.setState)
    || tv.keepPending
    || tv.variants.some((variant) => !isAttemptTerminal(variant.laneState))));
}

function attemptVisualState(state) {
  if (state === 'completed') return 'done';
  if (state === 'failed' || state === 'cancelled' || state === 'interrupted') return 'error';
  return 'running';
}

function refreshCompare(sessionId = S.session.id) {
  const compare = $('#compare');
  if (!compare || !sessionId || compare.session !== sessionId) return;
  void compare.refresh?.();
}

async function attemptJson(url, options) {
  const response = await fetch(url, options);
  const text = await response.text();
  let body = null;
  if (text) {
    try { body = JSON.parse(text); } catch { body = text; }
  }
  if (!response.ok) {
    const message = body && typeof body === 'object' ? body.error : body;
    throw new Error(message || ('HTTP ' + response.status));
  }
  return body;
}

async function startThreadVariants(task, input, lanes, pendingTurn = null) {
  const sessionId = S.session.id;
  const requested = Array.isArray(lanes) ? lanes.map(lane => ({ ...lane })) : [];
  if (!sessionId || requested.length < 2) return;
  if (S.threadVariants && S.threadVariants.sessionId === sessionId) {
    toast('Finish the current attempts', 'Keep one or finish without keeping before exploring again.', 'warn');
    openModule('compare');
    return;
  }

  buildVariantTurn(requested, { sessionId, task, instruction: input, setState: 'preparing' });
  const optimistic = S.threadVariants;
  const startRecovery = { optimistic, pendingTurn, task, input, message: '', requestPending: true };
  _attemptStartRecoveries.set(sessionId, startRecovery);
  $('#cockpit-status').textContent = 'exploring ' + requested.length + ' ways…';
  setCockpitLive('live', 'live');
  try {
    const set = await attemptJson(
      '/api/sessions/' + encodeURIComponent(sessionId) + '/variants', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ task, input, lanes: requested }),
      });
    if (!set || !set.id || !Array.isArray(set.lanes) || set.session_id !== sessionId) {
      throw new Error('The daemon did not return an attempt set.');
    }

    // Let ownership installation release any frames that arrived between
    // LaneStarted and this response into the optimistic turn it belongs to.
    if (S.threadVariants === optimistic) optimistic.attemptSetId = set.id;
    // A successful start replaces every stale rail fact for this session. The
    // set id makes later Keep/Discard events unable to clear a newer run.
    beginAttemptRailSet(sessionId, set.id, set.lanes);
    startRecovery.requestPending = false;
    startRecovery.confirmedSetId = set.id;
    if (S.session.id !== sessionId) return;
    if (S.threadVariants !== optimistic) {
      if (S.threadVariants?.attemptSetId === set.id) {
        _attemptStartRecoveries.delete(sessionId);
        S.session.attemptStartRecovery = null;
        S.session.attemptPlan = null;
        syncAttemptsDraft();
      }
      return;
    }
    applyThreadAttemptSet(set);
    _attemptStartRecoveries.delete(sessionId);
    S.session.attemptStartRecovery = null;
    openModule('compare');
    refreshCompare(sessionId);
    refreshAttempts(sessionId);
    if (S.session.id === sessionId) {
      S.session.attemptPlan = null;
      syncAttemptsDraft();
    }
    scheduleThreadVariantPoll();
  } catch (error) {
    const ownsOptimistic = S.threadVariants === optimistic;
    startRecovery.optimistic = ownsOptimistic ? optimistic : startRecovery.optimistic;
    startRecovery.requestPending = false;
    startRecovery.message = String(error?.message || error);
    _attemptStartRecoveries.set(sessionId, startRecovery);
    if (S.session.id === sessionId) {
      // A lost POST response is ambiguous: the daemon may already own the
      // set. Keep the optimistic turn and Send gate intact until results says
      // whether to hydrate it or roll it back into the composer.
      S.session.attemptRestorePending = true;
      S.session.attemptStartRecovery = startRecovery;
      $('#cockpit-status').textContent = 'checking attempt start…';
      setCockpitLive('live', 'live');
      void restoreThreadVariants(sessionId);
    }
  }
}

function rollbackFailedVariantStart(sessionId, recovery) {
  if (!recovery || S.session.id !== sessionId) return;
  const optimistic = recovery.optimistic;
  if (optimistic && S.threadVariants === optimistic) clearThreadVariantSummary(sessionId, null);
  const pendingTurn = recovery.pendingTurn;
  if (pendingTurn) {
    pendingTurn.userEl?.remove();
    const composer = $('#session-text');
    let hadNewerDraft = false;
    if (composer) {
      const newerDraft = composer.value.trim();
      hadNewerDraft = Boolean(newerDraft);
      composer.value = newerDraft
        ? `${pendingTurn.composerText}\n\n${composer.value}` : pendingTurn.composerText;
      composer.focus();
    }
    S.session.refs = [...(pendingTurn.refs || []), ...(S.session.refs || [])];
    if (!hadNewerDraft && pendingTurn.plan) S.session.attemptPlan = pendingTurn.plan;
    renderChatRefs();
    syncAttemptsDraft();
  }
  $('#cockpit-status').textContent = 'could not start attempts';
  setCockpitLive('error', 'error');
  refreshAttempts(sessionId);
  toast('Could not explore', recovery.message || 'The attempt set did not start.', 'err');
}

function buildVariantTurn(lanes, meta = {}) {
  const specs = Array.isArray(lanes) ? lanes : [];
  const wrap = el('div', 'smsg vturn');
  wrap.appendChild(el('div', 'smsg-role', 'agent'));
  const pills = el('div', 'vt-pills');
  pills.setAttribute('role', 'group');
  pills.setAttribute('aria-label', 'Attempt ways');
  const lifecycle = el('div', 'vt-status');
  lifecycle.setAttribute('role', 'status');
  lifecycle.setAttribute('aria-live', 'polite');
  lifecycle.setAttribute('aria-atomic', 'true');
  const body = el('div', 'vt-body prose');
  const foot = el('div', 'vt-foot');
  const diffstat = el('span', 'vt-diffstat', 'exploring…');
  const keep = el('button', 'btn sm vt-keep', 'Keep this');
  keep.disabled = true;
  foot.append(diffstat, keep);
  wrap.append(pills, lifecycle, body, foot);
  appendSessionEl(wrap);
  const variants = [];
  specs.forEach((spec, position) => {
    const index = Number.isInteger(spec?.index) ? spec.index : position;
    const laneState = spec?.state || (meta.setState === 'preparing' ? 'queued' : 'running');
    const pill = el('button', 'vt-pill' + (position === 0 ? ' active' : ''));
    pill.type = 'button';
    pill.setAttribute('aria-pressed', String(position === 0));
    const dot = el('span', 'vt-pill-dot ' + attemptVisualState(laneState));
    const stat = el('span', 'vt-pill-stat', '');
    pill.append(dot, el('span', '', String(index + 1)), stat);
    pill.addEventListener('click', () => setActiveVariant(index));
    pills.appendChild(pill);
    variants.push({
      ...spec,
      index,
      buf: '',
      laneState,
      error: null,
      verdict: null,
      pill, dot, stat, files: [], filesLoaded: false,
    });
  });
  keep.addEventListener('click', keepActiveVariant);
  S.threadVariants = {
    sessionId: meta.sessionId || S.session.id,
    attemptSetId: meta.attemptSetId || null,
    task: meta.task || '',
    instruction: meta.instruction || '',
    setState: meta.setState || 'preparing',
    keptIndex: Number.isInteger(meta.keptIndex) ? meta.keptIndex : null,
    lanes: specs.map(spec => ({ ...spec })),
    results: null,
    wrap,
    pillsEl: pills,
    bodyEl: body,
    footEl: foot,
    diffstatEl: diffstat,
    keepBtn: keep,
    lifecycleEl: lifecycle,
    lifecycleSummary: '',
    active: variants[0]?.index ?? 0,
    variants,
    settledOpened: false,
  };
  if (variants.length) setActiveVariant(variants[0].index);
  syncVariantAccessibility(S.threadVariants);
}

function syncVariantAccessibility(tv = S.threadVariants) {
  if (!tv) return;
  for (const variant of tv.variants) {
    const identity = variant.agent || variant.model || 'configuration unavailable';
    const fileSummary = variant.filesLoaded
      ? `, ${variant.files.length} changed file${variant.files.length === 1 ? '' : 's'}` : '';
    const error = variant.error ? `, error: ${variant.error}` : '';
    variant.pill.setAttribute('aria-label',
      `Way ${variant.index + 1}, ${identity}, `
      + `${String(variant.laneState || 'queued').replaceAll('_', ' ')}${fileSummary}${error}`);
  }
  const counts = new Map();
  for (const variant of tv.variants) {
    const state = String(variant.laneState || 'queued').replaceAll('_', ' ');
    counts.set(state, (counts.get(state) || 0) + 1);
  }
  const summary = [...counts].map(([state, count]) => `${count} ${state}`).join(', ');
  if (summary && summary !== tv.lifecycleSummary) {
    tv.lifecycleSummary = summary;
    tv.lifecycleEl.textContent = `Current attempts: ${summary}.`;
  }
}

function setActiveVariant(i) {
  const tv = S.threadVariants;
  const v = tv?.variants.find(variant => variant.index === i);
  if (!tv || !v) return;
  tv.active = i;
  tv.variants.forEach(variant => {
    const active = variant.index === i;
    variant.pill.classList.toggle('active', active);
    variant.pill.setAttribute('aria-pressed', String(active));
  });
  tv.bodyEl.style.opacity = '0';
  setTimeout(() => {
    if (S.threadVariants !== tv || tv.active !== i) return;
    let fallback = '<span class="muted small">working…</span>';
    if (v.laneState === 'completed') {
      fallback = '<span class="muted small">Finished. Review Outcome and Route in Attempts.</span>';
    } else if (isAttemptTerminal(v.laneState)) {
      fallback = '<span class="muted small">This attempt did not complete. Review it in Attempts.</span>';
    }
    tv.bodyEl.innerHTML = v.buf ? mdRender(v.buf) : fallback;
    tv.bodyEl.style.opacity = '1';
  }, 90);
  renderVariantFoot();
}

function threadVariantKeepReason(tv, variant) {
  if (!tv?.attemptSetId) return 'Wait for the attempt set to start.';
  if (tv.setState === 'discarding') return 'Finish cleaning up the attempts.';
  if (tv.setState === 'checking') return 'Checks are incomplete. Retry Checks in Attempts.';
  if (ATTEMPT_KEEP_RECOVERY_STATES.has(tv.setState)) {
    return tv.keptIndex === variant?.index
      ? 'Finish the interrupted Keep in Attempts.'
      : `Keep is already in progress for attempt ${(tv.keptIndex ?? 0) + 1}.`;
  }
  if (variant?.laneState !== 'completed') {
    return isAttemptTerminal(variant?.laneState)
      ? 'This attempt did not complete. Review the failure in Attempts.'
      : 'Wait for every attempt to finish, then review it in Attempts.';
  }
  if (!variant.verdict) return 'Run Checks in Attempts before keeping one.';
  if (!variant.verdict.passed) return 'Checks ruled this attempt out. Review the result in Attempts.';
  if (!(variant.verdict.changed_files > 0)) return 'Checks found no change to keep. Review the result in Attempts.';
  return '';
}

function renderVariantFoot() {
  const tv = S.threadVariants; if (!tv) return;
  const v = tv.variants.find(variant => variant.index === tv.active); if (!v) return;
  const files = v.files || [];
  const neu = files.filter(f => f.state === 'added' || f.state === 'untracked').length;
  const mod = files.filter(f => f.state === 'modified' || f.state === 'renamed').length;
  const del = files.filter(f => f.state === 'deleted').length;
  let summary = '';
  if (!files.length) {
    summary = isAttemptTerminal(v.laneState)
      ? (v.filesLoaded ? 'no changes' : 'reading changes…')
      : 'exploring…';
  } else {
    const bits = [];
    if (neu) bits.push(neu + ' new');
    if (mod) bits.push(mod + ' edited');
    if (del) bits.push(del + ' removed');
    summary = files.length + (files.length > 1 ? ' files' : ' file') + ' · ' + bits.join(', ');
  }
  const reason = threadVariantKeepReason(tv, v);
  if (reason && isAttemptTerminal(v.laneState)) summary += ' · ' + reason;
  tv.diffstatEl.textContent = summary;
  tv.keepBtn.disabled = !tv.attemptSetId;
  tv.keepBtn.textContent = reason ? 'Review attempts' : 'Keep this one';
  tv.keepBtn.title = reason || 'Keep this attempt and return its changes to the workspace';
}

// Stream demux → the in-thread variant turn (calm view: text only).
function threadVariantToken(i, delta) {
  const tv = S.threadVariants;
  const variant = tv?.variants.find(v => v.index === i);
  if (!tv || !variant) return;
  variant.buf += delta;
  if (i === tv.active) {
    tv.bodyEl.innerHTML = mdRender(variant.buf);
    const msgs = $('#session-msgs'); msgs.scrollTop = msgs.scrollHeight;
  }
}
function threadVariantStatus(i, status) {
  const tv = S.threadVariants;
  const variant = tv?.variants.find(v => v.index === i);
  if (!tv || !variant) return;
  variant.laneState = status === 'done' ? 'completed' : (status === 'error' ? 'failed' : status);
  variant.dot.className = 'vt-pill-dot ' + attemptVisualState(variant.laneState);
  syncVariantAccessibility(tv);
  if (i === tv.active) renderVariantFoot();
  if (isAttemptTerminal(variant.laneState)) {
    refreshCompare(tv.sessionId);
    // The socket can settle before the durable attempt-set write becomes
    // visible. Keep one generation-guarded reader alive until results moves
    // the set out of preparing/running, including across transient failures.
    scheduleThreadVariantPoll();
  }
  if (tv.variants.length && tv.variants.every(v => isAttemptTerminal(v.laneState))) {
    if (!tv.settledOpened && S.session.id === tv.sessionId) {
      tv.settledOpened = true;
      openModule('compare');
    }
  }
}

let _tvPoll = null;
let _tvPollGeneration = 0;
let _tvStatusReadId = 0;
function scheduleThreadVariantPoll() {
  stopThreadVariantPoll();
  const generation = _tvPollGeneration;
  const tick = async () => {
    if (generation !== _tvPollGeneration) return;
    const retry = await refreshThreadVariantStatus();
    if (generation !== _tvPollGeneration
        || (!retry && !threadVariantNeedsPoll(S.threadVariants))) return;
    _tvPoll = setTimeout(tick, 3000);
  };
  void tick();
}
function stopThreadVariantPoll() {
  _tvPollGeneration++;
  _tvStatusReadId++;
  if (_tvPoll) clearTimeout(_tvPoll);
  _tvPoll = null;
}

function applyThreadAttemptSet(set) {
  const tv = S.threadVariants;
  if (!tv || !set || tv.sessionId !== set.session_id) return false;
  if (tv.attemptSetId && tv.attemptSetId !== set.id) return false;
  tv.attemptSetId = set.id;
  installAttemptSetOwnership(set.session_id, set.id);
  tv.task = set.task || tv.task;
  tv.instruction = set.instruction || tv.instruction;
  tv.setState = set.state || tv.setState;
  tv.keptIndex = Number.isInteger(set.kept_index) ? set.kept_index : null;
  tv.lanes = (set.lanes || []).map(lane => ({ ...lane }));
  for (const lane of (set.lanes || [])) {
    const variant = tv.variants.find(item => item.index === lane.index);
    if (!variant) continue;
    variant.branch = lane.branch;
    variant.worktree = lane.worktree;
    variant.agent = lane.agent;
    variant.model = lane.model;
    variant.provider = lane.provider;
  }
  syncVariantAccessibility(tv);
  renderVariantFoot();
  return true;
}

function applyThreadVariantResults(results) {
  const tv = S.threadVariants;
  const set = results?.attempt_set;
  if (!tv || !set || !applyThreadAttemptSet(set)) return false;
  tv.results = results;
  const laneStates = Array.isArray(results.lane_states) ? results.lane_states : [];
  const verdicts = Array.isArray(results.verdicts) ? results.verdicts : [];
  const outputs = Array.isArray(results.outputs) ? results.outputs : [];
  for (const variant of tv.variants) {
    const fact = laneStates.find(item => item.index === variant.index);
    if (fact?.state) variant.laneState = fact.state;
    else if (['ready', 'checking', 'verified', 'judged'].includes(set.state)) variant.laneState = 'completed';
    else if (set.state === 'failed') variant.laneState = 'failed';
    else if (set.state === 'discarding') variant.laneState = 'discarding';
    variant.error = fact?.error || null;
    variant.verdict = verdicts.find(item => item.index === variant.index) || null;
    const output = outputs.find(item => item.index === variant.index);
    if (typeof output?.content === 'string') variant.buf = output.content;
    variant.dot.className = 'vt-pill-dot ' + attemptVisualState(variant.laneState);
  }
  syncVariantAccessibility(tv);
  syncAttemptRailFromThread(tv);
  setActiveVariant(tv.active);
  const settled = tv.variants.length && tv.variants.every(v => isAttemptTerminal(v.laneState));
  if (settled && !threadVariantNeedsPoll(tv)) {
    stopThreadVariantPoll();
    refreshCompare(tv.sessionId);
    if (!tv.settledOpened && S.session.id === tv.sessionId) {
      tv.settledOpened = true;
      openModule('compare');
    }
  }
  return true;
}

async function refreshThreadVariantStatus() {
  const readId = ++_tvStatusReadId;
  const tv = S.threadVariants;
  if (!tv?.attemptSetId || S.session.id !== tv.sessionId) return;
  const sessionId = tv.sessionId;
  const setId = tv.attemptSetId;
  const base = '/api/sessions/' + encodeURIComponent(sessionId) + '/variants';
  // Results is the lifecycle authority. Read it first so a set that entered
  // Discard cleanup never triggers a status call into disappearing sandboxes.
  const resultsRead = await Promise.allSettled([attemptJson(base + '/results')]);
  if (readId !== _tvStatusReadId || S.threadVariants !== tv
      || S.session.id !== sessionId || tv.attemptSetId !== setId) return;
  if (resultsRead[0].status !== 'fulfilled') {
    renderVariantFoot();
    return true;
  }
  const results = resultsRead[0].value || {};
  if (!results.attempt_set) {
    const resolvedState = tv.setState;
    const keptIndex = tv.keptIndex;
    clearThreadVariantSummary(sessionId, setId);
    clearAttemptRailForSet(sessionId, setId);
    await reloadSessionTranscript(sessionId);
    refreshFileTree();
    void refreshGitPane();
    if (S.session.id === sessionId) {
      if (ATTEMPT_KEEP_RECOVERY_STATES.has(resolvedState)) {
        setCockpitLive('done', 'done');
        $('#cockpit-status').textContent = Number.isInteger(keptIndex)
          ? `kept attempt ${keptIndex + 1}` : 'attempt kept';
      } else if (resolvedState === 'discarding') {
        setCockpitLive('idle', 'idle');
        $('#cockpit-status').textContent = 'finished without keeping';
      }
    }
    refreshCompare(sessionId);
    refreshAttempts(sessionId);
    return;
  }
  if (results.attempt_set.id !== setId) {
    restoreThreadVariantResults(sessionId, results);
    return;
  }
  const setState = results.attempt_set.state;
  const keepRecovery = ATTEMPT_KEEP_RECOVERY_STATES.has(setState);
  if (!['checking', 'discarding'].includes(setState) && !keepRecovery) {
    const statusUrl = base + '/status?attempt_set_id=' + encodeURIComponent(setId);
    const statusRead = await Promise.allSettled([attemptJson(statusUrl)]);
    if (readId !== _tvStatusReadId || S.threadVariants !== tv
        || S.session.id !== sessionId || tv.attemptSetId !== setId) return;
    if (statusRead[0].status === 'fulfilled' && Array.isArray(statusRead[0].value)) {
      statusRead[0].value.forEach(vs => {
        const variant = tv.variants.find(item => item.index === vs.index); if (!variant) return;
        variant.files = (vs.status && vs.status.files) || [];
        variant.filesLoaded = true;
        variant.stat.textContent = variant.files.length ? ('· ' + variant.files.length) : '';
      });
      syncVariantAccessibility(tv);
    }
  }
  applyThreadVariantResults(results);
  renderVariantFoot();
}

function restoreThreadVariantResults(sessionId, results) {
  if (!sessionId || S.session.id !== sessionId) return false;
  const set = results?.attempt_set;
  if (!set || set.session_id !== sessionId || !Array.isArray(set.lanes) || !set.lanes.length) {
    return false;
  }
  if (S.threadVariants) clearThreadVariantSummary(sessionId, null);
  buildVariantTurn(set.lanes, {
    sessionId,
    attemptSetId: set.id,
    task: set.task,
    instruction: set.instruction,
    setState: set.state,
    keptIndex: set.kept_index,
  });
  applyThreadVariantResults(results);
  openModule('compare');
  refreshCompare(sessionId);
  refreshAttempts(sessionId);
  if (threadVariantNeedsPoll(S.threadVariants)) scheduleThreadVariantPoll();
  else if (set.state !== 'discarding') void refreshThreadVariantStatus();
  return true;
}

let _tvRestoreTimer = null;
let _tvRestoreReadId = 0;
let _attemptDecisionRecoveryId = 0;

function reconcileUncertainAttemptDecision(sessionId, attemptSetId) {
  const recoveryId = ++_attemptDecisionRecoveryId;
  const read = () => {
    if (recoveryId !== _attemptDecisionRecoveryId || S.session.id !== sessionId) return;
    const currentSetId = S.threadVariants?.sessionId === sessionId
      ? S.threadVariants.attemptSetId : null;
    // Success may already have been observed by an earlier read. It may also
    // have made room for a newer set; never let this old response inspect or
    // clear that replacement.
    if (!currentSetId || (attemptSetId && currentSetId !== attemptSetId)) return;
    S.session.attemptRestorePending = true;
    void restoreThreadVariants(sessionId);
    scheduleThreadVariantRestore(sessionId);
  };
  read();
  // A connection can fail before the server task that received the request
  // reaches its first durable transition. Recheck past that window instead of
  // treating one still-ready read as proof that Keep/Discard never happened.
  setTimeout(read, 1000);
  setTimeout(read, 3000);
}

function stopThreadVariantRestore() {
  _tvRestoreReadId++;
  if (_tvRestoreTimer) clearTimeout(_tvRestoreTimer);
  _tvRestoreTimer = null;
}

function scheduleThreadVariantRestore(sessionId) {
  if (!sessionId || S.session.id !== sessionId || !S.session.attemptRestorePending) return;
  if (_tvRestoreTimer) clearTimeout(_tvRestoreTimer);
  const generation = _tvRestoreReadId;
  _tvRestoreTimer = setTimeout(() => {
    _tvRestoreTimer = null;
    if (generation !== _tvRestoreReadId || S.session.id !== sessionId) return;
    void restoreThreadVariants(sessionId);
  }, 3000);
}

async function restoreThreadVariants(sessionId) {
  if (!sessionId || S.session.id !== sessionId) return;
  if (!S.session.attemptStartRecovery && _attemptStartRecoveries.has(sessionId)) {
    S.session.attemptStartRecovery = _attemptStartRecoveries.get(sessionId);
  }
  if (_tvRestoreTimer) clearTimeout(_tvRestoreTimer);
  _tvRestoreTimer = null;
  const restoreId = ++_tvRestoreReadId;
  scheduleThreadVariantRestore(sessionId);
  const url = '/api/sessions/' + encodeURIComponent(sessionId) + '/variants/results';
  try {
    const results = await attemptJson(url);
    if (restoreId !== _tvRestoreReadId || S.session.id !== sessionId) return;
    const set = results?.attempt_set;
    const recovery = S.session.attemptStartRecovery || null;
    if (!set || !Array.isArray(set.lanes) || !set.lanes.length) {
      if (recovery?.requestPending) {
        S.session.attemptRestorePending = true;
        scheduleThreadVariantRestore(sessionId);
        return;
      }
      if (recovery && !recovery.confirmedSetId) rollbackFailedVariantStart(sessionId, recovery);
      clearThreadVariantSummary(sessionId, null);
      clearAttemptRailForSet(sessionId, null);
      // A completed Keep appends the chosen outcome to the durable transcript,
      // while both decisions can change files and git state. Results being
      // empty is the authoritative completion signal, including after a lost
      // HTTP response, so restore every visible product surface here.
      await reloadSessionTranscript(sessionId);
      if (restoreId !== _tvRestoreReadId || S.session.id !== sessionId) return;
      refreshFileTree();
      void refreshGitPane();
      refreshCompare(sessionId);
      refreshAttempts(sessionId);
    } else {
      const optimistic = recovery?.optimistic;
      const recoveredStart = Boolean(recovery && (
        recovery.confirmedSetId === set.id
        || (recovery.task === set.task && recovery.input === set.instruction)
        || (optimistic?.task === set.task && optimistic?.instruction === set.instruction)
      ));
      if (recovery && !recoveredStart) rollbackFailedVariantStart(sessionId, recovery);
      if (recoveredStart && recovery.pendingTurn?.userEl
          && !recovery.pendingTurn.userEl.isConnected) {
        appendSessionEl(recovery.pendingTurn.userEl);
      }
      if (!restoreThreadVariantResults(sessionId, results)) {
        throw new Error('The daemon returned attempts for a different session.');
      }
      if (recoveredStart) {
        S.session.attemptPlan = null;
        syncAttemptsDraft();
        if (recovery.message) {
          toast('Attempts recovered', 'The daemon started them before the response was interrupted.', 'info');
        }
      }
    }
    if (_tvRestoreTimer) clearTimeout(_tvRestoreTimer);
    _tvRestoreTimer = null;
    S.session.attemptRestorePending = false;
    S.session.attemptRestoreError = null;
    S.session.attemptStartRecovery = null;
    _attemptStartRecoveries.delete(sessionId);
  } catch (error) {
    if (restoreId !== _tvRestoreReadId || S.session.id !== sessionId) return;
    const message = String(error?.message || error);
    // A failed read proves neither that the session is clear nor which set it
    // owns. Keep Send gated and retry until durable results answer that.
    S.session.attemptRestorePending = true;
    if (S.session.attemptRestoreError !== message) {
      S.session.attemptRestoreError = message;
      toast('Could not restore attempts', message + ' Retrying…', 'err');
    }
    scheduleThreadVariantRestore(sessionId);
  }
}

async function keepActiveVariant() {
  const tv = S.threadVariants; if (!tv) return;
  const i = tv.active;
  const variant = tv.variants.find(v => v.index === i); if (!variant) return;
  const reason = threadVariantKeepReason(tv, variant);
  if (reason) {
    openModule('compare');
    refreshCompare(tv.sessionId);
    toast('Review before keeping', reason, 'info');
    return;
  }
  const ok = await axoConfirm({
    title: 'Keep this one?',
    body: 'Use attempt ' + (i + 1) + ' and set the others aside.',
    okLabel: 'Keep', okKind: 'primary',
  });
  if (!ok) return;
  tv.keepBtn.disabled = true;
  tv.keepPending = true;
  scheduleThreadVariantPoll();
  try {
    const result = await attemptJson('/api/sessions/' + encodeURIComponent(tv.sessionId) + '/variants/adopt', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ attempt_set_id: tv.attemptSetId, index: i }),
    });
    await finishAttemptDecision('keep', {
      session: tv.sessionId,
      attempt_set_id: tv.attemptSetId,
      index: i,
      attempt: { ...variant },
      result,
    });
  } catch (error) {
    reconcileUncertainAttemptDecision(tv.sessionId, tv.attemptSetId);
    openModule('compare');
    refreshCompare(tv.sessionId);
    toast('Keep failed', String(error?.message || error) + ' Open Attempts to review Checks and retry.', 'err');
    if (S.threadVariants === tv) renderVariantFoot();
  } finally {
    tv.keepPending = false;
  }
}

function collapseVariantTurn(i) {
  const tv = S.threadVariants; if (!tv) return;
  const v = tv.variants.find(variant => variant.index === i); if (!v) return;
  tv.pillsEl.remove();
  tv.footEl.remove();
  tv.bodyEl.innerHTML = mdRender(v.buf || '');
  tv.wrap.appendChild(el('div', 'vt-trace small muted', 'kept attempt ' + (i + 1) + ' of ' + tv.variants.length));
  if (window.hljs) tv.wrap.querySelectorAll('pre code').forEach(c => { try { window.hljs.highlightElement(c); } catch {} });
  S.threadVariants = null;
}

function clearThreadVariantSummary(sessionId, attemptSetId) {
  const tv = S.threadVariants;
  if (!tv || tv.sessionId !== sessionId) return false;
  if (attemptSetId && tv.attemptSetId !== attemptSetId) return false;
  stopThreadVariantPoll();
  tv.wrap?.remove();
  S.threadVariants = null;
  return true;
}

async function finishAttemptDecision(kind, detail) {
  const sessionId = detail?.session;
  const setId = detail?.attempt_set_id;
  if (!sessionId || !setId) return;

  const knownRailSet = _attemptSetIds.get(sessionId);
  const conflictsWithRail = Boolean(knownRailSet && knownRailSet !== setId);
  const matchesThread = S.threadVariants?.sessionId === sessionId
    && S.threadVariants?.attemptSetId === setId;
  const conflictsWithThread = S.threadVariants?.sessionId === sessionId
    && S.threadVariants?.attemptSetId && S.threadVariants.attemptSetId !== setId;
  clearAttemptRailForSet(sessionId, setId);
  if (matchesThread && kind === 'keep') collapseVariantTurn(detail.index);
  else if (matchesThread) clearThreadVariantSummary(sessionId, setId);

  if (S.session.id !== sessionId) return;
  // A late event from an older set may report a real daemon decision, but it
  // must not stop, relabel, or reload over a newer set already shown here.
  if (conflictsWithRail || conflictsWithThread) {
    refreshCompare(sessionId);
    refreshAttempts(sessionId);
    return;
  }
  if (matchesThread) stopThreadVariantPoll();
  await reloadSessionTranscript(sessionId);
  refreshFileTree();
  void refreshGitPane();
  refreshCompare(sessionId);
  refreshAttempts(sessionId);
  if (kind === 'keep') {
    setCockpitLive('done', 'done');
    $('#cockpit-status').textContent = 'kept attempt ' + (detail.index + 1);
    toast('Kept this one', 'Its changes are back in the workspace for review and commit.', 'ok');
  } else {
    setCockpitLive('idle', 'idle');
    $('#cockpit-status').textContent = 'finished without keeping';
    toast('Finished without keeping', 'No attempt changes were kept.', 'info');
  }
}

// ── Change cards: the agent's edits, as a card in the conversation ───────
// After a turn that touched files, a calm card lands in the thread. Tap a
// file to open its diff inline — the diff lives in the flow, not in a pane.
const CC_BADGE = { modified: 'M', added: 'A', untracked: 'A', deleted: 'D', renamed: 'R' };

async function appendChangeCard() {
  if (!S.session.id) return;
  let st;
  try { st = await fetch('/api/sessions/' + encodeURIComponent(S.session.id) + '/git/status').then(r => r.json()); }
  catch { return; }
  const files = (st && st.files) || [];
  if (!files.length) return;
  const card = el('div', 'smsg change-card');
  const head = el('div', 'cc-head');
  head.append(
    el('span', 'cc-icon', '◆'),
    el('span', 'cc-title', 'Changed ' + files.length + (files.length > 1 ? ' files' : ' file')),
  );
  card.appendChild(head);

async function toggleCardDiff(card, path, chip) {
  const host = card.querySelector('.cc-diff');
  // Toggle off if already showing this file.
  if (chip.classList.contains('open')) {
    chip.classList.remove('open');
    host.classList.add('hide'); host.innerHTML = '';
    return;
  }
  card.querySelectorAll('.cc-file.open').forEach(c => c.classList.remove('open'));
  chip.classList.add('open');
  host.classList.remove('hide');
  host.innerHTML = '<div class="muted small" style="padding:6px 2px;">Loading diff…</div>';
  let d;
  try { d = await fetch('/api/sessions/' + encodeURIComponent(S.session.id) + '/git/diff?path=' + encodeURIComponent(path)).then(r => r.json()); }
  catch { host.innerHTML = '<div class="muted small">Diff unavailable.</div>'; return; }
  if (!d || d.error) { host.innerHTML = '<div class="muted small">Diff unavailable.</div>'; return; }
  if (d.binary || d.too_large) {
    host.innerHTML = '<div class="muted small" style="padding:6px 2px;">' + (d.binary ? 'Binary file.' : 'File too large to preview.') + '</div>';
    return;
  }
  host.innerHTML = '';
  host.appendChild(renderInlineDiff(d.old || '', d.new || ''));
}

// A calm prefix/suffix line diff — light, no Monaco. Good for the contiguous
// edits agents usually make; collapses long unchanged runs.
function renderInlineDiff(oldText, newText) {
  const a = oldText.length ? oldText.split('\n') : [];
  const b = newText.length ? newText.split('\n') : [];
  let s = 0; while (s < a.length && s < b.length && a[s] === b[s]) s++;
  let ea = a.length, eb = b.length;
  while (ea > s && eb > s && a[ea - 1] === b[eb - 1]) { ea--; eb--; }
  const rows = [];
  const ctx = 2;
  const pushCtx = (arr, from, to) => {
    for (let i = from; i < to; i++) rows.push({ t: ' ', l: arr[i] });
  };
  // leading context (last `ctx` unchanged lines before the change)
  pushCtx(a, Math.max(0, s - ctx), s);
  for (let i = s; i < ea; i++) rows.push({ t: '-', l: a[i] });
  for (let i = s; i < eb; i++) rows.push({ t: '+', l: b[i] });
  // trailing context
  pushCtx(a, ea, Math.min(a.length, ea + ctx));
  const pre = el('div', 'inline-diff');
  rows.slice(0, 80).forEach(r => {
    const line = el('div', 'idiff-line idiff-' + (r.t === '+' ? 'add' : r.t === '-' ? 'del' : 'ctx'));
    line.append(el('span', 'idiff-gutter', r.t === ' ' ? '' : r.t), el('span', 'idiff-text', r.l || ' '));
    pre.appendChild(line);
  });
  if (rows.length > 80) pre.appendChild(el('div', 'idiff-more muted small', '… ' + (rows.length - 80) + ' more lines'));
  return pre;
}

function ensureRefs() {
  if (!S.session.refs) S.session.refs = [];
  return S.session.refs;
}

function addRef(ref) {
  ensureRefs().push(ref);
  renderChatRefs();
}

function removeRef(i) {
  const r = ensureRefs();
  r.splice(i, 1);
  renderChatRefs();
}

function renderChatRefs() {
  const host = $('#chat-refs'); if (!host) return;
  host.innerHTML = '';
  const refs = ensureRefs();
  refs.forEach((r, i) => {
    const chip = el('span', 'chat-ref');
    chip.title = r.preview || '';
    chip.appendChild(el('span', 'chip-icon', r.kind === 'dom' ? '🎯' : '⌖'));
    const label =
      r.kind === 'code' ? `${r.path}:${r.startLine}${r.endLine !== r.startLine ? '-' + r.endLine : ''}` :
      r.kind === 'dom'  ? (r.selector || '(element)') :
      '(reference)';
    chip.appendChild(el('span', 'chip-text', label));
    const x = el('span', 'chip-x', '×');
    x.addEventListener('click', () => removeRef(i));
    chip.appendChild(x);
    host.appendChild(chip);
  });
}

function buildRefsContext(refs) {
  const lines = ['## Context the user attached:'];
  refs.forEach(r => {
    if (r.kind === 'code') {
      const range = r.endLine !== r.startLine ? `${r.startLine}-${r.endLine}` : `${r.startLine}`;
      lines.push(`\n### File: \`${r.path}\` (lines ${range})`);
      lines.push('```' + (r.lang || ''));
      lines.push(r.text);
      lines.push('```');
    } else if (r.kind === 'dom') {
      lines.push(`\n### DOM element on ${r.url || '(unknown)'}`);
      if (r.selector) lines.push(`Selector: \`${r.selector}\``);
      if (r.html) {
        lines.push('```html');
        lines.push(r.html);
        lines.push('```');
      }
    }
  });
  lines.push('');
  return lines.join('\n');
}

/**
 * The "+ Add to chat" bubble over an editor selection.
 *
 * Selecting code in order to talk about it is a conversation act, so the shell
 * owns this: the editor only reports that a selection exists and where it is.
 */
let _selBubble = null;
let _selDetail = null;

function showSelBubbleFor(detail) {
  hideSelBubble();
  if (!detail.at) return;
  _selDetail = detail;
  const b = document.createElement('div');
  b.className = 'sel-bubble';
  b.textContent = '+ Add to chat';
  b.style.left = Math.max(8, detail.at.x) + 'px';
  b.style.top = Math.max(8, detail.at.y) + 'px';
  // Mousedown would move focus out of the editor and collapse the very
  // selection the click is about.
  b.addEventListener('mousedown', (e) => { e.preventDefault(); e.stopPropagation(); });
  b.addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation();
    addSelectionAsRef();
  });
  document.body.appendChild(b);
  _selBubble = b;
}

function hideSelBubble() {
  if (_selBubble) { _selBubble.remove(); _selBubble = null; }
  _selDetail = null;
}

function addSelectionAsRef() {
  const d = _selDetail;
  if (!d || !d.text || !d.text.trim()) return;
  addRef({
    kind: 'code',
    path: d.path,
    lang: d.lang || '',
    startLine: d.startLine,
    endLine: d.endLine,
    text: d.text,
    preview: d.text.length > 200 ? d.text.slice(0, 200) + '…' : d.text,
  });
  toast('Reference added', d.path + ':' + d.startLine, 'ok');
  hideSelBubble();
}

function sessionActiveAgentIds(session) {
  if (!session || !session.mode) return [];
  if (session.mode.kind === 'single_agent') return [session.mode.agent_id];
  if (session.mode.kind === 'custom' && Array.isArray(session.mode.agents)) {

  return [];
}

let _sessionModelPickerReadId = 0;

function sessionModelOverrideAgentId(session) {

  if (ids.length === 1) return ids[0];

  const selected = target && !target.classList.contains('hide') ? target.value : null;

// Populate the per-turn model picker for one resolved agent. Model names are
// provider-scoped, so a multi-agent "all" turn deliberately has no override:
// every agent keeps its own configured provider/model until the user targets
// one specific agent.
async function populateSessionModelPicker(session) {
  const sel = $('#session-model'); if (!sel) return;
  const readId = ++_sessionModelPickerReadId;
  const sessionId = session?.id;
  if (!sessionId || S.session.id !== sessionId) return;
  const agentId = sessionModelOverrideAgentId(session);
  sel.innerHTML = '';
  if (!agentId) {
    sel.classList.add('hide');
    return;
  }
  sel.classList.remove('hide');
  const agent = (S.agents || []).find(item => item.id === agentId) || { id: agentId };
  const defaultModel = agent.model || '';
  const opt0 = document.createElement('option');
  opt0.value = '__default__';
  opt0.textContent = defaultModel
    ? `model · ${defaultModel} · default`
    : `model · ${agentId} default`;
  sel.appendChild(opt0);
  sel.value = '__default__';
  // The endpoint resolves the selected agent's provider and returns only that
  // provider's model names. It intentionally does not return a global catalog.
  try {
    const response = await fetch('/api/llm/models?agent=' + encodeURIComponent(agentId));
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      throw new Error(body.error || ('HTTP ' + response.status));
    }
    const data = await response.json();
    if (!Array.isArray(data)) throw new Error('The model endpoint returned an invalid list.');
    if (readId !== _sessionModelPickerReadId || S.session.id !== sessionId
        || sessionModelOverrideAgentId(S.session) !== agentId) return;
    const seen = new Set(defaultModel ? [defaultModel] : []);
    data.forEach(model => {
      if (!model || seen.has(model)) return;
      seen.add(model);
      const opt = document.createElement('option');
      opt.value = model;
      opt.textContent = agent.provider ? `${model} · ${agent.provider}` : model;
      sel.appendChild(opt);
    });
  } catch (error) {
    if (readId !== _sessionModelPickerReadId || S.session.id !== sessionId) return;
    // The configured default remains usable. Do not turn a discovery failure
    // into a false cross-provider list or block the session turn.
    opt0.textContent += ' · choices unavailable';
    sel.title = `Could not load ${agentId} model choices: ${error.message || error}`;
  }
}

// Populate the agent-target picker.  Hidden when the session has 0 or 1

function populateSessionAgentTarget(session) {
  const sel = $('#session-target'); if (!sel) return;
  const ids = sessionActiveAgentIds(session);
  sel.innerHTML = '';
  if (ids.length <= 1) {
    sel.classList.add('hide');
    sel.innerHTML = '';

  }
  sel.classList.remove('hide');
  const opt0 = document.createElement('option');
  opt0.value = '__all__';
  opt0.textContent = 'send to · all · agent defaults';
  sel.appendChild(opt0);
  ids.forEach(aid => {
    const opt = document.createElement('option');
    opt.value = aid; opt.textContent = 'send to · ' + aid;
    sel.appendChild(opt);
  });
  sel.value = '__all__';
}

// MCP approval state and rendering live in `<ax-mcp-approval>`; this adapter
// keeps WebSocket frame handling readable while the component owns its queue.
function withMcpApproval(action) {
  const component = $('#mcp-approval');
  if (component && typeof component.enqueue === 'function') {
    action(component);
    return;
  }
  // The component is imported by a deferred module in the document head. In
  // the unlikely event a fast local WebSocket wins that race, preserve frame
  // order and apply it as soon as the existing element is upgraded.
  customElements.whenDefined('ax-mcp-approval').then(() => {
    const upgraded = $('#mcp-approval');
    if (upgraded) action(upgraded);
  });
}

function enqueueMcpApproval(frame) {
  withMcpApproval(component => component.enqueue(frame));
}

function dismissMcpApproval(approvalId) {
  withMcpApproval(component => component.resolveExternally(approvalId));
}

function reconcileMcpApprovals(frames) {
  withMcpApproval(component => component.reconcile(Array.isArray(frames) ? frames : []));
}

/**
 * Everything you can reach by typing.
 *
 * The palette follows the one-app hierarchy: session modules and Settings,
 * with the same shortcuts printed beside each module as the launcher shows.
 */
function paletteItems() {
  const items = [];

  // Sessions first: the thing you are most often looking for is other work.
  for (const s of (S.sessions || [])) {
    if (s.status === 'closed') continue;
    items.push({
      kind: 'session',
      label: s.name || (s.working_dir || '').split('/').pop() || s.id,
      sub: s.working_dir || '',
      action: () => openCockpit(s),
    });
  }

  // Modules, only while a session is open — there is nothing to open them onto
  // otherwise, and offering them would be offering a dead end.
  if (S.session && S.session.id) {
    for (const m of PALETTE_MODULES) {
      items.push({
        kind: 'module',
        label: m.title,
        sub: `⌘${m.key.toUpperCase()}`,
        action: () => openModule(m.id),
      });
    }
  }

  for (const sec of PALETTE_SETTINGS) {
    items.push({
      kind: 'settings',
      label: sec.title,
      sub: 'Settings',
      action: () => $('#settings')?.show(sec.id),
    });
  }

  items.push({ kind: 'session', label: 'New session', sub: 'Choose a folder',
               action: () => { closeCockpit(); sessionHome()?.newSession?.(); } });
  items.push({ kind: 'session', label: 'All sessions', sub: 'Browse',
               action: () => closeCockpit() });

  // Automations, agents and skills stay reachable by name — they are things you
  // fire mid-thought, which is exactly what a palette is for.
  (S.automations || []).forEach(a => items.push({
    kind: 'automation', label: a.name || a.id, sub: 'Run now',
    action: () => {
      $('#settings')?.show?.('automations');
      queueMicrotask(() => { void $('#settings-automations')?.run?.(a.id); });
    },
  }));
  (S.agents || []).forEach(a => items.push({
    kind: 'agent', label: a.id, sub: 'Restart',
    action: () => { void $('#settings-agents')?.restartAgent?.(a.id); },
  }));
  (S.skills || []).forEach(g => items.push({
    kind: 'skill', label: g.name, sub: 'Fire',
    action: () => { void $('#settings-skills')?.fire?.(g.id); },
  }));

  return items;
}

function renderPalette(query) {
  const list = $('#palette-list'); list.innerHTML = '';
  const q = query.trim().toLowerCase();
  const matches = paletteItems().filter(i => {
    if (!q) return true;
    return i.label.toLowerCase().includes(q)
      || i.kind.toLowerCase().includes(q)
      || (i.sub || '').toLowerCase().includes(q);
  });
  if (!matches.length) {
    list.appendChild(el('div', 'palette-empty', `Nothing matches “${query.trim()}”`));
    return;
  }
  matches.slice(0, 50).forEach((it, i) => {
    const row = el('div', 'palette-item' + (i === 0 ? ' sel' : ''));
    row.appendChild(el('span', 'kind', it.kind));
    row.appendChild(el('span', 'nm', it.label));
    row.appendChild(el('span', 'sub', it.sub));
    row.addEventListener('click', () => { it.action(); closePalette(); });
    list.appendChild(row);
  });
}
$('#palette-input').addEventListener('input', e => renderPalette(e.target.value));
$('#palette-input').addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePalette(); return; }
  const items = $$('.palette-item'); if (!items.length) return;
  let sel = items.findIndex(x => x.classList.contains('sel')); if (sel < 0) sel = 0;
  if (e.key === 'ArrowDown') { e.preventDefault(); items[sel].classList.remove('sel'); sel = (sel + 1) % items.length; items[sel].classList.add('sel'); items[sel].scrollIntoView({ block: 'nearest' }); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); items[sel].classList.remove('sel'); sel = (sel - 1 + items.length) % items.length; items[sel].classList.add('sel'); items[sel].scrollIntoView({ block: 'nearest' }); }
  else if (e.key === 'Enter') { e.preventDefault(); items[sel].click(); }
});
