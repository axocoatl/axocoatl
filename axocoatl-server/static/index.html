// Keep exactly `n` resizer handles in the grid (create + wire as needed).
// Resizers are positioned by inline grid-column in applyCockpitLayout, so
// DOM order among grid children doesn't matter.
function ensureResizerPool(n) {
  const grid = document.querySelector('.cockpit-grid');
  if (!grid) return;
  let pool = grid.querySelectorAll('.col-resizer');
  for (let i = pool.length; i < n; i++) {
    const h = document.createElement('div');
    h.className = 'col-resizer';
    h.tabIndex = 0;
    h.setAttribute('role', 'separator');
    h.setAttribute('aria-orientation', 'vertical');
    attachColResizer(h);
    grid.appendChild(h);
  }
}

// ── Terminals bottom dock ─────────────────────────────────────────
// Independent of the cockpit-grid: a thin strip of terminal names when
// closed, a configurable-height dock when open. The grid reserves the
// strip's space via `margin-bottom: var(--term-rail-w)` so opening the
// dock overlays only the bottom edge of the panes — never shifts them.
const TERM_RAIL_W      = 32;
const TERM_DRAWER_MIN  = 160;
const TERM_DRAWER_MAX  = 800;
const TERM_INNER_MIN   = 80;
const TERM_STAGE_MIN   = 220;

function terminalDrawerMax() {
  const shell = document.getElementById('cockpit-shell');
  return Math.min(TERM_DRAWER_MAX,
    Math.max(TERM_DRAWER_MIN, (shell?.clientHeight || (TERM_DRAWER_MAX + TERM_STAGE_MIN)) - TERM_STAGE_MIN));
}

function applyTerminalsDrawer() {
  const drawer = document.getElementById('cockpit-terminals');
  const shell  = document.getElementById('cockpit-shell');
  if (!drawer || !shell) return;
  const L = S.cockpitLayout;
  // Reserve the closed rail's height beneath the grid.
  shell.style.setProperty('--term-rail-w', TERM_RAIL_W + 'px');
  const maxDrawer = terminalDrawerMax();
  const drawerHeight = Math.max(TERM_DRAWER_MIN, Math.min(maxDrawer, L.termOpenW || 320));
  shell.style.setProperty('--term-open-w', drawerHeight + 'px');
  const open = Boolean(L.termOpen);
  drawer.classList.toggle('is-open', open);
  const outerResizer = document.getElementById('term-drawer-outer-resizer');
  outerResizer?.setAttribute('aria-valuemin', String(TERM_DRAWER_MIN));
  outerResizer?.setAttribute('aria-valuemax', String(Math.round(maxDrawer)));
  outerResizer?.setAttribute('aria-valuenow', String(Math.round(drawerHeight)));
  document.getElementById('term-rail-toggle')?.setAttribute('aria-expanded', String(open));
  syncSessionViewNav();
  // Inner split: list width is exact, output flexes.
  const list = document.getElementById('terminals-list');
  if (list) list.style.width = (L.termInnerListW || 140) + 'px';
  const innerResizer = document.getElementById('terminals-inner-resizer');
  const innerMax = Math.max(TERM_INNER_MIN + 80, drawer.getBoundingClientRect().width - 80);
  innerResizer?.setAttribute('aria-valuemin', String(TERM_INNER_MIN));
  innerResizer?.setAttribute('aria-valuemax', String(Math.round(innerMax)));
  innerResizer?.setAttribute('aria-valuenow', String(Math.round(L.termInnerListW || 140)));
  renderTermRailList();
}

function renderTermRailList() {
  const rail = document.getElementById('term-rail-list');
  if (!rail) return;
  rail.innerHTML = '';
  const tasks = (S.session && S.session.tasks) || [];
  if (tasks.length === 0) return;
  const activeId = S.session && S.session.activeTerminalId;
  // Newest first, matching the open-drawer list order.
  tasks.slice().reverse().forEach(t => {
    const active = t.id === activeId;
    const row = el('button', 'term-rail-row' + (active ? ' active' : ''));
    row.type = 'button';
    row.setAttribute('aria-pressed', String(active));
    const dot = el('span', 'term-dot ' + (typeof termStatusClass === 'function' ? termStatusClass(t.status) : (t.status || 'running')));
    const label = (typeof termShortLabel === 'function' ? termShortLabel(t.command) : (t.command || 'terminal'));
    row.append(dot, document.createTextNode(label));
    row.title = (t.command || '') + '\n' + (t.status || '');
    row.addEventListener('click', () => {
      S.session.activeTerminalId = t.id;
      S.cockpitLayout.termOpen = true;
      applyCockpitLayout();
      syncLauncherState();
      if (typeof renderTerminals === 'function') renderTerminals();
    });
    rail.appendChild(row);
  });
}

function toggleTerminalsDrawer(open) {
  const L = S.cockpitLayout;
  L.termOpen = (typeof open === 'boolean') ? open : !L.termOpen;
  applyCockpitLayout();
  syncLauncherState();
}

function openSessionTerminal(expectedSessionId = S.session.id) {
  if (!expectedSessionId || expectedSessionId !== S.session.id) return;
  if (presentSessionRuntimeGate('Terminal')) return;
  toggleTerminalsDrawer(true);
  renderTerminals();
  requestAnimationFrame(() => {
    const active = S.session.activeTerminalId;
    const terminal = active ? S.xterms?.get?.(active) : null;
    if (terminal?.focus) terminal.focus();
    else $('#term-new-btn')?.focus();
  });
}

function attachTermDrawerOuterResizer() {
  const h = document.getElementById('term-drawer-outer-resizer');
  if (!h) return;
  h.addEventListener('keydown', (event) => {
    if (!S.cockpitLayout.termOpen || !['ArrowUp', 'ArrowDown', 'Home', 'End'].includes(event.key)) return;
    event.preventDefault();
    const step = event.shiftKey ? 48 : 16;
    const max = terminalDrawerMax();
    const current = Math.min(max, S.cockpitLayout.termOpenW || 320);
    S.cockpitLayout.termOpenW = event.key === 'Home' ? TERM_DRAWER_MIN
      : event.key === 'End' ? max
      : Math.max(TERM_DRAWER_MIN, Math.min(max,
        current + (event.key === 'ArrowUp' ? step : -step)));
    applyCockpitLayout();
  });
  h.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    if (!S.cockpitLayout.termOpen) return;
    e.preventDefault();
    try { h.setPointerCapture(e.pointerId); } catch {}
    h.classList.add('dragging');
    document.body.classList.add('axo-resizing');
    const startY = e.clientY;
    const max = terminalDrawerMax();
    const startW = Math.min(max, S.cockpitLayout.termOpenW);
    const onMove = (ev) => {
      const dy = startY - ev.clientY; // drag UP grows, as a bottom dock does
      const w  = Math.max(TERM_DRAWER_MIN, Math.min(max, startW + dy));
      S.cockpitLayout.termOpenW = w;
      applyCockpitLayout();
    };
    const onEnd = () => {
      h.classList.remove('dragging');
      document.body.classList.remove('axo-resizing');
      try { h.releasePointerCapture(e.pointerId); } catch {}
      h.removeEventListener('pointermove', onMove);
      h.removeEventListener('pointerup', onEnd);
      h.removeEventListener('pointercancel', onEnd);
    };
    h.addEventListener('pointermove', onMove);
    h.addEventListener('pointerup', onEnd);
    h.addEventListener('pointercancel', onEnd);
  });
}

function attachTermInnerResizer() {
  const h = document.getElementById('terminals-inner-resizer');
  if (!h) return;
  h.addEventListener('keydown', (event) => {
    if (!['ArrowLeft', 'ArrowRight', 'Home'].includes(event.key)) return;
    event.preventDefault();
    const drawer = document.getElementById('cockpit-terminals');
    const max = Math.max(TERM_INNER_MIN + 80,
      (drawer ? drawer.getBoundingClientRect().width : 800) - 80);
    const current = S.cockpitLayout.termInnerListW || 140;
    const step = event.shiftKey ? 48 : 16;
    S.cockpitLayout.termInnerListW = event.key === 'Home' ? TERM_INNER_MIN
      : Math.max(TERM_INNER_MIN, Math.min(max,
        current + (event.key === 'ArrowRight' ? step : -step)));
    applyCockpitLayout();
  });
  h.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    try { h.setPointerCapture(e.pointerId); } catch {}
    h.classList.add('dragging');
    document.body.classList.add('axo-resizing');
    const startX = e.clientX;
    const startW = S.cockpitLayout.termInnerListW;
    const drawer = document.getElementById('cockpit-terminals');
    const max = Math.max(TERM_INNER_MIN + 80,
      (drawer ? drawer.getBoundingClientRect().width : 800) - 80);
    const onMove = (ev) => {
      const dx = ev.clientX - startX;
      S.cockpitLayout.termInnerListW = Math.max(TERM_INNER_MIN, Math.min(max, startW + dx));
      applyCockpitLayout();
    };
    const onEnd = () => {
      h.classList.remove('dragging');
      document.body.classList.remove('axo-resizing');
      try { h.releasePointerCapture(e.pointerId); } catch {}
      h.removeEventListener('pointermove', onMove);
      h.removeEventListener('pointerup', onEnd);
      h.removeEventListener('pointercancel', onEnd);
    };
    h.addEventListener('pointermove', onMove);
    h.addEventListener('pointerup', onEnd);
    h.addEventListener('pointercancel', onEnd);
  });
}

function attachTermDrawerToggle() {
  const t = document.getElementById('term-rail-toggle');
  const c = document.getElementById('term-drawer-close-btn');
  const nRail = document.getElementById('term-rail-new-btn');
  if (t)     t.addEventListener('click', () => toggleTerminalsDrawer(true));
  if (c)     c.addEventListener('click', () => toggleTerminalsDrawer(false));
  if (nRail) nRail.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleTerminalsDrawer(true);
    openTerminalPop();
  });
}

function relayoutEmbeddedEditors() {
  try {
    axEditor().layout();
  } catch {}
  // Each terminal re-measures itself and tells its far end; the shell only has
  // to say that the layout moved.
  try { S.xterms?.forEach((elx) => { try { elx.fit(); } catch {} }); } catch {}
}

// Panes menu — the safety net for "I collapsed a pane and now it's gone."
const DEFAULT_LAYOUT = {
  center: 'stream',
  pinned: null,
  widths: { files: 640, browser: 520, trace: 520, compare: 680 },
  termOpen: false,
  termOpenW: 320,
  termInnerListW: 140,
};

const PINNABLE_SURFACES = ['files', 'browser', 'compare', 'trace'];
// A small toggle switch in the cockpit's own dark/accent vibe — reusable
// across the app. <ax-toggle checked disabled>; emits 'change' with {checked}.
// Shadow-DOM styled, but reads the page's CSS custom properties (they pierce
// the shadow boundary) so it stays on-theme automatically.
class AxToggle extends HTMLElement {
  static get observedAttributes() { return ['checked', 'disabled']; }

  constructor() {
    super();
    const r = this.attachShadow({ mode: 'open' });
    r.innerHTML =
      '<style>' +
      ':host{display:inline-flex;cursor:pointer;-webkit-tap-highlight-color:transparent}' +
      ':host([disabled]){cursor:default;opacity:.45}' +
      '.t{width:34px;height:19px;border-radius:999px;background:var(--bg-2,#1c1c1c);' +
      'border:1px solid var(--border,#333);position:relative;transition:background .18s,border-color .18s}' +
      '.k{position:absolute;top:1px;left:1px;width:15px;height:15px;border-radius:50%;' +
      'background:var(--muted,#888);transition:transform .18s,background .18s;box-shadow:0 1px 2px rgba(0,0,0,.3)}' +
      ':host([checked]) .t{background:var(--accent,#4ade80);border-color:var(--accent,#4ade80)}' +
      ':host([checked]) .k{transform:translateX(15px);background:#fff}' +
      '</style><div class="t"><div class="k"></div></div>';
    this.addEventListener('click', () => {
      if (this.hasAttribute('disabled')) return;
      this.checked = !this.checked;
      this.dispatchEvent(new CustomEvent('change', { detail: { checked: this.checked }, bubbles: true }));
    });
    this.addEventListener('keydown', (event) => {
      if (this.hasAttribute('disabled') || (event.key !== 'Enter' && event.key !== ' ')) return;
      event.preventDefault();
      this.click();
    });
  }
  connectedCallback() { this.#syncAccessibility(); }
  attributeChangedCallback() { this.#syncAccessibility(); }
  get checked() { return this.hasAttribute('checked'); }
  set checked(v) { v ? this.setAttribute('checked', '') : this.removeAttribute('checked'); }

  #syncAccessibility() {
    if (this.dataset.presentation === 'true') {
      this.removeAttribute('role');
      this.setAttribute('aria-hidden', 'true');
      this.tabIndex = -1;
      return;
    }
    const disabled = this.hasAttribute('disabled');
    this.setAttribute('role', 'switch');
    this.setAttribute('aria-checked', String(this.checked));
    this.setAttribute('aria-disabled', String(disabled));
    this.tabIndex = disabled ? -1 : 0;
  }
}
if (!customElements.get('ax-toggle')) customElements.define('ax-toggle', AxToggle);

// A polished dropdown in the cockpit's vibe — a drop-in for a small <select>.
// It reads its <option> light-DOM children (so existing populate code that
// appends <option>s keeps working), exposes a select-like `.value`, and emits
// 'change'. The menu is a fixed-position layer so it escapes the panes'
// overflow clipping and opens upward above the composer. Shadow-DOM styled,
// reading the page's CSS custom properties so it stays on-theme.
class AxSelect extends HTMLElement {
  constructor() {
    super();
    this._value = null;
    this._open = false;
    this._opts = [];
    const r = this.attachShadow({ mode: 'open' });
    r.innerHTML =
      '<style>' +
      ':host{display:inline-flex;max-width:100%;vertical-align:middle}' +
      '.trig{display:inline-flex;align-items:center;gap:7px;max-width:100%;' +
        'background:var(--bg-3,#1a1a1a);border:1px solid var(--border,#333);border-radius:6px;' +
        'color:var(--text,#ececec);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;' +
        'padding:4px 9px;cursor:pointer;outline:none;user-select:none;transition:border-color .15s}' +
      '.trig:hover{border-color:var(--border-strong,#444)}' +
      ':host(.open) .trig,.trig:focus-visible{border-color:var(--accent,#4ade80)}' +
      '.lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}' +
      '.chev{flex-shrink:0;opacity:.55;font-size:9px;transition:transform .15s}' +
      ':host(.open) .chev{transform:rotate(180deg)}' +
      '.menu{position:fixed;z-index:70;min-width:160px;max-width:360px;max-height:280px;overflow:auto;' +
        'background:var(--panel,#161616);border:1px solid var(--border-strong,#444);border-radius:9px;' +
        'padding:5px;box-shadow:0 12px 34px rgba(0,0,0,.45);display:none}' +
      '.menu.show{display:block}' +
      '.opt{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:6px;cursor:pointer;' +
        'width:100%;border:0;background:transparent;text-align:left;' +
        'font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11.5px;color:var(--text,#ececec);white-space:nowrap}' +
      '.opt:hover{background:var(--bg-3,#222)}' +
      '.opt[aria-selected="true"]{color:var(--text,#ececec);font-weight:600}' +
      '.opt .tick{margin-left:auto;opacity:0;font-size:11px}' +
      '.opt[aria-selected="true"] .tick{opacity:1;color:var(--accent,#4ade80)}' +
      '</style>' +
      '<div class="trig" part="trigger" tabindex="0"><span class="lbl"></span><span class="chev">▾</span></div>' +
      '<div class="menu"></div>';
    this._trig = r.querySelector('.trig');
    this._lbl = r.querySelector('.lbl');
    this._menu = r.querySelector('.menu');
    const listboxId = `ax-select-${Math.random().toString(36).slice(2)}`;
    this._menu.id = listboxId;
    this._menu.setAttribute('role', 'listbox');
    this._trig.setAttribute('role', 'combobox');
    this._trig.setAttribute('aria-haspopup', 'listbox');
    this._trig.setAttribute('aria-controls', listboxId);
    this._trig.setAttribute('aria-expanded', 'false');
    this._trig.addEventListener('click', () => this.toggleOpen());
    this._trig.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.toggleOpen(); }
      else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!this._open) this.open();
        this._focusOption(e.key === 'ArrowUp' ? -1 : 1);
      }
      else if (e.key === 'Escape') this.close();
    });
    this._onDocDown = (e) => {
      if (!this._open) return;
      const path = e.composedPath ? e.composedPath() : [];
      if (path.includes(this) || path.includes(this._menu)) return;
      this.close();
    };
    this._mo = new MutationObserver(() => this._scheduleSync());
  }
  connectedCallback() {
    this._mo.observe(this, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['value', 'selected'] });
    this._sync();
  }
  disconnectedCallback() {
    this._mo.disconnect();
    document.removeEventListener('mousedown', this._onDocDown, true);
  }
  _scheduleSync() {
    if (this._syncQ) return;
    this._syncQ = true;
    Promise.resolve().then(() => { this._syncQ = false; this._sync(); });
  }
  // Read <option> children → rebuild the menu, keeping the value valid.
  _sync() {
    this._opts = Array.from(this.querySelectorAll('option')).map(o => ({
      value: o.getAttribute('value') != null ? o.getAttribute('value') : (o.textContent || ''),
      label: o.textContent || '',
      selected: o.hasAttribute('selected'),
    }));
    let v = this._value;
    if (!this._opts.some(o => o.value === v)) {
      const sel = this._opts.find(o => o.selected);
      v = sel ? sel.value : (this._opts[0] ? this._opts[0].value : null);
    }
    this._value = v;
    this._renderMenu();
    this._renderLabel();
  }
  _renderMenu() {
    this._menu.innerHTML = '';
    this._opts.forEach(o => {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'opt';
      row.setAttribute('role', 'option');
      row.dataset.value = o.value;
      row.setAttribute('aria-selected', String(o.value === this._value));
      const t = document.createElement('span');
      t.textContent = o.label;
      row.appendChild(t);
      const tick = document.createElement('span');
      tick.className = 'tick';
      tick.textContent = '✓';
      row.appendChild(tick);
      row.addEventListener('click', () => this._select(o.value));
      row.addEventListener('keydown', (event) => this._onOptionKey(event));
      this._menu.appendChild(row);
    });
  }
  _renderLabel() {
    const cur = this._opts.find(o => o.value === this._value);
    this._lbl.textContent = cur ? cur.label : '';
    this.title = cur ? cur.label : '';
  }
  _select(v) {
    const changed = v !== this._value;
    this._value = v;
    this._renderMenu();
    this._renderLabel();
    this.close();
    if (changed) this.dispatchEvent(new CustomEvent('change', { detail: { value: v }, bubbles: true }));
  }
  toggleOpen() { this._open ? this.close() : this.open(); }
  open() {
    if (this._open || !this._opts.length) return;
    this._open = true;
    this.classList.add('open');
    this._menu.classList.add('show');
    this._trig.setAttribute('aria-expanded', 'true');
    this._position();
    setTimeout(() => document.addEventListener('mousedown', this._onDocDown, true), 0);
  }
  close() {
    if (!this._open) return;
    this._open = false;
    this.classList.remove('open');
    this._menu.classList.remove('show');
    this._trig.setAttribute('aria-expanded', 'false');
    document.removeEventListener('mousedown', this._onDocDown, true);
  }
  _focusOption(direction) {
    const options = Array.from(this._menu.querySelectorAll('.opt'));
    if (!options.length) return;
    const active = this.shadowRoot.activeElement;
    let index = options.indexOf(active);
    if (index < 0) index = options.findIndex(option => option.dataset.value === this._value);
    index = Math.max(0, Math.min(options.length - 1, index + direction));
    options[index].focus();
  }
  _onOptionKey(event) {
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault(); this._focusOption(event.key === 'ArrowDown' ? 1 : -1);
    } else if (event.key === 'Home' || event.key === 'End') {
      event.preventDefault();
      const options = Array.from(this._menu.querySelectorAll('.opt'));
      options[event.key === 'Home' ? 0 : options.length - 1]?.focus();
    } else if (event.key === 'Escape') {
      event.preventDefault(); this.close(); this._trig.focus();
    }
  }
  // Anchor above the trigger (the composer sits low), left-aligned, clamped.
  _position() {
    const r = this._trig.getBoundingClientRect();
    const m = this._menu;
    m.style.visibility = 'hidden';
    m.style.minWidth = Math.max(r.width, 160) + 'px';
    const mw = m.offsetWidth || 200;
    const mh = m.offsetHeight || 200;
    const margin = 8;
    let left = r.left;
    if (left + mw > window.innerWidth - margin) left = window.innerWidth - mw - margin;
    if (left < margin) left = margin;
    let top = r.top - mh - 5;
    if (top < margin) top = r.bottom + 5;
    m.style.left = left + 'px';
    m.style.top = top + 'px';
    m.style.visibility = '';
  }
  get value() { return this._value; }
  set value(v) { this._value = v; this._renderMenu(); this._renderLabel(); }
}
if (!customElements.get('ax-select')) customElements.define('ax-select', AxSelect);

function renderPanesMenu() {
  const menu = $('#panes-menu'); if (!menu) return;
  menu.innerHTML = '';
  const L = S.cockpitLayout;
  menu.appendChild(el('div', 'pm-heading', 'Open'));
  [
    ['Search Session history', () => $('#session-history-btn')?.click()],
    ['Agent graph', () => openModule('trace')],
    ['Review attempts', () => openModule('compare')],
  ].forEach(([label, action]) => {
    const row = el('button', 'pm-item pm-action');
    row.type = 'button';
    row.setAttribute('role', 'menuitem');
    row.appendChild(el('span', '', label));
    row.addEventListener('click', () => {
      closePanesMenu(false);
      action();
    });
    menu.appendChild(row);
  });
  menu.appendChild(el('div', 'pm-divider'));
  const heading = el('div', 'pm-heading', 'Pin beside conversation');
  const hint = el('div', 'pm-hint', 'One review surface at a time. Unavailable choices need more width.');
  menu.append(heading, hint);
  [[null, 'None'], ...PINNABLE_SURFACES.map(id => [id, SURFACES[id].title])]
    .forEach(([id, label]) => {
      const disabled = Boolean(id && !canPairSurface(id));
      const selected = (L.pinned || null) === id;
      const row = el('button', 'pm-item pm-radio');
      row.type = 'button';
      row.setAttribute('role', 'menuitemradio');
      row.setAttribute('aria-checked', String(selected));
      row.disabled = disabled;
      row.appendChild(el('span', 'pm-radio-mark', selected ? '●' : '○'));
      row.appendChild(el('span', 'pm-label', label));
      if (disabled) row.appendChild(el('span', 'pm-why', 'needs more width'));
      row.addEventListener('click', () => {
        L.pinned = id;
        L.center = 'stream';
        closePanesMenu(false);
        applyCockpitLayout();
        syncLauncherState();
      });
      menu.appendChild(row);
    });
  menu.appendChild(el('div', 'pm-divider'));
  const reset = el('button', 'pm-item pm-action');
  reset.type = 'button';
  reset.setAttribute('role', 'menuitem');
  reset.appendChild(el('span', '', '↺ Reset workspace'));
  reset.addEventListener('click', () => { resetWorkspace(); renderPanesMenu(); });
  menu.appendChild(reset);
}

// Compatibility adapter for older internal callers. The state still admits
// only one optional companion, never an arbitrary pane set.
function toggleSurface(id, show) {
  const L = S.cockpitLayout;
  if (id === 'stream') return;
  L.pinned = show ? id : (L.pinned === id ? null : L.pinned);
  L.center = 'stream';
  applyCockpitLayout();
}

function resetWorkspace() {
  const L = S.cockpitLayout;
  L.center = 'stream';
  L.pinned = null;
  L.widths = { files: 640, browser: 520, trace: 520, compare: 680 };
  L.attemptsOpen = false;
  applyCockpitLayout();
}

function openPanesMenu() {
  const menu = $('#panes-menu');
  const btn  = $('#panes-menu-btn');
  if (!menu || !btn) return;
  if (!menu.classList.contains('hide')) { closePanesMenu(true); return; }
  renderPanesMenu();
  // Render once hidden so we can measure the menu's real width, then
  // right-align it under the button and clamp inside the viewport.
  menu.classList.remove('hide');
  menu.style.visibility = 'hidden';
  const r  = btn.getBoundingClientRect();
  const mw = menu.offsetWidth || 240;
  let left = r.right - mw;
  const margin = 8;
  if (left < margin) left = margin;
  if (left + mw > window.innerWidth - margin) left = window.innerWidth - mw - margin;
  menu.style.top  = (r.bottom + 4) + 'px';
  menu.style.left = left + 'px';
  menu.style.visibility = '';
  menu.setAttribute('aria-hidden', 'false');
  btn.setAttribute('aria-expanded', 'true');
  requestAnimationFrame(() => menu.querySelector('[role="menuitem"], [role="menuitemradio"]')?.focus());
  // Close on any outside click (next tick so the opening click doesn't close it).
  setTimeout(() => {
    document.addEventListener('mousedown', closePanesMenuOutside, { capture: true });
  }, 0);
}
function closePanesMenu(restoreFocus = false) {
  const menu = $('#panes-menu');
  const button = $('#panes-menu-btn');
  if (!menu) return;
  menu.classList.add('hide');
  menu.setAttribute('aria-hidden', 'true');
  button?.setAttribute('aria-expanded', 'false');
  document.removeEventListener('mousedown', closePanesMenuOutside, { capture: true });
  if (restoreFocus) button?.focus();
}
function closePanesMenuOutside(e) {
  const menu = $('#panes-menu');
  const btn  = $('#panes-menu-btn');
  if (!menu) return;
  if (menu.contains(e.target) || (btn && btn.contains(e.target))) return;
  closePanesMenu(false);
}

function readRailCollapsedPreference() {
  try {
    const current = localStorage.getItem(RAIL_COLLAPSED_KEY);
    if (current === '1' || current === '0') return current === '1';

    // One-time migration from the deleted three-state sidebar. Both of its
    // compact states map to the real rail's single reversible collapsed state.
    const legacy = localStorage.getItem(LEGACY_SIDEBAR_KEY);
    if (legacy === 'full' || legacy === 'mini' || legacy === 'hidden') {
      const collapsed = legacy !== 'full';
      localStorage.setItem(RAIL_COLLAPSED_KEY, collapsed ? '1' : '0');
      localStorage.removeItem(LEGACY_SIDEBAR_KEY);
      return collapsed;
    }
  } catch {}
  return null;
}

function setRailCollapsed(collapsed, { persist = true } = {}) {
  const rail = $('#rail');
  if (!rail) return;
  rail.collapsed = Boolean(collapsed);
  if (persist) {
    try { localStorage.setItem(RAIL_COLLAPSED_KEY, collapsed ? '1' : '0'); } catch {}
  }
}

function toggleRail() {
  const rail = $('#rail');
  if (!rail) return;
  if (window.innerWidth < 720) {
    if (document.body.classList.contains('mobile-rail-open')) closeMobileRail(true);
    else openMobileRail();
    return;
  }
  setRailCollapsed(!rail.collapsed);
}

/// Resizers use pointer events with `setPointerCapture` so the up event is
/// guaranteed even if the cursor leaves the window — `mousedown`/`mousemove`
/// on `document` can drop the up and leave the strip stuck in its drag style.
// A two-up layout is always Conversation | selected surface. Moving the
// separator right grows Conversation and shrinks the selected review.
function resizerTargetForBoundary(b) {
  const visible = visibleSurfaces();
  if (b !== 0 || visible.length !== 2 || visible[0] !== 'stream') return null;
  return { key: visible[1], sign: -1 };
}

function attachColResizer(handle) {
  handle.addEventListener('keydown', (event) => {
    if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
    const tgt = resizerTargetForBoundary(parseInt(handle.dataset.boundary || '0', 10));
    if (!tgt) return;
    event.preventDefault();
    const sf = SURFACES[tgt.key];
    const room = Math.max(0, document.querySelector('.cockpit-grid')?.getBoundingClientRect().width || 0);
    const max = Math.min(sf.max, Math.max(sf.pairMin, room - PAIR_CHAT_MIN - PAIR_GUTTER));
    const step = event.shiftKey ? 64 : 24;
    const current = surfaceWidth(tgt.key);
    S.cockpitLayout.widths[tgt.key] = event.key === 'Home' ? sf.pairMin
      : event.key === 'End' ? max
      : Math.max(sf.pairMin, Math.min(max,
        current + (event.key === 'ArrowLeft' ? step : -step)));
    applyCockpitLayout();
  });
  handle.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    const b = parseInt(handle.dataset.boundary || '0', 10);
    const tgt = resizerTargetForBoundary(b);
    if (!tgt || !tgt.key) return;
    const sf = SURFACES[tgt.key] || {};
    const room = Math.max(0, document.querySelector('.cockpit-grid')?.getBoundingClientRect().width || 0);
    const mm = {
      min: sf.pairMin || sf.min || 420,
      max: Math.min(sf.max || 1200, Math.max(sf.pairMin || sf.min || 420,
        room - PAIR_CHAT_MIN - PAIR_GUTTER)),
    };
    try { handle.setPointerCapture(e.pointerId); } catch {}
    handle.classList.add('dragging');
    document.body.classList.add('axo-resizing');
    const startX = e.clientX;
    const startW = surfaceWidth(tgt.key);
    const onMove = (ev) => {
      const dx = ev.clientX - startX;
      S.cockpitLayout.widths[tgt.key] = Math.max(mm.min, Math.min(mm.max, startW + tgt.sign * dx));
      applyCockpitLayout();
    };
    const onEnd = () => {
      handle.classList.remove('dragging');
      document.body.classList.remove('axo-resizing');
      try { handle.releasePointerCapture(e.pointerId); } catch {}
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onEnd);
      handle.removeEventListener('pointercancel', onEnd);
      handle.removeEventListener('lostpointercapture', onEnd);
    };
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onEnd);
    handle.addEventListener('pointercancel', onEnd);
    handle.addEventListener('lostpointercapture', onEnd);
  });
}

// Safety net: any time the window loses focus or is hidden, clear stuck drag state.
['blur', 'visibilitychange'].forEach(ev => {
  window.addEventListener(ev, () => {
    document.querySelectorAll('.col-resizer.dragging')
      .forEach(h => h.classList.remove('dragging'));
    document.body.classList.remove('axo-resizing', 'axo-vresizing');
  });
});

function onPaneBtn(e) {
  const btn = e.target.closest('.pane-btn, .pane-return'); if (!btn) return;
  const act = btn.dataset.act, pane = btn.dataset.pane;
  if (act === 'conversation') {
    openModule('stream');
    return;
  } else if (act === 'focus') {
    S.cockpitLayout.center = pane;
  } else if (act === 'collapse') {
    if (S.cockpitLayout.pinned === pane) S.cockpitLayout.pinned = null;
    S.cockpitLayout.center = 'stream';
  }
  applyCockpitLayout();
}

function onCockpitKey(e) {
  // Sidebar toggle works anywhere in the app (Ctrl/Cmd + \).
  if ((e.ctrlKey || e.metaKey) && e.key === '\\') {
    e.preventDefault();
    toggleRail();
    return;
  }
  if (e.key === 'Escape' && document.body.classList.contains('mobile-rail-open')) {
    closeMobileRail(true);
    return;
  }
  if ($('#session-cockpit').style.display === 'none' || !S.session.id) return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  const inField = tag === 'INPUT' || tag === 'TEXTAREA';
  if (e.key === 'Escape' && S.cockpitLayout.attemptsOpen) {
    setAttemptsDock(false);
    $('#attempts-dock-toggle')?.focus();
    return;
  }
  if (e.key === 'Escape' && centerSurface() !== 'stream') {
    openModule('stream'); return;
  }
  if (inField) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l') {
    e.preventDefault();
    openModule('stream');
    $('#session-text')?.focus();
  }
}

// File browsing and Source Control have different information density, so
// each remembers its own list width. One shared 140px preference was the root
// cause of the crushed commit controls and unreadable file paths.
const FILES_EXPLORER_W_KEYS = {
  files: 'axo:files-list-width.v2',
  git: 'axo:source-control-list-width.v2',
};
const FILES_EXPLORER_DEFAULTS = { files: 280, git: 360 };
const FILES_EXPLORER_MIN = { files: 220, git: 300 };
const FILES_EDITOR_MIN = 420;

function activeExplorerTab() {
  return S.session?.explorerTab === 'git' ? 'git' : 'files';
}

function filesExplorerBounds(tab = activeExplorerTab()) {
  const inner = document.querySelector('#cockpit-files .files-pane-inner');
  const total = inner?.getBoundingClientRect().width || 960;
  return {
    min: FILES_EXPLORER_MIN[tab] || 220,
    max: Math.max(FILES_EXPLORER_MIN[tab] || 220, Math.min(600, total - FILES_EDITOR_MIN)),
  };
}

function setFilesExplorerWidth(width, { persist = false, tab = activeExplorerTab() } = {}) {
  const ex = $('#files-explorer');
  const h = $('#files-inner-resizer');
  if (!ex) return;
  const { min, max } = filesExplorerBounds(tab);
  const value = Math.max(min, Math.min(max, Number(width) || FILES_EXPLORER_DEFAULTS[tab]));
  ex.style.setProperty('--explorer-w', value + 'px');
  h?.setAttribute('aria-valuemin', String(min));
  h?.setAttribute('aria-valuemax', String(max));
  h?.setAttribute('aria-valuenow', String(Math.round(value)));
  if (persist) {
    try { localStorage.setItem(FILES_EXPLORER_W_KEYS[tab], String(Math.round(value))); } catch {}
  }
}

function restoreFilesExplorerWidth(tab = activeExplorerTab()) {
  let saved = 0;
  try { saved = parseInt(localStorage.getItem(FILES_EXPLORER_W_KEYS[tab]) || '0', 10); } catch {}
  setFilesExplorerWidth(saved > 0 ? saved : FILES_EXPLORER_DEFAULTS[tab], { tab });
}

function attachFilesInnerResizer() {
  const h = $('#files-inner-resizer');
  const ex = $('#files-explorer');
  if (!h || !ex) return;
  restoreFilesExplorerWidth();
  h.addEventListener('keydown', (event) => {
    if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
    event.preventDefault();
    const tab = activeExplorerTab();
    const { min, max } = filesExplorerBounds(tab);
    const current = ex.getBoundingClientRect().width;
    const step = event.shiftKey ? 48 : 16;
    const next = event.key === 'Home' ? min : event.key === 'End' ? max
      : current + (event.key === 'ArrowRight' ? step : -step);
    setFilesExplorerWidth(next, { persist: true, tab });
    relayoutEmbeddedEditors();
  });
  h.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    const tab = activeExplorerTab();
    const startX = e.clientX;
    const startW = ex.getBoundingClientRect().width;
    try { h.setPointerCapture(e.pointerId); } catch {}
    h.classList.add('dragging');
    document.body.classList.add('axo-resizing');
    const onMove = (event) => {
      setFilesExplorerWidth(startW + event.clientX - startX, { tab });
      relayoutEmbeddedEditors();
    };
    const onEnd = () => {
      h.classList.remove('dragging');
      document.body.classList.remove('axo-resizing');
      setFilesExplorerWidth(ex.getBoundingClientRect().width, { persist: true, tab });
      try { h.releasePointerCapture(e.pointerId); } catch {}
      h.removeEventListener('pointermove', onMove);
      h.removeEventListener('pointerup', onEnd);
      h.removeEventListener('pointercancel', onEnd);
    };
    h.addEventListener('pointermove', onMove);
    h.addEventListener('pointerup', onEnd);
    h.addEventListener('pointercancel', onEnd);
  });
}

let _cockpitInited = false;
// Lifecycle chrome is rendered from one state derivation so the title bar and
// composer cannot disagree (for example, "idle" beside an active Stop, or two
// separate Stop buttons addressing the same turn).
function setCockpitLive(state, label) {
  if (S.session) {
    S.session.terminalState = state || 'idle';
    S.session.terminalLabel = label || state || 'idle';
    S.session.terminalDetail = $('#cockpit-status')?.textContent || '';
  }
  syncSessionLifecycleChrome();
}

function syncSessionLifecycleChrome() {
  const pill = document.getElementById('cockpit-live');
  const action = $('#session-run-action');
  const status = $('#cockpit-status');
  const running = Boolean(S.session?.activeTurnId);
  const pending = Boolean(S.session?.pendingTurn);
  const stopping = running && Boolean(S.session?.stopPending);
  const reconnecting = (running || pending) && S.liveConnection !== 'connected';
  let state = S.session?.terminalState || 'idle';
  let label = S.session?.terminalLabel || state;
  let detail = S.session?.terminalDetail || '';

  if (reconnecting) {
    state = 'reconnecting'; label = 'reconnecting';
    detail = running ? 'turn still running · reconnecting…' : 'confirming turn start…';
  } else if (stopping) {
    state = 'stopping'; label = 'stopping'; detail = 'stopping after a safe boundary…';
  } else if (running) {
    state = 'running'; label = 'running'; detail = 'running…';
  } else if (pending) {
    state = 'starting'; label = 'starting'; detail = 'starting turn…';
  }

  if (pill) {
    pill.dataset.state = state;
    pill.classList.toggle('idle', ['idle', 'done', 'error', 'stopped'].includes(state));
    const pillLabel = pill.querySelector('.cockpit-live-label');
    if (pillLabel) pillLabel.textContent = label;
  }
  if (status) status.textContent = detail;
  if (action) {
    action.classList.toggle('hide', !running);
    action.disabled = reconnecting || stopping;
    action.textContent = stopping ? 'Stopping…' : 'Stop';
    action.title = reconnecting
      ? 'Reconnecting before Stop can be sent to this exact turn'
      : 'Stop this turn after any active tool reaches a safe boundary';
  }
}

function sessionDir(s) {
  return typeof s.working_dir === 'string' ? s.working_dir : (s.working_dir || '');
}

function syncSessionDeepLink(sessionId) {
  const next = new URL(location.href);
  if (sessionId) next.searchParams.set('session', sessionId);
  else next.searchParams.delete('session');
  const currentLocation = `${location.pathname}${location.search}${location.hash}`;
  const nextLocation = `${next.pathname}${next.search}${next.hash}`;
  if (nextLocation !== currentLocation) {
    history.replaceState(history.state, '', nextLocation);
  }
}

// ── Cockpit ──
async function reopenCurrentSession(expectedSessionId = S.session.id) {
  if (!expectedSessionId || S.session.id !== expectedSessionId
      || S.session.status !== 'closed') return null;
  const action = $('#session-environment-action');
  if (action) action.disabled = true;
  try {
    const response = await fetch(`/api/sessions/${encodeURIComponent(expectedSessionId)}/reopen`, {
      method: 'POST',
    });
    const reopened = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(reopened.error || `HTTP ${response.status}`);
    if (S.session.id !== expectedSessionId) return reopened;
    if (!Array.isArray(S.sessions)) S.sessions = [];
    const at = S.sessions.findIndex((session) => session?.id === expectedSessionId);
    if (at >= 0) S.sessions.splice(at, 1, reopened);
    else S.sessions.push(reopened);
    applySessionEnvironmentUpdate(reopened);
    void sessionHome()?.refresh?.();
    void $('#rail')?.refresh?.();
    toast('Session reopened', reopened.name || S.session.name, 'ok');
    return reopened;
  } catch (error) {
    if (S.session.id === expectedSessionId) {
      toast('Could not reopen Session', String(error?.message || error), 'err');
    }
    return null;
  } finally {
    if (S.session.id === expectedSessionId && action) action.disabled = false;
  }
}

function openCockpit(s) {
  _workspaceNavigationGeneration += 1;
  $('#session-home')?.noteExternalNavigation?.();
  setSelectedWorkspace(s.workspace_id || '', { scope: 'workspace' });
  syncSessionDeepLink(s.id);
  const previousSessionState = S.session;
  const previousSessionId = previousSessionState.id;
  if (previousSessionId === s.id && $('#session-cockpit')?.style.display === 'flex') {
    S.session.status = s.status || 'active';
    S.session.environment = s.environment || { state: 'unprepared' };
    renderSessionEnvironment(S.session);
    syncSessionComposerState();
    bindSessionComponents(s);
    void hydrateSessionConversation(s.id);
    closeMobileRail();
    $('#session-text')?.focus();
    return;
  }
  if (previousSessionState.taskTimer) clearInterval(previousSessionState.taskTimer);
  // A thread summary belongs to exactly one open session. The durable set is
  // restored after its transcript, so no DOM or set id can bleed across a
  // fast session switch.
  S.threadVariants = null;
  S.session = {
    id: s.id, workspaceId: s.workspace_id || '', dir: sessionDir(s), name: s.name,
    status: s.status || 'active',
    mode: s.mode || null,
    environment: s.environment || { state: 'unprepared' },
    streamEl: null, streamBuf: '', toolCards: {}, liveStreams: new Map(),
    historyState: 'loading', historyError: '', historyGeneration: 0, historyController: null,
    refs: [],
    attemptPlan: null,
    attemptStartRecovery: _attemptStartRecoveries.get(s.id) || null,
    pendingTurn: _pendingSessionTurns.get(s.id) || null,
    stopPending: false,
    terminalState: 'idle',
    terminalLabel: 'idle',
    terminalDetail: '',
    autoTerminalDone: false,
    autoTerminalController: null,
    manualTerminalStarting: false,
    manualTerminalController: null,
    attemptRestorePending: true,
    runtimeActivationPending: s.status !== 'closed' && sessionEnvironmentReady(s),
    runtimeActivationInFlight: false,
    runtimeActivationGeneration: 0,
    runtimeActivationOwnerGeneration: null,
    runtimeActivationController: null,
  };
  // The composer is page-global, but its draft belongs to the session that
  // was open when it was typed. Never feed that text into another session's
  // Attempts preflight or let it be sent there after a rail switch.
  const _sessionText = $('#session-text');
  if (_sessionText && previousSessionId !== s.id) _sessionText.value = '';
  renderChatRefs();
  // The Session browser itself leaves the layout while the cockpit is open,
  // but its fixed picker/dialog layer must remain mounted. Environment review
  // is owned by this component and is reachable from every gated cockpit
  // action; hiding the whole custom element made that modal invisible.
  const sessionHomeElement = $('#session-home');
  if (sessionHomeElement) {
    sessionHomeElement.style.display = '';
    sessionHomeElement.setAttribute('cockpit-active', '');
  }
  $('#session-cockpit').style.display = 'flex';
  $('#session-surface')?.classList.add('session-open');
  closeMobileRail();
  initCockpitChrome();
  $('#cockpit-title').textContent = s.name;
  $('#cockpit-dir').textContent = sessionDir(s);
  $('#cockpit-status').textContent = '';
  setCockpitLive('idle', 'idle');
  $('#session-msgs').innerHTML = '';
  S.session.gitDiff = null;
  S.session._previewCards = new Set();
  // Fan-out is an on/off plus a configured count. It persists across turns
  // within a session (a send doesn't reset it); each freshly-opened session
  // starts from the default — off, 3 ways.
  S.session.fanout = 3;
  S.session.fanoutOn = false;
  S.session.fanoutLanes = [{}, {}, {}];
  const _fanout = $('#fanout');
  if (_fanout) {
    _fanout.enabled = S.session.fanoutOn;
    _fanout.lanes = S.session.fanoutLanes;
    _fanout.disabled = !sessionSupportsAttempts() || !sessionEnvironmentReady();
  }
  if (typeof closeFanoutPop === 'function') closeFanoutPop();
  if (typeof updateFanoutBtn === 'function') updateFanoutBtn();
  S.cockpitLayout.center = 'stream';
  S.cockpitLayout.attemptsOpen = false;
  applyCockpitLayout();
  if (typeof stopThreadVariantPoll === 'function') stopThreadVariantPoll();
  if (typeof stopThreadVariantRestore === 'function') stopThreadVariantRestore();
  setExplorerTab('files');   // default to the file tree; git refreshes lazily
  // Files belong to the session that was open, so the editor starts empty and
  // is re-pointed before anything can ask it to load.
  const _ed = axEditor();
  if (typeof _ed.reset === 'function') _ed.reset();
  _ed.setAttribute('session', '');
  $('#file-tabs').innerHTML = '';
  S.session.filesDetailVisible = false;
  S.session.gitDiffMode = 'side-by-side';
  viewerShow(filesEmptyDetail());
  updateFilesEditor();
  const _tree = $('#file-tree');
  if (_tree) {
    _tree.session = '';
    _tree.selected = '';
  }
  const _sourceControl = $('#source-control');
  if (_sourceControl) _sourceControl.session = '';
  const _rail = $('#rail');
  if (_rail) { _rail.workspace = s.workspace_id || S.selectedWorkspaceId; _rail.current = s.id; _rail.refresh(); }
  bindSessionComponents(s);
  try { localStorage.setItem(LAST_SESSION_KEY, s.id); } catch {}
  if (s.workspace_id) {
    try { localStorage.setItem(lastWorkspaceSessionKey(s.workspace_id), s.id); } catch {}
  }
  sessionLatticeBuild(s);
  renderSessionActive(s);
  renderSessionEnvironment(S.session);
  populateSessionAgentTarget(s);
  void populateSessionModelPicker(s);
  const openedSessionId = s.id;
  // Selecting a Closed Session is a setup-free recovery read. Do not even
  // poll its runtime task surface: the durable transcript and Attempt evidence
  // below remain available, while the explicit Reopen banner action is the
  // only path that may reconstruct the Session environment.
  if (S.session.status !== 'closed') {
    S.session.taskTimer = setInterval(() => void refreshSessionTasks(openedSessionId), 4000);
    void refreshSessionTasks(openedSessionId);
  } else {
    S.session.tasks = [];
    renderTerminals();
  }
  // The transcript is the permanent spine; place the unresolved attempt
  // summary after it, then restore its durable lifecycle from the daemon.
  void hydrateSessionConversation(s.id).then((ready) => {
    if (ready) return restoreThreadVariants(s.id);
    return null;
  });
  $('#session-text').focus();
}

function bindSessionComponents(s) {
  if (!s?.id) return;
  const bindings = ['compare', 'attempts'];
  for (const id of bindings) {
    const component = $('#' + id);
    component?.setAttribute?.('session', s.id);
  }
  bindSessionRuntimeComponents(s);
  const context = $('#session-context');
  if (context) {
    context.setAttribute('session', s.id);
    context.toggleAttribute('disabled', S.session.historyState !== 'ready'
      || Boolean(S.session.activeTurnId || S.session.pendingTurn));
  }
  const history = $('#session-history');
  if (history) {
    history.setAttribute('session-id', s.id);
    history.setAttribute('session-name', s.name || 'Session');
    history.setAttribute('rewind-enabled',
      sessionRuntimeSurfaceReady(s) && sessionSupportsRewind(s) ? 'true' : 'false');
  }
  if (customElements.get('ax-attempts')) syncAttemptsDraft();
  else customElements.whenDefined('ax-attempts').then(() => {
    if (S.session.id === s.id) syncAttemptsDraft();
  });
}

function bindSessionRuntimeComponents(s = S.session) {
  const current = s?.id === S.session.id ? S.session : s;
  const ready = Boolean(s?.id) && sessionRuntimeSurfaceReady(current);
  const sessionId = ready ? s.id : '';
  const sourceControl = $('#source-control');
  if (sourceControl) sourceControl.session = sessionId;
  const browser = $('#browser');
  if (browser) browser.session = sessionId;
  const tree = $('#file-tree');
  if (tree) tree.session = sessionId;
  const editor = axEditor();
  if (editor) {
    // Ways and cold reconstruction suspend this Session's editor instead of
    // rebinding it to an empty Session. That keeps unsaved drafts and models
    // alive while every file request is inert; a real Session switch still
    // changes the attribute and performs the component's full reset.
    const editorSessionId = s?.id || '';
    if (editor.session !== editorSessionId) editor.session = editorSessionId;
    editor.suspended = !ready;
  }
  document.querySelectorAll('ax-changes').forEach((card) => {
    card.toggleAttribute('disabled', !ready);
  });
}

function markSessionRuntimeActivationRequired(sessionId = S.session.id) {
  if (!sessionId || S.session.id !== sessionId) return;
  const sessionState = S.session;
  const newlyRequired = !sessionState.runtimeActivationPending;
  const invalidateLiveRuntime = newlyRequired || sessionState.runtimeActivationInFlight;
  // An activation request is owned by one exact Session/runtime epoch. Retire
  // it synchronously before advancing the epoch so a delayed task snapshot or
  // canonical Session read cannot leave a later activation waiting on stale
  // `inFlight` bookkeeping.
  sessionState.runtimeActivationController?.abort?.();
  sessionState.runtimeActivationController = null;
  sessionState.runtimeActivationInFlight = false;
  sessionState.runtimeActivationOwnerGeneration = null;
  sessionState.runtimeActivationGeneration =
    Number(sessionState.runtimeActivationGeneration || 0) + 1;
  sessionState.runtimeActivationPending = true;
  bindSessionRuntimeComponents(sessionState);
  closeQuickOpen();
  invalidateQuickOpenIndex();
  if (sessionState.gitDiff) gitDisposeDiff(window.monaco);
  if (!invalidateLiveRuntime) {
    syncSessionComposerState();
    updateFanoutBtn();
    return;
  }
  teardownXterms();
  sessionState.autoTerminalController?.abort?.();
  sessionState.autoTerminalController = null;
  sessionState.manualTerminalController?.abort?.();
  sessionState.manualTerminalController = null;
  sessionState.manualTerminalStarting = false;
  sessionState.tasks = [];
  sessionState.activeTerminalId = null;
  sessionState.autoTerminalDone = false;
  sessionState.autoTerminalStarting = false;
  renderTerminals();
  syncSessionComposerState();
  updateFanoutBtn();
}

async function activateOpenedSessionRuntime(expectedSessionId = S.session.id) {
  if (!expectedSessionId || S.session.id !== expectedSessionId
      || S.session.status === 'closed' || !sessionEnvironmentReady()
      || S.session.attemptRestorePending
      || _sessionEnvironmentTransitions.has(expectedSessionId)
      || workspaceAttemptOwnsPrimaryRuntime(S.session)
      || S.threadVariants?.sessionId === expectedSessionId) return false;
  const sessionState = S.session;
  if (!sessionState.runtimeActivationPending) {
    bindSessionRuntimeComponents(sessionState);
    syncSessionComposerState();
    updateFanoutBtn();
    return true;
  }
  if (sessionState.runtimeActivationInFlight) return false;
  const activationGeneration = Number(sessionState.runtimeActivationGeneration || 0);
  const controller = new AbortController();
  sessionState.runtimeActivationInFlight = true;
  sessionState.runtimeActivationOwnerGeneration = activationGeneration;
  sessionState.runtimeActivationController = controller;
  const ownsActivation = () => S.session === sessionState
    && S.session.id === expectedSessionId
    && sessionState.runtimeActivationController === controller
    && !controller.signal.aborted
    && sessionState.runtimeActivationOwnerGeneration === activationGeneration
    && Number(sessionState.runtimeActivationGeneration || 0) === activationGeneration
    && !sessionState.attemptRestorePending
    && !_sessionEnvironmentTransitions.has(expectedSessionId)
    && !workspaceAttemptOwnsPrimaryRuntime(sessionState)
    && S.threadVariants?.sessionId !== expectedSessionId;
  try {
    // Read the already-live task list without provisioning anything. If this
    // daemon has no runtime handle after restart, the one terminal POST below
    // becomes the sole lazy-activation owner; Files and Git remain unbound
    // until it returns, so they cannot race the durable Preparing transition.
    const response = await fetch(
      '/api/sessions/' + encodeURIComponent(expectedSessionId) + '/tasks',
      {
        cache: 'no-store',
        headers: { accept: 'application/json' },
        signal: controller.signal,
      },
    );
    const body = await response.json().catch(() => null);
    if (!ownsActivation()) return false;
    if (!response.ok || !Array.isArray(body)) {
      await reconcileSessionAfterRuntimeFailure(
        expectedSessionId,
        sessionState,
        controller.signal,
      );
      if (!ownsActivation()) return false;
      if (response.status === 409
          && sessionEnvironmentReady(sessionState)) {
        sessionState.attemptRestorePending = true;
        await restoreThreadVariants(expectedSessionId);
      }
      return false;
    }
    sessionState.tasks = body;
    renderTerminals();
    detectUrlsFromTasks();
    const activated = await maybeAutoStartTerminal(expectedSessionId, activationGeneration);
    if (!ownsActivation()) return false;
    await reconcileSessionAfterRuntimeFailure(
      expectedSessionId,
      sessionState,
      controller.signal,
    );
    if (!activated || !ownsActivation() || !sessionEnvironmentReady(sessionState)) {
      return false;
    }
    sessionState.runtimeActivationPending = false;
    bindSessionRuntimeComponents(sessionState);
    syncSessionComposerState();
    updateFanoutBtn();
    await refreshSessionTasks(expectedSessionId);
    return true;
  } catch (error) {
    if (error?.name === 'AbortError' || !ownsActivation()) return false;
    await reconcileSessionAfterRuntimeFailure(
      expectedSessionId,
      sessionState,
      controller.signal,
    );
    if (ownsActivation()) {
      console.warn('could not activate Session runtime:', error);
    }
    return false;
  } finally {
    if (S.session === sessionState && sessionState.runtimeActivationController === controller) {
      sessionState.runtimeActivationController = null;
    }
    if (S.session === sessionState
        && sessionState.runtimeActivationOwnerGeneration === activationGeneration
        && Number(sessionState.runtimeActivationGeneration || 0) === activationGeneration) {
      sessionState.runtimeActivationInFlight = false;
      sessionState.runtimeActivationOwnerGeneration = null;
    }
  }
}

// Friction-reducer: every freshly-opened session lands with a POSIX shell
// already attached at the working dir. If a live terminal already exists,
// just focus that — never spawn duplicates.
async function maybeAutoStartTerminal(
  expectedSessionId = S.session.id,
  expectedActivationGeneration = Number(S.session.runtimeActivationGeneration || 0),
) {
  if (!expectedSessionId || S.session.id !== expectedSessionId
      || !sessionEnvironmentReady()
      || S.session.attemptRestorePending
      || _sessionEnvironmentTransitions.has(expectedSessionId)
      || workspaceAttemptOwnsPrimaryRuntime(S.session)
      || S.threadVariants?.sessionId === expectedSessionId) return false;
  const sessionState = S.session;
  const ownsRuntime = () => S.session === sessionState
    && S.session.id === expectedSessionId
    && Number(sessionState.runtimeActivationGeneration || 0) === expectedActivationGeneration
    && !sessionState.attemptRestorePending
    && !_sessionEnvironmentTransitions.has(expectedSessionId)
    && !workspaceAttemptOwnsPrimaryRuntime(sessionState)
    && S.threadVariants?.sessionId !== expectedSessionId;
  const live = (sessionState.tasks || []).filter(
    t => t.kind === 'terminal' && String(t.status || '').startsWith('running')
  );
  if (live.length) {
    if (!ownsRuntime()) return false;
    sessionState.autoTerminalDone = true;
    sessionState.activeTerminalId = live[live.length - 1].id;
    renderTerminals();
    return true;
  }
  if (sessionState.autoTerminalStarting) return false;
  // A prior activation epoch may have started a terminal but lost ownership
  // before it could refresh the task list. With no live task in this epoch,
  // `done` is stale and must not strand runtime activation forever.
  sessionState.autoTerminalDone = false;
  // Environment preparation has already proved `sh` is available. Show a
  // clear status while the interactive task is attached.
  sessionState.autoTerminalStarting = true;
  const controller = new AbortController();
  sessionState.autoTerminalController = controller;
  renderTerminals();
  let started = false;
  try {
    const r = await fetch('/api/sessions/' + encodeURIComponent(expectedSessionId) + '/tasks', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ command: 'sh', interactive: true, rows: 30, cols: 100 }),
      signal: controller.signal,
    });
    const j = await r.json().catch(() => ({}));
    if (!ownsRuntime()) return false;
    if (r.ok && j.id) {
      sessionState.activeTerminalId = j.id;
      sessionState.autoTerminalDone = true;
      started = true;
    } else {
      sessionState.autoTerminalDone = false;
      await reconcileSessionAfterRuntimeFailure(expectedSessionId, sessionState);
      if (!ownsRuntime()) return false;
      if (r.status === 409 && sessionEnvironmentReady(sessionState)) {
        // A concurrent tab may have started Ways after our Results read. A
        // still-Ready 409 is ownership contention, not a broken terminal;
        // restore the durable set instead of surfacing an expected error.
        sessionState.attemptRestorePending = true;
        await restoreThreadVariants(expectedSessionId);
        return false;
      }
      toast('Auto terminal failed', j && j.error ? j.error : ('HTTP ' + r.status), 'err');
    }
  } catch (e) {
    if (!ownsRuntime()) return false;
    sessionState.autoTerminalDone = false;
    await reconcileSessionAfterRuntimeFailure(expectedSessionId, sessionState);
    if (!ownsRuntime()) return false;
    console.warn('auto-start terminal failed:', e);
    toast('Auto terminal failed', String(e), 'err');
  } finally {
    if (S.session === sessionState && sessionState.autoTerminalController === controller) {
      sessionState.autoTerminalController = null;
    }
    if (ownsRuntime()) {
      sessionState.autoTerminalStarting = false;
      if (sessionEnvironmentReady(sessionState)) await refreshSessionTasks(expectedSessionId);
      else renderTerminals();
    }
  }
  return started;
}
function closeCockpit(options = {}) {

// ── Browser pane ──
S.browser = { url: null, suggestions: [], seen: new Set(), history: [], histIdx: -1 };
const URL_RE = /\bhttps?:\/\/(?:localhost|127\.0\.0\.1|0\.0\.0\.0)(?::\d{2,5})?(?:\/[^\s'"<>`]*)?/g;

function detectUrlsFromTasks() {
  const tasks = S.session.tasks || [];
  let added = false;
  for (const t of tasks) {
    const text = (t.log || '') + ' ' + (t.command || '');
    const m = text.match(URL_RE);
    if (!m) continue;
    for (const raw of m) {
      // Normalize 0.0.0.0 → localhost (browsers can't reach 0.0.0.0).
      const u = raw.replace('://0.0.0.0', '://localhost').replace('://127.0.0.1', '://localhost');
      if (!S.browser.seen.has(u)) {
        S.browser.seen.add(u);
        S.browser.suggestions.unshift(u);
        added = true;
        appendPreviewCard(u);   // surface it as a card in the conversation
      }
    }
  }
  if (added) renderBrowserSuggestions();
}

function renderBrowserSuggestions() {
  const bar = $('#bx-suggest'); if (!bar) return;
  const sug = S.browser.suggestions.slice(0, 6);
  if (!sug.length) { bar.classList.add('hide'); return; }
  bar.innerHTML = '';
  bar.classList.remove('hide');
  sug.forEach(u => {
    const chip = el('span', 'bx-chip');
    const open = el('button', 'bx-chip-open', u);
    open.type = 'button';
    open.setAttribute('aria-label', `Open preview ${u}`);
    open.addEventListener('click', () => browserGo(u));
    const x = el('button', 'bx-chip-x', '×');
    x.type = 'button';
    x.setAttribute('aria-label', `Remove preview suggestion ${u}`);
    x.addEventListener('click', () => {
      const i = S.browser.suggestions.indexOf(u);
      if (i >= 0) S.browser.suggestions.splice(i, 1);
      renderBrowserSuggestions();
    });
    chip.append(open, x);
    bar.appendChild(chip);
  });
}

// Local logical URLs use a dedicated per-Session/per-port Preview origin. The
// injected picker communicates through a source-and-origin-checked postMessage
// channel; external URLs remain sandboxed and do not get a picker.
// Navigation, history, and proxy routing live in <ax-browser>. What
// stays here is where URLs come from — the shell watches what the agents run —
// and the element picker, which exists to put a reference into the conversation.
function browserGo(rawUrl) {
  if (presentSessionRuntimeGate('Preview')) return;
  const bx = $('#browser'); if (!bx) return;
  bx.go(rawUrl);
  // Picking is per-page state; a navigation ends it.
  setBrowserPicking(false);
  if (S.browser.hier) closeDomHier(false);
}

function monitorPreviewRuntimeActivation(event) {
  const browser = $('#browser');
  const expectedSessionId = browser?.session;
  if (!browser || !expectedSessionId || expectedSessionId !== S.session.id) return;
  const logicalUrl = event.detail?.url || '';
  const proxied = browser.proxied(logicalUrl);
  try {
    const previewUrl = new URL(proxied, location.href);
    if (!previewUrl.hostname.startsWith(`${expectedSessionId}-p`)
        || !previewUrl.hostname.endsWith('.localhost')) return;
  } catch { return; }
  const sessionState = S.session;
  const frame = browser.frame;
  if (!frame) return;
  const reconcile = () => {
    if (browser.frame !== frame || S.session !== sessionState) return;
    void reconcileSessionAfterRuntimeFailure(expectedSessionId, sessionState);
  };
  frame.addEventListener('error', reconcile, { once: true });
  frame.addEventListener('load', () => {
    if (browser.frame !== frame || S.session !== sessionState) return;
    const timing = performance.getEntriesByName(frame.src).at(-1);
    let structuredError = false;
    try {
      if (frame.contentDocument?.contentType?.includes('json')) {
        const body = JSON.parse(frame.contentDocument.body?.textContent || '{}');
        structuredError = typeof body?.error === 'string' && Boolean(body.error);
      }
    } catch {}
    if (Number(timing?.responseStatus || 0) >= 400 || structuredError) reconcile();
  }, { once: true });
}

function browserBack() { $('#browser')?.back(); }
function browserForward() { $('#browser')?.forward(); }
function browserReload() { $('#browser')?.reload(); }
/** The component owns its own back/forward state. */
function updateBrowserNavButtons() {}

// ── DOM picker ──
// The frame lives inside the component's shadow root now, so the picker asks
// for it rather than querying the document — the same reference, reached the
// way the component publishes it.
function getBrowserIframe() { return $('#browser')?.frame || null; }

function browserFrameOrigin(frame = getBrowserIframe()) {
  try {
    const url = new URL(frame?.src || '', location.href);
    const sessionId = $('#browser')?.session;
    const prefix = `${sessionId || ''}-p`;
    const logicalPort = url.hostname.slice(prefix.length, -'.localhost'.length);
    // Only the dedicated Preview virtual host owns the picker bridge. An
    // external page may still be viewed in the sandboxed frame, but it must
    // never become a trusted postMessage peer merely because it is the
    // frame's current `src`.
    if (url.protocol !== location.protocol
        || url.port !== location.port
        || !sessionId
        || !url.hostname.startsWith(prefix)
        || !/^\d+$/.test(logicalPort)
        || Number(logicalPort) < 1
        || Number(logicalPort) > 65535
        || !url.hostname.endsWith('.localhost')) return null;
    return url.origin === 'null' ? null : url.origin;
  } catch { return null; }
}

function setBrowserPicking(on) {
  S.browser.picking = !!on;
  const btn = $('#bx-pick');
  if (btn) {
    btn.classList.toggle('active', !!on);
    btn.setAttribute('aria-pressed', String(!!on));
    btn.textContent = on ? 'Stop inspecting' : 'Inspect element';
  }
  const f = getBrowserIframe();
  const targetOrigin = browserFrameOrigin(f);
  if (!f || !f.contentWindow || !targetOrigin) return;
  try {
    f.contentWindow.postMessage({ kind: on ? 'axo-tap:start' : 'axo-tap:cancel' }, targetOrigin);
  } catch {}
}

function toggleBrowserPick() {
  if (!S.browser.url) {
    toast('Open a page first', 'Enter a URL above, then choose Inspect element.', 'err');
    return;
  }
  // The picker is injected only into Session-proxied local applications.
  try {
    const u = new URL(S.browser.url);
    const isLocal = u.hostname === 'localhost' || u.hostname === '127.0.0.1' || u.hostname === '0.0.0.0';
    if (!isLocal) {
      toast('Picker only works on local URLs', 'External pages do not receive the Session element-picker script.', 'err');
      return;
    }
  } catch {}
  setBrowserPicking(!S.browser.picking);
}

// Hierarchy panel state — held while the user is choosing a level.
S.browser.hier = null;  // { chain, selectedIndex, html, url, selector }

function postToIframe(msg) {
  const f = getBrowserIframe();
  const targetOrigin = browserFrameOrigin(f);
  if (!f || !f.contentWindow || !targetOrigin) return;
  try { f.contentWindow.postMessage(msg, targetOrigin); } catch {}
}

function openDomHier(chain, selectedIndex, url, selector, html) {

function closeDomHier(confirmed) {

function renderDomHier() {
  const h = S.browser.hier;

  if (!h || !list) return;
  list.innerHTML = '';
  h.chain.forEach((node, i) => {
    const active = i === h.selectedIndex;
    const row = el('button', 'dom-hier-row' + (active ? ' active' : ''));
    row.type = 'button';
    row.setAttribute('aria-pressed', String(active));
    const indent = '·'.repeat(i);  // visual depth, padded with a dot per level
    row.appendChild(el('span', 'indent', indent));
    row.appendChild(el('span', 'label', node.label || node.tag || '(node)'));
    row.title = node.selector || '';
    row.addEventListener('mouseenter', () => postToIframe({ kind: 'axo-tap:hover-level', level: i }));
    row.addEventListener('mouseleave', () => postToIframe({ kind: 'axo-tap:unhover' }));
    row.addEventListener('click', () => selectHierLevel(i));
    list.appendChild(row);
  });
  if (snip) snip.textContent = (h.html || '').slice(0, 1200) + (h.html && h.html.length > 1200 ? '\n…' : '');

function selectHierLevel(i) {

function confirmDomHier() {
  const h = S.browser.hier;
  if (!h) return;

    kind: 'dom',
