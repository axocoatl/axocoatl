// ╔════════════════════ Unified live WebSocket ════════════════════╗
// The dashboard's only live transport — lattice events, workflow tokens,
// and chat all flow over one reconnecting socket.
let axoWs = null;
let wsBackoff = 500;

function connectWs() {
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
  axoWs = new WebSocket(url);
  axoWs.addEventListener('open', () => { wsBackoff = 500; });
  axoWs.addEventListener('message', (e) => {
    let d; try { d = JSON.parse(e.data); } catch { return; }
    handleWsFrame(d);
  });
  axoWs.addEventListener('close', () => {
    setTimeout(connectWs, wsBackoff);
    wsBackoff = Math.min(wsBackoff * 2, 10000); // exponential backoff, capped
  });
  axoWs.addEventListener('error', () => { try { axoWs.close(); } catch {} });
}

function wsSend(obj) {
  if (axoWs && axoWs.readyState === WebSocket.OPEN) {
    axoWs.send(JSON.stringify(obj));
    return true;
  }
  return false;
}

// ── Attempts, across every session ─────────────────────────────────────
//
// A run key is `{session}#{i}`, so a lane frame can be attributed to its session
// without that session being the one on screen. That is the whole point: the
// failure of parallel work is not being unable to see it, it is not noticing one
// stopped — and the one that stopped is usually in a session you navigated away
// from.
const _attempts = new Map();   // session id -> Map(lane index -> state)
const _attemptSetIds = new Map(); // session id -> HTTP-authoritative durable set id
const _announcedAttemptSetIds = new Map(); // raw LaneStarted/snapshot ownership claims
const _laneAttemptSetIds = new Map(); // claims accepted against the HTTP current set
const _pendingAttemptFrames = new Map(); // run -> { attemptSetId, frames }
const _backgroundAttemptReads = new Map();
const _backgroundAttemptRefreshAgain = new Set();

function clearAttemptRunOwnership(sessionId, clearAnnouncements = false) {
  for (const run of [..._laneAttemptSetIds.keys()]) {
    if (laneKeyParts(run)?.session === sessionId) _laneAttemptSetIds.delete(run);
  }
  if (clearAnnouncements) {
    for (const run of [..._announcedAttemptSetIds.keys()]) {
      if (laneKeyParts(run)?.session === sessionId) _announcedAttemptSetIds.delete(run);
    }
    for (const run of [..._pendingAttemptFrames.keys()]) {
      if (laneKeyParts(run)?.session === sessionId) _pendingAttemptFrames.delete(run);
    }
  }
}

function attemptFrameRun(frame) {
  if (['token', 'reasoning', 'tool-call'].includes(frame?.kind)) return frame.workflow || null;
  if (['session-start', 'session-done', 'session-error'].includes(frame?.kind)) {
    return frame.session || null;
  }
  return null;
}

/**
 * Hold frames whose LaneStarted claim arrived before the authoritative start
 * response/results read. They are released only after HTTP proves that exact
 * set owns the session, closing the first-token race without allowing a stale
 * socket frame to leak into a newer attempt turn.
 */
function queueUnownedAttemptFrame(frame) {
  const run = attemptFrameRun(frame);
  if (!run || !laneKeyParts(run) || attemptRunOwnerMatches(run)) return false;
  const attemptSetId = _announcedAttemptSetIds.get(run);
  if (!attemptSetId) return false;
  let pending = _pendingAttemptFrames.get(run);
  if (!pending || pending.attemptSetId !== attemptSetId) {
    pending = { attemptSetId, frames: [] };
    _pendingAttemptFrames.set(run, pending);
  }
  const previous = pending.frames[pending.frames.length - 1];
  if (previous && ['token', 'reasoning'].includes(frame.kind)
      && previous.kind === frame.kind && attemptFrameRun(previous) === run) {
    const merged = String(previous.delta || '') + String(frame.delta || '');
    previous.delta = merged.length > 262144 ? merged.slice(-262144) : merged;
  } else {
    pending.frames.push({ ...frame });
  }
  // A delayed HTTP response should be brief. Bound pathological streams; the
  // durable output artifact remains the full recovery authority at completion.
  if (pending.frames.length > 1024) pending.frames.splice(0, pending.frames.length - 1024);
  return true;
}

function flushPendingAttemptFrames(run, attemptSetId) {
  const pending = _pendingAttemptFrames.get(run);
  if (!pending || pending.attemptSetId !== attemptSetId) return;
  _pendingAttemptFrames.delete(run);
  for (const frame of pending.frames) handleWsFrame(frame);
}

/** Install the current set learned from HTTP, then accept only matching stream claims. */
function installAttemptSetOwnership(sessionId, attemptSetId) {
  clearAttemptRunOwnership(sessionId);
  _attemptSetIds.set(sessionId, attemptSetId);
  const acceptedRuns = [];
  for (const [run, announcedSetId] of _announcedAttemptSetIds) {
    if (announcedSetId === attemptSetId && laneKeyParts(run)?.session === sessionId) {
      _laneAttemptSetIds.set(run, attemptSetId);
      acceptedRuns.push(run);
    }
  }
  acceptedRuns.forEach(run => flushPendingAttemptFrames(run, attemptSetId));
}

function attemptRailStates(map) {
  return [...map.entries()].sort((a, b) => a[0] - b[0]).map(entry => entry[1]);
}

/** A successful start owns a fresh rail roster for this session. */
function beginAttemptRailSet(sessionId, attemptSetId, lanes) {
  installAttemptSetOwnership(sessionId, attemptSetId);
  const states = new Map();
  (lanes || []).forEach(lane => states.set(lane.index, 'run'));
  _attempts.set(sessionId, states);
  railAttempts(sessionId, attemptRailStates(states));
}

/** Rebuild the rail from durable lifecycle/verdict facts, never stale dots. */
function syncAttemptRailFromThread(tv) {
  if (!tv?.sessionId || !tv?.attemptSetId) return;
  const previous = _attemptSetIds.get(tv.sessionId) === tv.attemptSetId
    ? _attempts.get(tv.sessionId) : null;
  installAttemptSetOwnership(tv.sessionId, tv.attemptSetId);
  const states = new Map();
  tv.variants.forEach(variant => {
    let state = 'run';
    if (variant.verdict) {
      state = variant.verdict.passed && variant.verdict.changed_files > 0 ? 'pass' : 'fail';
    } else if (variant.laneState === 'completed') {
      state = 'done'; // neutral terminal dot: complete, not yet verified
    } else if (isAttemptTerminal(variant.laneState)) {
      state = 'fail';
    }
    // A durable running state does not mean a pending approval stopped needing
    // a person. Only terminal execution or a verdict resolves that rail fact.
    if (state === 'run' && previous?.get(variant.index) === 'need') state = 'need';
    states.set(variant.index, state);
  });
  _attempts.set(tv.sessionId, states);
  railAttempts(tv.sessionId, attemptRailStates(states));
}

function syncAttemptRailFromResults(sessionId, results) {
  const set = results?.attempt_set;
  if (!set) {
    clearAttemptRailForSet(sessionId, null);
    return;
  }
  if (set.session_id !== sessionId || !Array.isArray(set.lanes)) return;
  const laneStates = Array.isArray(results.lane_states) ? results.lane_states : [];
  const verdicts = Array.isArray(results.verdicts) ? results.verdicts : [];
  const previous = _attemptSetIds.get(sessionId) === set.id ? _attempts.get(sessionId) : null;
  installAttemptSetOwnership(sessionId, set.id);
  const states = new Map();
  for (const lane of set.lanes) {
    const fact = laneStates.find(item => item.index === lane.index);
    const verdict = verdicts.find(item => item.index === lane.index);
    let state = 'run';
    if (verdict) state = verdict.passed && verdict.changed_files > 0 ? 'pass' : 'fail';
    else if (fact?.state === 'completed') state = 'done';
    else if (isAttemptTerminal(fact?.state)) state = 'fail';
    if (state === 'run' && previous?.get(lane.index) === 'need') state = 'need';
    states.set(lane.index, state);
  }
  _attempts.set(sessionId, states);
  railAttempts(sessionId, attemptRailStates(states));
}

function refreshBackgroundAttemptSet(sessionId) {
  if (!sessionId) return;
  if (sessionId === S.session.id) {
    S.session.attemptRestorePending = true;
    void restoreThreadVariants(sessionId);
    scheduleThreadVariantRestore(sessionId);
    return;
  }
  if (_backgroundAttemptReads.has(sessionId)) {
    _backgroundAttemptRefreshAgain.add(sessionId);
    return;
  }
  const read = attemptJson('/api/sessions/' + encodeURIComponent(sessionId) + '/variants/results')
    .then(results => syncAttemptRailFromResults(sessionId, results))
    .catch(() => {})
    .finally(() => {
      if (_backgroundAttemptReads.get(sessionId) === read) {
        _backgroundAttemptReads.delete(sessionId);
        if (_backgroundAttemptRefreshAgain.delete(sessionId)) refreshBackgroundAttemptSet(sessionId);
      }
    });
  _backgroundAttemptReads.set(sessionId, read);
}

/** Clear only the decision's set; a stale event cannot erase a newer roster. */
function clearAttemptRailForSet(sessionId, attemptSetId) {
  const knownSetId = _attemptSetIds.get(sessionId);
  if (attemptSetId && knownSetId && knownSetId !== attemptSetId) return false;
  _attempts.delete(sessionId);
  _attemptSetIds.delete(sessionId);
  clearAttemptRunOwnership(sessionId, true);
  railAttempts(sessionId, []);
  return true;
}

/** Split `{session}#{n}` into its parts, or null if it is not a lane key. */
function laneKeyParts(key) {
  const i = String(key || '').lastIndexOf('#');
  if (i < 0) return null;
  const n = parseInt(key.slice(i + 1), 10);
  return Number.isInteger(n) ? { session: key.slice(0, i), lane: n } : null;
}

function noteAttempt(key, state) {
  const p = laneKeyParts(key); if (!p) return;
  if (!_attempts.has(p.session)) _attempts.set(p.session, new Map());
  const m = _attempts.get(p.session);
  // "needs you" outranks live activity: an attempt can keep emitting frames
  // while it waits, and losing the blocked state to a later token is exactly
  // the miss this exists to prevent. A verdict clears it — that is a decision.
  const settled = state === 'done' || state === 'pass' || state === 'fail';
  if (settled || state === 'need' || m.get(p.lane) !== 'need') m.set(p.lane, state);
  railAttempts(p.session, attemptRailStates(m));
}

function attemptRunOwnerMatches(run) {
  const parts = laneKeyParts(run);
  if (!parts) return false;
  const currentSetId = _attemptSetIds.get(parts.session);
  return Boolean(currentSetId && _laneAttemptSetIds.get(run) === currentSetId);
}

function handleWsFrame(d) {
  $('#settings-automations')?.handleFrame?.(d);
  if (queueUnownedAttemptFrame(d)) return;
  // Attribute every lane-scoped frame before the per-kind handling, so the rail
  // reflects sessions the cockpit is not currently showing.
  switch (d.kind) {
    case 'lane-started': {
      const run = d.run || d.workflow;
      const parts = laneKeyParts(run);
      const sessionId = d.session || parts?.session;
      if (!run || !sessionId || !d.attempt_set_id) break;
      const pending = _pendingAttemptFrames.get(run);
      if (pending && pending.attemptSetId !== d.attempt_set_id) {
        _pendingAttemptFrames.delete(run);
      }
      _announcedAttemptSetIds.set(run, d.attempt_set_id);
      const authoritativeSetId = _attemptSetIds.get(sessionId);
      if (authoritativeSetId === d.attempt_set_id) {
        _laneAttemptSetIds.set(run, d.attempt_set_id);
        flushPendingAttemptFrames(run, d.attempt_set_id);
        noteAttempt(run, 'run');
      } else {
        _laneAttemptSetIds.delete(run);
      }
      if (sessionId === S.session.id) {
        const tv = S.threadVariants;
        if (authoritativeSetId !== d.attempt_set_id
            || !tv || tv.attemptSetId !== d.attempt_set_id) {
          S.session.attemptRestorePending = true;
          void restoreThreadVariants(sessionId);
          scheduleThreadVariantRestore(sessionId);
        } else {
          scheduleThreadVariantPoll();
        }
        refreshCompare(sessionId);
        refreshAttempts(sessionId);
      } else if (authoritativeSetId !== d.attempt_set_id) refreshBackgroundAttemptSet(sessionId);
      break;
    }
    case 'token':
    case 'reasoning':
    case 'tool-call': if (attemptRunOwnerMatches(d.workflow)) noteAttempt(d.workflow, 'run'); break;
    case 'session-done': if (attemptRunOwnerMatches(d.session)) noteAttempt(d.session, 'done'); break;
    case 'session-error': if (attemptRunOwnerMatches(d.session)) noteAttempt(d.session, 'fail'); break;
    case 'mcp-approval-required':
      if (d.run && attemptRunOwnerMatches(d.run)) noteAttempt(d.run, 'need');
      break;
    case 'mcp-approval-resolved':
      // Resolved elsewhere; the next frame from that lane restores 'run'.
      break;
    case 'lane-verified': {
      const knownSetId = _attemptSetIds.get(d.session);
      if (!d.attempt_set_id || knownSetId !== d.attempt_set_id) {
        refreshBackgroundAttemptSet(d.session);
        break;
      }
      // A verdict changes the scoreboard; re-read rather than patch, so the
      // pane and the daemon cannot drift.
      if (d.session === S.session.id) {
        refreshCompare(d.session);
        // The final verdict file lands just after the per-lane frame. A short
        // delayed read catches it and updates inline Keep gating from evidence.
        setTimeout(() => { if (S.session.id === d.session) void refreshThreadVariantStatus(); }, 250);
      }
      const sess = d.session;
      if (sess) {
        if (!_attempts.has(sess)) _attempts.set(sess, new Map());
        _attempts.get(sess).set(d.index, d.passed && d.changed_files > 0 ? 'pass' : 'fail');
        const m = _attempts.get(sess);
        railAttempts(sess, attemptRailStates(m));
      }
      break;
    }
  }

  switch (d.kind) {
    case 'ready':
    case 'pong':
      break;

    // Sent on connect — re-attach the live view to any run already in flight
    // (e.g. the page was reloaded mid-run).
    case 'snapshot': {
      const snapshotRuns = Array.isArray(d.runs) ? d.runs : [];
      const snapshotApprovals = Array.isArray(d.approvals) ? d.approvals : [];
      // Approvals are their own authoritative snapshot collection. A run's
      // generic `awaiting` summary cannot recreate argument/tool detail and
      // cannot represent unscoped or multiple parallel approvals.
      reconcileMcpApprovals(snapshotApprovals);
      const approvalRuns = new Set(snapshotApprovals.map(item => item?.run).filter(Boolean));
      const runs = snapshotRuns.filter(r => (r.kind || 'workflow') === 'workflow');
      const attemptRuns = snapshotRuns.filter(r => r.kind === 'attempt' && r.attempt_set_id);
      // Snapshot is the complete live-run ownership view. Replace the stream
      // claims, but keep the HTTP current-set ids until results refreshes them.
      _announcedAttemptSetIds.clear();
      _laneAttemptSetIds.clear();
      _pendingAttemptFrames.clear();
      const sessionsToRefresh = new Set([
        ..._attemptSetIds.keys(),
        ...(S.sessions || []).map(session => session.id).filter(Boolean),
      ]);
      if (!(S.sessions || []).length) {
        void attemptJson('/api/sessions').then((sessions) => {
          for (const session of (Array.isArray(sessions) ? sessions : [])) {
            if (session?.id) refreshBackgroundAttemptSet(session.id);
          }
        }).catch(() => {});
      }
      for (const run of attemptRuns) {
        const parts = laneKeyParts(run.workflow);
        if (!parts) continue;
        sessionsToRefresh.add(parts.session);
        _announcedAttemptSetIds.set(run.workflow, run.attempt_set_id);
        if (_attemptSetIds.get(parts.session) === run.attempt_set_id) {
          _laneAttemptSetIds.set(run.workflow, run.attempt_set_id);
          noteAttempt(run.workflow, approvalRuns.has(run.workflow) ? 'need' : 'run');
        }
      }
      for (const sessionId of sessionsToRefresh) {
        if (sessionId === S.session.id) {
          S.session.attemptRestorePending = true;
          void restoreThreadVariants(sessionId);
          scheduleThreadVariantRestore(sessionId);
        } else {
          refreshBackgroundAttemptSet(sessionId);
        }
      }
      if (S.session.id) {
        refreshCompare(S.session.id);
        refreshAttempts(S.session.id);
      }
      if (runs.length) toast('Reconnected', `Re-attached to ${runs.length} live run${runs.length === 1 ? '' : 's'}`, 'info');
      break;
    }

    // A lattice coordination event.
    case 'event': {
      rvWorkerEvent(d);
      if (S.session.id && d.workflow === S.session.id) sessionLatticeEvent(d);
      break;
    }

    // A streamed token / reasoning chunk — routed to the session cockpit when
    // the run id matches the open session. Workflows fire silently from the
    // Automations card or palette; their component owns run status/history.
    case 'token': {
      const ln = variantLaneFor(d.workflow);
      if (ln !== null) {
        if (threadVariantFrameMatches(d.workflow)) threadVariantToken(ln, d.delta);
        break;
      }
      if (S.session.id && d.workflow === S.session.id) sessionAppendText(d.delta);
      break;
    }
    case 'reasoning':
      if (S.session.id && d.workflow === S.session.id) sessionAppendReasoning(d.delta);
      break;

    // A tool call from a running agent.
    case 'tool-call': {
      const ln = variantLaneFor(d.workflow);
      // In-thread variants stream text into their pill, not tool lines —
      // a variant-keyed tool call has no surface, so swallow it.
      if (ln !== null) break;
      if (S.session.id && d.workflow === S.session.id) {
        if (d.phase === 'start') sessionToolStart(d);
        else sessionToolResult(d);
      }
      break;
    }

    // A coordinator decomposed a goal and auctioned its subtasks — open the
    // Layer-2 run view and follow it live (workers arrive as run-scoped events).
    case 'coordinator-plan':
      onCoordinatorPlan(d);
      break;

    // Workflow run finished.
    case 'workflow-done':
      onWorkflowDone(d);
      break;
    case 'workflow-error':
      onWorkflowError(d);
      break;

    // Session run lifecycle.
    case 'session-start':
      // Single-agent sessions emit no AgentActivated events — drive the one
      // node from the run lifecycle instead.
      if (S.session.id === d.session && (S.session.agents || []).length === 1) {
        sessionLatticeStatus(S.session.agents[0], 'running');
      }
      break;
    case 'session-done': {
      // Only the session's own turn: an attempt finishing is reported by the
      // attempts pane, and a card per attempt would bury the thread.
      if (d.session === S.session.id) setTimeout(appendChangesCard, 300);
      const ln = variantLaneFor(d.session);
      if (ln !== null) {
        if (threadVariantFrameMatches(d.session)) threadVariantStatus(ln, 'completed');
        refreshCompare(S.session.id);
        break;
      }
      if (S.session.id === d.session) {
        S.session.streamEl = null;
        setThinking($('#session-msgs'), false);
        (S.session.agents || []).forEach(a => sessionLatticeStatus(a, 'success'));
        $('#cockpit-status').textContent =
          'done · ' + (d.input_tokens || 0) + ' in / ' + (d.output_tokens || 0) + ' out';
        setCockpitLive('done', 'done');
        refreshFileTree();
        refreshGitPane();
        appendChangeCard();   // the agent's edits, as a card in the flow
        if (window.hljs) {
          $$('#session-msgs pre code').forEach(c => {
            try { if (!c.dataset.hl) { window.hljs.highlightElement(c); c.dataset.hl = '1'; } } catch {}
          });
        }
      }
      break;
    }
    case 'session-error': {
      const lne = variantLaneFor(d.session);
      if (lne !== null) {
        if (threadVariantFrameMatches(d.session)) threadVariantStatus(lne, 'failed');
        refreshCompare(S.session.id);
        break;
      }
      if (S.session.id === d.session) {
        S.session.streamEl = null;
        setThinking($('#session-msgs'), false);
        const e = el('div', 'smsg');
        e.appendChild(el('div', 'smsg-role', 'error'));
        e.appendChild(el('div', 'smsg-body', d.error || 'session failed'));
        appendSessionEl(e);
        $('#cockpit-status').textContent = 'error';
        setCockpitLive('error', 'error');
      }
      break;
    }

    case 'mcp-approval-required':
      // Show the approval modal. Multiple approvals can be in flight; the
      // queue serializes them so the user isn't flooded with overlapping
      // dialogs from a parallel run.
      enqueueMcpApproval(d);
      break;
    case 'mcp-approval-resolved':
      // Another tab decided — drop this id from the queue if it's still
      // there (closes any stale modal we have open).
      dismissMcpApproval(d.approval_id);
      break;
  }
}

function onWorkflowDone(d) {
  toast('Workflow complete', `${(d.completed || []).length} agents · ${fmtNum(d.tokens || 0)} tokens`, 'ok');
  rvWorkflowDone(d);
  try { refreshTopStats(); } catch {}
}

function onWorkflowError(d) {
  toast('Workflow failed', d.error || 'unknown error', 'err');
  if (S.runView && d.workflow === S.runView.workflow) {
    S.runView.status = 'error';
    S.runView.synthesis = d.error || 'run failed';
    renderRunView();
  }
}

// ╔══════════════════ Coordinator run view (Layer-2) ══════════════════╗
// The live process tree for one coordinator run: goal → decompose →
// auction → workers → synthesis. Built entirely from the stream bus:
//   coordinator-plan  → the goal + subtasks + per-subtask auction outcome
//   event (run-scoped)→ each winning worker's running / done / error + output
//   workflow-done     → the coordinator's synthesis
// One run is held at a time and kept after it finishes, so a coordinator
// node can re-open its last run.

function onCoordinatorPlan(d) {
  S.runView = {
    workflow: d.workflow,
    coordinator: d.coordinator,
    goal: d.goal || '',
    subtasks: d.subtasks || [],
    workers: {},          // workerId → { status, output, tokens }
    synthesis: '',
    status: 'running',
  };
  // Seed each winning worker as queued so the whole plan shows before any
  // worker reports in.
  (d.subtasks || []).forEach(s => {
    if (s.winner) S.runView.workers[s.winner] = { status: 'queued', output: '', tokens: 0 };
  });
  openRunView();
  renderRunView();
}

// Fold a worker lifecycle event into the open run if it belongs to it.
// Returns true when consumed (so the caller knows it was run-scoped).
function rvWorkerEvent(d) {
  const rv = S.runView;
  if (!rv || !rv.workflow || d.workflow !== rv.workflow || !d.agent) return false;
  const t = d.type || '';
  // The coordinator's own completion carries the synthesis — fold it into the
  // synthesis phase, not the worker list. This always arrives (the activation
  // layer publishes it), so the run view shows the result even if the separate
  // workflow-done frame is missed.
  if (d.agent === rv.coordinator) {
    if (t === 'TaskCompleted') {
      if (d.output != null) rv.synthesis = String(d.output);
      if (d.tokens != null) rv.tokens = d.tokens;
      rv.status = 'done';
      renderRunView();
      return true;
    }
    if (t === 'AgentFailed') { rv.status = 'error'; renderRunView(); return true; }
    return false;  // the coordinator's own activation — the goal phase covers it
  }
  const w = rv.workers[d.agent] || (rv.workers[d.agent] = { status: 'queued', output: '', tokens: 0 });
  if (t === 'AgentActivated') {
    w.status = 'running';
  } else if (t === 'TaskCompleted') {
    w.status = 'done';
    if (d.output != null) w.output = String(d.output);
    if (d.tokens != null) w.tokens = d.tokens;
  } else if (t === 'AgentFailed') {
    w.status = 'error';
  } else {
    return false;
  }
  renderRunView();
  return true;
}

function rvWorkflowDone(d) {
  const rv = S.runView;
  if (!rv || d.workflow !== rv.workflow) return;
  rv.synthesis = d.output || '';
  rv.status = 'done';
  rv.tokens = d.tokens || 0;
  renderRunView();
}

function openRunView() { $('#run-view-modal')?.classList.remove('hide'); }
function closeRunView() { $('#run-view-modal')?.classList.add('hide'); }

// Open (or re-open) the run view for a specific coordinator — used by the
// "View run →" affordance on a coordinator node. Shows the last run if one is
// held, otherwise an idle shell.
function openCoordinatorRunView(coordinatorId) {
  if (!S.runView || S.runView.coordinator !== coordinatorId) {
    S.runView = {
      workflow: null, coordinator: coordinatorId, goal: '',
      subtasks: [], workers: {}, synthesis: '', status: 'idle',
    };
  }
  openRunView();
  renderRunView();
}

function renderRunView() {
  const rv = S.runView;
  const body = $('#run-view-body');
  if (!rv || !body) return;

  $('#run-view-title').textContent = (rv.coordinator || 'coordinator') + ' · run';
  const st = $('#run-view-status');
  st.className = 'run-view-status ' + (rv.status === 'idle' ? '' : rv.status);
  st.textContent = rv.status === 'done'  ? 'done'
                 : rv.status === 'error' ? 'failed'
                 : rv.status === 'idle'  ? 'idle'
                                         : 'running';

  body.innerHTML = '';

  // ── Goal
  const gp = el('div', 'rv-phase done');
  gp.appendChild(el('div', 'rv-phase-label', 'Goal'));
  gp.appendChild(el('div', 'rv-goal', rv.goal || '—'));
  body.appendChild(gp);

  // ── Decompose · auction · workers
  const tasksDone = rv.subtasks.length > 0 && rv.subtasks.every(s => {
    const w = rv.workers[s.winner];
    return w && (w.status === 'done' || w.status === 'error');
  });
  const pp = el('div', 'rv-phase ' + (rv.status === 'idle' ? '' : tasksDone ? 'done' : 'active'));
  pp.appendChild(el('div', 'rv-phase-label',
    rv.subtasks.length
      ? `Decompose · auction · ${rv.subtasks.length} subtask${rv.subtasks.length === 1 ? '' : 's'}`
      : 'Decompose · auction'));

  if (!rv.subtasks.length) {
    pp.appendChild(el('div', 'rv-out empty',
      rv.status === 'idle' ? 'No run yet — fire a workflow to watch this coordinator work.' : 'Decomposing…'));
  }

  rv.subtasks.forEach(s => {
    const w = rv.workers[s.winner] || { status: 'queued', output: '', tokens: 0 };
    const card = el('div', 'rv-task');

    const head = el('div', 'rv-task-head');
    head.appendChild(el('span', 'rv-dot ' + (w.status === 'queued' ? '' : w.status)));
    head.appendChild(el('span', 'rv-task-name', s.name || 'subtask'));
    const win = el('span', 'rv-winner');
    win.innerHTML = 'won by <span class="nm">' + escHtml(s.winner || '—') + '</span>'
      + (s.score ? ' · ' + Number(s.score).toFixed(2) : '');
    head.appendChild(win);
    if (s.adhoc) head.appendChild(el('span', 'rv-adhoc', 'ad-hoc'));
    card.appendChild(head);

    if (s.description) card.appendChild(el('div', 'rv-task-desc', s.description));

    if (s.bids && s.bids.length) {
      const bids = el('div', 'rv-bids');
      s.bids.forEach(b => {
        const cls = 'rv-bid' + (b.worker === s.winner ? ' win' : '') + (Number(b.score) === 0 ? ' zero' : '');
        bids.appendChild(el('span', cls, b.worker + ' ' + Number(b.score).toFixed(2)));
      });
      card.appendChild(bids);
    }

    const out = el('div', 'rv-out' + (w.output ? '' : ' empty'));
    out.textContent = w.output
      || (w.status === 'running' ? 'working…' : w.status === 'error' ? 'failed' : 'queued');
    card.appendChild(out);
    if (w.tokens) card.appendChild(el('div', 'rv-meta', fmtNum(w.tokens) + ' tokens'));

    pp.appendChild(card);
  });
  body.appendChild(pp);

  // ── Synthesis
  const sp = el('div', 'rv-phase' + (rv.status === 'done' ? ' done' : ''));
  sp.appendChild(el('div', 'rv-phase-label', 'Synthesis'));
  const synth = el('div', 'rv-synth' + (rv.synthesis ? '' : ' empty'));
  synth.textContent = rv.synthesis
    || (rv.status === 'idle' ? '—' : 'Waiting for the coordinator to synthesize…');
  sp.appendChild(synth);
  body.appendChild(sp);
}

// Close button, backdrop click, Esc — wired once.
(function wireRunView() {
  $('#run-view-close')?.addEventListener('click', closeRunView);
  $('#run-view-modal')?.addEventListener('click', (e) => {
    if (e.target === $('#run-view-modal')) closeRunView();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('#run-view-modal')?.classList.contains('hide')) closeRunView();
  });
})();

// ╔══════════════════════════════ Init ══════════════════════════════╗
async function init() {
  // The live socket comes up FIRST and never waits on anything.
  //
  // It used to be opened after two awaited fetches. If either rejected — daemon
  // mid-restart — init aborted; if either merely *hung*, init stalled with no
  // error at all, and the app sat there permanently disconnected saying
  // nothing. The socket reconnects on its own and depends on no data, so
  // nothing should be able to strand it.
  connectWs();
  try { await refreshStatus(); } catch {}
  try { await loadAll(); } catch {}
  void $('#session-home')?.refresh?.();
  refreshTopStats();
  setInterval(refreshStatus, 5000);
  setInterval(refreshTopStats, 8000);
  checkLlmHealth();
}

// First-run friendliness: probe configured LLM providers and surface a
// one-time toast with concrete fix-up commands if anything's missing. The
// localStorage flag clears on user dismiss + on each version bump so we
// re-notify if the situation regresses.
async function checkLlmHealth() {
  try {
    const r = await fetch('/api/llm-health');
    if (!r.ok) return;
    const d = await r.json();
    if (!d.ollama || !d.ollama.configured) return;
    if (d.ollama.reachable && (!d.ollama.missing_models || !d.ollama.missing_models.length)) {
      try { localStorage.removeItem('axo.llm-health.warned'); } catch {}
      return;
    }
    const key = 'axo.llm-health.warned:' + JSON.stringify({
      r: d.ollama.reachable, m: d.ollama.missing_models || []
    });
    try { if (localStorage.getItem(key)) return; } catch {}
    if (!d.ollama.reachable) {
      toast('Ollama is not running',
            `Start it with  ollama serve  — then pull a model:  ollama pull llama3.2`,
            'err', 9000);
    } else if (d.ollama.missing_models.length) {
      const cmd = d.ollama.missing_models.map(m => 'ollama pull ' + m).join('  &&  ');
      toast('Missing Ollama model' + (d.ollama.missing_models.length > 1 ? 's' : ''),
            `Run:  ${cmd}`,
            'err', 9000);
    }
    try { localStorage.setItem(key, '1'); } catch {}
  } catch { /* network down — nothing useful to say */ }
}

// The component graph above is a deferred ES module. Starting the classic
// shell while the parser is still running can create detached custom elements
// before their definitions exist; detached candidates are not upgraded when
// the definitions arrive, leaving methods such as <ax-editor>.reset missing.
// DOMContentLoaded fires only after deferred modules have evaluated.
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init, { once: true });
} else {
  init();
}
</script>
