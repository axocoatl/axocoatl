     ships with the page (no extra HTTP round-trip). -->
<link rel="icon" type="image/png" href="/brand/favicon.png" />

<style>
  /* Setup output is durable evidence, not another transcript. Keep the failed
     command readable in place while bounding noisy stdout/stderr to a small,
     independently scrollable review surface. */
  .session-environment-evidence { margin-top: 3px; max-width: min(72ch, 100%); }
  .session-environment-evidence > summary {
    width: fit-content; color: var(--text); cursor: pointer;
    font: var(--fs-xs) var(--font-sans);
  }
  .session-environment-evidence > summary:focus-visible {
    outline: none; border-radius: var(--r-sm); box-shadow: var(--focus-ring);
  }
  .session-environment-evidence dl {
    display: grid; grid-template-columns: max-content minmax(0, 1fr);
    gap: 4px var(--sp-2); margin: var(--sp-2) 0 0;
  }
  .session-environment-evidence dt {
    color: var(--muted); font: var(--fs-xs) var(--font-sans);
  }
  .session-environment-evidence dd { min-width: 0; margin: 0; }
  .session-environment-copy .session-environment-evidence code {
    display: block; width: auto; white-space: pre-wrap; overflow-wrap: anywhere;
    text-overflow: clip;
  }
  .session-environment-evidence pre {
    max-height: 96px; overflow: auto; margin: 0; padding: 4px 6px;
    border-left: 2px solid var(--border); background: var(--bg-3);
    color: var(--muted); font: var(--fs-xs)/1.45 var(--font-mono);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
</style>
<!-- App UI modules. Transitional bridge: this document is still a classic
     script, so the module graph is loaded here and the one helper the classic
     code still needs is handed across. It goes away when the shell itself
     becomes a module. -->
<script type="module">
  import { iconForFile } from '/ui/file-tree.js';
  import '/ui/rail.js';
  import '/ui/launcher.js';
  import '/ui/attempts.js';
  import '/ui/compare.js';
  import '/ui/fanout.js';
  import '/ui/changes.js';
  import '/ui/source-control.js';
  import '/ui/mcp-approval.js';
  import '/ui/session-home.js';
  import '/ui/session-context.js';
  import '/ui/session-history.js';
  import '/ui/settings-agents.js';
  import '/ui/settings-skills.js';
  import '/ui/settings-mcp.js';
  import '/ui/automation-settings.js';
  import '/ui/settings.js';
  import '/ui/terminal.js';
  import '/ui/browser.js';
  import { loadMonaco } from '/ui/editor.js';
  import { MODULES as AX_MODULES } from '/ui/launcher.js';
  import { SETTINGS_SECTIONS as AX_SETTINGS_SECTIONS } from '/ui/settings.js';
  // The palette lists the same modules and settings sections the launcher and
  // the settings dialog do — one source, so a new module appears everywhere.
  window.PALETTE_MODULES = AX_MODULES;
  window.PALETTE_SETTINGS = AX_SETTINGS_SECTIONS;
  // One AMD load for the page: the diff editor in the shell shares it.
  window.axLoadMonaco = loadMonaco;
  // Boot diagnostics: an exception during init() silently strands the app —
  // the live socket never opens and nothing says why. Record them where they
  // can be read instead of vanishing into an empty console.
  window.__bootErrors = [];
  addEventListener('error', (e) => window.__bootErrors.push(String(e.message)));
  addEventListener('unhandledrejection', (e) => window.__bootErrors.push('reject: ' + (e.reason?.message || e.reason)));
  window.iconForFile = iconForFile;
</script>

<script>
// ───── Theme (Light / Dark / System) ─────
// Set as early as possible so first paint already has the right palette.
// Stored as 'light' | 'dark' | 'system'; 'system' falls through to
// matchMedia('prefers-color-scheme: dark') and re-applies if it changes.
const THEME_KEY = 'axo:theme-pref';
function getThemePref() { return localStorage.getItem(THEME_KEY) || 'system'; }
function applyTheme(pref) {
  const effective = (pref === 'system')
    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : pref;
  if (effective === 'light') document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
  // Reflect on the segmented control if it's in the DOM yet.
  document.querySelectorAll('.theme-seg').forEach(b => {
    b.classList.toggle('active', b.dataset.themePref === pref);
  });
  // Propagate to Monaco if it's loaded — the Sessions file editor uses
  // its `vs` (light) and `vs-dark` themes.
  if (window.monaco) {
    try { window.monaco.editor.setTheme(effective === 'light' ? 'vs' : 'vs-dark'); } catch {}
  }
}
function setThemePref(pref) { localStorage.setItem(THEME_KEY, pref); applyTheme(pref); }
applyTheme(getThemePref());
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (getThemePref() === 'system') applyTheme('system');
});
window.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.theme-seg').forEach(b => {
    b.addEventListener('click', () => setThemePref(b.dataset.themePref));
  });
  applyTheme(getThemePref()); // re-stamp once the buttons exist
});

// ───── Helpers ─────
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };

// ───── Toasts ─────
function toast(title, body, kind = 'info', ms = 3500) {
  const t = el('div', `toast ${kind}`);
  t.appendChild(el('div', 't-title', title));
  if (body) t.appendChild(el('div', 't-body', body));
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .25s'; setTimeout(() => t.remove(), 260); }, ms);
}

// ───── In-app modal (axoModal) ─────
// Reusable, promise-based dialog. NEVER use alert/prompt/confirm — they
// look off-brand, block synchronously, and lose the Apple-feel. This is
// the only dialog primitive in the app.
//
// Usage:
//   await axoModal({ title, body }) → null on cancel
//   await axoModal({
//     title: 'Rename chat',
//     fields: [{ key:'name', label:'Name', value:'Old name', kind:'text' }],
//     okLabel: 'Save',
//   }) → { name: '...' } on confirm, null on cancel
//   await axoModal({
//     title: 'Delete?', body: 'This is permanent.',
//     okLabel: 'Delete', okKind: 'danger',
//   }) → true on confirm, false on cancel
//   await axoModal({
//     title: 'Pick agent',
//     choices: [{ value:'architect', label:'architect', sub:'ollama/llama3.2' }, ...],
//   }) → 'architect' on pick, null on cancel
//
// Fields support kind: 'text', 'textarea', 'select' (with `options`), 'file'.
let _axoModalSequence = 0;
function axoDeepActiveElement() {
  let active = document.activeElement;
  while (active?.shadowRoot?.activeElement) active = active.shadowRoot.activeElement;
  return active;
}
function axoModal(spec) {
  return new Promise((resolve) => {
    const returnFocus = axoDeepActiveElement();
    const modalId = `axo-modal-${++_axoModalSequence}`;
    const backdrop = el('div', 'modal-backdrop');
    const modal = el('div', 'modal axo-modal');
    modal.id = modalId;
    modal.setAttribute('role', 'dialog');
    modal.setAttribute('aria-modal', 'true');
    modal.tabIndex = -1;
    backdrop.appendChild(modal);

    if (spec.title) {
      const title = el('div', 'modal-head', spec.title);
      title.id = `${modalId}-title`;
      modal.setAttribute('aria-labelledby', title.id);
      modal.appendChild(title);
    } else {
      modal.setAttribute('aria-label', 'Dialog');
    }

    const body = el('div', 'axo-modal-body');
    modal.appendChild(body);

    if (spec.body) {
      const p = el('div', 'axo-modal-text');
      // body may be a string or a pre-built node
      if (typeof spec.body === 'string') p.textContent = spec.body;
      else p.appendChild(spec.body);
      body.appendChild(p);
    }

    // ── Choice picker (radio list) ──
    let chosenChoice = null;
    if (spec.choices && spec.choices.length) {
      const list = el('div', 'axo-modal-choices');
      list.setAttribute('role', 'listbox');
      spec.choices.forEach((c, i) => {
        const row = el('button', 'axo-modal-choice' + (i === 0 ? ' active' : ''));
        row.type = 'button';
        row.setAttribute('role', 'option');
        row.setAttribute('aria-selected', String(i === 0));
        chosenChoice = chosenChoice || c.value;
        row.dataset.value = c.value;
        const main = el('div', 'axo-modal-choice-main');
        main.appendChild(el('div', 'axo-modal-choice-label', c.label));
        if (c.sub) main.appendChild(el('div', 'axo-modal-choice-sub', c.sub));
        row.appendChild(main);
        row.addEventListener('click', () => {
          list.querySelectorAll('.axo-modal-choice').forEach(r => {
            r.classList.remove('active');
            r.setAttribute('aria-selected', 'false');
          });
          row.classList.add('active');
          row.setAttribute('aria-selected', 'true');
          chosenChoice = c.value;
        });
        // Double-click to confirm-pick in one motion.
        row.addEventListener('dblclick', () => commit());
        list.appendChild(row);
      });
      body.appendChild(list);
    }

    // ── Field inputs ──
    const fieldEls = {};
    if (spec.fields && spec.fields.length) {
      for (const f of spec.fields) {
        const wrap = el('div', 'axo-modal-field');
        const fieldId = `${modalId}-${String(f.key).replace(/[^a-zA-Z0-9_-]/g, '-')}`;
        if (f.label) {
          const label = el('label', 'axo-modal-label', f.label);
          label.htmlFor = fieldId;
          wrap.appendChild(label);
        }
        let input;
        if (f.kind === 'textarea') {
          input = document.createElement('textarea');
          input.className = 'input';
          input.rows = f.rows || 4;
          input.value = f.value || '';
        } else if (f.kind === 'select') {
          input = document.createElement('select');
          input.className = 'select';
          for (const opt of (f.options || [])) {
            const o = document.createElement('option');
            o.value = opt.value;
            o.textContent = opt.label || opt.value;
            if (opt.value === f.value) o.selected = true;
            input.appendChild(o);
          }
        } else if (f.kind === 'file') {
          input = document.createElement('input');
          input.type = 'file';
          input.className = 'axo-modal-file';
          if (f.accept) input.accept = f.accept;
          if (f.multiple) input.multiple = true;
        } else {
          input = document.createElement('input');
          input.type = f.kind || 'text';
          input.className = 'input';
          input.value = f.value || '';
        }
        input.id = fieldId;
        if (f.placeholder) input.placeholder = f.placeholder;
        wrap.appendChild(input);
        if (f.help) wrap.appendChild(el('div', 'axo-modal-help', f.help));
        body.appendChild(wrap);
        fieldEls[f.key] = input;
      }
    }

    // ── Footer with buttons ──
    const foot = el('div', 'modal-foot axo-modal-foot');
    const cancelBtn = el('button', 'btn ghost', spec.cancelLabel || 'Cancel');
    cancelBtn.addEventListener('click', () => cleanup(null));
    const okBtn = el('button', 'btn' + (spec.okKind === 'danger' ? ' danger' : ''), spec.okLabel || 'OK');
    okBtn.addEventListener('click', commit);
    foot.appendChild(el('div', '', '')); // spacer flex-fill
    foot.appendChild(cancelBtn);
    foot.appendChild(okBtn);
    modal.appendChild(foot);

    document.body.appendChild(backdrop);
    backdrop.addEventListener('click', onBackdropClick);

    // Autofocus: first input if any, else the OK button.
    requestAnimationFrame(() => {
      const firstInput = modal.querySelector('input.input, textarea.input, .select, .axo-modal-file');
      if (firstInput) firstInput.focus();
      else okBtn.focus();
    });

    // Esc cancels; Enter confirms (except inside textareas / when shift held).
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); cleanup(null); }
      else if (e.key === 'Tab') {
        const focusable = Array.from(modal.querySelectorAll(
          'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
        )).filter(node => node.getClientRects().length > 0);
        if (!focusable.length) { e.preventDefault(); modal.focus(); return; }
        const index = focusable.indexOf(document.activeElement);
        if (e.shiftKey && index <= 0) {
          e.preventDefault(); focusable[focusable.length - 1].focus();
        } else if (!e.shiftKey && (index < 0 || index === focusable.length - 1)) {
          e.preventDefault(); focusable[0].focus();
        }
      }
      else if (e.key === 'Enter' && !e.shiftKey) {
        const t = e.target;
        if (t.tagName === 'TEXTAREA' || t.tagName === 'BUTTON') return;
        e.preventDefault();
        commit();
      }
    }
    backdrop.addEventListener('keydown', onKey);

    function onBackdropClick(e) {
      if (e.target === backdrop) cleanup(null);
    }

    function commit() {
      // Determine the resolution shape based on what's in the dialog.
      if (spec.fields && spec.fields.length) {
        const out = {};
        for (const f of spec.fields) {
          const el = fieldEls[f.key];
          if (f.kind === 'file') out[f.key] = el.files;
          else out[f.key] = el.value;
        }
        cleanup(out);
      } else if (spec.choices && spec.choices.length) {
        cleanup(chosenChoice);
      } else {
        cleanup(true);
      }
    }
    function cleanup(value) {
      backdrop.removeEventListener('keydown', onKey);
      backdrop.removeEventListener('click', onBackdropClick);
      backdrop.remove();
      resolve(value);
      queueMicrotask(() => returnFocus?.isConnected && returnFocus.focus?.());
    }
  });
}

// Convenience wrappers — terser than spec objects for common shapes.
function axoConfirm({ title, body, okLabel = 'OK', okKind } = {}) {
  return axoModal({ title, body, okLabel, okKind });
}
function axoPrompt({ title, label, value = '', placeholder, multiline = false, okLabel = 'Save' } = {}) {
  return axoModal({
    title,
    fields: [{
      key: 'value',
      label,
      value,
      placeholder,
      kind: multiline ? 'textarea' : 'text',
    }],
    okLabel,
  }).then(out => (out == null ? null : out.value));
}

// ───── Markdown ─────
// markdown-it instance — GitHub-grade formatting (tables, task lists, nested
// lists, blockquotes). `html:false` escapes any raw HTML in model output, so
// it's strictly safer than the old hand-rolled renderer. Code blocks with a
// known language are highlighted inline via highlight.js (and pre-marked
// `.hljs` so the scheduled pass below skips them); unlabeled blocks fall
// through to highlight.js auto-detection in `scheduleHighlight`.
const MD = window.markdownit({
  html: false,
  linkify: true,
  breaks: false,
  highlight(code, lang) {
    if (window.hljs && lang && window.hljs.getLanguage(lang)) {
      try {
        const v = window.hljs.highlight(code, { language: lang, ignoreIllegals: true }).value;
        return `<pre class="hljs"><code class="hljs language-${lang}">${v}</code></pre>`;
      } catch {}
    }
    return ''; // let markdown-it escape + wrap; scheduleHighlight() colors it
  },
});
// Open links in a new tab (safely) — matches the manual citation links.
const _mdLinkOpen = MD.renderer.rules.link_open
  || ((tokens, idx, options, env, self) => self.renderToken(tokens, idx, options));
MD.renderer.rules.link_open = (tokens, idx, options, env, self) => {
  tokens[idx].attrSet('target', '_blank');
  tokens[idx].attrSet('rel', 'noopener noreferrer');
  return _mdLinkOpen(tokens, idx, options, env, self);
};
function mdRender(text) {
  if (!text) return '';
  const html = MD.render(text);
  // Microtask + ":not(.hljs)" guard means we only ever highlight each block
  // once, even if mdRender runs many times per second during streaming.
  scheduleHighlight();
  return html;
}
let _hlScheduled = false;
function scheduleHighlight() {
  if (_hlScheduled) return;
  _hlScheduled = true;
  queueMicrotask(() => {
    _hlScheduled = false;
    if (window.hljs) {
      document.querySelectorAll('pre code:not(.hljs)').forEach(b => {
        try { window.hljs.highlightElement(b); } catch {}
      });
    }
  });
}

const TOOL_EVIDENCE_SUMMARY_LIMIT = 140;
function boundedToolText(value, fallback = '') {
  const text = String(value == null ? '' : value).replace(/\s+/g, ' ').trim();
  if (!text) return fallback;
  return text.length > TOOL_EVIDENCE_SUMMARY_LIMIT
    ? text.slice(0, TOOL_EVIDENCE_SUMMARY_LIMIT - 1) + '…' : text;
}

function toolResultSummary(name, result, isError = false) {
  if (result == null) return isError ? 'Failed without an error message' : 'Waiting for result';
  if (typeof result !== 'object') return boundedToolText(result, isError ? 'Failed' : 'Completed');
  const errorText = result.error || result.message || (isError ? result.stderr : '');
  if (isError && errorText) return boundedToolText(errorText, 'Failed');
  if (name === 'bash') {
    const exit = Number.isFinite(result.exit_code) ? `exit ${result.exit_code}` : 'command finished';
    const output = boundedToolText(result.stdout || result.stderr || '');
    return output ? `${exit} · ${output}` : exit;
  }
  if (name === 'read_file') {
    const content = String(result.content || '');
    const lines = content ? content.split('\n').length : 0;
    return boundedToolText(`${lines} line${lines === 1 ? '' : 's'}${content ? ' · ' + content : ''}`, 'File read');
  }
  if (name === 'write_file' || name === 'edit_file') {
    const count = result.replacements != null ? ` · ${result.replacements} replacement${result.replacements === 1 ? '' : 's'}` : '';
    return boundedToolText(`${result.path || 'File updated'}${count}`, 'File updated');
  }
  if (name === 'glob') {
    const files = Array.isArray(result.files) ? result.files : [];
    return `${files.length} file${files.length === 1 ? '' : 's'} found`;
  }
  if (name === 'grep') {
    const matches = String(result.matches || '').trim();
    if (!matches) return 'No matches';
    const count = matches.split('\n').length;
    return boundedToolText(
      `${count} match${count === 1 ? '' : 'es'} · ${matches}`,
      `${count} match${count === 1 ? '' : 'es'}`,
    );
  }
  if (name === 'web_search') {
    const hits = Array.isArray(result.results) ? result.results : [];
    return `${hits.length} result${hits.length === 1 ? '' : 's'}`;
  }
  const known = result.summary || result.output || result.matches || result.listing || result.path;
  if (known) return boundedToolText(known, 'Completed');
  const keys = Object.keys(result);
  return keys.length ? boundedToolText(`Completed · ${keys.slice(0, 4).join(', ')}`) : 'Completed';
}

function syncToolCardA11y(card) {
  const head = card.querySelector('.toolcard-head');
  if (!head) return;
  const verb = card.querySelector('.toolcard-verb')?.textContent || 'Tool';
  const name = card.querySelector('.toolcard-name')?.textContent || '';
  const state = card.querySelector('.toolcard-state')?.textContent || '';
  const summary = card.querySelector('.toolcard-summary')?.textContent || '';
  const expanded = head.getAttribute('aria-expanded') === 'true';
  head.setAttribute('aria-label', boundedToolText(
    `${verb}. ${name}. ${state}. ${summary}. ${expanded ? 'Collapse' : 'Expand'} details`,
    expanded ? 'Collapse tool details' : 'Expand tool details',
  ));
}

function buildToolCard(d) {
  const [ico, verb] = toolVerb(d.name, d.arguments);
  const card = el('div', 'toolcard running');
  card.dataset.callId = d.call_id || '';
  const head = el('button', 'toolcard-head');
  head.type = 'button';
  head.setAttribute('aria-expanded', 'false');
  head.appendChild(el('span', 'toolcard-ico', ico));
  const title = el('span', 'toolcard-title');
  title.appendChild(el('span', 'toolcard-verb', boundedToolText(verb, d.name || 'Tool')));
  title.appendChild(el('span', 'toolcard-name', boundedToolText(d.name || 'tool')));
  head.appendChild(title);
  head.appendChild(el('span', 'toolcard-state', 'Running'));
  head.appendChild(el('span', 'toolcard-summary', 'Waiting for result'));
  head.appendChild(el('span', 'toolcard-chevron', '›'));
  const body = el('div', 'toolcard-body hide');
  body.id = `toolcard-body-${++buildToolCard.sequence}`;
  head.setAttribute('aria-controls', body.id);
  head.addEventListener('click', () => {
    const expanded = body.classList.toggle('hide') === false;
    head.setAttribute('aria-expanded', String(expanded));
    syncToolCardA11y(card);
  });
  card.append(head, body);
  syncToolCardA11y(card);
  return { card, body };
}
buildToolCard.sequence = 0;

function fillToolCard(card, d) {
  const body = card.querySelector('.toolcard-body');
  card.dataset.resultApplied = 'true';
  card.classList.remove('running');
  card.classList.add(d.is_error ? 'err' : 'ok');
  const state = card.querySelector('.toolcard-state');
  if (state) state.textContent = d.is_error ? 'Error' : 'Done';
  const summary = card.querySelector('.toolcard-summary');
  if (summary) summary.textContent = toolResultSummary(d.name, d.result, Boolean(d.is_error));
  if (body) {
    body.innerHTML = renderToolResult(d.name, d.result);
    if (d.is_error) {
      body.classList.remove('hide');
      card.querySelector('.toolcard-head')?.setAttribute('aria-expanded', 'true');
    }
  }
  syncToolCardA11y(card);
  if (d.name === 'web_search' && d.result && typeof d.result === 'object') {
    const sources = extractWebSearchUrls(d.result);
    if (sources.length) {
      const cite = el('div', 'chat-citations');
      cite.appendChild(el('div', 'chat-citations-head', 'Sources'));
      sources.forEach((src, i) => {
        const row = el('div', 'chat-citation');
        row.appendChild(el('span', 'chat-citation-num', `[${i + 1}]`));
        const link = document.createElement('a');
        link.href = src.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = src.title || src.url;
        row.appendChild(link);
        cite.appendChild(row);
      });
      card.appendChild(cite);
    }
  }
}

function extractWebSearchUrls(result) {
  if (Array.isArray(result.results)) {
    return result.results.map(r => ({ url: r.url || r.link, title: r.title || r.name })).filter(r => r.url);
  }
  if (Array.isArray(result.urls)) return result.urls.map(url => ({ url, title: url }));
  return [];
}

// ───── Top status ─────
async function refreshStatus() {
  try {
    await fetch('/health').then(r => r.json());
    S.daemonHealth = 'healthy';
  } catch {
    S.daemonHealth = 'error';
  }
  renderStatusPearls();
}
async function refreshTopStats() {
  try {
    const [agents, tokens] = await Promise.all([
      fetch('/api/agents').then(r => r.json()),
      fetch('/api/tokens/report').then(r => r.json()).catch(() => null),
    ]);
    S.agents = agents;
    if (S.session.id) syncSessionRoleCapabilities(S.session);
    const total = tokens
      ? (tokens.total ?? (tokens.total_input + tokens.total_output + (tokens.total_reasoning || 0)))
      : 0;
    S.tokensTotal = total;
    $('#cnt-agents').textContent = agents.length;
    $('#cnt-workflows') && ($('#cnt-workflows').textContent = S.workflows.length);
    $('#cnt-schedules') && ($('#cnt-schedules').textContent = S.schedules.length);
    $('#cnt-skills') && ($('#cnt-skills').textContent = S.skills.length);
    $('#lat-alive') && ($('#lat-alive').textContent = agents.length);
    if ($('#lat-tokens')) {
      const complete = tokens?.token_usage_known === true;
      $('#lat-tokens').textContent = `${tokens && !complete ? '≥' : ''}${fmtNum(total)}`;
      $('#lat-tokens').title = !tokens
        ? 'Token usage is unavailable.'
        : (complete
          ? 'Complete tracked lifetime token usage for live actors.'
          : 'Known subtotal; at least one dispatched call lacks terminal usage.');
    }
  } catch {}
  renderStatusPearls();
}

// ───── Status pearls — bottom-right floating indicators ─────
//
// Replaces the old top status bar.  Each pearl is a tiny glass capsule
// showing one piece of glanceable session state.
//
// Always-on pearls: daemon health (jade/amber/red) and interrupts
// (warn pearl, only when pending), plus the active session and token total.

S.daemonHealth = S.daemonHealth || 'unknown';  // 'healthy' | 'starting' | 'error' | 'unknown'
S.pendingInterrupts = S.pendingInterrupts || 0;
S.liveConnection = S.liveConnection || 'connecting'; // 'connecting' | 'connected' | 'reconnecting'

function activeSessionPearlText() {
  if (!S.session || !S.session.id) return null;
  const name = S.session.name || S.session.id.slice(0, 8);
  const agentCount = (S.session.agents || []).length;
  return agentCount > 0 ? `${name} · ${agentCount} agents` : name;
}

function renderStatusPearls() {
  const host = $('#status-pearls'); if (!host) return;
  const pearls = [];

  // Daemon health — always present.  Color follows S.daemonHealth.
  const dotClass = S.daemonHealth === 'healthy' ? '' :
                   S.daemonHealth === 'starting' ? 'amber' :
                   S.daemonHealth === 'error' ? 'err' : 'mute';
  pearls.push({
    key: 'health',
    dot: dotClass,
    text: S.daemonHealth === 'healthy' ? 'daemon healthy' :
          S.daemonHealth === 'starting' ? 'daemon starting' :
          S.daemonHealth === 'error' ? 'daemon unreachable' : 'connecting…',
  });

  if (S.liveConnection === 'reconnecting') {
    pearls.push({ key: 'connection', dot: 'amber', text: 'live connection reconnecting…' });
  }

  // Interrupts are always discoverable when there are any pending.
  if (S.pendingInterrupts > 0) {
    pearls.push({
      key: 'interrupts', warn: true, clickable: true,
      text: `⏸ ${S.pendingInterrupts} waiting`,
      onClick: () => {
        $('#settings')?.show('automations');
        queueMicrotask(() => $('#settings-automations')?.showInterrupts?.());
      },
    });
  }

  const sess = activeSessionPearlText();
  if (sess) pearls.push({ key: 'session', text: sess });
  if (S.tokensTotal > 0) pearls.push({ key: 'tokens', text: `${fmtNum(S.tokensTotal)} tok` });

  // Diff-render: keep elements that haven't changed so the fade-in
  // animation doesn't run on every tick.
  const existing = new Map();
  Array.from(host.children).forEach(c => existing.set(c.dataset.key, c));
  const seen = new Set();
  pearls.forEach(p => {
    seen.add(p.key);
    const text = p.text;
    let row = existing.get(p.key);
    if (!row) {
      row = document.createElement('div');
      row.className = 'pearl fade-in';
      row.dataset.key = p.key;
      host.appendChild(row);
    }
    row.classList.toggle('warn', !!p.warn);
    row.classList.toggle('clickable', !!p.clickable);
    row.title = text;
    // Build content idempotently.
    const wantHTML = `<span class="pearl-dot ${p.dot || ''}"></span><span>${escHtml(text)}</span>`
                       .replace(/<span class="pearl-dot "><\/span>/, p.warn ? '' : '<span class="pearl-dot"></span>');
    if (row._lastHtml !== wantHTML) {
      row.innerHTML = (p.warn ? '' : `<span class="pearl-dot ${p.dot || ''}"></span>`) +
                      `<span>${escHtml(text)}</span>`;
      row._lastHtml = wantHTML;
    }
    if (p.onClick) {
      row.onclick = p.onClick;
      row.setAttribute('role', 'button');
      row.setAttribute('aria-label', text);
      row.tabIndex = 0;
      row.onkeydown = (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          row.click();
        }
      };
    } else {
      row.onclick = null;
      row.onkeydown = null;
      row.removeAttribute('role');
      row.removeAttribute('aria-label');
      row.removeAttribute('tabindex');
    }
  });
  // Remove pearls that are no longer in the set.
  existing.forEach((node, key) => {
    if (!seen.has(key)) node.remove();
  });
}

async function loadAll() {
  const [wfs, agents, schedules, skills] = await Promise.all([
    fetch('/api/workflows').then(r => r.json()),
    fetch('/api/agents').then(r => r.json()),
    fetch('/api/schedules').then(r => r.json()).catch(() => []),
    fetch('/api/skills').then(r => r.json()).catch(() => []),
  ]);
  S.workflows = wfs; S.agents = agents; S.schedules = schedules; S.skills = skills;
  const home = $('#session-home'); if (home) home.agents = agents;
  await refreshTopStats();
  // A Session can be restored before the slower configuration reads finish.
  // In that case its Agent graph was necessarily built without depends_on
  // metadata. Rebuild the durable route once the authoritative Agent list is
  // available so an initially hidden graph cannot stay edge-less forever.
  if (S.session.id
      && (S.session.mode?.kind === 'lattice' || S.session.mode?.kind === 'custom')) {
    void sessionLatticeBuild(S.session);
  }
}

// ───── Sessions cockpit ─────
S.session = {
  id: null, workspaceId: '', dir: '', name: '', mode: null, streamEl: null, streamBuf: '', toolCards: {},
  environment: { state: 'unprepared' },
  liveStreams: new Map(), historyState: 'idle', historyError: '', historyGeneration: 0,
};
// Session live ownership is global browser state. It is updated for every
// Session frame, not only the currently visible one, so switching away and
// back restores exact Stop even when the turn began after the socket snapshot.
const _liveSessionRuns = new Map();
// Per-Session WebSocket ordering lets HTTP hydration distinguish a cache that
// advanced while its request was in flight from one left stale by a dropped
// connection. A Snapshot is an authoritative replacement for every Session,
// including Sessions absent from its run list, so it has its own epoch.
const _liveSessionOwnershipRevisions = new Map();
let _liveSessionSnapshotEpoch = 0;
// Authoritative server-side ownership of destructive Session-runtime changes.
// Unlike the initiating component's same-tab DOM event, this survives another
// tab starting the change and is replaced atomically by every WS Snapshot.
const _sessionEnvironmentTransitions = new Map();
// A cross-tab Close must retire the exact cockpit that was Active when its
// destructive transition began, even if a concurrent Session-list refresh
// mutates that object to Closed before the settled edge arrives. Object
// identity prevents that ownership from leaking to a later Closed review.
const _sessionEnvironmentRetireOwners = new Map();
// One unresolved Ways set suspends the primary runtime of every Session in
// its Workspace, including sibling Sessions open in another tab.
const _workspaceAttemptOwnerships = new Map();
let _runtimeOwnershipSnapshotSeen = false;
function workspaceAttemptOwnsPrimaryRuntime(session = S.session) {
  const workspaceId = session?.workspaceId || session?.workspace_id || '';
  return Boolean(workspaceId && _workspaceAttemptOwnerships.has(workspaceId));
}
function liveSessionOwnershipStamp(sessionId) {
  return `${_liveSessionSnapshotEpoch}:${_liveSessionOwnershipRevisions.get(sessionId) || 0}`;
}
function advanceLiveSessionOwnership(sessionId) {
  if (!sessionId) return;
  _liveSessionOwnershipRevisions.set(
    sessionId,
    (_liveSessionOwnershipRevisions.get(sessionId) || 0) + 1,
  );
}
const _pendingSessionTurns = new Map();
// The compact, in-thread summary for the attempt set belonging to the open
// session. Durable identity lives here; the full decision surface is Compare.
S.threadVariants = null;
S.cockpitLayout = {
  // Exactly one surface owns the center stage. A single explicit secondary
  // preference may place that surface beside Conversation, but only while the
  // measured width can keep both useful. This state shape makes the old
  // five-column "dashboard" composition impossible to represent.
  center: 'stream',
  pinned: null,
  widths: { files: 640, browser: 520, trace: 520, compare: 680 },
  termOpen: false,        // false = thin rail, true = drawer expanded
  termOpenW: 320,         // dock height when open (drag-resizable)
  termInnerListW: 140,    // inner list width (drag-resizable inside the drawer)
  attemptsOpen: false,    // contextual planning/live inspector; never reserves empty space
};
// localStorage persistence — your custom workspace survives page reloads.
// v5: N-surface layout engine (preset + widths map).  v4: lattice pane
// dropped from Sessions.  v3: terminals became an overlay drawer.
// v6: presets retired — the cockpit is one configurable workspace; surfaces
// are toggled via the Panes menu. Bumped so old persisted presets reset.
// v9: terminals moved from a right-hand drawer to a bottom dock, so the
// remembered `termOpenW` is a width being read as a height — it describes a
// different axis of a different thing and is not a preference to carry over.
// v11: replaces arbitrary pane arrays with one center surface plus one optional
// Conversation split. Earlier dashboard-era layouts are intentionally ignored.
const LAYOUT_KEY = 'axo.cockpit.v11';
const RAIL_COLLAPSED_KEY = 'axo.rail.collapsed.v1';
const LEGACY_SIDEBAR_KEY = 'axo.sidebar.v1';
function persistLayout() {
  try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(S.cockpitLayout)); } catch {}
}
function loadPersistedLayout() {
  try {
    const s = JSON.parse(localStorage.getItem(LAYOUT_KEY) || 'null');
    if (s && typeof s === 'object') {
      if (s.widths && typeof s.widths === 'object') {
        Object.keys(SURFACES).forEach(id => {
          const w = s.widths[id];
          const mn = SURFACES[id].min || 120, mx = SURFACES[id].max || 1400;
          if (typeof w === 'number' && w >= mn && w <= mx) S.cockpitLayout.widths[id] = w;
        });
      }
      if (typeof s.pinned === 'string' && s.pinned !== 'stream' && SURFACES[s.pinned]) {
        S.cockpitLayout.pinned = s.pinned;
      }
      if (typeof s.termOpen     === 'boolean') S.cockpitLayout.termOpen     = s.termOpen;
      // Clamped rather than trusted: this value used to be a drawer *width*,
      // so a remembered 900 would open a dock tall enough to bury the app.
      if (typeof s.termOpenW === 'number') {
        S.cockpitLayout.termOpenW =
          Math.max(TERM_DRAWER_MIN, Math.min(TERM_DRAWER_MAX, s.termOpenW));
      }
      if (typeof s.termInnerListW === 'number' && s.termInnerListW > 60) S.cockpitLayout.termInnerListW = s.termInnerListW;
      // Center never restores: a reopened Session lands on its conversation.
    }

}

// Center-stage surface registry. The terminal and Ways inspector deliberately
// do not participate in this enum: they each have one stable dock.
const SURFACES = {
  stream:  { el: '#cockpit-stream',  title: 'Conversation', defaultW: 720, min: 420, max: 1600, pairMin: 420 },
  files:   { el: '#cockpit-files',   title: 'Files',        defaultW: 640, min: 560, max: 1200, pairMin: 600 },
  browser: { el: '#cockpit-browser', title: 'Preview',      defaultW: 520, min: 420, max: 1100, pairMin: 480 },
  compare: { el: '#cockpit-compare', title: 'Attempts',     defaultW: 680, min: 560, max: 1400, pairMin: 620 },
  trace:   { el: '#cockpit-trace',   title: 'Agent graph',  defaultW: 520, min: 420, max: 1200, pairMin: 480 },
};
const CENTER_SURFACES = Object.freeze(Object.keys(SURFACES));
const PAIR_CHAT_MIN = 420;
const PAIR_GUTTER = 8;
const surfaceWidth = (id) =>
  S.cockpitLayout.widths[id] ?? (SURFACES[id] ? SURFACES[id].defaultW : 520);

function centerSurface() {
  const L = S.cockpitLayout;
  return CENTER_SURFACES.includes(L.center) ? L.center : 'stream';
}

function cockpitStageWidth() {
  return Math.max(0, $('#cockpit-shell')?.clientWidth || $('.cockpit-grid')?.clientWidth || window.innerWidth);
}

function canPairSurface(id, stageWidth = cockpitStageWidth()) {
  if (!id || id === 'stream' || !SURFACES[id]) return false;
  const needed = PAIR_CHAT_MIN + (SURFACES[id].pairMin || SURFACES[id].min) + PAIR_GUTTER;
  return stageWidth >= needed;
}

// This can only return one or two entries. A constrained window ignores the
// remembered split without deleting it, so widening the window restores the
// explicit preference instead of inventing tiny columns.
function visibleSurfaces() {
  const center = centerSurface();
  if (center !== 'stream') return [center];
  const pinned = S.cockpitLayout.pinned;
  return canPairSurface(pinned) ? ['stream', pinned] : ['stream'];
}

function applyCockpitLayout() {
  const grid = document.querySelector('.cockpit-grid');
  if (!grid) return;
  const L = S.cockpitLayout;
  const visible = visibleSurfaces();
  const paired = visible.length === 2;
  const solo = !paired;

  // Ways reserves space only beside the resting Conversation at a genuinely
  // wide width. During review or a two-up split it becomes a modal inspector,
  // so it never creates a third squeezed column.
  syncAttemptsDock({ visible, stageWidth: cockpitStageWidth() });

  // One resizer between each pair of visible surfaces.
  const nResizers = paired ? 1 : 0;
  ensureResizerPool(nResizers);
  const resizers = [...grid.querySelectorAll('.col-resizer')];

  let pairToolWidth = null;
  if (paired) {
    const tool = visible[1];
    const room = Math.max(0, grid.getBoundingClientRect().width - PAIR_GUTTER);
    const maxTool = Math.max(SURFACES[tool].pairMin, room - PAIR_CHAT_MIN);
    pairToolWidth = Math.min(maxTool, Math.max(SURFACES[tool].pairMin, surfaceWidth(tool)));
    grid.style.gridTemplateColumns = `minmax(${PAIR_CHAT_MIN}px, 1fr) ${PAIR_GUTTER}px ${pairToolWidth}px`;
  } else {
    grid.style.gridTemplateColumns = 'minmax(0, 1fr)';
  }

  // Hide every registered surface, then place + show the visible ones in order.
  Object.keys(SURFACES).forEach(id => { const el = $(SURFACES[id].el); if (el) el.style.display = 'none'; });
  // Pin every child to row 1 + its column.  Without an explicit grid-row,
  // CSS grid auto-placement wraps a pane to a new row whenever DOM order
  // doesn't ascend by column (e.g. a preset that puts Activity left of Files
  // while Files is DOM-first) — which stacks the panes instead of tiling them.
  visible.forEach((id, i) => {
    const el = $(SURFACES[id].el); if (!el) return;
    el.style.gridRow = '1';
    el.style.gridColumn = String(i * 2 + 1);
    el.style.display = 'flex';
    el.classList.toggle('is-rightmost', i === visible.length - 1);
  });

  // Place resizers between consecutive visible panes; carry the boundary index.
  resizers.forEach((h, b) => {
    if (b < nResizers) {
      h.style.display = '';
      h.style.gridRow = '1';
      h.style.gridColumn = String(b * 2 + 2);
      h.dataset.boundary = String(b);
      h.setAttribute('aria-label', `Resize Conversation and ${SURFACES[visible[1]]?.title || 'review'} panes`);
      h.setAttribute('aria-valuemin', String(SURFACES[visible[1]]?.pairMin || 420));
      h.setAttribute('aria-valuemax', String(SURFACES[visible[1]]?.max || 1200));
      h.setAttribute('aria-valuenow', String(Math.round(pairToolWidth || surfaceWidth(visible[1]))));
    } else {
      h.style.display = 'none';
    }
  });

  // Terminal dock — open/closed, height, inner list/output split.
  applyTerminalsDrawer();
  // Defensive: any layout change clears stuck drag state (cursor, highlight).
  document.body.classList.remove('axo-resizing', 'axo-vresizing');
  grid.querySelectorAll('.col-resizer.dragging').forEach(h => h.classList.remove('dragging'));
  const cockpit = $('#session-cockpit');
  cockpit?.classList.toggle('conversation-only', solo && visible[0] === 'stream');
  cockpit?.classList.toggle('review-focused', solo && visible[0] !== 'stream');
  cockpit?.classList.toggle('two-up', paired);
  cockpit?.setAttribute('data-center-surface', centerSurface());
  syncSessionViewNav(visible);
  persistLayout();
  // After the grid relayouts, tell embedded editors to remeasure.  Without
  // this Monaco renders at the old container size (visually broken file
  // pane) and xterm gets stuck on the old rows/cols.
  requestAnimationFrame(() => { relayoutEmbeddedEditors(); relayoutTrace(); updateFilesEditor(); });
}

function syncSessionViewNav(visible = visibleSurfaces()) {
  const active = centerSurface();
  $$('[data-session-view]').forEach((button) => {
    const selected = button.dataset.sessionView === active;
    button.classList.toggle('active', selected);
    if (selected) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  });
  const terminal = $('[data-session-action="terminal"]');
  if (terminal) {
    terminal.classList.toggle('active', Boolean(S.cockpitLayout.termOpen));
    terminal.setAttribute('aria-expanded', String(Boolean(S.cockpitLayout.termOpen)));
  }
}

function setAttemptsDock(open, { focus = false } = {}) {
  S.cockpitLayout.attemptsOpen = Boolean(open);
  applyCockpitLayout();
  if (open && focus) requestAnimationFrame(() => {
    $('#attempts-dock-close')?.focus();

function syncAttemptsDock(options = {}) {
  const shell = $('#cockpit-shell');
  const dock = $('#attempts-dock');
  const toggle = $('#attempts-dock-toggle');
  if (!shell || !dock) return;
  const open = Boolean(S.cockpitLayout.attemptsOpen && S.session.id);
  const visible = options.visible || visibleSurfaces();
  const stageWidth = options.stageWidth || cockpitStageWidth();
  const canReserve = open && visible.length === 1 && visible[0] === 'stream' && stageWidth >= 1180;
  shell.classList.toggle('attempts-open', open);
  shell.classList.toggle('attempts-overlay', open && !canReserve);
  dock.toggleAttribute('inert', !open);
  dock.setAttribute('aria-hidden', String(!open));
  toggle?.classList.toggle('active', open);
  toggle?.setAttribute('aria-expanded', String(open));
  const variants = S.threadVariants?.sessionId === S.session.id ? S.threadVariants.variants || [] : [];
  const count = variants.length || (S.session?.fanoutOn ? (S.session.fanoutLanes || []).length : 0);
  const badge = $('#ways-count');
  if (badge) {
    badge.textContent = count ? String(count) : '';
    badge.classList.toggle('hide', !count);
  }

// Re-fit the session's agent-graph (lattice) when the trace surface is
// visible.  The lattice is built on cockpit open into a host that may be
// hidden (size 0), so it needs an autoLayout once it actually has room.
function relayoutTrace() {
  const lat = S.session && S.session.lattice;
  if (!lat) return;
  const pane = document.querySelector('#cockpit-trace');
  if (!pane || getComputedStyle(pane).display === 'none') return;
  try { if (typeof lat.autoLayout === 'function') lat.autoLayout({ direction: 'LR' }); } catch {}
