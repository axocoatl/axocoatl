function sessionDir(s) {
  return typeof s.working_dir === 'string' ? s.working_dir : (s.working_dir || '');
}

// Session browsing, lifecycle controls, and creation live in <ax-session-home>.

// ── Cockpit ──
function openCockpit(s) {
  $('#session-home')?.noteExternalNavigation?.();
  const previousSessionState = S.session;
  const previousSessionId = previousSessionState.id;
  if (previousSessionId === s.id && $('#session-cockpit')?.style.display === 'flex') {
    $('#session-text')?.focus();
    return;
  }
  if (previousSessionState.taskTimer) clearInterval(previousSessionState.taskTimer);
  // A thread summary belongs to exactly one open session. The durable set is
  // restored after its transcript, so no DOM or set id can bleed across a
  // fast session switch.
  S.threadVariants = null;
  S.session = {
    id: s.id, dir: sessionDir(s), name: s.name,
    mode: s.mode || null,
    streamEl: null, streamBuf: '', toolCards: {},
    refs: [],
    attemptPlan: null,
    attemptStartRecovery: _attemptStartRecoveries.get(s.id) || null,
    autoTerminalDone: false,
    attemptRestorePending: true,
  };
  // The composer is page-global, but its draft belongs to the session that
  // was open when it was typed. Never feed that text into another session's
  // Attempts preflight or let it be sent there after a rail switch.
  const _sessionText = $('#session-text');
  if (_sessionText && previousSessionId !== s.id) _sessionText.value = '';
  renderChatRefs();
  $('#session-home').style.display = 'none';
  $('#session-cockpit').style.display = 'flex';
  initCockpitChrome();
  $('#cockpit-title').textContent = s.name;
  $('#cockpit-dir').textContent = sessionDir(s);
  $('#cockpit-status').textContent = '';
  setCockpitLive('idle', 'idle');
  $('#session-msgs').innerHTML = '';
  S.session.gitDiff = null;
  S.session._previewCards = new Set();
  // Fan-out is an on/off plus a configured count. It persists across turns
  // within a session (a send doesn't reset it); each freshly-opened session
  // starts from the default — off, 3 ways.
  S.session.fanout = 3;
  S.session.fanoutOn = false;
  S.session.fanoutLanes = [{}, {}, {}];
  const _fanout = $('#fanout');
  if (_fanout) {
    _fanout.enabled = S.session.fanoutOn;
    _fanout.lanes = S.session.fanoutLanes;
    _fanout.disabled = !sessionSupportsAttempts();
  }
  if (typeof closeFanoutPop === 'function') closeFanoutPop();
  if (typeof updateFanoutBtn === 'function') updateFanoutBtn();
  if (typeof stopThreadVariantPoll === 'function') stopThreadVariantPoll();
  if (typeof stopThreadVariantRestore === 'function') stopThreadVariantRestore();
  setExplorerTab('files');   // default to the file tree; git refreshes lazily
  // Files belong to the session that was open, so the editor starts empty and
  // is re-pointed before anything can ask it to load.
  const _ed = axEditor();
  _ed.reset();
  _ed.session = s.id;
  $('#file-tabs').innerHTML = '';
  viewerShow('<div class="empty small">Select a file to view</div>');
  updateFilesEditor();       // editor collapsed until a file/diff is opened
  const _tree = $('#file-tree');
  if (_tree) { _tree.session = s.id; _tree.selected = ''; }
  const _sourceControl = $('#source-control');
  if (_sourceControl) _sourceControl.session = s.id;
  const _rail = $('#rail');
  if (_rail) { _rail.current = s.id; _rail.refresh(); }
  const _cmp = $('#compare');
  if (_cmp) _cmp.session = s.id;
  const _attemptsDock = $('#attempts');
  if (_attemptsDock) {
    _attemptsDock.session = s.id;
    syncAttemptsDraft();
  }
  const _bx = $('#browser');
  if (_bx) _bx.session = s.id;
  try { localStorage.setItem(LAST_SESSION_KEY, s.id); } catch {}
  refreshFileTree();
  sessionLatticeBuild(s);
  renderSessionActive(s);
  populateSessionAgentTarget(s);
  void populateSessionModelPicker(s);
  const openedSessionId = s.id;
  S.session.taskTimer = setInterval(() => void refreshSessionTasks(openedSessionId), 4000);
  void refreshSessionTasks(openedSessionId).then((current) => {
    if (current) return maybeAutoStartTerminal(openedSessionId);
  });
  // The transcript is the permanent spine; place the unresolved attempt
  // summary after it, then restore its durable lifecycle from the daemon.
  void reloadSessionTranscript(s.id).then(() => restoreThreadVariants(s.id));
  $('#session-text').focus();
}

// Friction-reducer: every freshly-opened session lands with a bash terminal
// already attached at the working dir. If a live terminal already exists,
// just focus that — never spawn duplicates.
async function maybeAutoStartTerminal(expectedSessionId = S.session.id) {
  if (!expectedSessionId || S.session.id !== expectedSessionId || S.session.autoTerminalDone) return;
  const sessionState = S.session;
  sessionState.autoTerminalDone = true;
  const live = (sessionState.tasks || []).filter(
    t => t.kind === 'terminal' && String(t.status || '').startsWith('running')
  );
  if (live.length) {
    if (S.session !== sessionState) return;
    sessionState.activeTerminalId = live[live.length - 1].id;
    renderTerminals();
    return;
  }
  // First-spawn in a fresh container provisions the sandbox + installs dev
  // essentials (bash, vim, python3, node, …). On a cold start that's ~15s.
  // Show a clear status so it doesn't feel like the UI is stuck.
  sessionState.autoTerminalStarting = true;
  renderTerminals();
  try {
    const r = await fetch('/api/sessions/' + encodeURIComponent(expectedSessionId) + '/tasks', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ command: 'bash', interactive: true, rows: 30, cols: 100 }),
    });
    const j = await r.json().catch(() => ({}));
    if (S.session !== sessionState) return;
    if (r.ok && j.id) {
      sessionState.activeTerminalId = j.id;
    } else {
      toast('Auto terminal failed', j && j.error ? j.error : ('HTTP ' + r.status), 'err');
    }
  } catch (e) {
    if (S.session !== sessionState) return;
    console.warn('auto-start terminal failed:', e);
    toast('Auto terminal failed', String(e), 'err');
  } finally {
    if (S.session === sessionState) {
      sessionState.autoTerminalStarting = false;
      await refreshSessionTasks(expectedSessionId);
    }
  }
}
function closeCockpit() {
  if (S.session.taskTimer) { clearInterval(S.session.taskTimer); S.session.taskTimer = null; }
  // Tear down anything that outlives the pane: the fan-out popover's
  // capture-phase outside-click listener and the in-thread variant poll.
  if (typeof closeFanoutPop === 'function') closeFanoutPop();
  if (typeof stopThreadVariantPoll === 'function') stopThreadVariantPoll();
  if (typeof stopThreadVariantRestore === 'function') stopThreadVariantRestore();
  if (S.session.id && typeof clearThreadVariantSummary === 'function') {
    clearThreadVariantSummary(S.session.id, null);
  } else {
    S.threadVariants = null;
  }
  const attempts = $('#attempts'); if (attempts) attempts.session = '';
  const compare = $('#compare'); if (compare) compare.session = '';
  const sourceControl = $('#source-control'); if (sourceControl) sourceControl.session = '';
  teardownXterms();
  _lastMountedTerminal = { id: null, kind: null };
  S.session.id = null;
  S.browser = { url: null, suggestions: [], seen: new Set(), history: [], histIdx: -1 };
  $('#session-cockpit').style.display = 'none';
  $('#session-home').style.display = '';
  void $('#session-home')?.refresh?.();
}

// ── Browser pane ──
S.browser = { url: null, suggestions: [], seen: new Set(), history: [], histIdx: -1 };
const URL_RE = /\bhttps?:\/\/(?:localhost|127\.0\.0\.1|0\.0\.0\.0)(?::\d{2,5})?(?:\/[^\s'"<>`]*)?/g;

function detectUrlsFromTasks() {
  const tasks = S.session.tasks || [];
  let added = false;
  for (const t of tasks) {
    const text = (t.log || '') + ' ' + (t.command || '');
    const m = text.match(URL_RE);
    if (!m) continue;
    for (const raw of m) {
      // Normalize 0.0.0.0 → localhost (browsers can't reach 0.0.0.0).
      const u = raw.replace('://0.0.0.0', '://localhost').replace('://127.0.0.1', '://localhost');
      if (!S.browser.seen.has(u)) {
        S.browser.seen.add(u);
        S.browser.suggestions.unshift(u);
        added = true;
        appendPreviewCard(u);   // surface it as a card in the conversation
      }
    }
  }
  if (added) renderBrowserSuggestions();
}

function renderBrowserSuggestions() {
  const bar = $('#bx-suggest'); if (!bar) return;
  const sug = S.browser.suggestions.slice(0, 6);
  if (!sug.length) { bar.classList.add('hide'); return; }
  bar.innerHTML = '';
  bar.classList.remove('hide');
  sug.forEach(u => {
    const chip = el('span', 'bx-chip');
    chip.appendChild(el('span', '', u));
    const x = el('span', 'bx-chip-x', '×');
    chip.appendChild(x);
    chip.addEventListener('click', (e) => {
      if (e.target === x) {
        const i = S.browser.suggestions.indexOf(u);
        if (i >= 0) S.browser.suggestions.splice(i, 1);
        renderBrowserSuggestions();
        return;
      }
      browserGo(u);
    });
    bar.appendChild(chip);
  });
}

// Rewrite a logical URL to the same-origin proxy when it points at the
// session sandbox. Same-origin makes the DOM picker possible. Non-localhost
// URLs go through directly (they'll be opaque to the picker, but the user
// can still view them).
// Navigation, history and the same-origin proxy live in <ax-browser>. What
// stays here is where URLs come from — the shell watches what the agents run —
// and the element picker, which exists to put a reference into the conversation.
function browserGo(rawUrl) {
  const bx = $('#browser'); if (!bx) return;
  bx.go(rawUrl);
  if (S.cockpitLayout?.collapsed?.browser) {
    S.cockpitLayout.collapsed.browser = false;
    applyCockpitLayout();
  }
  // Picking is per-page state; a navigation ends it.
  setBrowserPicking(false);
  if (S.browser.hier) closeDomHier(false);
}

function browserBack() { $('#browser')?.back(); }
function browserForward() { $('#browser')?.forward(); }
function browserReload() { $('#browser')?.reload(); }
function browserOpenExternal() {
  const u = $('#browser')?.url;
  if (u) window.open(u, '_blank', 'noopener');
}
/** The component owns its own back/forward state. */
function updateBrowserNavButtons() {}

// ── DOM picker ──
// The frame lives inside the component's shadow root now, so the picker asks
// for it rather than querying the document — the same reference, reached the
// way the component publishes it.
function getBrowserIframe() { return $('#browser')?.frame || null; }

function setBrowserPicking(on) {
  S.browser.picking = !!on;
  const btn = $('#bx-pick');
  if (btn) btn.classList.toggle('active', !!on);
  const f = getBrowserIframe();
  if (!f || !f.contentWindow) return;
  try {
    f.contentWindow.postMessage({ kind: on ? 'axo-tap:start' : 'axo-tap:cancel' }, '*');
  } catch {}
}

function toggleBrowserPick() {
  if (!S.browser.url) {
    toast('Open a page first', 'Enter a URL above, then click 🎯 Pick.', 'err');
    return;
  }
  // If the URL didn't get proxied (non-localhost), picker can't run.
  try {
    const u = new URL(S.browser.url);
    const isLocal = u.hostname === 'localhost' || u.hostname === '127.0.0.1' || u.hostname === '0.0.0.0';
    if (!isLocal) {
      toast('Picker only works on local URLs', 'Same-origin restrictions block tapping into external sites.', 'err');
      return;
    }
  } catch {}
  setBrowserPicking(!S.browser.picking);
}

// Hierarchy panel state — held while the user is choosing a level.
S.browser.hier = null;  // { chain, selectedIndex, html, url, selector }

function postToIframe(msg) {
  const f = getBrowserIframe();
  if (!f || !f.contentWindow) return;
  try { f.contentWindow.postMessage(msg, '*'); } catch {}
}

function openDomHier(chain, selectedIndex, url, selector, html) {
  S.browser.hier = { chain, selectedIndex, url, selector, html };
  renderDomHier();
  $('#dom-hier').classList.remove('hide');
}

function closeDomHier(confirmed) {
  S.browser.hier = null;
  $('#dom-hier').classList.add('hide');
  postToIframe({ kind: confirmed ? 'axo-tap:confirm' : 'axo-tap:cancel' });
  setBrowserPicking(false);
}

function renderDomHier() {
  const h = S.browser.hier;
  const list = $('#dom-hier-list');
  const snip = $('#dom-hier-snippet');
  if (!h || !list) return;
  list.innerHTML = '';
  h.chain.forEach((node, i) => {
    const row = el('div', 'dom-hier-row' + (i === h.selectedIndex ? ' active' : ''));
    const indent = '·'.repeat(i);  // visual depth, padded with a dot per level
    row.appendChild(el('span', 'indent', indent));
    row.appendChild(el('span', 'label', node.label || node.tag || '(node)'));
    row.title = node.selector || '';
    row.addEventListener('mouseenter', () => postToIframe({ kind: 'axo-tap:hover-level', level: i }));
    row.addEventListener('mouseleave', () => postToIframe({ kind: 'axo-tap:unhover' }));
    row.addEventListener('click', () => selectHierLevel(i));
    list.appendChild(row);
  });
  if (snip) snip.textContent = (h.html || '').slice(0, 1200) + (h.html && h.html.length > 1200 ? '\n…' : '');
}

function selectHierLevel(i) {
  const h = S.browser.hier;
  if (!h) return;
  h.selectedIndex = i;
  // Selector + html will arrive in the next postMessage response.
  postToIframe({ kind: 'axo-tap:select-level', level: i });
  renderDomHier();
}

function confirmDomHier() {
  const h = S.browser.hier;
  if (!h) return;
  addRef({
    kind: 'dom',
    url: h.url || S.browser.url || '',
    selector: h.selector || '',
    html: h.html || '',
    preview: h.selector || '(element)',
  });
  toast('Element referenced', h.selector || '(no selector)', 'ok');
  closeDomHier(true);
}

window.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.kind === 'axo-tap:picked') {
    openDomHier(d.chain || [], d.selectedIndex || 0, d.url || S.browser.url || '', d.selector || '', d.html || '');
  } else if (d.kind === 'axo-tap:level') {
    const h = S.browser.hier;
    if (h && typeof d.level === 'number') {
      h.selector = d.selector || h.selector;
      h.html     = d.html     || h.html;
      renderDomHier();
    }
  } else if (d.kind === 'axo-tap:cancelled') {
    closeDomHier(false);
  } else if (d.kind === 'axo-tap:ready') {
    // Tap script alive in the iframe — nothing to do, but useful for future
    // "picker available" indicators.
  }
});

function termStatusClass(status) {
  const s = String(status || '');
  if (s.startsWith('running')) return 'running';
  if (s.startsWith('failed') || s.startsWith('error')) return 'failed';
  return 'exited';
}
function termShortLabel(command) {
  const c = String(command || '').trim();
  // First whitespace-separated word, plus the next arg if short.
  const parts = c.split(/\s+/);
  if (parts.length === 1) return parts[0] || '(empty)';
  return (parts[0] + ' ' + parts[1]).slice(0, 28);
}

async function refreshSessionTasks(expectedSessionId = S.session.id) {
  if (!expectedSessionId || S.session.id !== expectedSessionId) return false;
  const sessionState = S.session;
  let tasks = [];
  try {
    tasks = await fetch('/api/sessions/' + encodeURIComponent(expectedSessionId) + '/tasks')
      .then(r => r.json());
  } catch {}
  if (S.session !== sessionState || S.session.id !== expectedSessionId) return false;
  if (!Array.isArray(tasks)) tasks = [];
  sessionState.tasks = tasks;
  renderTerminals();
  detectUrlsFromTasks();
  return true;
}

// Tracks what the output panel currently displays so the 4-second task poll
// doesn't blindly tear it down and steal focus from xterm on every tick.
let _lastMountedTerminal = { id: null, kind: null };

function renderTerminals() {
  // Keep the closed-state rail in sync on every render so newly-spawned
  // terminals show up in the bottom strip without a separate trigger.
  try { renderTermRailList(); } catch {}
  const list = $('#terminals-list');
  const out  = $('#terminals-output');
  if (!list || !out) return;

  const tasks = S.session.tasks || [];

  if (!tasks.length) {
    if (S.session.autoTerminalStarting) {
      list.innerHTML = '<div class="terminals-empty small term-jade">starting bash…</div>';
      out.innerHTML =
        '<pre class="term-pre term-welcome">' +
        '<span class="term-dim">user@axocoatl </span><span class="term-jade">$</span> provision-session\n\n' +
        '<span class="term-jade">▶</span> <span style="font-weight:600;color:var(--axo-jade-glow);">Starting your terminal…</span>\n' +
        '<span class="term-dim">  installing bash, vim, python3, node, git…</span>\n' +
        '<span class="term-dim">  first time only — usually 10–20 seconds</span>\n\n' +
        '<span class="term-dim">user@axocoatl </span><span class="term-jade">$</span> <span class="term-cursor">▌</span>' +
        '</pre>';
    } else {
      list.innerHTML = '<div class="terminals-empty small muted">no terminals yet — click ＋ to start one</div>';
      out.innerHTML =
        '<pre class="term-pre term-welcome">' +
        '<span class="term-dim">user@axocoatl </span><span class="term-jade">$</span> <span class="term-cursor">▌</span>\n\n' +
        '<span class="term-dim">Click ＋ to start a terminal — run a dev server, a build watcher, or anything else.</span>' +
        '</pre>';
    }
    S.session.activeTerminalId = null;
    _lastMountedTerminal = { id: null, kind: null };
    return;
  }

  const ordered = tasks.slice().reverse();
  if (!S.session.activeTerminalId
      || !ordered.find(t => t.id === S.session.activeTerminalId)) {
    S.session.activeTerminalId = ordered[0].id;
  }

  // Sidebar list — always cheap to rebuild; doesn't touch the xterm DOM.
  list.innerHTML = '';
  ordered.forEach(t => {
    const row = el('div', 'term-row' + (t.id === S.session.activeTerminalId ? ' active' : ''));
    row.appendChild(el('span', 'term-dot ' + termStatusClass(t.status)));
    row.appendChild(el('span', 'term-label', termShortLabel(t.command)));
    row.title = (t.command || '') + '\n' + (t.status || '');
    row.addEventListener('click', () => {
      S.session.activeTerminalId = t.id;
      renderTerminals();
    });
    list.appendChild(row);
  });

  const active = ordered.find(t => t.id === S.session.activeTerminalId);
  if (!active) { out.innerHTML = ''; _lastMountedTerminal = { id: null, kind: null }; return; }

  // Same terminal that's already mounted? Just refresh the status text.
  // CRITICAL: do NOT touch the xterm DOM or it loses focus mid-typing.
  if (_lastMountedTerminal.id === active.id && _lastMountedTerminal.kind === active.kind) {
    const cmdEl = out.querySelector('.term-status-bar .term-cmd');
    const statusEl = out.querySelector('.term-status-bar > span:last-child');
    const dotEl = out.querySelector('.term-status-bar .term-dot');
    if (cmdEl)    cmdEl.textContent = active.command || '';
    if (statusEl) statusEl.textContent = active.status || '';
    if (dotEl)    dotEl.className = 'term-dot ' + termStatusClass(active.status);
    // For legacy (log) tasks, also refresh the scrollback.
    if (active.kind !== 'terminal') {
      const pre = out.querySelector('.term-pre');
      if (pre) {
        const atBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 8;
        pre.textContent = String(active.log || '').slice(-32 * 1024) || '(no output yet)';
        if (atBottom) pre.scrollTop = pre.scrollHeight;
      }
    }
    return;
  }

  // Different terminal — fully re-mount.
  out.innerHTML = '';
  const bar = el('div', 'term-status-bar');
  bar.appendChild(el('span', 'term-dot ' + termStatusClass(active.status)));
  bar.appendChild(el('span', 'term-cmd', active.command || ''));
  bar.appendChild(el('span', 'grow'));
  bar.appendChild(el('span', '', active.status || ''));
  out.appendChild(bar);

  if (active.kind === 'terminal') {
    const elx = getOrCreateXterm(active.id);
    if (elx) {
      out.appendChild(elx);
      // The element re-fits itself on resize; this is for the mount, where it
      // has just been given dimensions for the first time.
      setTimeout(() => { elx.fit(); elx.focus(); }, 0);
    } else {
      out.appendChild(el('div', 'term-empty-output', 'xterm.js failed to load.'));
    }
  } else {
    const pre = el('pre', 'term-pre');
    pre.textContent = String(active.log || '').slice(-32 * 1024) || '(no output yet)';
    out.appendChild(pre);
    queueMicrotask(() => { pre.scrollTop = pre.scrollHeight; });
  }
  _lastMountedTerminal = { id: active.id, kind: active.kind };
}

// ── + New terminal popover ──
// First preset is highlighted as the "default" — clicking the ＋ button and
// hitting Enter starts a plain shell at the session's working directory.
const TERMINAL_PRESETS = [
  'bash',
  'sh',
  'python3 serve.py',
  'python3 -m http.server 3000',
  'npm run dev',
  'cargo run',
  'vim .',
  'nano',
  'ls -la',
];

function openTerminalPop() {
  const pop = $('#term-new-pop'); if (!pop) return;
  const presets = $('#term-presets');
  if (presets) {
    presets.innerHTML = '';
    TERMINAL_PRESETS.forEach(cmd => {
      const b = el('button', 'term-preset', cmd);
      b.type = 'button';
      b.addEventListener('click', () => {
        const inp = $('#term-new-cmd');
        if (inp) { inp.value = cmd; inp.focus(); }
      });
      presets.appendChild(b);
    });
  }
  const inp = $('#term-new-cmd');
  if (inp) {
    inp.value = 'bash';
    setTimeout(() => { inp.focus(); inp.select(); }, 0);
  }
  // Stage off-screen so layout is real before we measure (display:none → flex
  // can give a zero rect on the same tick in some browsers).
  pop.style.top = '-9999px';
  pop.style.left = '-9999px';
  pop.classList.remove('hide');
  requestAnimationFrame(() => {
    const btn = $('#term-new-btn');
    if (!btn) return;
    const r = btn.getBoundingClientRect();
    const popRect = pop.getBoundingClientRect();
    const vh = window.innerHeight, vw = window.innerWidth;
    const fitsBelow = (r.bottom + 6 + popRect.height) <= vh - 8;
    const top = fitsBelow ? (r.bottom + 6) : Math.max(8, r.top - 6 - popRect.height);
    let left = r.left;
    if (left + popRect.width > vw - 8) left = Math.max(8, vw - 8 - popRect.width);
    pop.style.top  = top  + 'px';
    pop.style.left = left + 'px';
    pop.style.right = 'auto';
  });
  setTimeout(() => document.addEventListener('mousedown', onTermPopOutside, true), 0);
}

function closeTerminalPop() {
  const pop = $('#term-new-pop');
  if (pop) pop.classList.add('hide');
  document.removeEventListener('mousedown', onTermPopOutside, true);
}

function onTermPopOutside(e) {
  const pop = $('#term-new-pop');
  const btn = $('#term-new-btn');
  if (!pop || pop.contains(e.target) || (btn && btn.contains(e.target))) return;
  closeTerminalPop();
}

async function submitNewTerminal() {
  const inp = $('#term-new-cmd');
  const cmd = (inp && inp.value || '').trim();
  if (!cmd || !S.session.id) return;
  const expectedSessionId = S.session.id;
  const sessionState = S.session;
  closeTerminalPop();
  try {
    const r = await fetch('/api/sessions/' + encodeURIComponent(expectedSessionId) + '/tasks', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      // Default to interactive PTY — these run vim/nano, dev servers with
      // colored output, etc. The legacy log-only path is still reachable
      // server-side via interactive:false (used by agent-spawned tasks).
      body: JSON.stringify({ command: cmd, interactive: true, rows: 30, cols: 100 }),
    });
    const j = await r.json().catch(() => ({}));
    if (S.session !== sessionState || S.session.id !== expectedSessionId) return;
    if (r.ok && j && j.id) {
      sessionState.activeTerminalId = j.id;
      toast('Terminal started', cmd, 'ok');
    } else {
      const msg = j && j.error ? j.error : ('HTTP ' + r.status);
      toast('Could not start terminal', msg, 'err');
      const out = $('#terminals-output');
      if (out) out.innerHTML = '<div class="term-empty-output">Failed to start: ' + escHtml(msg) + '</div>';
    }
  } catch (e) {
    if (S.session !== sessionState || S.session.id !== expectedSessionId) return;
    toast('Could not start terminal', String(e), 'err');
    const out = $('#terminals-output');
    if (out) out.innerHTML = '<div class="term-empty-output">Failed to start: ' + escHtml(String(e)) + '</div>';
  }
  await refreshSessionTasks(expectedSessionId);
}

// ── xterm.js bridge ──
// One Terminal instance per terminal id we've seen, so switching back and
// forth doesn't lose state.
// ── Terminals ──
//
// A terminal is <ax-terminal> (see /ui/terminal.js): it owns its xterm, its PTY
// socket, the brand theme and the resize protocol. What stays here is which
// terminals exist and where the active one is shown.
//
// Elements are created once per task and reused. Everything about a terminal is
// stateful and expensive to recreate — scrollback, the running process, the
// socket — so it is moved between containers, never rebuilt.
S.xterms = new Map();   // task id → <ax-terminal>

function getOrCreateXterm(taskId) {
  let elx = S.xterms.get(taskId);
  if (elx) return elx;
  if (typeof Terminal === 'undefined') return null;
  elx = document.createElement('ax-terminal');
  elx.session = S.session.id;
  elx.task = taskId;
  S.xterms.set(taskId, elx);
  return elx;
}

function teardownXterms() {
  S.xterms.forEach((elx) => { try { elx.destroy(); } catch {} });
  S.xterms.clear();
}


// ── File tree ──
//
// The tree itself is <ax-file-tree> (see /ui/file-tree.js): a shadow-DOM
// component that loads folders on demand, filters, and reports `file-open`
// rather than opening anything itself. What stays here is the wiring — which
// session it shows, what happens when a row is activated, and the search input
// that drives its `filter` attribute.

/** Re-read the tree from disk. Called whenever the project changes underneath. */
function refreshFileTree() { $('#file-tree')?.reload?.(); }

// ── Rail ──
//
// Navigation is one kind of thing now: sessions, grouped by the directory they
// are anchored to. Opening one goes through the same openCockpit the finder
// used, so there is exactly one path into a session.
const LAST_SESSION_KEY = 'axo.session.last.v1';

/** Open the session you were last in, if it still exists. */
async function restoreLastSession() {
  const explicitId = new URLSearchParams(location.search).get('session');
  const id = explicitId || localStorage.getItem(LAST_SESSION_KEY);
  if (!id) return false;
  try {
    // There is no GET for a single session; the list is the source.
    const list = await fetch('/api/sessions').then(r => r.json());
    const s = (Array.isArray(list) ? list : []).find(x => x.id === id);
    if (!s) return false;
    openCockpit(s);
    return true;
  } catch { return false; }
}

// ── Module launcher ────────────────────────────────────────────────────
//
// Opening a pane used to mean going to a menu and flipping a switch, which is a
// settings gesture. It is an action you take mid-thought, so it lives on a
// shortcut. The launcher lists every module with its binding, because a
// shortcut nobody can discover is one nobody uses.
const MODULE_KEYS = { p: 'files', a: 'stream', e: 'compare', t: 'terminal', b: 'browser', g: 'trace' };

function openModule(id) {
  if (id === 'terminal') {
    toggleTerminalsDrawer(true);
    renderTerminals();
    return;
  }
  if (!SURFACES[id]) return;
  const L = S.cockpitLayout;
  const order = (L.paneOrder || DEFAULT_PANE_ORDER).filter((paneId) => SURFACES[paneId]);
  // Launcher and shortcut opens are focus actions: the module temporarily
  // replaces chat. The Panes menu remains the explicit path to peer tiling.
  if (!order.includes(id)) {
    if (id === 'files') order.unshift(id);
    else order.push(id);
  }
  L.paneOrder = order;
  if (L.collapsed) L.collapsed[id] = false;
  L.focused = id;
  applyCockpitLayout();
  if (id === 'compare') refreshCompare(S.session.id);
  renderPanesMenu();
  syncLauncherState();
}

function syncLauncherState() {
  const open = (S.cockpitLayout.paneOrder || DEFAULT_PANE_ORDER)
    .filter((id) => SURFACES[id]);
  if (S.cockpitLayout.termOpen) open.push('terminal');
  $('#launcher')?.setOpenModules?.(open);
}

const RAIL_COLLAPSED_KEY = 'axo.rail.collapsed.v1';

function applyResponsiveRailState(rail = $('#rail')) {
  if (!rail) return;
  if (window.innerWidth < 1100) {
    rail.collapsed = true;
    return;
  }
  try { rail.collapsed = localStorage.getItem(RAIL_COLLAPSED_KEY) === '1'; } catch {}

// The column caps are computed from the window's actual width, so they have to
// be recomputed when it changes. Without this the layout is only ever correct
// for the width it was last built at: shrink the window and the panes keep
// their old tracks and push the chat spine off the edge.
(function relayoutOnResize() {
  let queued = false;
  window.addEventListener('resize', () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => {
      queued = false;
      applyCockpitLayout();
      relayoutEmbeddedEditors();
      // Below a laptop width there is not room for a rail and a readable chat
      // at once. It collapses itself rather than being fought with, and the
      // preference is left alone so it comes back when the window does.
      applyResponsiveRailState();
    });
  });
})();

// (or after refresh). Subsequence + substring scoring.
S.quickOpen = { index: null, indexFor: null, building: false };

async function buildQuickOpenIndex() {
  if (S.quickOpen.building) return;
  if (!S.session || !S.session.id) return;
  if (S.quickOpen.indexFor === S.session.id && S.quickOpen.index) return;
  S.quickOpen.building = true;
  const out = [];
  // BFS the directory tree. Backend caps recursion / file count
  // organically by the same `/tree` endpoint the tree pane uses.
  async function crawl(p) {
    let entries = [];
    try {
      entries = await fetch('/api/sessions/' + encodeURIComponent(S.session.id) + '/tree'
        + (p ? '?path=' + encodeURIComponent(p) : '')).then(r => r.json());
    } catch {}
    if (!Array.isArray(entries)) return;
    for (const e of entries) {
      if (e.kind === 'dir') { await crawl(e.path); }
      else { out.push({ name: e.name, path: e.path }); }
      // Safety bail — sessions can be huge.
      if (out.length >= 5000) return;
    }
  }
  await crawl('');
  S.quickOpen.index = out;
  S.quickOpen.indexFor = S.session.id;
  S.quickOpen.building = false;
}

// Subsequence-aware fuzzy match. Returns a numeric score (higher = better)
// or -1 if no match. Falls back to substring + ranks paths shorter / closer
// to root higher so common files surface fast.
function quickOpenScore(query, name, path) {
  const q = query.toLowerCase();
  const n = name.toLowerCase();
  const p = path.toLowerCase();
  // 1. Exact name match — best.
  if (n === q) return 10000 - p.length;
  // 2. Name startsWith
  if (n.startsWith(q)) return 5000 - p.length;
  // 3. Name substring
  const nameIdx = n.indexOf(q);
  if (nameIdx >= 0) return 2000 - nameIdx * 5 - p.length;
  // 4. Path substring (matches against full relative path)
  const pathIdx = p.indexOf(q);
  if (pathIdx >= 0) return 800 - pathIdx * 2 - p.length;
  // 5. Subsequence in name (every query char appears in order)
  let qi = 0;
  for (let i = 0; i < n.length && qi < q.length; i++) {
    if (n[i] === q[qi]) qi++;
  }
  if (qi === q.length) return 300 - p.length;
  return -1;
}

let _quickOpenEl = null;
let _quickOpenActiveIdx = 0;
let _quickOpenHits = [];

async function openQuickOpen() {
  if (!S.session || !S.session.id) return;
  // Build index in background while the modal opens.
  buildQuickOpenIndex();
  if (_quickOpenEl) return;
  const overlay = el('div', 'quick-open');
  const card = el('div', 'quick-open-card');
  const input = document.createElement('input');
  input.className = 'quick-open-input';
  input.placeholder = 'Search files by name…';
  input.spellcheck = false;
  input.autocomplete = 'off';
  const list = el('div', 'quick-open-list');
  card.appendChild(input);
  card.appendChild(list);
  overlay.appendChild(card);
  document.body.appendChild(overlay);
  _quickOpenEl = overlay;
  _quickOpenActiveIdx = 0;
  function refresh() {
    const q = input.value.trim();
    if (!q) {
      // Default view: most-recent first (the openFiles tabs sit on top).
      const recent = (axEditor().files || []).map(f => ({ name: f.path.split('/').pop(), path: f.path }));
      _quickOpenHits = recent;
    } else {
      const idx = S.quickOpen.index || [];
      const scored = [];
      for (const it of idx) {
        const s = quickOpenScore(q, it.name, it.path);
        if (s >= 0) scored.push({ ...it, score: s });
      }
      scored.sort((a, b) => b.score - a.score);
      _quickOpenHits = scored.slice(0, 200);
    }
    _quickOpenActiveIdx = 0;
    renderList();
  }
  function renderList() {
    list.innerHTML = '';
    if (!_quickOpenHits.length) {
      list.appendChild(el('div', 'quick-open-empty',
        S.quickOpen.building ? 'Indexing files…' : 'No matches'));
      return;
    }
    _quickOpenHits.forEach((it, i) => {
      const row = el('div', 'quick-open-item' + (i === _quickOpenActiveIdx ? ' active' : ''));
      const [iconName, tint] = iconForFile(it.name);
      const ico = el('i', 'codicon codicon-' + iconName + ' ftn-ico ' + tint, '');
      const name = el('span', 'quick-open-name', it.name);
      const path = el('span', 'quick-open-path', it.path);
      row.appendChild(ico); row.appendChild(name); row.appendChild(path);
      row.addEventListener('click', () => choose(i));
      list.appendChild(row);
    });
    // Keep the active row in view.
    const active = list.querySelector('.quick-open-item.active');
    if (active) active.scrollIntoView({ block: 'nearest' });
  }
  function move(delta) {
    if (!_quickOpenHits.length) return;
    _quickOpenActiveIdx = (_quickOpenActiveIdx + delta + _quickOpenHits.length) % _quickOpenHits.length;
    renderList();
  }
  function choose(idx) {
    const hit = _quickOpenHits[idx]; if (!hit) return;
    closeQuickOpen();
    openFile(hit.path);
  }
  input.addEventListener('input', refresh);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); closeQuickOpen(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp')   { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter')     { e.preventDefault(); choose(_quickOpenActiveIdx); }
  });
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeQuickOpen();
  });
  // Initial render + light polling so the modal stays responsive while
  // the index is still being built in the background.
  refresh();
  const poll = setInterval(() => {
    if (!_quickOpenEl) { clearInterval(poll); return; }
    if (!S.quickOpen.building) { clearInterval(poll); refresh(); }
  }, 250);
  input.focus();
}
function closeQuickOpen() {
  if (_quickOpenEl) { _quickOpenEl.remove(); _quickOpenEl = null; }
}

// Global Ctrl/Cmd+P binding — only when a session is active.
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p' && !e.shiftKey && !e.altKey) {

// saving — live in <ax-editor> (see /ui/editor.js). It is deliberately light
// DOM: Monaco injects its stylesheet into document.head and measures against
// the document, so inside a shadow root it renders nothing.
//
// What stays here is the chrome around it: the tab bar, the view-mode switch,
// and the preview renderer, which is a different way of showing a file rather
// than part of the editor.

 * A pane sized for a file tree leaves the editor about seventy pixels, which
 * renders — line numbers, syntax, everything — and is unreadable. Widening only

function widenFilesForEditor() {
  document.querySelector('#cockpit-files .files-pane-inner')?.classList.remove('editor-collapsed');
  if (surfaceWidth('files') < FILES_PANE_WITH_EDITOR) {

function renderFileTabs() {
  const bar = $('#file-tabs'); if (!bar) return;
  const ed = axEditor();
  bar.innerHTML = '';
  ed.files.forEach(f => {
    // A dot rather than a word: it has to be readable at a glance across a row

    const tab = el('div', 'ftab' + (f.active ? ' active' : '') + (f.dirty ? ' dirty' : ''));
    tab.title = f.path + (f.dirty ? ' — unsaved changes' : '');

// Collapse the file-editor column when nothing is open, so the Files pane is
// just the tree (no empty cramped editor beside it). Opens when a file or a
// diff is open.
function updateFilesEditor() {
  const inner = document.querySelector('#cockpit-files .files-pane-inner');
  if (!inner) return;
  const hasContent = axEditor().files.length > 0 || !!S.session.gitDiff;
  const wasCollapsed = inner.classList.contains('editor-collapsed');
  inner.classList.toggle('editor-collapsed', !hasContent);
  if (hasContent && wasCollapsed) requestAnimationFrame(() => relayoutEmbeddedEditors());

/**
 * Replace what the viewer is showing, keeping the editor alive.
 *
 * The editor holds every open model and its view state, so it must be detached
 * rather than destroyed — clearing `innerHTML` around it would silently throw
 * away unsaved work and every cursor position. Callers that want the editor
 * back call `renderActiveFile()`.
 */
function viewerShow(node) {
  const v = $('#file-viewer'); if (!v) return null;
  const ed = axEditor();
  if (ed.parentNode === v) v.removeChild(ed);
  v.textContent = '';
  if (typeof node === 'string') v.innerHTML = node;
  else if (node) v.append(node);
  return v;
}

/**
 * The one editor element, created on first use and never replaced.
 *
 * Held in a variable rather than looked up by id: the element spends time
 * detached — while a preview or a diff has the pane — and a lookup would miss
 * it and build a second editor with none of the open files.
 */
let _editorEl = null;
function axEditor() {
  if (!_editorEl) {
    _editorEl = document.createElement('ax-editor');
    _editorEl.id = 'editor';
    wireEditor(_editorEl);
  }
  return _editorEl;
}

const PREVIEWABLE_LANGS = new Set(['html', 'htm', 'svg', 'md', 'markdown']);
const MARKDOWN_LANGS = new Set(['md', 'markdown']);

/**
 * Show the active file: either the preview renderer or the editor.
 *
 * Preview is a different way of showing the same file, not part of the editor,
 * so it lives here and the editor element is simply set aside while it shows.
 */
function renderActiveFile() {
  const v = $('#file-viewer'); if (!v) return;
  const ed = axEditor();
  const modes = $('#viewer-modes');
  const hint = $('#viewer-hint');
  const saveBtn = $('#viewer-save');
  const f = ed.activeFile;
  if (!f) {
    if (modes) modes.style.display = 'none';
    viewerShow('<div class="empty small">Select a file to view</div>');
    return;
  }
  const previewable = PREVIEWABLE_LANGS.has((f.lang || '').toLowerCase());
  const mode = viewModeFor(f);
  if (modes) {
    modes.style.display = 'flex';
    $$('.vmode').forEach(b => {
      const m = b.dataset.mode;
      b.classList.toggle('active', m === mode);
      b.style.display = (m === 'preview' && !previewable) ? 'none' : '';
    });
    if (hint) {
      hint.textContent =
        mode === 'preview' ? 'Live preview (sandboxed)' :
        f.truncated        ? 'Read-only — file truncated by backend' :
        f.dirty            ? 'Unsaved changes — Ctrl+S to save' :
                             'Editing — Ctrl+S to save';
    }
    if (saveBtn) saveBtn.classList.toggle('hide', mode !== 'edit' || !!f.truncated);
    const revertBtn = $('#viewer-cancel');
    if (revertBtn) revertBtn.classList.toggle('hide', mode !== 'edit' || !f.dirty);
  }

  if (mode === 'preview') {
    const iframe = document.createElement('iframe');
    iframe.className = 'file-preview';
    iframe.setAttribute('sandbox', 'allow-scripts');
    const lang = (f.lang || '').toLowerCase();
    iframe.setAttribute('srcdoc',
      MARKDOWN_LANGS.has(lang) ? renderMarkdownDoc(ed.contentOf(f.path)) : ed.contentOf(f.path));
    viewerShow(iframe);
    return;
  }
  // The editor moves back into the pane rather than being rebuilt — it is
  // holding a model and a cursor position for every open file.
  if (ed.parentNode !== v) {
    // A diff was showing; it is not any more, and holding its editor would keep
    // the pane open around an empty view once the last file is closed.
    if (S.session.gitDiff) gitDisposeDiff(window.monaco);
    v.textContent = '';
    v.append(ed);
  }
  ed.layout();
  ed.focus();
}

/** Which way a file is being shown. Previewable types start rendered. */
const _viewModes = new Map();   // path → 'edit' | 'preview'
function viewModeFor(f) {
  if (!_viewModes.has(f.path)) {
    _viewModes.set(f.path,
      PREVIEWABLE_LANGS.has((f.lang || '').toLowerCase()) ? 'preview' : 'edit');
  }
  return _viewModes.get(f.path);
}

async function onViewerModeClick(e) {
  const b = e.target.closest('.vmode'); if (!b) return;
  const ed = axEditor();
  const f = ed.activeFile; if (!f) return;
  const next = b.dataset.mode;
  // Leaving the editor with unsaved work is a decision, not a side effect.
  if (viewModeFor(f) === 'edit' && next !== 'edit' && f.dirty) {
    const ok = await axoConfirm({
      title: 'Discard unsaved changes?',
      body: `"${f.path}" has unsaved edits. Switching view will lose them.`,
      okLabel: 'Discard',
      okKind: 'danger',
    });
    if (!ok) return;
    ed.revert(f.path);
  }
  _viewModes.set(f.path, next);
  renderActiveFile();
}

function saveActiveFile() { return axEditor().save(); }

/// Does this edit affect a file we have open? Path comparison handles both
/// absolute paths and paths relative to the session's working dir.
function pathMatchesOpen(editedPath, openPath) {
  if (!editedPath || !openPath) return false;
  const e = editedPath.replace(/^\.\//, '');
  const o = openPath.replace(/^\.\//, '');
  return e === o || e.endsWith('/' + o);
}

async function reloadOpenFileIfMatch(editedPath) {
  const ed = axEditor(); if (!ed) return;
  // Match on either an absolute path or one relative to the working dir.
  const hit = ed.files.find(f => pathMatchesOpen(editedPath, f.path));
  if (!hit) return;
  const done = await ed.reload(hit.path);
  // A file with unsaved work is left alone rather than overwritten; say so
  // instead of letting the buffer and the disk quietly disagree.
  if (!done && hit.dirty) {
    toast('File changed on disk', hit.path + ' has unsaved edits — not reloaded.', 'warn');
  }
  renderActiveFile();
}

// ── Activity stream ──
function appendSessionEl(node) {
  const msgs = $('#session-msgs');
  msgs.appendChild(node);
  msgs.scrollTop = msgs.scrollHeight;
}
function toolVerb(name, args) {
  args = args || {};
  switch (name) {
    case 'read_file': return ['◆', 'Read ' + (args.path || '')];
    case 'write_file': return ['✎', 'Write ' + (args.path || '')];
    case 'edit_file': return ['✎', 'Edit ' + (args.path || '')];
    case 'list_dir': return ['▤', 'List ' + (args.path || '.')];
    case 'grep': return ['⌕', 'Grep “' + (args.pattern || '') + '”'];
    case 'glob': return ['⌕', 'Glob ' + (args.pattern || '')];
    case 'bash': return ['▸', 'Bash: ' + (args.command || '')];
    case 'web_search': return ['◍', 'Search the web: ' + (args.query || '')];
    default:
      if (name && name.indexOf('skill_') === 0) return ['◈', 'Fire skill: ' + name.slice(6)];
      return ['•', name || 'tool'];
  }
}
function renderToolResult(name, result) {
  if (result == null) return '';
  const r = result;
  if (name === 'bash') {
    let s = '';
    if (r.stdout) s += r.stdout;
    if (r.stderr) s += (s ? '\n' : '') + r.stderr;
    return '<pre>' + escHtml(s || '(no output)') + '</pre>'
      + (r.exit_code ? '<div class="small muted">exit ' + r.exit_code + '</div>' : '');
  }
  if (name === 'read_file') return '<pre>' + escHtml((r.content || '').slice(0, 4000)) + '</pre>';
  if (name === 'grep') return '<pre>' + escHtml(r.matches || '(no matches)') + '</pre>';
  if (name === 'list_dir') return '<pre>' + escHtml(r.listing || '') + '</pre>';
  if (name === 'glob') return '<pre>' + escHtml((r.files || []).join('\n')) + '</pre>';
  if (name === 'write_file' || name === 'edit_file') {
    return '<div class="small">✓ ' + escHtml(r.path || '')
      + (r.replacements != null ? ' · ' + r.replacements + ' replacement(s)' : '') + '</div>';
  }
  if (name === 'web_search') {
    const hits = r.results || [];
    if (!hits.length) return '<div class="small muted">No results.</div>';
    return hits.map(h =>
      '<div style="margin-bottom:7px;"><a href="' + escHtml(h.url || '#')
      + '" target="_blank" rel="noopener">' + escHtml(h.title || h.url || '') + '</a>'
      + '<div class="small muted">' + escHtml((h.snippet || '').slice(0, 220)) + '</div></div>'
    ).join('');
  }
  return '<pre>' + escHtml(JSON.stringify(r, null, 2)) + '</pre>';
}
function sessionToolStart(d) {
  setThinking($('#session-msgs'), false);
  S.session.streamEl = null;
  const { card, body } = buildToolCard(d);
  S.session.toolCards[d.call_id] = { card, body };
  appendSessionEl(card);
}
function sessionToolResult(d) {
  const tc = S.session.toolCards[d.call_id];
  if (!tc) return;
  fillToolCard(tc.card, d);
  // A write changed the project — refresh the file tree and re-render any
  // open file that just changed (which makes the Preview iframe auto-reload).
  if (!d.is_error && (d.name === 'write_file' || d.name === 'edit_file' || d.name === 'bash')) {
    refreshFileTree();
    refreshGitPane(); // the agent changed files — update Source Control live
    if (d.name === 'write_file' || d.name === 'edit_file') {
      const edited = d.result && d.result.path;
      if (edited) reloadOpenFileIfMatch(edited);
    }
  }
}
function sessionAppendText(delta) {
  setThinking($('#session-msgs'), false);
  if (!S.session.streamEl) {
    const wrap = el('div', 'smsg');
    wrap.appendChild(el('div', 'smsg-role', 'agent'));
    // Same `.prose` body as Chat → identical markdown styling in both tabs.
    const body = el('div', 'smsg-body prose');
    wrap.appendChild(body);
    S.session.streamEl = body;
