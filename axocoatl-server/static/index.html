<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Axocoatl</title>
<!-- Favicon: the brand glyph in jade green, inlined as a data URI so it
     ships with the page (no extra HTTP round-trip). -->
<link rel="icon" type="image/png" href="/brand/favicon.png" />
<!-- Brand faces vendored locally under /vendor/fonts — no external font CDN, fully offline. -->
<link rel="stylesheet" href="/ui/shell.css">
<link rel="stylesheet" href="/vendor/highlight.css">
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/vendor/codicons/codicon.css">
<!-- App UI modules. Transitional bridge: this document is still a classic
     script, so the module graph is loaded here and the one helper the classic
     code still needs is handed across. It goes away when the shell itself
     becomes a module. -->
<script type="module">
  import { iconForFile } from '/ui/file-tree.js';
  import '/ui/rail.js';
  import '/ui/launcher.js';
  import '/ui/attempts.js';
  import '/ui/compare.js';
  import '/ui/fanout.js';
  import '/ui/changes.js';
  import '/ui/source-control.js';
  import '/ui/mcp-approval.js';
  import '/ui/session-home.js';
  import '/ui/settings-agents.js';
  import '/ui/settings-skills.js';
  import '/ui/settings-mcp.js';
  import '/ui/automation-settings.js';
  import '/ui/settings.js';
  import '/ui/terminal.js';
  import '/ui/browser.js';
  import { loadMonaco } from '/ui/editor.js';
  import { MODULES as AX_MODULES } from '/ui/launcher.js';
  import { SETTINGS_SECTIONS as AX_SETTINGS_SECTIONS } from '/ui/settings.js';
  // The palette lists the same modules and settings sections the launcher and
  // the settings dialog do — one source, so a new module appears everywhere.
  window.PALETTE_MODULES = AX_MODULES;
  window.PALETTE_SETTINGS = AX_SETTINGS_SECTIONS;
  // One AMD load for the page: the diff editor in the shell shares it.
  window.axLoadMonaco = loadMonaco;
  // Boot diagnostics: an exception during init() silently strands the app —
  // the live socket never opens and nothing says why. Record them where they
  // can be read instead of vanishing into an empty console.
  window.__bootErrors = [];
  addEventListener('error', (e) => window.__bootErrors.push(String(e.message)));
  addEventListener('unhandledrejection', (e) => window.__bootErrors.push('reject: ' + (e.reason?.message || e.reason)));
  window.iconForFile = iconForFile;
</script>

     Auto-opens when a coordinator plan lands; also re-openable from a
     coordinator node. Top-level so it overlays from any tab. -->

<script>
// ───── Theme (Light / Dark / System) ─────
// Set as early as possible so first paint already has the right palette.
// Stored as 'light' | 'dark' | 'system'; 'system' falls through to
// matchMedia('prefers-color-scheme: dark') and re-applies if it changes.
const THEME_KEY = 'axo:theme-pref';
function getThemePref() { return localStorage.getItem(THEME_KEY) || 'system'; }
function applyTheme(pref) {
  const effective = (pref === 'system')
    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : pref;
  if (effective === 'light') document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
  // Reflect on the segmented control if it's in the DOM yet.
  document.querySelectorAll('.theme-seg').forEach(b => {
    b.classList.toggle('active', b.dataset.themePref === pref);
  });
  // Propagate to Monaco if it's loaded — the Sessions file editor uses
  // its `vs` (light) and `vs-dark` themes.
  if (window.monaco) {
    try { window.monaco.editor.setTheme(effective === 'light' ? 'vs' : 'vs-dark'); } catch {}
  }
}
function setThemePref(pref) { localStorage.setItem(THEME_KEY, pref); applyTheme(pref); }
applyTheme(getThemePref());
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (getThemePref() === 'system') applyTheme('system');
});
window.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.theme-seg').forEach(b => {
    b.addEventListener('click', () => setThemePref(b.dataset.themePref));
  });
  applyTheme(getThemePref()); // re-stamp once the buttons exist
});

// ───── Helpers ─────
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const fmtNum = n => n != null ? new Intl.NumberFormat().format(n) : '—';
const escHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));


let S = {
  agents: [], workflows: [], schedules: [], skills: [], mcpServers: [], mcpTools: [],
  sessions: [], activeSession: null,
  tokensTotal: 0,
  // The one coordinator run currently shown in the run view (Layer-2 tree).
  // Held across completion so the coordinator node can re-open it.
  runView: null,
};
// A start request can outlive navigation. Keep enough reversible UI state by
// session to either hydrate the daemon's set or restore the unsent draft.
const _attemptStartRecoveries = new Map();

// ───── Toasts ─────
function toast(title, body, kind = 'info', ms = 3500) {
  const t = el('div', `toast ${kind}`);
  t.appendChild(el('div', 't-title', title));
  if (body) t.appendChild(el('div', 't-body', body));
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .25s'; setTimeout(() => t.remove(), 260); }, ms);
}

// ───── In-app modal (axoModal) ─────
// Reusable, promise-based dialog. NEVER use alert/prompt/confirm — they
// look off-brand, block synchronously, and lose the Apple-feel. This is
// the only dialog primitive in the app.
//
// Usage:
//   await axoModal({ title, body }) → null on cancel
//   await axoModal({
//     title: 'Rename chat',
//     fields: [{ key:'name', label:'Name', value:'Old name', kind:'text' }],
//     okLabel: 'Save',
//   }) → { name: '...' } on confirm, null on cancel
//   await axoModal({
//     title: 'Delete?', body: 'This is permanent.',
//     okLabel: 'Delete', okKind: 'danger',
//   }) → true on confirm, false on cancel
//   await axoModal({
//     title: 'Pick agent',
//     choices: [{ value:'architect', label:'architect', sub:'ollama/llama3.2' }, ...],
//   }) → 'architect' on pick, null on cancel
//
// Fields support kind: 'text', 'textarea', 'select' (with `options`), 'file'.
function axoModal(spec) {
  return new Promise((resolve) => {
    const backdrop = el('div', 'modal-backdrop');
    const modal = el('div', 'modal axo-modal');
    backdrop.appendChild(modal);

    if (spec.title) modal.appendChild(el('div', 'modal-head', spec.title));

    const body = el('div', 'axo-modal-body');
    modal.appendChild(body);

    if (spec.body) {
      const p = el('div', 'axo-modal-text');
      // body may be a string or a pre-built node
      if (typeof spec.body === 'string') p.textContent = spec.body;
      else p.appendChild(spec.body);
      body.appendChild(p);
    }

    // ── Choice picker (radio list) ──
    let chosenChoice = null;
    if (spec.choices && spec.choices.length) {
      const list = el('div', 'axo-modal-choices');
      spec.choices.forEach((c, i) => {
        const row = el('div', 'axo-modal-choice' + (i === 0 ? ' active' : ''));
        chosenChoice = chosenChoice || c.value;
        row.dataset.value = c.value;
        const main = el('div', 'axo-modal-choice-main');
        main.appendChild(el('div', 'axo-modal-choice-label', c.label));
        if (c.sub) main.appendChild(el('div', 'axo-modal-choice-sub', c.sub));
        row.appendChild(main);
        row.addEventListener('click', () => {
          list.querySelectorAll('.axo-modal-choice').forEach(r => r.classList.remove('active'));
          row.classList.add('active');
          chosenChoice = c.value;
        });
        // Double-click to confirm-pick in one motion.
        row.addEventListener('dblclick', () => commit());
        list.appendChild(row);
      });
      body.appendChild(list);
    }

    // ── Field inputs ──
    const fieldEls = {};
    if (spec.fields && spec.fields.length) {
      for (const f of spec.fields) {
        const wrap = el('div', 'axo-modal-field');
        if (f.label) wrap.appendChild(el('label', 'axo-modal-label', f.label));
        let input;
        if (f.kind === 'textarea') {
          input = document.createElement('textarea');
          input.className = 'input';
          input.rows = f.rows || 4;
          input.value = f.value || '';
        } else if (f.kind === 'select') {
          input = document.createElement('select');
          input.className = 'select';
          for (const opt of (f.options || [])) {
            const o = document.createElement('option');
            o.value = opt.value;
            o.textContent = opt.label || opt.value;
            if (opt.value === f.value) o.selected = true;
            input.appendChild(o);
          }
        } else if (f.kind === 'file') {
          input = document.createElement('input');
          input.type = 'file';
          input.className = 'axo-modal-file';
          if (f.accept) input.accept = f.accept;
          if (f.multiple) input.multiple = true;
        } else {
          input = document.createElement('input');
          input.type = f.kind || 'text';
          input.className = 'input';
          input.value = f.value || '';
        }
        if (f.placeholder) input.placeholder = f.placeholder;
        wrap.appendChild(input);
        if (f.help) wrap.appendChild(el('div', 'axo-modal-help', f.help));
        body.appendChild(wrap);
        fieldEls[f.key] = input;
      }
    }

    // ── Footer with buttons ──
    const foot = el('div', 'modal-foot axo-modal-foot');
    const cancelBtn = el('button', 'btn ghost', spec.cancelLabel || 'Cancel');
    cancelBtn.addEventListener('click', () => cleanup(null));
    const okBtn = el('button', 'btn' + (spec.okKind === 'danger' ? ' danger' : ''), spec.okLabel || 'OK');
    okBtn.addEventListener('click', commit);
    foot.appendChild(el('div', '', '')); // spacer flex-fill
    foot.appendChild(cancelBtn);
    foot.appendChild(okBtn);
    modal.appendChild(foot);

    document.body.appendChild(backdrop);

    // Autofocus: first input if any, else the OK button.
    requestAnimationFrame(() => {
      const firstInput = modal.querySelector('input.input, textarea.input, .select, .axo-modal-file');
      if (firstInput) firstInput.focus();
      else okBtn.focus();
    });

    // Esc cancels; Enter confirms (except inside textareas / when shift held).
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); cleanup(null); }
      else if (e.key === 'Enter' && !e.shiftKey) {
        const t = e.target;
        if (t.tagName === 'TEXTAREA') return; // textareas allow Enter for newlines
        e.preventDefault();
        commit();
      }
    }
    backdrop.addEventListener('keydown', onKey);

    function commit() {
      // Determine the resolution shape based on what's in the dialog.
      if (spec.fields && spec.fields.length) {
        const out = {};
        for (const f of spec.fields) {
          const el = fieldEls[f.key];
          if (f.kind === 'file') out[f.key] = el.files;
          else out[f.key] = el.value;
        }
        cleanup(out);
      } else if (spec.choices && spec.choices.length) {
        cleanup(chosenChoice);
      } else {
        cleanup(true);
      }
    }
    function cleanup(value) {
      backdrop.removeEventListener('keydown', onKey);
      backdrop.remove();
      resolve(value);
    }
  });
}

// Convenience wrappers — terser than spec objects for common shapes.
function axoConfirm({ title, body, okLabel = 'OK', okKind } = {}) {
  return axoModal({ title, body, okLabel, okKind });
}
function axoPrompt({ title, label, value = '', placeholder, multiline = false, okLabel = 'Save' } = {}) {
  return axoModal({
    title,
    fields: [{
      key: 'value',
      label,
      value,
      placeholder,
      kind: multiline ? 'textarea' : 'text',
    }],
    okLabel,
  }).then(out => (out == null ? null : out.value));
}

// ───── Markdown ─────
// markdown-it instance — GitHub-grade formatting (tables, task lists, nested
// lists, blockquotes). `html:false` escapes any raw HTML in model output, so
// it's strictly safer than the old hand-rolled renderer. Code blocks with a
// known language are highlighted inline via highlight.js (and pre-marked
// `.hljs` so the scheduled pass below skips them); unlabeled blocks fall
// through to highlight.js auto-detection in `scheduleHighlight`.
const MD = window.markdownit({
  html: false,
  linkify: true,
  breaks: false,
  highlight(code, lang) {
    if (window.hljs && lang && window.hljs.getLanguage(lang)) {
      try {
        const v = window.hljs.highlight(code, { language: lang, ignoreIllegals: true }).value;
        return `<pre class="hljs"><code class="hljs language-${lang}">${v}</code></pre>`;
      } catch {}
    }
    return ''; // let markdown-it escape + wrap; scheduleHighlight() colors it
  },
});
// Open links in a new tab (safely) — matches the manual citation links.
const _mdLinkOpen = MD.renderer.rules.link_open
  || ((tokens, idx, options, env, self) => self.renderToken(tokens, idx, options));
MD.renderer.rules.link_open = (tokens, idx, options, env, self) => {
  tokens[idx].attrSet('target', '_blank');
  tokens[idx].attrSet('rel', 'noopener noreferrer');
  return _mdLinkOpen(tokens, idx, options, env, self);
};
function mdRender(text) {
  if (!text) return '';
  const html = MD.render(text);
  // Microtask + ":not(.hljs)" guard means we only ever highlight each block
  // once, even if mdRender runs many times per second during streaming.
  scheduleHighlight();
  return html;
}
let _hlScheduled = false;
function scheduleHighlight() {
  if (_hlScheduled) return;
  _hlScheduled = true;
  queueMicrotask(() => {
    _hlScheduled = false;
    if (window.hljs) {
      document.querySelectorAll('pre code:not(.hljs)').forEach(b => {
        try { window.hljs.highlightElement(b); } catch {}
      });
    }
  });
}

function setThinking(host, on) {

function buildToolCard(d) {
  const [ico, verb] = toolVerb(d.name, d.arguments);
  const card = el('div', 'toolcard running');
  card.dataset.callId = d.call_id || '';
  const head = el('div', 'toolcard-head');
  head.appendChild(el('span', 'toolcard-ico', ico));
  head.appendChild(el('span', 'toolcard-verb', verb));
  const body = el('div', 'toolcard-body hide');
  head.addEventListener('click', () => body.classList.toggle('hide'));
  card.append(head, body);
  return { card, body };
}

function fillToolCard(card, d) {
  const body = card.querySelector('.toolcard-body');
  card.classList.remove('running');
  card.classList.add(d.is_error ? 'err' : 'ok');
  if (body) {
    body.innerHTML = renderToolResult(d.name, d.result);
    if (d.is_error) body.classList.remove('hide');
  }
  if (d.name === 'web_search' && d.result && typeof d.result === 'object') {
    const sources = extractWebSearchUrls(d.result);
    if (sources.length) {
      const cite = el('div', 'chat-citations');
      cite.appendChild(el('div', 'chat-citations-head', 'Sources'));
      sources.forEach((src, i) => {
        const row = el('div', 'chat-citation');
        row.appendChild(el('span', 'chat-citation-num', `[${i + 1}]`));
        const link = document.createElement('a');
        link.href = src.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = src.title || src.url;
        row.appendChild(link);
        cite.appendChild(row);
      });
      card.appendChild(cite);
    }
  }
}

function extractWebSearchUrls(result) {
  if (Array.isArray(result.results)) {
    return result.results.map(r => ({ url: r.url || r.link, title: r.title || r.name })).filter(r => r.url);
  }
  if (Array.isArray(result.urls)) return result.urls.map(url => ({ url, title: url }));
  return [];
}

// ───── Status pearls — bottom-right floating indicators ─────
//
// Replaces the old top status bar.  Each pearl is a tiny glass capsule
// showing one piece of glanceable session state.
//
// Always-on pearls: daemon health (jade/amber/red) and interrupts
// (warn pearl, only when pending), plus the active session and token total.

S.daemonHealth = S.daemonHealth || 'unknown';  // 'healthy' | 'starting' | 'error' | 'unknown'
S.pendingInterrupts = S.pendingInterrupts || 0;

function activeSessionPearlText() {
  if (!S.session || !S.session.id) return null;
  const name = S.session.name || S.session.id.slice(0, 8);
  const agentCount = (S.session.agents || []).length;
  return agentCount > 0 ? `${name} · ${agentCount} agents` : name;
}

function renderStatusPearls() {
  const host = $('#status-pearls'); if (!host) return;
  const pearls = [];

  // Daemon health — always present.  Color follows S.daemonHealth.
  const dotClass = S.daemonHealth === 'healthy' ? '' :
                   S.daemonHealth === 'starting' ? 'amber' :
                   S.daemonHealth === 'error' ? 'err' : 'mute';
  pearls.push({
    key: 'health',
    dot: dotClass,
    text: S.daemonHealth === 'healthy' ? 'daemon healthy' :
          S.daemonHealth === 'starting' ? 'daemon starting' :
          S.daemonHealth === 'error' ? 'daemon unreachable' : 'connecting…',
  });

  // Interrupts are always discoverable when there are any pending.
  if (S.pendingInterrupts > 0) {
    pearls.push({
      key: 'interrupts', warn: true, clickable: true,
      text: `⏸ ${S.pendingInterrupts} waiting`,
      onClick: () => {
        $('#settings')?.show('automations');
        queueMicrotask(() => $('#settings-automations')?.showInterrupts?.());
      },
    });
  }

  const sess = activeSessionPearlText();
  if (sess) pearls.push({ key: 'session', text: sess });
  if (S.tokensTotal > 0) pearls.push({ key: 'tokens', text: `${fmtNum(S.tokensTotal)} tok` });

  // Diff-render: keep elements that haven't changed so the fade-in
  // animation doesn't run on every tick.
  const existing = new Map();
  Array.from(host.children).forEach(c => existing.set(c.dataset.key, c));
  const seen = new Set();
  pearls.forEach(p => {
    seen.add(p.key);
    const text = p.text;
    let row = existing.get(p.key);
    if (!row) {
      row = document.createElement('div');
      row.className = 'pearl fade-in';
      row.dataset.key = p.key;
      host.appendChild(row);
    }
    row.classList.toggle('warn', !!p.warn);
    row.classList.toggle('clickable', !!p.clickable);
    row.title = text;
    // Build content idempotently.
    const wantHTML = `<span class="pearl-dot ${p.dot || ''}"></span><span>${escHtml(text)}</span>`
                       .replace(/<span class="pearl-dot "><\/span>/, p.warn ? '' : '<span class="pearl-dot"></span>');
    if (row._lastHtml !== wantHTML) {
      row.innerHTML = (p.warn ? '' : `<span class="pearl-dot ${p.dot || ''}"></span>`) +
                      `<span>${escHtml(text)}</span>`;
      row._lastHtml = wantHTML;
    }
    if (p.onClick) { row.onclick = p.onClick; } else { row.onclick = null; }
  });
  // Remove pearls that are no longer in the set.
  existing.forEach((node, key) => {
    if (!seen.has(key)) node.remove();
  });
}

// ───── Sessions cockpit ─────
S.session = { id: null, dir: '', name: '', mode: null, streamEl: null, streamBuf: '', toolCards: {} };
// The compact, in-thread summary for the attempt set belonging to the open
// session. Durable identity lives here; the full decision surface is Compare.
S.threadVariants = null;
S.cockpitLayout = {
  // The cockpit is a row of N "surfaces" (panes) drawn from the SURFACES
  // registry.  `paneOrder` is the visible surfaces left→right; `widths` is the
  // px size of each fixed surface (flex surfaces — e.g. Activity — take 1fr and
  // ignore it). The terminal is a separate bottom dock.
  flex: 'stream',               // id of the surface that fills (1fr)
  widths: { files: 220, browser: 360 },
  collapsed: {},
  focused: null,                // null | surface id
  // Conversation-only by default: a fresh session is just the Activity canvas.
  // Files/browser/graph appear when you reach for them (Panes menu).
  paneOrder: ['stream'],
  termOpen: false,        // false = thin rail, true = drawer expanded
  termOpenW: 320,         // dock height when open (drag-resizable)
  termInnerListW: 140,    // inner list width (drag-resizable inside the drawer)
};
S.sidebarMode = 'full';         // 'full' | 'mini' | 'hidden'

// localStorage persistence — your custom workspace survives page reloads.
// v5: N-surface layout engine (preset + widths map).  v4: lattice pane
// dropped from Sessions.  v3: terminals became an overlay drawer.
// v6: presets retired — the cockpit is one configurable workspace; surfaces
// are toggled via the Panes menu. Bumped so old persisted presets reset.
// v9: terminals moved from a right-hand drawer to a bottom dock, so the
// remembered `termOpenW` is a width being read as a height — it describes a
// different axis of a different thing and is not a preference to carry over.
const LAYOUT_KEY = 'axo.cockpit.v9';
const SIDEBAR_KEY = 'axo.sidebar.v1';
function persistLayout() {
  try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(S.cockpitLayout)); } catch {}
}
function persistSidebar() {
  try { localStorage.setItem(SIDEBAR_KEY, S.sidebarMode); } catch {}
}
function loadPersistedLayout() {
  try {
    const s = JSON.parse(localStorage.getItem(LAYOUT_KEY) || 'null');
    if (s && typeof s === 'object') {
      // Merge carefully so new fields land with sensible defaults.
      if (typeof s.flex === 'string' && SURFACES[s.flex]) S.cockpitLayout.flex = s.flex;
      if (s.widths && typeof s.widths === 'object') {
        Object.keys(SURFACES).forEach(id => {
          const w = s.widths[id];
          const mn = SURFACES[id].min || 120, mx = SURFACES[id].max || 1400;
          if (typeof w === 'number' && w >= mn && w <= mx) S.cockpitLayout.widths[id] = w;
        });
      }
      if (s.collapsed && typeof s.collapsed === 'object') {
        Object.keys(S.cockpitLayout.collapsed).forEach(k => {
          if (typeof s.collapsed[k] === 'boolean') S.cockpitLayout.collapsed[k] = s.collapsed[k];
        });
      }
      // Accept any persisted order whose ids are all registered surfaces.
      if (Array.isArray(s.paneOrder) && s.paneOrder.length && s.paneOrder.every(id => SURFACES[id])) {
        S.cockpitLayout.paneOrder = s.paneOrder.slice();
      }
      if (typeof s.termOpen     === 'boolean') S.cockpitLayout.termOpen     = s.termOpen;
      // Clamped rather than trusted: this value used to be a drawer *width*,
      // so a remembered 900 would open a dock tall enough to bury the app.
      if (typeof s.termOpenW === 'number') {
        S.cockpitLayout.termOpenW =
          Math.max(TERM_DRAWER_MIN, Math.min(TERM_DRAWER_MAX, s.termOpenW));
      }
      if (typeof s.termInnerListW === 'number' && s.termInnerListW > 60) S.cockpitLayout.termInnerListW = s.termInnerListW;
      // Don't restore focused on reload — start fresh, no jarring jump.
    }
  } catch {}
  try {
    const m = localStorage.getItem(SIDEBAR_KEY);
    if (m === 'mini' || m === 'hidden' || m === 'full') S.sidebarMode = m;
  } catch {}
}

// Surface registry — each surface is a persistent pane element the layout
// engine places into the grid. `flex` surfaces take 1fr; the rest are sized in
// px via S.cockpitLayout.widths[id]. The terminal is intentionally absent: its
// one home is the bottom dock.
const SURFACES = {
  files:   { el: '#cockpit-files',   title: 'Files',       defaultW: 260, min: 150, max: 1200, collapsible: true },
  stream:  { el: '#cockpit-stream',  title: 'Activity',    defaultW: 420, min: 280, max: 1200, collapsible: false },
  browser: { el: '#cockpit-browser', title: 'Browser',     defaultW: 240, min: 180, max: 1100, collapsible: true },
  trace:   { el: '#cockpit-trace',   title: 'Agent graph', defaultW: 420, min: 240, max: 1200, collapsible: true },
  compare: { el: '#cockpit-compare', title: 'Attempts',    defaultW: 520, min: 320, max: 1400, collapsible: true },
};
const DEFAULT_PANE_ORDER = ['files', 'stream', 'browser'];
// Which surface stretches to fill (1fr) is a property of the active layout,
// not the surface — a preset can make the diff or the editor the big one.
const isFlexSurface = (id) => id === (S.cockpitLayout.flex || 'stream');
const surfaceWidth = (id) =>
  S.cockpitLayout.widths[id] ?? (SURFACES[id] ? SURFACES[id].defaultW : 260);
// Visible surfaces, in order: registered, and (unless one is focused) not
// collapsed.  Focus mode shows only the focused surface.
function visibleSurfaces() {
  const L = S.cockpitLayout;
  const order = (Array.isArray(L.paneOrder) ? L.paneOrder : DEFAULT_PANE_ORDER).filter(id => SURFACES[id]);
  return order.filter(id => (L.focused ? id === L.focused : !L.collapsed[id]));
}

function applyCockpitLayout() {
  const grid = document.querySelector('.cockpit-grid');
  if (!grid) return;
  const L = S.cockpitLayout;
  const px = n => n + 'px';
  const visible = visibleSurfaces();
  const solo = visible.length === 1;            // focus mode / single surface fills

  // One resizer between each pair of visible surfaces.
  const nResizers = Math.max(0, visible.length - 1);
  ensureResizerPool(nResizers);
  const resizers = [...grid.querySelectorAll('.col-resizer')];

  // Build the track template: surface, 6px, surface, 6px, …  A solo surface
  // fills (1fr); otherwise flex surfaces take 1fr and the rest their px width.
  // Cap the fixed columns so the flexible one always survives. Widths are
  // remembered per surface, so opening a third module at a narrow window could
  // ask for more track than exists — CSS grid then overflows rather than
  // shrinking, and the chat spine, which is the point of the app, ends up a
  // sliver or off-screen entirely. The cap is applied to the layout, not
  // written back to the remembered width: widen the window and your sizes
  // return.
  const gutters = Math.max(0, visible.length - 1) * 6;
  const room = Math.max(0, grid.getBoundingClientRect().width - gutters);
  // The persistent Attempts dock deliberately owns real width. On a compact
  // desktop window, let the surrounding fixed panes compress proportionally
  // before allowing the shell to overflow and clip the session spine.
  const compact = room < 760;
  const CHAT_MIN = compact
    ? Math.max(240, Math.min(320, Math.floor(room * .55)))
    : 380;
  const fixed = visible.filter(id => !isFlexSurface(id));
  const wanted = fixed.reduce((n, id) => n + surfaceWidth(id), 0);
  const spare = room - CHAT_MIN;
  const compactWidths = new Map();
  if (compact && !solo && fixed.length) {
    const budget = Math.max(0, spare);
    const floor = Math.min(72, Math.floor(budget / fixed.length));
    const remainder = Math.max(0, budget - floor * fixed.length);
    const weights = fixed.map(id => Math.max(1, surfaceWidth(id) - floor));
    const totalWeight = weights.reduce((sum, weight) => sum + weight, 0);
    fixed.forEach((id, index) => {
      compactWidths.set(id, floor + Math.floor(remainder * weights[index] / totalWeight));
    });
  }
  // Scale every fixed column by the same factor rather than starving the last
  // one, so the layout keeps its proportions as the window narrows.
  const squeeze = (!solo && room > 0 && wanted > spare && wanted > 0)
    ? Math.max(0.35, spare / wanted)
    : 1;
  const capped = (id) => {
    if (compactWidths.has(id)) return compactWidths.get(id);
    const sf = SURFACES[id] || {};
    return Math.max(sf.min || 150, Math.floor(surfaceWidth(id) * squeeze));
  };

  const tracks = [];
  visible.forEach((id, i) => {
    tracks.push(solo ? '1fr' : (isFlexSurface(id) ? `minmax(${CHAT_MIN}px, 1fr)` : px(capped(id))));
    if (i < visible.length - 1) tracks.push('6px');
  });
  grid.style.gridTemplateColumns = tracks.length ? tracks.join(' ') : '1fr';

  // Hide every registered surface, then place + show the visible ones in order.
  Object.keys(SURFACES).forEach(id => { const el = $(SURFACES[id].el); if (el) el.style.display = 'none'; });
  // Pin every child to row 1 + its column.  Without an explicit grid-row,
  // CSS grid auto-placement wraps a pane to a new row whenever DOM order
  // doesn't ascend by column (e.g. a preset that puts Activity left of Files
  // while Files is DOM-first) — which stacks the panes instead of tiling them.
  visible.forEach((id, i) => {
    const el = $(SURFACES[id].el); if (!el) return;
    el.style.gridRow = '1';
    el.style.gridColumn = String(i * 2 + 1);
    el.style.display = 'flex';
    el.classList.toggle('is-rightmost', i === visible.length - 1);
  });

  // Place resizers between consecutive visible panes; carry the boundary index.
  resizers.forEach((h, b) => {
    if (b < nResizers) {
      h.style.display = '';
      h.style.gridRow = '1';
      h.style.gridColumn = String(b * 2 + 2);
      h.dataset.boundary = String(b);
    } else {
      h.style.display = 'none';
    }
  });

  // Terminal dock — open/closed, height, inner list/output split.
  applyTerminalsDrawer();
  $$('.pane-btn[data-act="focus"]').forEach(b => b.classList.toggle('active', L.focused === b.dataset.pane));
  $$('.pane-btn[data-act="collapse"]').forEach(b => b.classList.toggle('active', !!L.collapsed[b.dataset.pane]));
  // Defensive: any layout change clears stuck drag state (cursor, highlight).
  document.body.classList.remove('axo-resizing', 'axo-vresizing');
  grid.querySelectorAll('.col-resizer.dragging').forEach(h => h.classList.remove('dragging'));
  persistLayout();
  // After the grid relayouts, tell embedded editors to remeasure.  Without
  // this Monaco renders at the old container size (visually broken file
  // pane) and xterm gets stuck on the old rows/cols.
  requestAnimationFrame(() => { relayoutEmbeddedEditors(); relayoutTrace(); updateFilesEditor(); });
}

// Re-fit the session's agent-graph (lattice) when the trace surface is
// visible.  The lattice is built on cockpit open into a host that may be
// hidden (size 0), so it needs an autoLayout once it actually has room.
function relayoutTrace() {
  const lat = S.session && S.session.lattice;
  if (!lat) return;
  const pane = document.querySelector('#cockpit-trace');
  if (!pane || getComputedStyle(pane).display === 'none') return;
  try { if (typeof lat.autoLayout === 'function') lat.autoLayout({ direction: 'LR' }); } catch {}
}

// Keep exactly `n` resizer handles in the grid (create + wire as needed).
// Resizers are positioned by inline grid-column in applyCockpitLayout, so
// DOM order among grid children doesn't matter.
function ensureResizerPool(n) {
  const grid = document.querySelector('.cockpit-grid');
  if (!grid) return;
  let pool = grid.querySelectorAll('.col-resizer');
  for (let i = pool.length; i < n; i++) {
    const h = document.createElement('div');
    h.className = 'col-resizer';
    attachColResizer(h);
    grid.appendChild(h);
  }
}

// ── Terminals bottom dock ─────────────────────────────────────────
// Independent of the cockpit-grid: a thin strip of terminal names when
// closed, a configurable-height dock when open. The grid reserves the
// strip's space via `margin-bottom: var(--term-rail-w)` so opening the
// dock overlays only the bottom edge of the panes — never shifts them.
const TERM_RAIL_W      = 32;
const TERM_DRAWER_MIN  = 160;
const TERM_DRAWER_MAX  = 800;
const TERM_INNER_MIN   = 80;

function applyTerminalsDrawer() {
  const drawer = document.getElementById('cockpit-terminals');
  const shell  = document.getElementById('cockpit-shell');
  if (!drawer || !shell) return;
  const L = S.cockpitLayout;
  // Reserve the closed rail's height beneath the grid.
  shell.style.setProperty('--term-rail-w', TERM_RAIL_W + 'px');
  shell.style.setProperty('--term-open-w', (L.termOpenW || 320) + 'px');
  drawer.classList.toggle('is-open', !!L.termOpen);
  // Inner split: list width is exact, output flexes.
  const list = document.getElementById('terminals-list');
  if (list) list.style.width = (L.termInnerListW || 140) + 'px';
  renderTermRailList();
}

function renderTermRailList() {
  const rail = document.getElementById('term-rail-list');
  if (!rail) return;
  rail.innerHTML = '';
  const tasks = (S.session && S.session.tasks) || [];
  if (tasks.length === 0) return;
  const activeId = S.session && S.session.activeTerminalId;
  // Newest first, matching the open-drawer list order.
  tasks.slice().reverse().forEach(t => {
    const row = el('div', 'term-rail-row' + (t.id === activeId ? ' active' : ''));
    const dot = el('span', 'term-dot ' + (typeof termStatusClass === 'function' ? termStatusClass(t.status) : (t.status || 'running')));
    const label = (typeof termShortLabel === 'function' ? termShortLabel(t.command) : (t.command || 'terminal'));
    row.append(dot, document.createTextNode(label));
    row.title = (t.command || '') + '\n' + (t.status || '');
    row.addEventListener('click', () => {
      S.session.activeTerminalId = t.id;
      S.cockpitLayout.termOpen = true;
      applyCockpitLayout();
      syncLauncherState();
      if (typeof renderTerminals === 'function') renderTerminals();
    });
    rail.appendChild(row);
  });
}

function attachTermDrawerOuterResizer() {
  const h = document.getElementById('term-drawer-outer-resizer');

  h.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;

    try { h.setPointerCapture(e.pointerId); } catch {}
    h.classList.add('dragging');
    document.body.classList.add('axo-resizing');

    const startW = S.cockpitLayout.termOpenW;

      h.classList.remove('dragging');
      document.body.classList.remove('axo-resizing');
      try { h.releasePointerCapture(e.pointerId); } catch {}
      h.removeEventListener('pointermove', onMove);
      h.removeEventListener('pointerup', onEnd);
      h.removeEventListener('pointercancel', onEnd);
    };
    h.addEventListener('pointermove', onMove);
    h.addEventListener('pointerup', onEnd);
    h.addEventListener('pointercancel', onEnd);
  });
}

function attachTermInnerResizer() {

// Panes menu — the safety net for "I collapsed a pane and now it's gone."
const DEFAULT_LAYOUT = {
  flex: 'stream',
  widths: { files: 220, browser: 360 },
  collapsed: {},
  focused: null,
  paneOrder: ['stream'],
  termOpen: false,
  termOpenW: 320,
  termInnerListW: 140,
};

// The cockpit is one configurable workspace; this menu shows/hides each
// surface. The conversation (Activity) is the canvas — always on.
const TOGGLEABLE_SURFACES = ['stream', 'files', 'compare', 'browser', 'trace'];
// A small toggle switch in the cockpit's own dark/accent vibe — reusable
// across the app. <ax-toggle checked disabled>; emits 'change' with {checked}.
// Shadow-DOM styled, but reads the page's CSS custom properties (they pierce
// the shadow boundary) so it stays on-theme automatically.
class AxToggle extends HTMLElement {
  constructor() {
    super();
    const r = this.attachShadow({ mode: 'open' });
    r.innerHTML =
      '<style>' +
      ':host{display:inline-flex;cursor:pointer;-webkit-tap-highlight-color:transparent}' +
      ':host([disabled]){cursor:default;opacity:.45}' +
      '.t{width:34px;height:19px;border-radius:999px;background:var(--bg-2,#1c1c1c);' +
      'border:1px solid var(--border,#333);position:relative;transition:background .18s,border-color .18s}' +
      '.k{position:absolute;top:1px;left:1px;width:15px;height:15px;border-radius:50%;' +
      'background:var(--muted,#888);transition:transform .18s,background .18s;box-shadow:0 1px 2px rgba(0,0,0,.3)}' +
      ':host([checked]) .t{background:var(--accent,#4ade80);border-color:var(--accent,#4ade80)}' +
      ':host([checked]) .k{transform:translateX(15px);background:#fff}' +
      '</style><div class="t"><div class="k"></div></div>';
    this.addEventListener('click', () => {
      if (this.hasAttribute('disabled')) return;
      this.checked = !this.checked;
      this.dispatchEvent(new CustomEvent('change', { detail: { checked: this.checked }, bubbles: true }));
    });
  }
  get checked() { return this.hasAttribute('checked'); }
  set checked(v) { v ? this.setAttribute('checked', '') : this.removeAttribute('checked'); }
}
if (!customElements.get('ax-toggle')) customElements.define('ax-toggle', AxToggle);

// A polished dropdown in the cockpit's vibe — a drop-in for a small <select>.
// It reads its <option> light-DOM children (so existing populate code that
// appends <option>s keeps working), exposes a select-like `.value`, and emits
// 'change'. The menu is a fixed-position layer so it escapes the panes'
// overflow clipping and opens upward above the composer. Shadow-DOM styled,
// reading the page's CSS custom properties so it stays on-theme.
class AxSelect extends HTMLElement {
  constructor() {
    super();
    this._value = null;
    this._open = false;
    this._opts = [];
    const r = this.attachShadow({ mode: 'open' });
    r.innerHTML =
      '<style>' +
      ':host{display:inline-flex;max-width:100%;vertical-align:middle}' +
      '.trig{display:inline-flex;align-items:center;gap:7px;max-width:100%;' +
        'background:var(--bg-3,#1a1a1a);border:1px solid var(--border,#333);border-radius:6px;' +
        'color:var(--fg-soft,#ddd);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;' +
        'padding:4px 9px;cursor:pointer;outline:none;user-select:none;transition:border-color .15s}' +
      '.trig:hover{border-color:var(--border-strong,#444)}' +
      ':host(.open) .trig,.trig:focus-visible{border-color:var(--accent,#4ade80)}' +
      '.lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}' +
      '.chev{flex-shrink:0;opacity:.55;font-size:9px;transition:transform .15s}' +
      ':host(.open) .chev{transform:rotate(180deg)}' +
      '.menu{position:fixed;z-index:70;min-width:160px;max-width:360px;max-height:280px;overflow:auto;' +
        'background:var(--panel,#161616);border:1px solid var(--border-strong,#444);border-radius:9px;' +
        'padding:5px;box-shadow:0 12px 34px rgba(0,0,0,.45);display:none}' +
      '.menu.show{display:block}' +
      '.opt{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:6px;cursor:pointer;' +
        'font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11.5px;color:var(--fg-soft,#ddd);white-space:nowrap}' +
      '.opt:hover{background:var(--bg-3,#222)}' +
      '.opt[aria-selected="true"]{color:var(--accent-lift,var(--accent,#4ade80))}' +
      '.opt .tick{margin-left:auto;opacity:0;font-size:11px}' +
      '.opt[aria-selected="true"] .tick{opacity:1}' +
      '</style>' +
      '<div class="trig" part="trigger" tabindex="0"><span class="lbl"></span><span class="chev">▾</span></div>' +
      '<div class="menu"></div>';
    this._trig = r.querySelector('.trig');
    this._lbl = r.querySelector('.lbl');
    this._menu = r.querySelector('.menu');
    this._trig.addEventListener('click', () => this.toggleOpen());
    this._trig.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.toggleOpen(); }
      else if (e.key === 'Escape') this.close();
    });
    this._onDocDown = (e) => {
      if (!this._open) return;
      const path = e.composedPath ? e.composedPath() : [];
      if (path.includes(this) || path.includes(this._menu)) return;
      this.close();
    };
    this._mo = new MutationObserver(() => this._scheduleSync());
  }
  connectedCallback() {
    this._mo.observe(this, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['value', 'selected'] });
    this._sync();
  }
  disconnectedCallback() {
    this._mo.disconnect();
    document.removeEventListener('mousedown', this._onDocDown, true);
  }
  _scheduleSync() {
    if (this._syncQ) return;
    this._syncQ = true;
    Promise.resolve().then(() => { this._syncQ = false; this._sync(); });
  }
  // Read <option> children → rebuild the menu, keeping the value valid.
  _sync() {
    this._opts = Array.from(this.querySelectorAll('option')).map(o => ({
      value: o.getAttribute('value') != null ? o.getAttribute('value') : (o.textContent || ''),
      label: o.textContent || '',
      selected: o.hasAttribute('selected'),
    }));
    let v = this._value;
    if (!this._opts.some(o => o.value === v)) {
      const sel = this._opts.find(o => o.selected);
      v = sel ? sel.value : (this._opts[0] ? this._opts[0].value : null);
    }
    this._value = v;
    this._renderMenu();
    this._renderLabel();
  }
  _renderMenu() {
    this._menu.innerHTML = '';
    this._opts.forEach(o => {
      const row = document.createElement('div');
      row.className = 'opt';
      if (o.value === this._value) row.setAttribute('aria-selected', 'true');
      const t = document.createElement('span');
      t.textContent = o.label;
      row.appendChild(t);
      const tick = document.createElement('span');
      tick.className = 'tick';
      tick.textContent = '✓';
      row.appendChild(tick);
      row.addEventListener('click', () => this._select(o.value));
      this._menu.appendChild(row);
    });
  }
  _renderLabel() {
    const cur = this._opts.find(o => o.value === this._value);
    this._lbl.textContent = cur ? cur.label : '';
    this.title = cur ? cur.label : '';
  }
  _select(v) {
    const changed = v !== this._value;
    this._value = v;
    this._renderMenu();
    this._renderLabel();
    this.close();
    if (changed) this.dispatchEvent(new CustomEvent('change', { detail: { value: v }, bubbles: true }));
  }
  toggleOpen() { this._open ? this.close() : this.open(); }
  open() {
    if (this._open || !this._opts.length) return;
    this._open = true;
    this.classList.add('open');
    this._menu.classList.add('show');
    this._position();
    setTimeout(() => document.addEventListener('mousedown', this._onDocDown, true), 0);
  }
  close() {
    if (!this._open) return;
    this._open = false;
    this.classList.remove('open');
    this._menu.classList.remove('show');
    document.removeEventListener('mousedown', this._onDocDown, true);
  }
  // Anchor above the trigger (the composer sits low), left-aligned, clamped.
  _position() {
    const r = this._trig.getBoundingClientRect();
    const m = this._menu;
    m.style.visibility = 'hidden';
    m.style.minWidth = Math.max(r.width, 160) + 'px';
    const mw = m.offsetWidth || 200;
    const mh = m.offsetHeight || 200;
    const margin = 8;
    let left = r.left;
    if (left + mw > window.innerWidth - margin) left = window.innerWidth - mw - margin;
    if (left < margin) left = margin;
    let top = r.top - mh - 5;
    if (top < margin) top = r.bottom + 5;
    m.style.left = left + 'px';
    m.style.top = top + 'px';
    m.style.visibility = '';
  }
  get value() { return this._value; }
  set value(v) { this._value = v; this._renderMenu(); this._renderLabel(); }
}
if (!customElements.get('ax-select')) customElements.define('ax-select', AxSelect);

function renderPanesMenu() {
  const menu = $('#panes-menu'); if (!menu) return;
  menu.innerHTML = '';
  const L = S.cockpitLayout;
  const order = (L.paneOrder || DEFAULT_PANE_ORDER).filter(id => SURFACES[id]);
  TOGGLEABLE_SURFACES.forEach(id => {
    if (!SURFACES[id]) return;
    const canvas = id === 'stream';                 // the conversation, always on
    const present = order.includes(id);
    const row = el('div', 'pm-item');
    row.appendChild(el('span', 'pm-label', SURFACES[id].title));
    const tog = document.createElement('ax-toggle');
    if (canvas || present) tog.setAttribute('checked', '');
    if (canvas) tog.setAttribute('disabled', '');
    tog.addEventListener('change', () => { if (!canvas) toggleSurface(id, tog.checked); });
    row.appendChild(tog);
    // Clicking anywhere on the row flips the toggle (forwards to it).
    row.addEventListener('click', (e) => { if (!canvas && e.target !== tog) tog.click(); });
    menu.appendChild(row);
  });
  menu.appendChild(el('div', 'pm-divider'));
  const reset = el('div', 'pm-item pm-action');
  reset.appendChild(el('span', '', '↺ Reset workspace'));
  reset.addEventListener('click', () => { resetWorkspace(); renderPanesMenu(); });
  menu.appendChild(reset);
}

// Show/hide a surface by adding/removing it from the layout. Files sit left of
// the conversation; everything else to its right.
function toggleSurface(id, show) {
  const L = S.cockpitLayout;
  let order = (L.paneOrder || DEFAULT_PANE_ORDER).filter(x => SURFACES[x]);
  if (show && !order.includes(id)) {
    if (id === 'files') order.unshift(id);
    else order.push(id);
  } else if (!show) {
    order = order.filter(x => x !== id);
  }
  L.paneOrder = order;
  L.focused = null;
  if (L.collapsed) L.collapsed[id] = false;
  applyCockpitLayout();
}

function resetWorkspace() {
  const L = S.cockpitLayout;
  L.paneOrder = ['stream'];
  L.flex = 'stream';
  L.widths = { files: 220, browser: 360 };
  L.collapsed = {};
  L.focused = null;
  applyCockpitLayout();
}

function openPanesMenu() {
  const menu = $('#panes-menu');
  const btn  = $('#panes-menu-btn');
  if (!menu || !btn) return;
  if (!menu.classList.contains('hide')) { menu.classList.add('hide'); return; }
  renderPanesMenu();
  // Render once hidden so we can measure the menu's real width, then
  // right-align it under the button and clamp inside the viewport.
  menu.classList.remove('hide');
  menu.style.visibility = 'hidden';
  const r  = btn.getBoundingClientRect();
  const mw = menu.offsetWidth || 240;
  let left = r.right - mw;
  const margin = 8;
  if (left < margin) left = margin;
  if (left + mw > window.innerWidth - margin) left = window.innerWidth - mw - margin;
  menu.style.top  = (r.bottom + 4) + 'px';
  menu.style.left = left + 'px';
  menu.style.visibility = '';
  // Close on any outside click (next tick so the opening click doesn't close it).
  setTimeout(() => {
    document.addEventListener('mousedown', closePanesMenuOutside, { capture: true });
  }, 0);
}
function closePanesMenuOutside(e) {
  const menu = $('#panes-menu');
  const btn  = $('#panes-menu-btn');
  if (!menu) return;
  if (menu.contains(e.target) || (btn && btn.contains(e.target))) return;
  menu.classList.add('hide');
  document.removeEventListener('mousedown', closePanesMenuOutside, { capture: true });
}

function applySidebar() {
  document.body.classList.remove('side-mini', 'side-hidden');
  if (S.sidebarMode === 'mini')   document.body.classList.add('side-mini');
  if (S.sidebarMode === 'hidden') document.body.classList.add('side-hidden');
  persistSidebar();
}
function cycleSidebar() {
  S.sidebarMode = { full: 'mini', mini: 'hidden', hidden: 'full' }[S.sidebarMode] || 'full';
  applySidebar();
}

/// Resizers use pointer events with `setPointerCapture` so the up event is
/// guaranteed even if the cursor leaves the window — `mousedown`/`mousemove`
/// on `document` can drop the up and leave the strip stuck in its drag style.
// Each fixed-width pane owns exactly one resizer — the one on its side
// closer to the flex (stream) pane.  This guarantees every fixed pane
// is resizable AND no pane has two resizers fighting over its width.
//
//   [F]  r1  [stream]  r2  [L]  r3  [B]  r4  [T]
//    └──→─┘            └─→─┘     └─→─┘     └─→─┘
//   files owns r1   L owns r2   B owns r3   T owns r4
//
// Sign convention:
//   - Pane LEFT  of flex, drag-right → pane grows  (sign +1)
//   - Pane RIGHT of flex, drag-right → pane shrinks (sign -1)
// Which fixed surface does dragging the resizer at boundary `b` resize, and
// in which direction?  A boundary sits between visible[b] and visible[b+1];
// we resize the fixed neighbour on the far side from the flex (1fr) surface
// so the flex pane absorbs the slack.
function resizerTargetForBoundary(b) {
  const visible = visibleSurfaces();
  const flexIdx = visible.findIndex(isFlexSurface);
  const left = visible[b], right = visible[b + 1];
  if (flexIdx === -1)   return { key: left,  sign: +1 }; // no flex: grow left pane
  if (b + 1 === flexIdx) return { key: left,  sign: +1 };
  if (b === flexIdx)     return { key: right, sign: -1 };
  if (b + 1 < flexIdx)   return { key: left,  sign: +1 };
  return { key: right, sign: -1 };                       // b > flexIdx
}

function attachColResizer(handle) {
  handle.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    const b = parseInt(handle.dataset.boundary || '0', 10);
    const tgt = resizerTargetForBoundary(b);
    if (!tgt || !tgt.key || isFlexSurface(tgt.key)) return; // can't px-resize a flex pane
    const sf = SURFACES[tgt.key] || {};
    const mm = { min: sf.min || 150, max: sf.max || 1000 };
    try { handle.setPointerCapture(e.pointerId); } catch {}
    handle.classList.add('dragging');
    document.body.classList.add('axo-resizing');
    const startX = e.clientX;
    const startW = surfaceWidth(tgt.key);
    const onMove = (ev) => {
      const dx = ev.clientX - startX;
      S.cockpitLayout.widths[tgt.key] = Math.max(mm.min, Math.min(mm.max, startW + tgt.sign * dx));
      applyCockpitLayout();
    };
    const onEnd = () => {
      handle.classList.remove('dragging');
      document.body.classList.remove('axo-resizing');
      try { handle.releasePointerCapture(e.pointerId); } catch {}
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onEnd);
      handle.removeEventListener('pointercancel', onEnd);
      handle.removeEventListener('lostpointercapture', onEnd);
    };
    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onEnd);
    handle.addEventListener('pointercancel', onEnd);
    handle.addEventListener('lostpointercapture', onEnd);
  });
}

// Drag-to-reorder: HTML5 native drag on .pane-head[draggable=true].  The
// dragstart fires on a pane head; while dragging, sibling pane heads accept
// `dragover` and show a `.drag-over` highlight; the `drop` event swaps the
// two panes' positions in S.cockpitLayout.paneOrder and re-applies the
// layout.  Persist via the existing persistLayout() path.
let _dragPaneKey = null;
function attachPaneDragReorder() {
  const heads = document.querySelectorAll('#session-cockpit .pane-head[draggable="true"]');
  heads.forEach(h => {
    h.addEventListener('dragstart', (e) => {
      _dragPaneKey = h.dataset.pane;
      h.classList.add('drag-source');
      try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', _dragPaneKey); } catch {}
    });
    h.addEventListener('dragend', () => {
      _dragPaneKey = null;
      document.querySelectorAll('#session-cockpit .pane-head.drag-source, #session-cockpit .pane-head.drag-over')
        .forEach(x => x.classList.remove('drag-source', 'drag-over'));
    });
    h.addEventListener('dragover', (e) => {
      if (!_dragPaneKey || _dragPaneKey === h.dataset.pane) return;
      e.preventDefault();
      try { e.dataTransfer.dropEffect = 'move'; } catch {}
      h.classList.add('drag-over');
    });
    h.addEventListener('dragleave', () => h.classList.remove('drag-over'));
    h.addEventListener('drop', (e) => {
      e.preventDefault();
      h.classList.remove('drag-over');
      const src = _dragPaneKey;
      const dst = h.dataset.pane;
      if (!src || !dst || src === dst) return;
      const order = S.cockpitLayout.paneOrder.slice();
      const si = order.indexOf(src), di = order.indexOf(dst);
      if (si < 0 || di < 0) return;
      order.splice(si, 1);
      order.splice(di, 0, src);
      S.cockpitLayout.paneOrder = order;
      applyCockpitLayout();
    });
  });
}

// Safety net: any time the window loses focus or is hidden, clear stuck drag state.
['blur', 'visibilitychange'].forEach(ev => {
  window.addEventListener(ev, () => {
    document.querySelectorAll('.col-resizer.dragging')
      .forEach(h => h.classList.remove('dragging'));
    document.body.classList.remove('axo-resizing', 'axo-vresizing');
  });
});

function onPaneBtn(e) {
  const btn = e.target.closest('.pane-btn'); if (!btn) return;
  const act = btn.dataset.act, pane = btn.dataset.pane;
  if (act === 'focus') {
    S.cockpitLayout.focused = S.cockpitLayout.focused === pane ? null : pane;
  } else if (act === 'collapse') {
    S.cockpitLayout.collapsed[pane] = !S.cockpitLayout.collapsed[pane];
  }
  applyCockpitLayout();
}

function onCockpitKey(e) {
  // Sidebar toggle works anywhere in the app (Ctrl/Cmd + \).
  if ((e.ctrlKey || e.metaKey) && e.key === '\\') {
    e.preventDefault();
    cycleSidebar();
    return;
  }
  if ($('#session-cockpit').style.display === 'none' || !S.session.id) return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  const inField = tag === 'INPUT' || tag === 'TEXTAREA';
  if (e.key === 'Escape' && S.cockpitLayout.focused) {
    S.cockpitLayout.focused = null; applyCockpitLayout(); return;
  }
  if (inField) return;
  if ((e.ctrlKey || e.metaKey) && !e.altKey && ['1','2','3','4','5'].includes(e.key)) {
    e.preventDefault();
    // Focus the Nth surface in the current visible order.
    const order = (S.cockpitLayout.paneOrder || DEFAULT_PANE_ORDER).filter(id => SURFACES[id]);
    const which = order[parseInt(e.key, 10) - 1];
    if (which) {
      S.cockpitLayout.focused = S.cockpitLayout.focused === which ? null : which;
      applyCockpitLayout();
    }
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') {
    e.preventDefault();
    S.cockpitLayout.collapsed.files = !S.cockpitLayout.collapsed.files;
    applyCockpitLayout();
  }
}

// Files pane inner resizer — drag the divider between the Explorer
// (search + tree) and the Editor (tabs + Monaco).  Persists the
// explorer width to localStorage so it survives reloads.
const FILES_EXPLORER_W_KEY = 'axo:files-explorer-w';
function attachFilesInnerResizer() {
  const h = $('#files-inner-resizer');
  const ex = $('#files-explorer');
  if (!h || !ex) return;
  // Restore previously saved width.
  const saved = parseInt(localStorage.getItem(FILES_EXPLORER_W_KEY) || '0', 10);
  if (saved > 0) ex.style.setProperty('--explorer-w', saved + 'px');
  let dragging = false, startX = 0, startW = 0;
  h.addEventListener('mousedown', (e) => {
    e.preventDefault();
    dragging = true;
    startX = e.clientX;
    startW = ex.getBoundingClientRect().width;
    h.classList.add('dragging');
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    let w = Math.max(140, Math.min(600, startW + dx));
    ex.style.setProperty('--explorer-w', w + 'px');
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    h.classList.remove('dragging');
    document.body.style.userSelect = '';
    const w = parseInt(ex.style.getPropertyValue('--explorer-w'), 10);
    if (w > 0) localStorage.setItem(FILES_EXPLORER_W_KEY, String(w));
  });
}
