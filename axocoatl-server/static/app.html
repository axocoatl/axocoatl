<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Axocoatl</title>
<style>
  :root {
    --bg: #0d0f12; --bg-2: #14171c; --bg-3: #1a1e25;
    --fg: #e6e9ef; --muted: #8b93a1; --dim: #5c6472;
    --line: #242a33; --accent: #5eead4; --accent-dim: #2dd4bf;
    --pass: #4ade80; --fail: #f87171; --warn: #fbbf24;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Inter, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased;
    display: grid; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden;
  }

  /* ── header ── */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg-2);
  }
  .brand { font-weight: 600; font-size: 14px; letter-spacing: .01em; }
  .brand span { color: var(--dim); font-weight: 400; }
  header select, header input {
    background: var(--bg-3); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 9px; font: 12.5px var(--sans);
  }
  .spacer { flex: 1; }
  /* The count of lanes waiting on you. The failure mode of parallel agents is
     not being unable to see them — it is not noticing one has stopped. */
  #blocked {
    font: 600 11.5px var(--sans); color: #06231f; background: var(--accent);
    border-radius: 999px; padding: 4px 11px; cursor: pointer;
  }
  #blocked.hidden { display: none; }
  .peek {
    margin-top: 8px; padding: 9px; border: 1px solid var(--accent-dim);
    border-radius: 7px; background: var(--bg-3);
  }
  .peek .q { font-size: 12.5px; margin-bottom: 8px; }
  .peek .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .peek button { padding: 5px 10px; font-size: 11.5px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button {
    background: transparent; color: var(--muted); border: 0; padding: 5px 10px;
    font: 500 11.5px var(--sans); cursor: pointer;
  }
  .seg button.on { background: var(--bg-3); color: var(--fg); }

  /* ── the split: transcript scrolls, run state does not ── */
  .split { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
  @media (max-width: 1000px) { .split { grid-template-columns: 1fr; } aside { display: none; } }

  main { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }

  /* A module opens *around* the chat, not instead of it: a pinned band above
     the transcript, in the main column where there is width to lay several
     candidates side by side. The 340px rail is for run state you glance at;
     a comparison is something you read. */
  .module { border-bottom: 1px solid var(--line); background: var(--bg-2); }
  .module.shut { display: none; }
  .module > summary {
    cursor: pointer; list-style: none; padding: 9px 22px;
    display: flex; align-items: center; gap: 9px;
    font: 600 10.5px var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--dim);
  }
  .module > summary::-webkit-details-marker { display: none; }
  .module > summary::before { content: "▾"; font-size: 11px; }
  .module:not([open]) > summary::before { content: "▸"; }
  .module .inner { padding: 0 22px 14px; overflow-x: auto; }
  #transcript { overflow-y: auto; padding: 20px 22px; }
  aside {
    border-left: 1px solid var(--line); background: var(--bg-2);
    overflow-y: auto; padding: 16px;
  }

  /* ── transcript ── */
  .turn { margin-bottom: 18px; max-width: 900px; }
  .who { font: 600 11px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--dim); margin-bottom: 5px; }
  .turn.user .who { color: var(--accent-dim); }
  .body { white-space: pre-wrap; }
  .body.thinking { color: var(--muted); font-style: italic; }

  /* An event is a first-class thing in the conversation, not a side panel. */
  .event {
    border: 1px solid var(--line); border-radius: 9px; background: var(--bg-2);
    margin-bottom: 14px; max-width: 900px; overflow: hidden;
  }
  .event > summary {
    cursor: pointer; padding: 10px 13px; list-style: none;
    display: flex; align-items: center; gap: 9px; font-size: 13px;
  }
  .event > summary::-webkit-details-marker { display: none; }
  .event > summary::before { content: "▸"; color: var(--dim); font-size: 11px; }
  .event[open] > summary::before { content: "▾"; }
  .event .kind {
    font: 600 10px var(--mono); letter-spacing: .07em; text-transform: uppercase;
    color: var(--accent); border: 1px solid currentColor; border-radius: 999px; padding: 1px 7px;
  }
  .event .gist { color: var(--muted); }
  .event .inner { padding: 0 13px 13px; border-top: 1px solid var(--line); padding-top: 12px; }

  /* ── composer ── */
  .composer { border-top: 1px solid var(--line); padding: 12px 22px 16px; background: var(--bg-2); }
  .composer textarea {
    width: 100%; background: var(--bg-3); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; font: 13px var(--sans); resize: vertical; min-height: 56px;
  }
  .composer textarea:focus { outline: none; border-color: var(--accent-dim); }
  .acts { display: flex; gap: 8px; margin-top: 9px; align-items: center; flex-wrap: wrap; }
  button.go {
    background: var(--accent); color: #06231f; border: 0; border-radius: 7px;
    padding: 8px 14px; font: 600 12.5px var(--sans); cursor: pointer;
  }
  button.ghost {
    background: transparent; color: var(--fg); border: 1px solid var(--line);
    border-radius: 7px; padding: 8px 12px; font: 500 12.5px var(--sans); cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .hint { color: var(--dim); font-size: 11.5px; }

  /* ── run state ── */
  aside h2 {
    font: 600 10.5px var(--mono); letter-spacing: .09em; text-transform: uppercase;
    color: var(--dim); margin: 0 0 9px;
  }
  aside section { margin-bottom: 20px; }
  .lane-row {
    display: flex; align-items: baseline; gap: 8px; padding: 7px 0;
    border-bottom: 1px solid var(--line); font-size: 12.5px; cursor: pointer;
  }
  .lane-row:last-child { border-bottom: 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: var(--dim); }
  .dot.working { background: var(--warn); animation: pulse 1.4s ease-in-out infinite; }
  .dot.pass { background: var(--pass); } .dot.fail { background: var(--fail); }
  .dot.need { background: var(--accent); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  .lane-name { font: 11.5px var(--mono); }
  .lane-act { color: var(--muted); font-size: 11.5px; margin-left: auto; text-align: right; }
  .empty { color: var(--dim); font-size: 12px; }
  .kv { display: flex; justify-content: space-between; font-size: 12.5px; padding: 3px 0; }
  .kv .v { font: 12.5px var(--mono); }
  .kv .v.save { color: var(--accent); }
  aside input {
    width: 100%; background: var(--bg-3); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font: 11.5px var(--mono); margin-top: 6px;
  }
  aside input:focus { outline: none; border-color: var(--accent-dim); }
  pre {
    background: var(--bg-3); border: 1px solid var(--line); border-radius: 7px;
    padding: 9px; overflow: auto; max-height: 300px; font: 11.5px/1.45 var(--mono); margin: 8px 0 0;
  }
  pre .add { color: var(--pass); } pre .del { color: var(--fail); } pre .hd { color: var(--muted); }
  .dl { display: block; cursor: text; }
  .dl:hover { background: #1f2630; }
  .dl.marked { background: #1c2b2b; box-shadow: inset 2px 0 0 var(--accent); }
  .cbox { margin: 6px 0 10px; display: flex; gap: 6px; }
  .cbox input {
    flex: 1; background: var(--bg-3); color: var(--fg); border: 1px solid var(--accent-dim);
    border-radius: 6px; padding: 6px 9px; font: 12px var(--sans);
  }
  .cnote { font: 11.5px var(--sans); color: var(--accent); padding: 2px 0 2px 14px; }
  /* Tier 1 — metrics as rows, candidates as columns. Transposed because with
     several candidates the eye compares down a row, not across a card. */
  .board { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .board th, .board td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .board th { color: var(--muted); font-weight: 500; white-space: nowrap; }
  .board td { font: 12px var(--mono); }
  .board .base { color: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
  .board td.win { color: var(--accent); }
  .board td.bad { color: var(--fail); }
  .board td.good { color: var(--pass); }
  .board tr.same { opacity: .38; }
  .board .rebase { background: none; border: 0; padding: 0; color: var(--fg); font: inherit; cursor: pointer; }
  .board .rebase:hover { color: var(--accent); text-decoration: underline; }
  .boardopt { display: flex; gap: 6px; align-items: center; margin-top: 9px; font-size: 11.5px; color: var(--muted); }
  .boardopt input { width: auto; }

  /* Tier 2 — aligned trajectories. Same column order as the scoreboard, so the
     two views are read as one comparison. */
  .traj { width: 100%; border-collapse: collapse; font-size: 12px; }
  .traj th, .traj td {
    text-align: left; padding: 5px 9px; vertical-align: top;
    border-bottom: 1px solid var(--line);
  }
  .traj th { color: var(--muted); font-weight: 500; white-space: nowrap; font-size: 12.5px; }
  .traj td { font: 11.5px var(--mono); }
  .traj tr.diverged { background: #1a1512; }
  .traj tr.diverged td { border-left: 2px solid var(--warn); }
  .traj tr.diverged td:first-child { border-left: 0; }
  /* On a divergence row, the lanes that still matched the baseline recede and the
     ones that went their own way come forward — so "which of these differ" is
     answered by looking, not by reading every cell. */
  .traj tr.diverged td.same { opacity: .45; }
  .traj tr.diverged td.off { box-shadow: inset 2px 0 0 var(--warn); }
  .traj .n { color: var(--dim); width: 1%; white-space: nowrap; }
  /* Observation vs mutation, at a glance: what a lane looked at is context,
     what it changed is the decision. */
  .k { font: 600 9.5px var(--mono); letter-spacing: .06em; text-transform: uppercase;
       border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; margin-right: 5px; }
  .k.read, .k.list, .k.search { color: var(--dim); }
  .k.edit, .k.write { color: var(--accent); }
  .k.run { color: var(--warn); }
  .k.other { color: var(--muted); }
  .det { color: var(--muted); display: block; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
  .none { color: var(--dim); }
  .bad-step { color: var(--fail); }
  /* A run of steps every lane took identically. Collapsed by default: it is the
     part that carries no information about how they differ. */
  .fold td { padding: 4px 9px; }
  .fold button {
    background: none; border: 0; color: var(--dim); font: 11.5px var(--sans);
    cursor: pointer; padding: 0;
  }
  .fold button:hover { color: var(--accent); }
  .err { color: var(--fail); font: 12px var(--mono); margin-top: 8px; white-space: pre-wrap; }
  .badge {
    font: 600 9.5px var(--mono); letter-spacing: .06em; text-transform: uppercase;
    padding: 1px 6px; border-radius: 999px; border: 1px solid currentColor;
  }
  .badge.pass { color: var(--pass); } .badge.fail { color: var(--fail); } .badge.warn { color: var(--warn); }
</style>
</head>
<body>

<header>
  <div class="brand">Axocoatl <span>/ workspace</span></div>
  <select id="session"><option value="">— choose a workspace —</option></select>
  <div class="spacer"></div>
  <div id="blocked" class="hidden"></div>
  <div class="seg" id="verbosity" title="With several lanes running, verbosity is a parallelism control, not a preference">
    <button data-v="summary">Summary</button>
    <button data-v="normal" class="on">Normal</button>
    <button data-v="verbose">Verbose</button>
  </div>
</header>

<div class="split">
  <main>
    <details class="module shut" id="boardmod" open>
      <summary>Scoreboard</summary>
      <div class="inner"><div id="board"></div></div>
    </details>
    <details class="module shut" id="trajmod">
      <summary>Trajectories <span id="trajgist" style="text-transform:none;letter-spacing:0;font-weight:400"></span></summary>
      <div class="inner"><div id="traj"></div></div>
    </details>
    <div id="transcript"></div>
    <div class="composer">
      <textarea id="input" placeholder="Describe the change. Send to work with one agent; fan out to compare several."></textarea>
      <div class="acts">
        <button class="go" id="send">Send</button>
        <button class="ghost" id="planBtn">Plan first</button>
        <button class="ghost" id="fan">Fan out</button>
        <input id="models" value="qwen3-coder:30b, qwen3:8b"
               style="flex:1 1 240px;background:var(--bg-3);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:12px var(--mono)" />
        <span class="hint" id="modelhint"></span>
      </div>
      <div class="err" id="err"></div>
    </div>
  </main>

  <aside>
    <section>
      <h2>Lanes</h2>
      <div id="roster"><div class="empty">No lanes yet. Fan out to compare several attempts.</div></div>
    </section>
    <section id="planbox" style="display:none">
      <h2>Plan</h2>
      <div id="planbody" class="empty"></div>
    </section>
    <section>
      <h2>Check</h2>
      <input id="check" value="npm run check" title="The project's own command — tests, build, typecheck. This is the arbiter that eliminates lanes, so it has to be the project's, not a guess." />
    </section>
    <section>
      <h2>Cost</h2>
      <div id="costbody"><div class="empty">—</div></div>
      <input id="baseline" value="claude-sonnet-4" title="The model the counterfactual is priced against — what this run would have cost on one expensive model." />
    </section>
  </aside>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const money = (n) => '$' + (n < 0.01 && n > 0 ? n.toFixed(4) : n.toFixed(2));
const secs = (ms) => ms < 1000 ? `${ms}ms` : (ms < 60000 ? `${(ms / 1000).toFixed(1)}s` : `${Math.floor(ms / 60000)}m ${Math.round((ms % 60000) / 1000)}s`);
// What a lane is *called* is the thing being compared: an agent when lanes
// differ by agent, otherwise the model. Named once so the roster and the
// scoreboard can never disagree about it.
const laneLabel = (l) => l.agent || l.model || `lane ${l.index}`;

const state = {
  session: null,
  verbosity: 'normal',
  lanes: [],            // [{index, model, branch}]
  runToLane: {},        // run key -> lane index
  activity: {},         // lane index -> what it is doing now
  verdicts: {},         // lane index -> verdict
  ranks: {}, winner: null,
  awaiting: {},          // run key -> what it is blocked on
  usage: {},             // lane index -> {input_tokens, output_tokens, cost_usd, duration_ms}
  peek: null,            // lane index whose peek panel is open
  away: null,            // {at, snapshot} captured when the window loses focus
  comments: [],          // line-anchored review notes, compiled into one follow-up
  streaming: null,      // element currently receiving assistant tokens
};

const api = async (path, opts) => {
  const r = await fetch(path, opts);
  const t = await r.text();
  let b; try { b = JSON.parse(t); } catch { b = t; }
  if (!r.ok) throw new Error(typeof b === 'string' ? b : (b.error || JSON.stringify(b)));
  return b;
};
const fail = (e) => { $('err').textContent = String(e?.message || e); };

// ── transcript ───────────────────────────────────────────────────────
const scroll = () => { const t = $('transcript'); t.scrollTop = t.scrollHeight; };

function addTurn(who, text, cls = '') {
  const el = document.createElement('div');
  el.className = `turn ${cls}`;
  el.innerHTML = `<div class="who">${esc(who)}</div><div class="body">${esc(text)}</div>`;
  $('transcript').appendChild(el);
  scroll();
  return el.querySelector('.body');
}

/** An event block in the conversation — the fan-out, the plan, the verdicts.
 *  These are part of the narrative, not a separate destination: you scroll back
 *  through a run's history the same way you scroll back through what was said. */
function addEvent(kind, gist, innerHTML, open = true) {
  const el = document.createElement('details');
  el.className = 'event';
  if (open) el.open = true;
  el.innerHTML = `<summary><span class="kind">${esc(kind)}</span><span class="gist">${esc(gist)}</span></summary>
                  <div class="inner">${innerHTML}</div>`;
  $('transcript').appendChild(el);
  scroll();
  return el;
}

// ── run state panel ──────────────────────────────────────────────────
function renderRoster() {
  const host = $('roster');
  if (!state.lanes.length) {
    host.innerHTML = '<div class="empty">No lanes yet. Fan out to compare several attempts.</div>';
    return;
  }
  host.innerHTML = state.lanes.map(l => {
    const v = state.verdicts[l.index];
    const act = state.activity[l.index];
    // A lane that changed nothing is not a pass, however green the check was.
    const empty = v && v.changed_files === 0;
    // Blocked-on-human outranks every other state: a lane that is waiting is
    // not "working", and showing it as working is how it gets missed.
    const wait = state.awaiting[`${state.session}#${l.index}`];
    const cls = wait ? 'need' : (v ? (v.passed && !empty ? 'pass' : 'fail') : (act ? 'working' : ''));
    const right = wait
      ? 'needs input'
      : (v ? (empty ? 'changed nothing' : (v.passed ? 'passed' : 'eliminated')) : (act || 'queued'));
    const rank = state.ranks[l.index];
    return `<div class="lane-row" data-lane="${l.index}">
      <span class="dot ${cls}"></span>
      <span class="lane-name">${esc(laneLabel(l))}</span>
      ${rank ? `<span class="badge">#${rank.rank}</span>` : ''}
      ${v && v.touched_tests?.length ? '<span class="badge warn">own tests</span>' : ''}
      <span class="lane-act">${esc(right)}</span>
    </div>` + (wait && state.peek === l.index ? peekPanel(l.index, wait) : '');
  }).join('');
  host.querySelectorAll('[data-lane]').forEach(r => r.onclick = () => {
    const i = Number(r.dataset.lane);
    // A waiting lane wants answering, not inspecting.
    if (state.awaiting[`${state.session}#${i}`]) { state.peek = state.peek === i ? null : i; renderRoster(); }
    else showLane(i);
  });
  renderBlocked();
  renderScoreboard();
}

/** Peek: answer the question where you are, rather than attaching to the lane.
 *  Attaching costs several seconds of re-orientation, and with five lanes that
 *  is the whole budget — so the common case (a yes or no) is one click. */
function peekPanel(index, wait) {
  const age = Math.max(0, Math.floor(Date.now() / 1000) - (wait.since || 0));
  return `<div class="peek">
    <div class="q">${esc(wait.question)} <span style="color:var(--dim)">— waiting ${age}s</span></div>
    <div class="btns">
      <button class="go" onclick="answer('${esc(wait.approval_id)}','allow')">Allow</button>
      <button class="ghost" onclick="answer('${esc(wait.approval_id)}','allow-always')">Always</button>
      <button class="ghost" onclick="answer('${esc(wait.approval_id)}','deny')">Deny</button>
    </div>
  </div>`;
}

window.answer = (approvalId, decision) => {
  ws.send(JSON.stringify({ cmd: 'mcp-approve', approval_id: approvalId, decision }));
  state.peek = null;
};

/** What changed while you were not looking.
 *
 *  Deliberately computed, not summarised by a model: lane transitions are facts
 *  we already hold exactly, so a deterministic recap is instant, free and cannot
 *  be wrong about them. The trigger is the borrowed part — capture on blur, and
 *  only bother if enough time passed that you actually lost the thread.
 */
const AWAY_SECONDS = 25;

function laneSnapshot() {
  return state.lanes.map(l => {
    const v = state.verdicts[l.index];
    const wait = state.awaiting[`${state.session}#${l.index}`];
    return {
      index: l.index,
      model: l.model,
      status: wait ? 'needs-input'
        : v ? (v.changed_files === 0 ? 'empty' : (v.passed ? 'passed' : 'eliminated'))
        : (state.activity[l.index] ? 'working' : 'queued'),
    };
  });
}

function recapSince(before) {
  const now = laneSnapshot();
  const byIndex = Object.fromEntries(before.map(l => [l.index, l.status]));
  const lines = [];
  for (const l of now) {
    const was = byIndex[l.index];
    if (was === undefined || was === l.status) continue;
    const name = l.model || `lane ${l.index}`;
    lines.push({
      'passed': `${name} finished and passed its checks`,
      'eliminated': `${name} was eliminated by the checks`,
      'empty': `${name} finished without changing anything`,
      'needs-input': `${name} is waiting on you`,
      'working': `${name} started working`,
    }[l.status] || `${name} → ${l.status}`);
  }
  return lines;
}

window.addEventListener('blur', () => {
  if (!state.lanes.length) return;
  state.away = { at: Date.now(), snapshot: laneSnapshot() };
});

window.addEventListener('focus', () => {
  const away = state.away; state.away = null;
  if (!away) return;
  const seconds = Math.round((Date.now() - away.at) / 1000);
  if (seconds < AWAY_SECONDS) return;
  const lines = recapSince(away.snapshot);
  if (!lines.length) return;
  addEvent('while you were away', `${seconds}s — ${lines.length} change${lines.length > 1 ? 's' : ''}`,
    lines.map(l => `<div style="font-size:12.5px">· ${esc(l)}</div>`).join(''));
});

/** Tier 1: the scoreboard.
 *
 *  Rows are metrics, columns are candidates. The transpose matters — comparing
 *  four candidates on six measures reads down a row, where four stacked cards
 *  make you hold values in your head. Leftmost is the baseline everything else
 *  is read against, which is the convention every serious comparison tool
 *  converged on, so deviating would cost familiarity for nothing.
 *
 *  "Only differences" collapses rows where every candidate agrees: when they
 *  mostly match, the few rows that differ ARE the comparison. */
let boardDiffOnly = false;
let boardBase = 0;              // lane index held in the leftmost column

const METRICS = [
  ['outcome', 'Outcome'], ['rank', 'Rank'], ['files', 'Files changed'],
  ['tests', 'Tests'], ['duration', 'Duration'], ['cost', 'Cost'], ['tokens', 'Tokens'],
];

/** What each candidate is worth on every measured axis.
 *
 *  Everything here comes from something observed — a check's exit code, a file
 *  count, a token count, a clock in the daemon. Nothing is a score we invented,
 *  because the whole claim of the product is that the project's own checks
 *  decide, not us. */
function scoreboardCell(l) {
  const v = state.verdicts[l.index];
  const r = state.ranks[l.index];
  const wait = state.awaiting[`${state.session}#${l.index}`];
  const u = state.usage[l.index];
  return {
    outcome: wait ? 'needs input'
      : v ? (v.changed_files === 0 ? 'changed nothing' : (v.passed ? 'passed' : 'eliminated'))
      : (state.activity[l.index] ? 'working' : 'queued'),
    rank: r ? `#${r.rank}` : '—',
    files: v ? String(v.changed_files) : '—',
    tests: v?.touched_tests?.length ? 'rewrote tests' : 'untouched',
    duration: u?.duration_ms ? secs(u.duration_ms) : '—',
    cost: u ? money(u.cost_usd) : '—',
    tokens: u ? String(u.input_tokens + u.output_tokens) : '—',
  };
}

function renderScoreboard() {
  const host = $('board');
  const mod = $('boardmod');
  if (!host || !mod) return;
  // Nothing to compare is not an empty state worth any screen — the band stays
  // out of the way entirely until a second candidate exists.
  mod.classList.toggle('shut', state.lanes.length < 2);
  if (state.lanes.length < 2) return;
  // Re-based rather than re-sorted. Which candidate you read the others against
  // is a judgement only the user can make — usually "the one I'd have shipped
  // anyway" — so it is a click, not a ranking we impose.
  const order = [...state.lanes].sort((a, b) =>
    (a.index === boardBase ? -1 : 0) - (b.index === boardBase ? -1 : 0));
  const cells = order.map(scoreboardCell);
  const head = `<tr><th></th>${order.map((l, i) =>
    `<th><button class="rebase" data-lane="${l.index}">${esc(laneLabel(l))}</button>` +
    `${i === 0 ? '<div class="base">baseline</div>' : ''}</th>`).join('')}</tr>`;
  const body = METRICS.map(([k, name]) => {
    const vals = cells.map(c => c[k]);
    const same = vals.every(v => v === vals[0]);
    if (boardDiffOnly && same) return '';
    return `<tr class="${same ? 'same' : ''}"><th>${name}</th>` + vals.map((v) => {
      let cls = '';
      if (k === 'outcome') cls = v === 'passed' ? 'good' : (v === 'eliminated' || v === 'changed nothing' ? 'bad' : '');
      if (k === 'rank' && v === '#1') cls = 'win';
      if (k === 'tests' && v === 'rewrote tests') cls = 'bad';
      return `<td class="${cls}">${esc(v)}</td>`;
    }).join('') + '</tr>';
  }).join('');
  const hidden = boardDiffOnly
    ? METRICS.filter(([k]) => { const vs = cells.map(c => c[k]); return vs.every(v => v === vs[0]); }).length
    : 0;
  host.innerHTML = `<table class="board">${head}${body}</table>
    <label class="boardopt"><input type="checkbox" id="diffonly" ${boardDiffOnly ? 'checked' : ''}>
      only differences${hidden ? ` — ${hidden} identical row${hidden === 1 ? '' : 's'} hidden` : ''}</label>`;
  $('diffonly').onchange = (e) => { boardDiffOnly = e.target.checked; renderScoreboard(); };
  host.querySelectorAll('.rebase').forEach(b => {
    b.onclick = () => {
      boardBase = Number(b.dataset.lane);
      renderScoreboard();
      // The trajectory is read against the same baseline, so re-basing here
      // re-bases there. Two views of one comparison must never disagree about
      // which column is the reference.
      trajOpen = new Set();
      loadTrajectories();
    };
  });
}

/** Tier 2: aligned trajectories.
 *
 *  The scoreboard answers "which one won". It cannot answer the case that
 *  actually needs judgement — two candidates that both pass — because the
 *  numbers tie and the difference is in the route each took.
 *
 *  Rows are aligned steps, columns are lanes. Stretches every lane walked
 *  identically fold away by default: that is the part carrying no information
 *  about how they differ, and leaving it expanded is how a comparison of forty
 *  steps hides the three that matter. */
let trajectory = null;      // the alignment as served
let trajOpen = new Set();   // indexes of folds the user has expanded

// `rel` is how this cell stands to the baseline: 'same', 'off', or '' for the
// baseline itself, which stands to nothing. Past three columns the row-level
// verdict stops being enough — you need to see which lanes went their own way
// without reading every cell.
function stepCell(a, rel) {
  const cls = [rel, a?.failed ? 'bad-step' : ''].filter(Boolean).join(' ');
  if (!a) return `<td class="none ${cls}">—</td>`;
  const kind = esc(a.kind);
  return `<td class="${cls}">`
    + `<span class="k ${kind}" title="${esc(a.tool)}">${kind}</span>${esc(a.target)}`
    + (a.detail ? `<span class="det">${esc(a.detail)}</span>` : '')
    + (a.failed ? '<span class="det">failed</span>' : '')
    + '</td>';
}

/** Group consecutive agreeing rows so they can fold as one unit. */
function trajGroups(rows) {
  const out = [];
  for (const [i, r] of rows.entries()) {
    const last = out[out.length - 1];
    if (r.agree && last && last.agree) last.rows.push([i, r]);
    else out.push({ agree: r.agree, rows: [[i, r]] });
  }
  return out;
}

async function loadTrajectories() {
  const mod = $('trajmod');
  if (!state.session || state.lanes.length < 2) { mod.classList.add('shut'); return; }
  try {
    trajectory = await api(`/api/sessions/${state.session}/variants/trajectories?baseline=${boardBase}`);
    renderTrajectories();
  } catch (e) { fail(e); }
}

function renderTrajectories() {
  const mod = $('trajmod'), host = $('traj'), gist = $('trajgist');
  if (!trajectory || !trajectory.rows?.length) {
    // No recorded steps is not an empty state worth any screen.
    mod.classList.add('shut');
    return;
  }
  mod.classList.remove('shut');
  const lanes = trajectory.lanes;
  const total = trajectory.rows.length;
  const diverged = total - trajectory.agreed;
  gist.textContent = diverged === 0
    ? `— ${total} steps, identical throughout`
    : `— ${diverged} of ${total} steps diverged`;

  const label = (i) => {
    const l = state.lanes.find(x => x.index === i);
    return l ? laneLabel(l) : `lane ${i}`;
  };
  const head = `<tr><th class="n"></th>${lanes.map((i, n) =>
    `<th>${esc(label(i))}${n === 0 ? '<div class="base">baseline</div>' : ''}</th>`).join('')}</tr>`;

  const body = trajGroups(trajectory.rows).map((g, gi) => {
    // A single agreeing row is not worth a fold control.
    if (g.agree && g.rows.length > 1 && !trajOpen.has(gi)) {
      return `<tr class="fold"><td class="n"></td><td colspan="${lanes.length}">`
        + `<button data-fold="${gi}">▸ ${g.rows.length} identical steps</button></td></tr>`;
    }
    const rows = g.rows.map(([i, r]) =>
      `<tr class="${r.agree ? '' : 'diverged'}"><td class="n">${i + 1}</td>`
      // The baseline gets neither mark. It cannot recede — it is the column
      // everything else is read against, and dimming it hides the very content
      // you reach for when a row diverges. Nor can it "differ from itself".
      + r.cells.map((c, n) =>
          stepCell(c, n === 0 ? '' : ((r.agree || r.matches_baseline?.[n]) ? 'same' : 'off'))).join('')
      + '</tr>').join('');
    if (g.agree && g.rows.length > 1) {
      return `<tr class="fold"><td class="n"></td><td colspan="${lanes.length}">`
        + `<button data-fold="${gi}">▾ ${g.rows.length} identical steps</button></td></tr>` + rows;
    }
    return rows;
  }).join('');

  host.innerHTML = `<table class="traj">${head}${body}</table>`;
  host.querySelectorAll('[data-fold]').forEach(b => {
    b.onclick = () => {
      const k = Number(b.dataset.fold);
      trajOpen.has(k) ? trajOpen.delete(k) : trajOpen.add(k);
      renderTrajectories();
    };
  });
}

function renderBlocked() {
  const n = Object.keys(state.awaiting).length;
  const el = $('blocked');
  el.classList.toggle('hidden', n === 0);
  el.textContent = n === 1 ? '1 lane needs input' : `${n} lanes need input`;
  el.onclick = () => {
    // Jump to the first waiting lane and open its peek.
    const key = Object.keys(state.awaiting)[0];
    const idx = Number(key.split('#')[1]);
    if (!Number.isNaN(idx)) { state.peek = idx; renderRoster(); }
  };
}

async function showLane(index) {
  const lane = state.lanes.find(l => l.index === index);
  const v = state.verdicts[index];
  const rank = state.ranks[index];
  let inner = `<div style="font:12px var(--mono);color:var(--muted)">${esc(lane?.model || 'agent default')}</div>`;
  if (rank) inner += `<div style="margin-top:8px"><b style="color:var(--muted);font-weight:500">Approach</b><br>${esc(rank.approach)}
                      <br><b style="color:var(--muted);font-weight:500">Trade-off</b><br>${esc(rank.tradeoffs)}</div>`;
  if (v && !v.passed) inner += `<pre>${esc((v.output || '').split('\n').slice(-12).join('\n'))}</pre>`;
  inner += `<div style="margin-top:10px;display:flex;gap:8px">
      <button class="ghost" onclick="laneDiff(${index}, this)">Diff</button>
      ${v && v.passed && v.changed_files > 0 ? `<button class="go" onclick="adopt('${lane.branch}')">Adopt</button>` : ''}
    </div><div id="ld-${index}"></div>`;
  addEvent('lane ' + index, lane?.model || '', inner);
}

// ── diff ─────────────────────────────────────────────────────────────
function lineDiff(oldText, newText, context = 3) {
  const a = String(oldText || '').split('\n'), b = String(newText || '').split('\n');
  if (a.length * b.length > 4_000_000) return `(too large to diff inline)\n`;
  const lcs = Array.from({ length: a.length + 1 }, () => new Uint32Array(b.length + 1));
  for (let i = a.length - 1; i >= 0; i--)
    for (let j = b.length - 1; j >= 0; j--)
      lcs[i][j] = a[i] === b[j] ? lcs[i + 1][j + 1] + 1 : Math.max(lcs[i + 1][j], lcs[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) ops.push([' ', a[i++]]), j++;
    else if (lcs[i + 1][j] >= lcs[i][j + 1]) ops.push(['-', a[i++]]);
    else ops.push(['+', b[j++]]);
  }
  while (i < a.length) ops.push(['-', a[i++]]);
  while (j < b.length) ops.push(['+', b[j++]]);
  if (!ops.some(([t]) => t !== ' ')) return '(no changes)\n';
  const keep = new Array(ops.length).fill(false);
  ops.forEach(([t], k) => { if (t !== ' ') for (let x = Math.max(0, k - context); x <= Math.min(ops.length - 1, k + context); x++) keep[x] = true; });
  const out = []; let gap = false;
  ops.forEach(([t, l], k) => { if (keep[k]) { out.push(t + l); gap = false; } else if (!gap) { out.push('@@'); gap = true; } });
  return out.join('\n') + '\n';
}
/** Render a patch with every line addressable.
 *
 *  Review is not accept-or-reject: the useful act is pointing at a line and
 *  saying what is wrong with it. Anchoring a note to a line and compiling the
 *  set into one follow-up turns review into steering, over the channel that
 *  already exists, instead of a binary verdict plus a retyped explanation. */
function renderPatch(patch, file) {
  return esc(patch).split('\n').map((l, i) => {
    const cls = l.startsWith('+') ? 'add' : l.startsWith('-') ? 'del' : l.startsWith('@@') ? 'hd' : '';
    return `<span class="dl ${cls}" data-file="${esc(file)}" data-line="${i}">${l || ' '}</span>`;
  }).join('\n');
}

window.laneDiff = async (index, btn) => {
  const host = $('ld-' + index);
  if (host.innerHTML) { host.innerHTML = ''; return; }
  btn.disabled = true;
  try {
    const st = await api(`/api/sessions/${state.session}/variants/status`);
    const files = st.find(s => s.index === index)?.status?.files || [];
    if (!files.length) { host.innerHTML = '<pre>this lane changed nothing</pre>'; return; }
    // Render per file so each line carries the file it belongs to — a comment
    // is only actionable if it says *where*.
    let out = '';
    for (const f of files.slice(0, 4)) {
      const d = await api(`/api/sessions/${state.session}/variants/diff?index=${index}&path=${encodeURIComponent(f.path)}`);
      const patch = d.too_large || d.binary ? '(not shown inline)' : lineDiff(d.old, d.new);
      out += `<span class="dl hd">--- ${esc(f.path)}</span>\n` + renderPatch(patch, f.path) + '\n';
    }
    host.innerHTML = `<pre>${out}</pre><div class="cbar"></div>`;
    attachCommenting(host);
  } catch (e) { host.innerHTML = `<pre>${esc(e.message)}</pre>`; }
  finally { btn.disabled = false; }
};

/** Click a line, say what is wrong with it. */
function attachCommenting(host) {
  host.querySelectorAll('.dl').forEach(line => {
    line.onclick = () => {
      if (line.nextElementSibling?.classList?.contains('cbox')) return;
      const box = document.createElement('div');
      box.className = 'cbox';
      box.innerHTML = `<input placeholder="what's wrong with this line?" />
                       <button class="go">Add</button>`;
      line.after(box);
      const input = box.querySelector('input');
      input.focus();
      const commit = () => {
        const text = input.value.trim();
        box.remove();
        if (!text) return;
        line.classList.add('marked');
        const note = document.createElement('div');
        note.className = 'cnote';
        note.textContent = '↳ ' + text;
        line.after(note);
        state.comments.push({ file: line.dataset.file, code: line.textContent.trim(), text });
        renderCommentBar();
      };
      box.querySelector('button').onclick = commit;
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') commit();
        if (e.key === 'Escape') box.remove();
      });
    };
  });
}

/** Comments accumulate, then go as ONE follow-up — several notes are one
 *  instruction, not several conversations. */
function renderCommentBar() {
  document.querySelectorAll('.cbar').forEach(bar => {
    const n = state.comments.length;
    bar.innerHTML = n
      ? `<button class="go" onclick="sendComments()">Send ${n} comment${n > 1 ? 's' : ''} as follow-up</button>
         <button class="ghost" onclick="clearComments()">Discard</button>`
      : '';
    bar.style.cssText = n ? 'display:flex;gap:8px;margin-top:10px' : '';
  });
}
window.clearComments = () => {
  state.comments = [];
  document.querySelectorAll('.marked').forEach(e => e.classList.remove('marked'));
  document.querySelectorAll('.cnote').forEach(e => e.remove());
  renderCommentBar();
};
window.sendComments = () => {
  if (!state.comments.length) return;
  const body = state.comments
    .map(c => `In ${c.file}, on this line:\n    ${c.code}\n${c.text}`)
    .join('\n\n');
  const msg = `Review feedback on the change:\n\n${body}`;
  addTurn('you', msg, 'user');
  state.streaming = null;
  ws.send(JSON.stringify({ cmd: 'session', id: state.session, input: msg }));
  clearComments();
};

window.adopt = async (branch) => {
  try {
    await api(`/api/sessions/${state.session}/variants/adopt`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ branch }),
    });
    addEvent('adopted', branch + ' merged into the session branch', '');
    state.lanes = []; state.verdicts = {}; state.activity = {}; state.ranks = {}; state.usage = {};
    renderRoster();
  } catch (e) { fail(e); }
};

// ── the stream ───────────────────────────────────────────────────────
let ws;
function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onmessage = (ev) => {
    let f; try { f = JSON.parse(ev.data); } catch { return; }
    const lane = state.runToLane[f.workflow ?? f.session];
    switch (f.kind) {
      case 'lane-started':
        state.runToLane[f.run] = f.index;
        state.activity[f.index] = 'starting';
        renderRoster();
        break;
      case 'token':
        if (lane !== undefined) { if (!state.activity[lane]) { state.activity[lane] = 'thinking'; renderRoster(); } break; }
        // Main conversation tokens land in the transcript.
        if (f.workflow === state.session) {
          if (!state.streaming) state.streaming = addTurn('agent', '');
          state.streaming.textContent += f.delta; scroll();
        }
        break;
      case 'reasoning':
        if (lane === undefined && f.workflow === state.session && state.verbosity === 'verbose') {
          if (!state.streaming) state.streaming = addTurn('agent', '');
          state.streaming.classList.add('thinking');
          state.streaming.textContent += f.delta; scroll();
        }
        break;
      case 'tool-call': {
        if (lane !== undefined) {
          const arg = f.arguments && (f.arguments.path || f.arguments.command || '');
          state.activity[lane] = `${f.name}${arg ? ' ' + String(arg).split('/').pop() : ''}`
            + (f.phase === 'result' ? (f.is_error ? ' — failed' : ' ✓') : '…');
          renderRoster();
        } else if (f.workflow === state.session && state.verbosity !== 'summary' && f.phase === 'start') {
          const arg = f.arguments && (f.arguments.path || f.arguments.command || '');
          addEvent('tool', `${f.name} ${String(arg).split('/').pop() || ''}`, '', false);
          state.streaming = null;
        }
        break;
      }
      case 'session-done':
        if (lane !== undefined) { state.activity[lane] = 'finished — awaiting verification'; renderRoster(); }
        else if (f.session === state.session) state.streaming = null;
        break;
      case 'mcp-approval-required':
        if (f.run) { state.awaiting[f.run] = { approval_id: f.approval_id, question: `approve ${f.tool_display} on ${f.server}?`, since: f.requested_at }; renderRoster(); }
        break;
      case 'mcp-approval-resolved':
        for (const k of Object.keys(state.awaiting))
          if (state.awaiting[k].approval_id === f.approval_id) delete state.awaiting[k];
        renderRoster();
        break;
      case 'snapshot':
        // A reload must still show which lanes are stuck — that is why the
        // daemon keeps this on the run rather than only announcing it once.
        for (const r of f.runs || []) if (r.awaiting) state.awaiting[r.workflow] = r.awaiting;
        renderRoster();
        break;
      case 'lane-verified':
        state.verdicts[f.index] = { index: f.index, passed: f.passed, changed_files: f.changed_files, touched_tests: f.touched_tests || [] };
        delete state.activity[f.index];
        renderRoster();
        break;
    }
  };
  ws.onclose = () => setTimeout(connect, 1500);
}

// ── actions ──────────────────────────────────────────────────────────
async function loadSessions() {
  try {
    const list = await api('/api/sessions');
    $('session').innerHTML = '<option value="">— choose a workspace —</option>' +
      list.map(s => `<option value="${esc(s.id)}">${esc(s.name)} — ${esc(s.working_dir)}</option>`).join('');
  } catch (e) { fail(e); }
}

/** Re-attach to a comparison that is already under way.
 *
 *  A variants run outlives the tab that started it — worktrees persist, checks
 *  take minutes, and reloading mid-run is ordinary. The daemon holds every
 *  answer already; without this the page would show an empty scoreboard over a
 *  run that has long since been verified and ranked. */
/** The run's economics, priced server-side from the lanes' real token counts.
 *
 *  One writer for both the rail and the scoreboard's cost row, so grading a run
 *  and re-attaching to one can never show different money. */
async function loadCost() {
  if (!state.session) return;
  const base = $('baseline').value.trim() || 'claude-sonnet-4';
  const cost = await api(`/api/sessions/${state.session}/variants/cost?baseline=${encodeURIComponent(base)}`);
  state.usage = Object.fromEntries((cost.lanes || []).map(l => [l.index, l]));
  renderScoreboard();
  $('costbody').innerHTML = !cost.lanes?.length
    ? '<div class="empty">—</div>'
    : `<div class="kv"><span>this run</span><span class="v">${money(cost.total_usd)}</span></div>
       <div class="kv"><span>all on ${esc(cost.baseline_model)}</span><span class="v">${money(cost.baseline_usd)}</span></div>
       <div class="kv"><span>saved</span><span class="v save">${money(cost.saved_usd)}</span></div>` +
      (cost.baseline_usd === 0 ? `<div class="empty" style="margin-top:6px">No price set for ${esc(cost.baseline_model)} — nothing to compare against.</div>` : '');
}

async function restoreRun() {
  if (!state.session) return;
  try {
    const r = await api(`/api/sessions/${state.session}/variants/results`);
    if (!r.lanes?.length) return;
    state.lanes = r.lanes;
    for (const v of r.lanes) state.runToLane[`${state.session}#${v.index}`] = v.index;
    for (const v of r.verdicts || []) state.verdicts[v.index] = v;
    for (const u of r.usage || []) state.usage[u.index] = u;
    for (const c of r.judgment?.candidates || []) state.ranks[c.index] = c;
    state.winner = r.judgment ? r.judgment.winner : null;
    renderRoster();
    // Prices the restored usage rather than trusting the raw counts — the
    // baseline comparison is computed from config, which lives server-side.
    await loadCost();
    await loadTrajectories();
  } catch { /* no variants dir yet — the normal case */ }
}

$('session').onchange = (e) => {
  state.session = e.target.value || null;
  state.lanes = []; state.verdicts = {}; state.activity = {}; state.ranks = {}; state.runToLane = {}; state.usage = {};
  trajectory = null; trajOpen = new Set(); boardBase = 0; $('trajmod').classList.add('shut');
  $('transcript').innerHTML = ''; renderRoster();
  restoreRun();
};

$('baseline').onchange = () => { if (state.session) loadCost().catch(fail); };

$('verbosity').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.verbosity = b.dataset.v;
  [...$('verbosity').children].forEach(x => x.classList.toggle('on', x === b));
};

async function checkModels() {
  const models = $('models').value.split(',').map(m => m.trim()).filter(Boolean);
  if (!models.length) return [];
  try {
    const r = await api(`/api/variants/probe?provider=ollama&models=${encodeURIComponent(models.join(','))}`);
    const bad = r.filter(m => !m.usable);
    $('modelhint').innerHTML = bad.length
      ? `<span style="color:var(--fail)">${esc(bad.map(m => m.model).join(', '))} cannot drive a lane</span>`
      : `<span style="color:var(--pass)">${r.length} ready</span>`;
    return bad.map(m => m.model);
  } catch { return []; }
}
$('models').addEventListener('change', checkModels);

$('send').onclick = () => {
  if (!state.session) return fail('choose a workspace first');
  const text = $('input').value.trim(); if (!text) return;
  $('err').textContent = '';
  addTurn('you', text, 'user');
  state.streaming = null;
  ws.send(JSON.stringify({ cmd: 'session', id: state.session, input: text }));
  $('input').value = '';
};

$('planBtn').onclick = async () => {
  if (!state.session) return fail('choose a workspace first');
  const task = $('input').value.trim(); if (!task) return fail('describe the change first');
  $('planBtn').disabled = true; $('err').textContent = '';
  try {
    const p = await api(`/api/sessions/${state.session}/variants/plan`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task, provider: 'ollama', model: 'qwen3:32b' }),
    });
    // The plan lands back in the composer as editable text: one plan corrected
    // beforehand costs nothing, where correcting it afterwards costs N runs.
    $('input').value = p.instruction;
    addEvent('plan', p.summary, `<div style="white-space:pre-wrap;font-size:12.5px">${esc(p.instruction)}</div>`);
    $('planbox').style.display = ''; $('planbody').textContent = p.summary; $('planbody').className = '';
  } catch (e) { fail(e); } finally { $('planBtn').disabled = false; }
};

$('fan').onclick = async () => {
  if (!state.session) return fail('choose a workspace first');
  const task = $('input').value.trim(); if (!task) return fail('describe the change first');
  const models = $('models').value.split(',').map(m => m.trim()).filter(Boolean);
  if (!models.length) return fail('name at least one lane model');
  const bad = await checkModels();
  if (bad.length) return fail(`these cannot drive a lane: ${bad.join(', ')}`);

  $('fan').disabled = true; $('err').textContent = '';
  try {
    addTurn('you', task, 'user');
    state.lanes = await api(`/api/sessions/${state.session}/variants`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      // "agent:name" compares agents; a bare name compares models. Same
      // mechanism, and which one you reach for is the question you are asking.
      body: JSON.stringify({ input: task, lanes: models.map(m =>
        m.startsWith('agent:') ? { agent: m.slice(6).trim() } : { model: m }) }),
    });
    state.verdicts = {}; state.activity = {}; state.ranks = {}; state.usage = {};
    addEvent('fan out', `${state.lanes.length} lanes — ${models.join(', ')}`,
      `<div style="font-size:12.5px;color:var(--muted)">Each lane works in its own isolated worktree. Watch the roster; grade them when they settle.</div>`);
    renderRoster();
    $('input').value = '';
  } catch (e) { fail(e); } finally { $('fan').disabled = false; }
};

// Grading is a separate act from fanning out: local models take minutes, so you
// fan out, walk away, and come back to judge.
const grade = document.createElement('button');
grade.className = 'ghost'; grade.textContent = 'Verify & judge';
grade.onclick = async () => {
  if (!state.lanes.length) return fail('fan out first');
  grade.disabled = true; $('err').textContent = '';
  try {
    const v = await api(`/api/sessions/${state.session}/variants/verify`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      // The project's own command. Hardcoding one would quietly make this a
      // JavaScript tool and, worse, would grade every lane against a check the
      // project does not actually use.
      body: JSON.stringify({ check: $('check').value.trim() || 'npm run check' }),
    });
    for (const r of v) state.verdicts[r.index] = r;
    renderRoster();
    const survivors = v.filter(r => r.passed && r.changed_files > 0).map(r => r.index);
    addEvent('verified', `${survivors.length} of ${v.length} survived`,
      v.map(r => `<div style="font-size:12.5px">lane ${r.index}: ${r.passed ? (r.changed_files ? 'passed' : 'passed but changed nothing') : 'eliminated'}</div>`).join(''));
    if (!survivors.length) return;

    const j = await api(`/api/sessions/${state.session}/variants/judge`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task: 'the change under review', provider: 'ollama', model: 'qwen3:32b', only: survivors }),
    });
    state.winner = j.winner;
    for (const c of j.candidates) state.ranks[c.index] = c;
    renderRoster();
    addEvent('judged', `lane ${j.winner} wins`,
      `<div style="font-size:12.5px">${esc(j.reasoning)}</div>` +
      j.candidates.map(c => `<div style="margin-top:8px;font-size:12.5px"><b>#${c.rank} lane ${c.index}</b> — ${esc(c.tradeoffs)}</div>`).join(''));

    await loadCost();
    await loadTrajectories();
  } catch (e) { fail(e); } finally { grade.disabled = false; }
};
document.querySelector('.acts').insertBefore(grade, $('models'));

$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('send').click(); }
});

loadSessions();
connect();
renderRoster();
</script>
</body>
</html>
