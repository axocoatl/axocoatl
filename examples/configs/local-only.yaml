# local-only — local inference via Ollama, zero hosted-provider API keys
#
# Prerequisites: ollama serve && ollama pull llama3.2  (no cloud credentials)
# Run:           axocoatl validate examples/configs/local-only.yaml
#                axocoatl dev -c examples/configs/local-only.yaml
# Expected:      both agents use the local Ollama endpoint. Session tool egress
#                is disabled; downloading the model happens before this run.
#                `network: none` also prevents in-container command
#                provisioning and project setup downloads. Use an image that
#                already contains Axocoatl's required repository commands;
#                Podman image pulls remain a separate host operation.

agents:
  - id: assistant
    name: "Local Assistant"
    provider: ollama
    model: llama3.2
    system_prompt: "You are a helpful assistant running entirely on local hardware."
    depends_on: []

  - id: critic
    name: "Local Critic"
    provider: ollama
    model: llama3.2
    system_prompt: "Critique the assistant's answer and point out anything missing or wrong."
    depends_on: [assistant]

providers:
  ollama:
    base_url: "http://localhost:11434"

sandbox:
  backend: podman
  network: none
