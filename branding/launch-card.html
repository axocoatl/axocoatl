<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!--
  Source of the social cards. render-cards.mjs opens this file at two sizes:
  1200x630 -> sites/marketing/assets/og-home.png (and branding/launch-card.png)
  1280x640 -> branding/github-social-preview.png
  The size comes from ?w=…&h=…; without it the card is 1200x630.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" />
<style>
  :root { --w: 1200px; --h: 630px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); background: #050709; }
  .card {
    position: relative;
    width: var(--w); height: var(--h);
    overflow: hidden;
    display: flex; align-items: center; justify-content: space-between; gap: 40px;
    padding: 0 80px 0 88px;
    background:
      radial-gradient(52% 80% at 84% 50%, rgba(62, 124, 92, 0.24), transparent 64%),
      radial-gradient(130% 120% at 50% 128%, rgba(63, 169, 200, 0.06), transparent 55%),
      #050709;
    font-family: "Space Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* bronze hairline along the bottom edge */
  .card::after {
    content: "";
    position: absolute; left: 0; bottom: 0; width: 100%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(181, 144, 74, 0.55), transparent);
  }
  .copy { position: relative; z-index: 2; max-width: 700px; }
  .eyebrow {
    display: flex; align-items: center; gap: 14px;
    font-family: "JetBrains Mono", monospace;
    font-size: 19px; font-weight: 500; letter-spacing: 3px;
    color: #E8C275; margin-bottom: 26px;
  }
  h1 {
    font-size: 76px; font-weight: 600; letter-spacing: -2px;
    color: #F4ECDA; line-height: 1.02; margin-bottom: 18px;
  }
  .kicker {
    font-size: 33px; font-weight: 500; letter-spacing: -0.5px;
    color: #4FCB8E; line-height: 1.2; margin-bottom: 30px;
  }
  .facts { list-style: none; display: grid; gap: 10px; margin-bottom: 34px; }
  .facts li {
    position: relative; padding-left: 30px;
    font-size: 25px; font-weight: 500; line-height: 1.3; color: #C8CBD1;
  }
  .facts li::before { content: "→"; position: absolute; left: 0; color: #4FCB8E; }
  .meta {
    display: flex; align-items: center; gap: 14px;
    font-family: "JetBrains Mono", monospace;
    font-size: 19px; font-weight: 500; letter-spacing: 0.3px; color: #ECECEC;
  }
  .meta .dot { width: 10px; height: 10px; border-radius: 50%; background: #4FCB8E;
               box-shadow: 0 0 12px rgba(79, 203, 142, 0.8); }
  .meta .sep { color: #636366; }
  .meta .dim { color: #8E8E93; }

  .markwrap { position: relative; z-index: 2; flex: none; display: grid; place-items: center; }
  .markwrap .glow {
    position: absolute; width: 440px; height: 440px; border-radius: 50%;
    background: radial-gradient(circle, rgba(62, 124, 92, 0.45), rgba(62,124,92,0.0) 65%);
    filter: blur(26px);
  }
  .markwrap img { position: relative; width: 300px; height: 300px; display: block; }
</style>
<script>
  const size = new URLSearchParams(location.search);
  const w = Number(size.get('w')) || 1200;
  const h = Number(size.get('h')) || 630;
  document.documentElement.style.setProperty('--w', `${w}px`);
  document.documentElement.style.setProperty('--h', `${h}px`);
</script>
</head>
<body>
  <div class="card">
    <div class="copy">
      <div class="eyebrow">AXOCOATL · OPEN SOURCE</div>
      <h1>Run coding agents<br>unattended.</h1>
      <p class="kicker">Agents write the code.<br>Axocoatl writes the receipt.</p>
      <ul class="facts">
        <li>Claude Code, Codex or a local model in a sandbox</li>
        <li>The host runs your checks; a different model reviews</li>
        <li>An exit code for CI and a signed receipt</li>
      </ul>
      <div class="meta">
        <span class="dot"></span>axocoatl.ai
        <span class="sep">·</span><span class="dim">Apache-2.0</span>
        <span class="sep">·</span><span class="dim">Rust</span>
      </div>
    </div>
    <div class="markwrap">
      <div class="glow"></div>
      <img src="mark.png" alt="Axocoatl" />
    </div>
  </div>
</body>
</html>
