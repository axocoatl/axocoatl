name: docs-deploy

# Build sites/docs/ after relevant main changes, but deploy only when the
# CLI product version already has a public GitHub release. release.yml calls this
# workflow after publishing that release and requires the deployment to finish.
on:
  push:
    branches: [main]
    paths:
      - 'sites/docs/**'
      - 'sites/marketing/assets/demo/dashboard-task-1.5/**'
      - 'sites/marketing/components/ax-video-chapters.js'
      - 'docs/**'
      - 'branding/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Public product release that authorizes this deployment
        required: true
        type: string
      release_sha:
        description: Frozen product source commit to build and deploy
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: Cloudflare API token used for the docs Pages deployment
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        description: Cloudflare account that owns the docs Pages project
        required: true

concurrency:
  # A release-caller must not turn red because an unrelated main push cancelled
  # its production deployment. Serialize all production docs mutations.
  group: axocoatl-production-docs
  queue: max
  cancel-in-progress: false

jobs:
  released-version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Reusable release callers must build the frozen release source, not
          # the newer workflow commit that is coordinating a recovery.
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Require the current product version to be published
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CALLED_RELEASE_TAG: ${{ inputs.release_tag }}
          CALLED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          mode=optional
          if [ -n "$CALLED_RELEASE_TAG" ]; then mode=required; fi
          published="$(./scripts/verify-public-release.sh \
            "$mode" "$CALLED_RELEASE_TAG" "$CALLED_RELEASE_SHA")"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          if [ "$published" = false ]; then
            echo "The current product release is not public; leaving production docs untouched."
          fi

  build-and-deploy:
    needs: released-version
    if: needs.released-version.outputs.published == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sites/docs/package-lock.json

      - name: Build and verify the exact documentation payload
        run: ./scripts/verify-docs-gate.sh

      - name: Reprove the public release and frozen tag immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          CALLED_RELEASE_TAG: ${{ inputs.release_tag }}
          CALLED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          mode=optional
          if [ -n "$CALLED_RELEASE_TAG" ]; then mode=required; fi
          test "$(./scripts/verify-public-release.sh \
            "$mode" "$CALLED_RELEASE_TAG" "$CALLED_RELEASE_SHA")" = true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          # The Wrangler that wrangler-action 3.15 installed by default; 4.x
          # defaults to the latest Wrangler 4.
          wranglerVersion: '3.90.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy sites/docs/dist --project-name=axocoatl-docs --branch=main
