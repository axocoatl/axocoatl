name: marketing-deploy

# Build sites/marketing/ after relevant main changes, but deploy only when the
# CLI product version already has a public GitHub release. release.yml calls this
# workflow after publishing that release and requires the deployment to finish.
on:
  push:
    branches: [main]
    paths:
      - 'sites/marketing/**'
      - 'llms.txt'
      - 'demo/one-app/films/portfolio.json'
      - 'demo/one-app/**'
      - 'scripts/install.sh'
      - 'branding/**'
      - '.github/workflows/marketing-deploy.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Public product release that authorizes this deployment
        required: true
        type: string
      release_sha:
        description: Frozen product source commit to build and deploy
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: Cloudflare API token used for the marketing Pages deployment
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        description: Cloudflare account that owns the marketing Pages project
        required: true

concurrency:
  # A release-caller must not turn red because an unrelated main push cancelled
  # its production deployment. Serialize all production marketing mutations.
  group: axocoatl-production-marketing
  queue: max
  cancel-in-progress: false

jobs:
  released-version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Reusable release callers must build the frozen release source, not
          # the newer workflow commit that is coordinating a recovery.
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Require the current product version to be published
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CALLED_RELEASE_TAG: ${{ inputs.release_tag }}
          CALLED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          mode=optional
          if [ -n "$CALLED_RELEASE_TAG" ]; then mode=required; fi
          published="$(./scripts/verify-public-release.sh \
            "$mode" "$CALLED_RELEASE_TAG" "$CALLED_RELEASE_SHA")"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          if [ "$published" = false ]; then
            echo "The current product release is not public; leaving production marketing untouched."
          fi

  deploy:
    needs: released-version
    if: needs.released-version.outputs.published == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install film inspection dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Build and verify release-bound marketing
        if: inputs.release_tag != ''
        run: ./scripts/verify-marketing-gate.sh source-bound /tmp/axocoatl-marketing

      - name: Build and verify standalone marketing content
        if: inputs.release_tag == ''
        run: ./scripts/verify-marketing-gate.sh portable /tmp/axocoatl-marketing

      - name: Reprove the public release and frozen tag immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          CALLED_RELEASE_TAG: ${{ inputs.release_tag }}
          CALLED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          mode=optional
          if [ -n "$CALLED_RELEASE_TAG" ]; then mode=required; fi
          test "$(./scripts/verify-public-release.sh \
            "$mode" "$CALLED_RELEASE_TAG" "$CALLED_RELEASE_SHA")" = true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy /tmp/axocoatl-marketing --project-name=axocoatl-marketing --branch=main
