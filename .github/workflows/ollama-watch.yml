name: Ollama watch

# Native Sessions accept an Ollama newer than the audited release only once
# the contract probes pass on the person's own models. This runs the same
# probes, every day, against each Ollama release and release candidate
# published in the last two days that is newer than the audited one, so a
# release that breaks a guarantee native execution relies on is known before
# anyone installs it. It changes nothing in this repository.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'One Ollama version to probe, such as 0.41.0 (empty: the new releases)'
        required: false
        type: string

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  AUDITED_OLLAMA_VERSION: '0.40.6'
  PROBE_MODEL: 'qwen3:0.6b'

jobs:
  releases:
    name: New Ollama releases
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - name: List the releases to probe
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED:-}" ]; then
            candidates="$REQUESTED"
          else
            candidates=$(gh api 'repos/ollama/ollama/releases?per_page=30' \
              --jq '.[] | select((.published_at | fromdateiso8601) > (now - 172800)) | .tag_name | ltrimstr("v")')
          fi
          versions=()
          for version in $candidates; do
            lowest=$(printf '%s\n%s\n' "$AUDITED_OLLAMA_VERSION" "$version" | sort -V | head -n 1)
            if [ "$version" != "$AUDITED_OLLAMA_VERSION" ] && [ "$lowest" = "$AUDITED_OLLAMA_VERSION" ]; then
              versions+=("$version")
            fi
          done
          json=$(printf '%s\n' ${versions[@]+"${versions[@]}"} | jq -R . | jq -cs 'map(select(length > 0))')
          echo "versions=$json" >> "$GITHUB_OUTPUT"
          echo "Ollama versions to probe: $json"

  probe:
    name: Contract probes on Ollama ${{ matrix.version }}
    needs: releases
    if: needs.releases.outputs.versions != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.releases.outputs.versions) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-23
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install the Ollama release
        env:
          OLLAMA_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/version && break
            sleep 2
          done
          ollama --version
      - name: Pull the probe model
        run: ollama pull "$PROBE_MODEL"
      - name: Run the contract probes
        env:
          AXOCOATL_WATCH_OLLAMA_URL: http://127.0.0.1:11434
          AXOCOATL_WATCH_OLLAMA_MODEL: ${{ env.PROBE_MODEL }}
        run: >-
          cargo test -p axocoatl-llm-ollama --lib --locked --
          --ignored --exact native::observed_context::watch::the_contract_probes_hold_on_a_live_ollama
          --nocapture
