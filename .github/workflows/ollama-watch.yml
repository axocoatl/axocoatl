name: Ollama watch

# Native Sessions accept an Ollama newer than the audited release only once
# the contract probes pass on the person's own models. This runs the same
# probes, every day, against each Ollama release and release candidate
# published in the last two days that is newer than the audited one, so a
# release that breaks a guarantee native execution relies on is known before
# anyone installs it. It changes nothing in this repository.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'One Ollama version to probe, such as 0.41.0 (empty: the new releases)'
        required: false
        type: string

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  AUDITED_OLLAMA_VERSION: '0.40.6'
  PROBE_MODEL: 'qwen3:0.6b'

jobs:
  releases:
    name: New Ollama releases
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - name: List the releases to probe
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED:-}" ]; then
            candidates="$REQUESTED"
          else
            candidates=$(gh api 'repos/ollama/ollama/releases?per_page=30' \
              --jq '.[] | select((.published_at | fromdateiso8601) > (now - 172800)) | .tag_name | ltrimstr("v")')
          fi
          versions=()
          for version in $candidates; do
            lowest=$(printf '%s\n%s\n' "$AUDITED_OLLAMA_VERSION" "$version" | sort -V | head -n 1)
            if [ "$version" != "$AUDITED_OLLAMA_VERSION" ] && [ "$lowest" = "$AUDITED_OLLAMA_VERSION" ]; then
              versions+=("$version")
            fi
          done
          json=$(printf '%s\n' ${versions[@]+"${versions[@]}"} | jq -R . | jq -cs 'map(select(length > 0))')
          echo "versions=$json" >> "$GITHUB_OUTPUT"
          echo "Ollama versions to probe: $json"

  probe:
    name: Contract probes on Ollama ${{ matrix.version }}
    needs: releases
    if: needs.releases.outputs.versions != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.releases.outputs.versions) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-23
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The installer starts its systemd service only when it finds systemd
      # running: 0.40.9-rc1's printed "systemd is not running" on this runner
      # and started nothing. Then this starts `ollama serve` itself, and the
      # step fails when no server of the requested version answers.
      - name: Install the Ollama release and start its server
        env:
          OLLAMA_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          answers() {
            curl -fsS --max-time 5 http://127.0.0.1:11434/api/version >/dev/null 2>&1
          }
          wait_for_server() {
            for _ in $(seq 1 30); do
              answers && return 0
              sleep 2
            done
            return 1
          }
          if ! systemctl is-active --quiet ollama 2>/dev/null || ! wait_for_server; then
            echo "The installer started no Ollama server that answers; starting ollama serve."
            nohup ollama serve >"$RUNNER_TEMP/ollama-serve.log" 2>&1 &
            wait_for_server || {
              echo "::error::Ollama $OLLAMA_VERSION does not answer on 127.0.0.1:11434 after the install and ollama serve."
              cat "$RUNNER_TEMP/ollama-serve.log" >&2 || true
              exit 1
            }
          fi
          served="$(curl -fsS --max-time 5 http://127.0.0.1:11434/api/version | jq -r .version)"
          test "$served" = "$OLLAMA_VERSION" || {
            echo "::error::The Ollama server answering is $served, not the $OLLAMA_VERSION this job probes."
            exit 1
          }
          echo "Ollama $served answers on 127.0.0.1:11434."
      - name: Pull the probe model
        run: ollama pull "$PROBE_MODEL"
      - name: Run the contract probes
        env:
          AXOCOATL_WATCH_OLLAMA_URL: http://127.0.0.1:11434
          AXOCOATL_WATCH_OLLAMA_MODEL: ${{ env.PROBE_MODEL }}
        run: >-
          cargo test -p axocoatl-llm-ollama --lib --locked --
          --ignored --exact native::observed_context::watch::the_contract_probes_hold_on_a_live_ollama
          --nocapture
