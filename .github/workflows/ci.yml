name: CI
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  workflow-contracts:
    name: Workflow contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.2'
          cache: false
      - name: Validate GitHub Actions semantics with pinned actionlint
        run: ./scripts/run-actionlint.sh
      - name: Verify workflow syntax, shell syntax, pinning, and shared gates
        run: ./scripts/check-workflow-contracts.rb
      - name: Exercise the workflow contract's verification-feature rules
        run: ./scripts/test-workflow-contracts.sh
      - name: Exercise film-gate release-candidate routing
        run: ./scripts/test-film-gate.sh
      - name: Exercise public release-state evaluation
        run: ./scripts/test-public-release.sh
      - name: Exercise the new-user gate's stub, fixtures table and release decision
        run: node --test scripts/release-gate/*.test.mjs
      - name: Exercise the new-user gate's scripts and evidence bundle
        run: ./scripts/release-gate/test-release-gate.sh
      - name: Every ignored test is in a Podman or live suite, or left out with a reason
        run: ./scripts/test-podman-suites.sh check

  marketing-site:
    name: Marketing site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Install film inspection dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Exercise film provenance and release compatibility contracts
        run: node --test demo/one-app/films/*.test.mjs
      - name: Exercise the incident recovery workflow contract
        run: ./scripts/test-recover-v1.0.1-workflow.sh
      - name: Build and verify the exact marketing payload
        run: ./scripts/verify-marketing-gate.sh portable /tmp/axocoatl-marketing
      - name: Require release provenance when the product version changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          base="$PR_BASE_SHA"
          head="$PR_HEAD_SHA"
          if [ -z "$base" ]; then
            base="$PUSH_BASE_SHA"
            head="$GITHUB_SHA"
          fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse "$head^")"
          fi
          ./scripts/verify-film-gate.sh candidate "$base" "$head"

  docs-site:
    name: Docs site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sites/docs/package-lock.json
      - name: Build and verify the exact documentation payload
        run: ./scripts/verify-docs-gate.sh

  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Verify the product browser gate is checked in
        run: |
          git ls-files --error-unmatch \
            axocoatl-server/browser-tests/package-lock.json \
            axocoatl-server/browser-tests/support/run-tests.mjs \
            axocoatl-server/browser-tests/tests/workbench.test.mjs >/dev/null
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: licenses/vendor-web/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.2'
          cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - name: Validate workflow semantics inside the required native check
        run: ./scripts/run-actionlint.sh
      - name: Verify workflow and shared-gate contracts inside the required native check
        run: ./scripts/check-workflow-contracts.rb
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-23
        with:
          toolchain: 1.88.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-23
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install the pinned audit tool
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Install the pinned license notice generator
        run: cargo install cargo-about --locked --version '=0.9.1' --features cli
      - name: Run the exact native release preflight
        run: ./scripts/verify-native-gate.sh

  msrv:
    name: Minimum Rust 1.88
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-23
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv-1.88
      - name: Check the declared minimum toolchain
        run: cargo check --locked --workspace --all-targets --all-features --jobs 1

  product-browser:
    # The release build, as users get it, on x86_64 and aarch64 in Chromium,
    # and in WebKit, the Safari engine, on x86_64 Linux and on macOS
    # (docs/RELEASE_GATE.md). release.yml runs the same legs.
    name: Product browser regressions (${{ matrix.leg }})
    runs-on: ${{ matrix.runner }}
    # The Linux legs that passed took 16 to 32 minutes (the 30 CI runs of
    # 14 to 23 October 2026); the margin is for a cold cache and the macOS
    # runner.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: x86_64, Chromium
            runner: ubuntu-24.04
            engine: chromium
            podman: true
          - leg: aarch64, Chromium
            runner: ubuntu-24.04-arm
            engine: chromium
            podman: true
          - leg: x86_64, WebKit
            runner: ubuntu-24.04
            engine: webkit
            podman: true
          # WebKit's own cookie store and a Mac without Podman exist only
          # here; a hosted macOS runner cannot run a Podman machine, so the
          # journey files that start a Session on Podman are left out
          # (scripts/verify-product-browser-gate.sh) and run in the release
          # gate's C1-browser-webkit path on a Mac.
          - leg: macOS arm64, WebKit
            runner: macos-26
            engine: webkit
            podman: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-23
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: product-browser-${{ matrix.runner }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: axocoatl-server/browser-tests/package-lock.json
      - name: Pull Docker Hub images through mirror.gcr.io
        if: matrix.podman
        run: ./scripts/ci-registry-mirror.sh
      # preview-cookies.test.mjs runs a real Session app in node:20-slim on
      # the runner's rootless Podman, with its ports published on loopback
      # (sandbox.network: bridge); native-turn-git.test.mjs and the
      # coordination reference journey run a Session in rust:bookworm, a
      # curated image with Git (their fixtures have no network). Each pull is
      # pinned to the image index by digest and tagged with the name the
      # journeys and the daemon look up; the daemon pulls only an image that
      # is missing. With AXOCOATL_E2E_REQUIRE_NODE_IMAGE=1 a missing node
      # image fails the Preview journeys instead of skipping them.
      - name: Pull the Session images the Preview, native turn and reference journeys run
        if: matrix.podman
        env:
          NODE_IMAGE: docker.io/library/node@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0
          RUST_IMAGE: docker.io/library/rust@sha256:48b7f435b8fc6378ce43b44f15e3a47fd8919b2825f835c39bd4bd3da50af5b8
        run: |
          command -v podman >/dev/null || { sudo apt-get update && sudo apt-get install -y podman; }
          podman pull "$NODE_IMAGE"
          podman tag "$NODE_IMAGE" docker.io/library/node:20-slim
          podman pull "$RUST_IMAGE"
          podman tag "$RUST_IMAGE" docker.io/library/rust:bookworm
      - name: Build and exercise the visible product surface
        env:
          AXO_BROWSER_INSTALL_WITH_DEPS: 'true'
          AXO_BROWSER_ENGINE: ${{ matrix.engine }}
          AXO_BROWSER_PROFILE: release
          AXO_BROWSER_WITHOUT_PODMAN: ${{ !matrix.podman && '1' || '' }}
          AXOCOATL_E2E_REQUIRE_NODE_IMAGE: ${{ matrix.podman && '1' || '' }}
          AXOCOATL_REFERENCE_RUNTIME_IMAGE: ${{ matrix.podman && 'docker.io/library/rust:bookworm' || '' }}
        run: ./scripts/verify-product-browser-gate.sh

  cross-aarch64-linux:
    name: Cross-build (aarch64-linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-23
        with:
          toolchain: 1.95.0
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build the CLI for aarch64-linux
        run: ./scripts/verify-cross-linux-gate.sh build

  new-user-linux:
    # docs/RELEASE_GATE.md, Tier A: a brand-new user on a stock runner, from
    # the published install command to a passing, signed run on every
    # tests/fixtures/newuser fixture, against this build's release archive.
    name: New user (Linux, ${{ matrix.leg }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            evidence: A-x86
            expect_refusal: ''
          - leg: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            evidence: A-arm
            expect_refusal: ''
          - leg: ubuntu-22.04 refusal
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            evidence: A-x86-refusal
            expect_refusal: 'Podman 3.4.4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-23
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: new-user-${{ matrix.runner }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: matrix.expect_refusal == ''
        with:
          go-version: '1.26.2'
          cache: false
      - name: Build and package this commit's release archive
        id: build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(awk '
            $0 == "[package]" { package_section = 1; next }
            package_section && /^\[/ { exit }
            package_section && $1 == "version" { gsub(/"/, "", $3); print $3; exit }
          ' axocoatl-cli/Cargo.toml)"
          cargo build --locked --release -p axocoatl-cli
          ./scripts/release-artifact.sh package "v$version" "$TARGET" target/release/axocoatl dist
          echo "TARBALL=dist/axocoatl-v$version-$TARGET.tar.gz" >> "$GITHUB_ENV"
      - name: Report the runner's Podman, user-ID ranges and journal access
        run: |
          podman version || echo "no podman on this runner image"
          grep "^$(id -un):" /etc/subuid /etc/subgid || echo "no subordinate ID range for $(id -un)"
          id
          # The gate reads sudo calls from the system journal.
          if [ -n "$(journalctl -q -n 1 _UID=0 -o cat 2>/dev/null)" ]; then
            echo "the system journal is readable as $(id -un)"
          elif [ -n "$(sudo -n journalctl -q -n 1 _UID=0 -o cat 2>/dev/null)" ]; then
            echo "the system journal is readable through sudo"
          else
            echo "the system journal is NOT readable"
          fi
      - name: Install Podman when the runner image lacks it
        if: matrix.expect_refusal == ''
        run: command -v podman >/dev/null || { sudo apt-get update && sudo apt-get install -y podman; }
      - name: Pull Docker Hub images through mirror.gcr.io
        if: matrix.expect_refusal == ''
        run: ./scripts/ci-registry-mirror.sh
      - name: Prove each fixture fails before the stub's fix and passes after it
        if: matrix.expect_refusal == ''
        env:
          GATE_REQUIRE_ALL_TOOLCHAINS: '1'
        run: ./scripts/release-gate/test-fixtures.sh
      - name: Exercise the gate's scripts with this build's binary
        if: matrix.expect_refusal == ''
        env:
          AXOCOATL_BIN: target/release/axocoatl
        run: ./scripts/release-gate/test-release-gate.sh
      # It runs even when the checks above fail, so CI shows how far the
      # product gets; it needs only the archive.
      - name: A brand-new user, from the install command to a passing signed run
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.expect_refusal == '' }}
        env:
          EVIDENCE: ${{ matrix.evidence }}
        run: |
          ./scripts/release-gate/newuser-linux.sh --tarball "$TARBALL" \
            --commit "$GITHUB_SHA" --label "$EVIDENCE" --system-changes
      - name: Onboarding and doctor refuse this machine cleanly
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.expect_refusal != '' }}
        env:
          EVIDENCE: ${{ matrix.evidence }}
          EXPECT_REFUSAL: ${{ matrix.expect_refusal }}
        run: |
          ./scripts/release-gate/newuser-linux.sh --tarball "$TARBALL" \
            --commit "$GITHUB_SHA" --label "$EVIDENCE" --expect-refusal "$EXPECT_REFUSAL"
      - name: Keep the new-user evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newuser-${{ matrix.evidence }}
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 30

  new-user-mac-plumbing:
    # docs/RELEASE_GATE.md, Tier B: a hosted macOS runner cannot run a
    # Podman machine, so doctor --json and onboard --plan run against a
    # Podman stand-in in each state a new Mac user meets, after the README's
    # install command with /usr/local/bin unwritable. The Intel leg runs the
    # x86_64 build, which must give the Intel answers.
    name: New user (macOS plumbing, ${{ matrix.leg }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: arm64
            runner: macos-15
            target: aarch64-apple-darwin
            evidence: B-arm
          - leg: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            evidence: B-intel
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-23
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: new-user-${{ matrix.runner }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Build and package this commit's release archive
        id: build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(awk '
            $0 == "[package]" { package_section = 1; next }
            package_section && /^\[/ { exit }
            package_section && $1 == "version" { gsub(/"/, "", $3); print $3; exit }
          ' axocoatl-cli/Cargo.toml)"
          cargo build --locked --release -p axocoatl-cli
          ./scripts/release-artifact.sh package "v$version" "$TARGET" target/release/axocoatl dist
          echo "TARBALL=dist/axocoatl-v$version-$TARGET.tar.gz" >> "$GITHUB_ENV"
      - name: A new Mac user's install, doctor and onboarding plan in each Podman state
        env:
          EVIDENCE: ${{ matrix.evidence }}
        run: |
          ./scripts/release-gate/newuser-mac-ci.sh --tarball "$TARBALL" \
            --commit "$GITHUB_SHA" --label "$EVIDENCE"
      - name: Keep the macOS plumbing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newuser-${{ matrix.evidence }}
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 30

  podman-suites:
    # Every test that is #[ignore]d by default because it needs Podman,
    # prepared images or the internet, on the runner's rootless Podman 4.9
    # (docs/RELEASE_GATE.md). scripts/test-podman-suites.sh prepares each
    # group's images (pinned by digest), runs every ignored test of its
    # crates and fails unless every one of them ran and passed; `check`, in
    # the workflow-contracts job, fails when an ignored test is in no group
    # or one is left out without a reason. The node_modules mount point tests
    # (isolation) start Session containers from Alpine on Podman's default
    # rootless network, and provisioning installs Git and the other Alpine
    # packages over it; each removal they assert runs while an unrelated
    # container of the person's own exists, and each keep of the empty mount
    # point names why, never Podman failing.
    name: Podman and live suites (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: [isolation, daemon, cli, other]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-23
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: podman-suites-${{ matrix.group }}
      - name: Pull Docker Hub images through mirror.gcr.io
        run: ./scripts/ci-registry-mirror.sh
      - name: Prepare the images the suites run
        env:
          GROUP: ${{ matrix.group }}
        run: ./scripts/test-podman-suites.sh prepare "$GROUP"
      - name: Run every ignored test of the group
        env:
          GROUP: ${{ matrix.group }}
        run: ./scripts/test-podman-suites.sh run "$GROUP"

  supervisor-runtime:
    # The embedded execution supervisors' protocol and process-lifecycle
    # suite (supervisor_runtime.rs) in Alpine and Debian images, as root and
    # as a non-root user, each on a kernel of the image's architecture: the
    # read-only and network-denying cases need Landlock, which user-mode
    # emulation lacks (docs/EXEC_SUPERVISOR_BUILD.md).
    name: Execution supervisor runtime (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-23
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: supervisor-runtime-${{ matrix.runner }}
      - name: Pull Docker Hub images through mirror.gcr.io
        run: ./scripts/ci-registry-mirror.sh
      - name: Build the Alpine and Debian test images
        env:
          ARCH: ${{ matrix.arch }}
        run: ./scripts/test-exec-supervisor-runtime.sh prepare "$ARCH"
      - name: Run the supervisor suite in each image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          umask 022
          ./scripts/test-exec-supervisor-runtime.sh run "$ARCH"

  ollama-suites:
    # The live Ollama tests: the contract probes the Ollama watch runs on new
    # releases, here on the audited release, and a native Session's provider
    # against a real model (plain, JSON and a tool round-trip, and an
    # over-long input).
    name: Live Ollama suites (Ollama ${{ matrix.version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        version: ['0.40.6']
    env:
      PROBE_MODEL: 'qwen3:0.6b'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-23
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ollama-suites
      - name: Install Ollama and serve it with cloud models off
        env:
          OLLAMA_VERSION: ${{ matrix.version }}
        run: ./scripts/test-podman-suites.sh serve-ollama "$OLLAMA_VERSION"
      - name: Pull the probe model
        run: ollama pull "$PROBE_MODEL"
      - name: Run the live Ollama tests
        run: ./scripts/test-podman-suites.sh run ollama
