name: Dependency security

on:
  push:
    branches: [main, dev]
    paths:
      - '.cargo/audit.toml'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'sites/docs/package.json'
      - 'sites/docs/package-lock.json'
      - 'sites/docs/audit-exceptions.json'
      - 'sites/docs/scripts/audit-gate.mjs'
      - 'axocoatl-server/browser-tests/package.json'
      - 'axocoatl-server/browser-tests/package-lock.json'
      - 'about.hbs'
      - 'about.toml'
      - 'axocoatl-server/THIRD_PARTY_LICENSES.txt'
      - 'axocoatl-server/static/vendor/**'
      - 'licenses/VENDORED_ASSETS.md'
      - 'licenses/vendor/**'
      - 'licenses/vendor-assets.sha256'
      - 'licenses/vendor-web/**'
      - 'scripts/check-third-party-licenses.sh'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - '.cargo/audit.toml'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'sites/docs/package.json'
      - 'sites/docs/package-lock.json'
      - 'sites/docs/audit-exceptions.json'
      - 'sites/docs/scripts/audit-gate.mjs'
      - 'axocoatl-server/browser-tests/package.json'
      - 'axocoatl-server/browser-tests/package-lock.json'
      - 'about.hbs'
      - 'about.toml'
      - 'axocoatl-server/THIRD_PARTY_LICENSES.txt'
      - 'axocoatl-server/static/vendor/**'
      - 'licenses/VENDORED_ASSETS.md'
      - 'licenses/vendor/**'
      - 'licenses/vendor-assets.sha256'
      - 'licenses/vendor-web/**'
      - 'scripts/check-third-party-licenses.sh'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-23
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-audit
      - name: Install the pinned audit tool
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Deny vulnerabilities, unsoundness, new maintenance warnings, and yanked crates
        run: cargo audit -D warnings

  npm-audit:
    name: Node dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Audit documentation dependencies
        working-directory: sites/docs
        run: node scripts/audit-gate.mjs --package-lock-only
      - name: Audit product-browser dependencies
        working-directory: axocoatl-server/browser-tests
        run: npm audit --package-lock-only --audit-level=high

  embedded-distribution-audit:
    name: Embedded distribution advisory and license audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: licenses/vendor-web/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-23
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: embedded-distribution-audit
      - name: Install the pinned license notice generator
        run: cargo install cargo-about --locked --version '=0.9.1' --features cli
      - name: Fetch the locked native release dependency graph
        run: cargo fetch --locked --manifest-path axocoatl-cli/Cargo.toml
      - name: Audit embedded assets and verify generated third-party notices
        run: ./scripts/check-third-party-licenses.sh
