[package]
name = "axocoatl-cli"
version = "1.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "CLI and local server for the Axocoatl coding workbench and agent runtime"

[[bin]]
name = "axocoatl"
path = "src/main.rs"

[dependencies]
axocoatl-core = { version = "1.3.0", path = "../crates/axocoatl-core" }
axocoatl-config = { version = "1.3.0", path = "../crates/axocoatl-config" }
axocoatl-daemon = { version = "1.3.0", path = "../crates/axocoatl-daemon" }
axocoatl-actor = { version = "1.3.0", path = "../crates/axocoatl-actor" }
axocoatl-server = { version = "1.3.0", path = "../axocoatl-server" }
axocoatl-memory = { version = "1.3.0", path = "../crates/axocoatl-memory" }
axocoatl-service = { version = "1.3.0", path = "../crates/axocoatl-service" }
axocoatl-session = { version = "1.3.0", path = "../crates/axocoatl-session" }
axocoatl-isolation = { version = "1.3.0", path = "../crates/axocoatl-isolation" }
axocoatl-llm-ollama = { version = "1.3.0", path = "../crates/axocoatl-llm-ollama" }
axocoatl-mcp = { version = "1.3.0", path = "../crates/axocoatl-mcp" }
clap = { workspace = true }
rmcp = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
dialoguer = "0.11"
# `axocoatl connect claude-code`: the pseudo-terminal `claude setup-token`
# runs in, the user's terminal in raw mode, character widths for its model of
# the terminal, zeroizing token buffers, and a header value that owns one.
portable-pty = "0.9.0"
rustix = { version = "1.1.4", features = ["termios", "event"] }
unicode-width = "0.2"
zeroize = "1"
bytes = "1.9"

[dev-dependencies]
tempfile = "3.27"
wiremock = { workspace = true }
# The fake HTTPS endpoint `connect claude-code`'s tests verify against, and
# the pseudo-terminal that stands in for the user's terminal.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustix = { version = "1.1.4", features = ["termios", "event", "pty", "fs"] }
