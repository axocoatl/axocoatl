[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newuser-python-pytest"
version = "0.1.0"
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
py-modules = ["pages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
