[tool.poetry]
name = "newuser-python-poetry"
version = "0.1.0"
description = "A Poetry project for the new-user gate"
authors = ["Axocoatl <gate@example.invalid>"]
packages = [{ include = "paging" }]

[tool.poetry.dependencies]
python = "^3.9"

[tool.poetry.group.test.dependencies]
pytest = "^8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"
