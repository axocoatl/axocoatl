# Built-in loadout: audit (opt-in). Owner: workstream audit.
#
# Three turns in one Session, each after its own Team and budget Apply:
#   1. plan: the planner splits the scope into 2-8 areas (an AREAS JSON
#      block); an invalid plan gets one retry that quotes the error, and a
#      second invalid plan leaves the whole scope not covered;
#   2. areas: the daemon runs one read-only worker per area in parallel, each
#      with a fresh context and no dependencies (no checks, no review);
#   3. integrate: the integrator merges every worker's report. Integration is
#      its own turn, so the integrator has no depends_on.
# A worker without a result and every NOT_REACHED entry are listed as not
# covered, which makes the run need attention (exit 2). Findings alone do
# not change the exit code unless fail_on_findings is true.
#
# Measured trade-off, not an Axocoatl result: on an audit larger than one
# context, orchestrated read-only area workers had recall +11 points (99% vs
# 87%) and precision -8 points at about 3x the tokens and the same wall time,
# measured with Claude Code subagents on Claude Opus (not through Axocoatl).
# The +11 is a sensitivity analysis (the study's preregistered exclusion rule
# excluded 9 of 10 attempts), not a preregistered result.
schema: axocoatl.loadout/1
id: audit
version: 1
name: Audit
description: >-
  Plan the scope into areas, audit each area in parallel with a fresh
  read-only worker, then integrate. Costs about three times the tokens of one
  agent; use it when the scope is larger than one context.
kind: audit
opt_in: true
params:
  planner_model:
    kind: model
    required: true
    description: provider:model of the planner
  worker_model:
    kind: model
    required: true
    description: provider:model of each area worker
  integrator_model:
    kind: model
    required: true
    description: provider:model of the integrator
agents:
  - id: planner
    role: planner
    model: { param: planner_model }
    tools: [read_file, list_dir, grep, glob]
    writes: []
    instructions: >-
      Read enough of the repository to split the scope into areas that
      together cover it without overlap, each small enough for one context.
      Change nothing. Answer with one AREAS JSON block only.
  - id: worker
    role: worker
    model: { param: worker_model }
    tools: [read_file, list_dir, grep, glob, bash]
    writes: []
    instructions: >-
      Audit only your area. Change nothing; your commands cannot write to the
      repository. Report each defect with file:line, evidence and severity in
      a FINDINGS JSON block, and list every part of your area you did not
      examine in a NOT_REACHED JSON block.
  - id: integrator
    role: integrator
    model: { param: integrator_model }
    tools: [read_file, list_dir, grep, glob]
    writes: []
    instructions: >-
      The host gives you every area worker's findings in one turn after the
      areas finish. Merge them: remove duplicates, keep every distinct defect
      with its area, and answer with one FINDINGS JSON block.
audit:
  min_areas: 2
  max_areas: 8
  fail_on_findings: false
budgets:
  agent: { activations: 2, invocations: 300, tokens: 3000000, cost_usd: 8 }
  wall_clock: 120m
prompt: |
  Audit this repository: {task}
sandbox:
  network: egress
  workload: hardened
