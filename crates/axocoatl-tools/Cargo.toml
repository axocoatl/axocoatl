[package]
name = "axocoatl-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "Built-in tool library and unified tool executor for Axocoatl"

[dependencies]
axocoatl-core = { version = "1.1.2", path = "../axocoatl-core" }
axocoatl-llm = { version = "1.1.2", path = "../axocoatl-llm" }
axocoatl-mcp = { version = "1.1.2", path = "../axocoatl-mcp" }
axocoatl-isolation = { version = "1.1.2", path = "../axocoatl-isolation" }
axocoatl-session = { version = "1.1.2", path = "../axocoatl-session" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
encoding_rs = "0.8"
memchr = "2.7"
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
