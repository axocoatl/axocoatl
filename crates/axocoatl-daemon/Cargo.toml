[package]
name = "axocoatl-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "Persistent agent daemon runtime for Axocoatl — bootstraps and orchestrates all subsystems"

[dependencies]
base64 = { workspace = true }
axocoatl-exec = { version = "=1.1.2", path = "../axocoatl-exec" }
axocoatl-core = { version = "1.1.2", path = "../axocoatl-core" }
axocoatl-config = { version = "1.1.2", path = "../axocoatl-config" }
axocoatl-llm = { version = "1.1.2", path = "../axocoatl-llm" }
axocoatl-llm-openai = { version = "1.1.2", path = "../axocoatl-llm-openai" }
axocoatl-llm-anthropic = { version = "1.1.2", path = "../axocoatl-llm-anthropic" }
axocoatl-llm-ollama = { version = "1.1.2", path = "../axocoatl-llm-ollama" }
axocoatl-llm-gemini = { version = "1.1.2", path = "../axocoatl-llm-gemini" }
axocoatl-llm-mistral = { version = "1.1.2", path = "../axocoatl-llm-mistral" }
axocoatl-actor = { version = "1.1.2", path = "../axocoatl-actor" }
axocoatl-token = { version = "1.1.2", path = "../axocoatl-token" }
axocoatl-memory = { version = "1.1.2", path = "../axocoatl-memory" }
axocoatl-tools = { version = "1.1.2", path = "../axocoatl-tools" }
axocoatl-mcp = { version = "1.1.2", path = "../axocoatl-mcp" }
axocoatl-session = { version = "1.1.2", path = "../axocoatl-session" }
axocoatl-isolation = { version = "1.1.2", path = "../axocoatl-isolation" }
uuid = { workspace = true }
ractor = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

reqwest = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
getrandom = "0.4"
unicode-normalization = { workspace = true }
# Egress route broker (`egress_broker`): TLS ends in the daemon with
# certificates from a per-Session authority signed with ring; requests are
# served and forwarded with hyper. Only crates already in Cargo.lock.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7"
rustls-native-certs = "0.8"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
secrecy = "0.10"
zeroize = "1"
memchr = "2"
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
wiremock = { workspace = true }
tempfile = "3.27"
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
tracing-subscriber = { workspace = true }
serde_yaml = { workspace = true }
