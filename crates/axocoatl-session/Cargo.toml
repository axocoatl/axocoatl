[package]
name = "axocoatl-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "Durable workspace, session, context-attachment, and turn-history storage for Axocoatl"

[dependencies]
axocoatl-core = { version = "1.5.0", path = "../axocoatl-core" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
memchr = "2.7"
quick-xml = "0.41"
# Receipts: Ed25519 signatures of run statements (the daemon's version).
ring = "0.17"
thiserror = { workspace = true }
# Repository toolchains: reading a Python project's pyproject.toml (the
# parser only, the same build of it proc-macro-crate already uses).
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
unicode-normalization = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3.27"
